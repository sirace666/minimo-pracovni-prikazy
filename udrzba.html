<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20100%20100%27%3E%3Crect%20width=%27100%27%20height=%27100%27%20rx=%2722%27%20fill=%27%231b4b8f%27/%3E%3Ctext%20x=%2750%27%20y=%2776%27%20font-size=%2774%27%20font-family=%27Arial,sans-serif%27%20font-weight=%27bold%27%20fill=%27white%27%20text-anchor=%27middle%27%3Em%3C/text%3E%3C/svg%3E">
<title>Údržba — YFAI minimo</title>
<link rel="stylesheet" href="header.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Barvy hlavičky/tlačítek = Davidovy (navy minimo). Karty, okno příkazu
     a barvy stavů = styl appky Pracovní příkazy. Rozvržení stránky Údržby
     (hlavička, dlaždice, filtry, prázdný stav) = přesně podle návrhu
     "Údržba — nové rozložení" z Claude Design (font Nunito, akcent #2b3a86). */
  :root{--navy-1:#0f2f5f;--navy-2:#1b4b8f;--bg:#f3f4f8;--surface:#fff;--border:#e3e6ef;--text:#1d2340;--muted:#4a5170;
    --ok:#15803d;--warn:#b45309;--danger:#c0392b;--radius:10px;
    --shadow:0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.06);
    --accent:#2b3a86;--accent-dark:#1f2d6e;
    --pj:#a21caf}   /* prostoj: vlastní barva (švestková), oranžová je už u rozpracováno, vysoké priority a objednaného dílu */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito','Segoe UI',sans-serif;font-size:14px}
  main{padding:12px 16px 16px}
  button{font-family:inherit;font-size:13.5px;cursor:pointer;border-radius:8px;border:1px solid transparent;padding:0.5rem 0.9rem;background:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select,textarea{font-family:inherit;font-size:14px;padding:0.5rem 0.6rem;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);width:100%}
  input::placeholder{color:#8a90a6}
  label{font-size:0.82rem;font-weight:600;color:var(--muted);display:block;margin-bottom:0.25rem}
  .btn-primary{background:var(--accent);color:#fff;font-weight:800}
  .btn-primary:hover{background:var(--accent-dark)}
  /* tlačítko Nový pracovní příkaz úmyslně barevně sedí k ostatním modulům
     (stejný oranžový gradient jako "+ Nový požadavek na opravu" v Opravách),
     ne k indigo --accent zbytku Údržby — Martinovo přání. */
  .btn-newprikaz{background:linear-gradient(180deg,#f6821f,#e8590c)}
  .btn-newprikaz:hover{background:linear-gradient(180deg,#e8590c,#d24f0a)}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--muted)}
  .btn-danger{background:#fff;border:1px solid #f3c6c1;color:var(--danger)}
  .btn-danger:hover{background:#fdecea}
  .row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
  .spacer{flex:1}
  .muted{color:var(--muted);font-size:.85rem}
  h1{font-size:1.35rem;margin:0 0 .2rem}

  /* --- hlavička stránky ---
     Přesně podle Claude Design zdroje: hlavička je grid se STEJNÝMI sloupci
     jako `.board` níž (260px / zbytek) — název je v levém sloupci (nad
     filtry), dlaždice+hledání+řazení+akce jsou v pravém sloupci (nad
     seznamem), aby vše lícovalo se sloupci pod tím. */
  .pagehead{display:grid;grid-template-columns:230px 1fr;gap:14px 18px;align-items:end;margin-bottom:12px}
  .pagehead h1{margin:0;height:38px;font-size:23px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
  .pagehead-row2{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;min-width:0}
  .check{display:inline-flex;gap:.4rem;align-items:center;font-size:.85rem;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
  .check input{width:16px;height:16px;margin:0;flex:none}

  /* --- dlaždice hlavních pohledů (co vyžaduje akci teď) --- */
  .viewtiles{display:flex;gap:3px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:9px;
    padding:3px;box-shadow:0 1px 2px rgba(29,35,64,.05);max-width:100%;min-width:0}
  .viewtile{display:flex;align-items:center;gap:6px;height:30px;background:transparent;border:none;border-radius:6px;
    padding:0 10px;font-weight:700;font-size:13px;color:var(--text);flex:none}
  .viewtile:hover:not(.on){background:#f0f2f8}
  .viewtile.on{background:var(--accent);color:#fff}
  .viewtile .vt-icon{font-size:13px}
  .viewtile .vt-label{text-align:left;white-space:nowrap}
  .viewtile .vt-count{min-width:19px;height:17px;border-radius:9px;background:#eef0f5;color:var(--muted);
    font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .viewtile.on .vt-count{background:rgba(255,255,255,.2);color:#fff}
  .viewtiles .vt-sep{width:1px;height:16px;background:var(--border);flex:none;align-self:center}
  .viewtile .vt-count.count-danger{background:#fdecea;color:var(--danger)}
  .viewtile .vt-count.count-ok{background:#e6f4ea;color:#1e7d4b}
  /* nepřiřazená havarijka: červené číslo; nepřiřazená havarijka +
     kritická navíc: červený vykřičník vedle čísla */
  .viewtile .vt-warn{color:var(--danger);font-weight:900;font-size:13px;margin-left:1px}
  .nd-tile-wrap{position:relative}

  /* --- pravá skupina: hledání (ikona → rozbalí se) + řazení + nový --- */
  .head-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
  .icon-btn{width:35px;height:38px;border-radius:8px;background:#fff;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;flex:none;font-size:16px;color:var(--accent)}
  .icon-btn:hover{border-color:var(--accent)}
  .search-wrap{display:flex;align-items:center;gap:5px;height:38px;width:250px;background:#fff;border:1px solid var(--accent);
    border-radius:8px;padding:0 5px 0 10px;box-shadow:0 0 0 3px rgba(43,58,134,.1)}
  .search-wrap .search-icon{font-size:13px;color:#8a90a6;flex:none}
  .search-wrap .search{flex:1;min-width:0;border:none;outline:none;padding:0;font-weight:600;font-size:13px}
  .search-close{width:22px;height:22px;border:none;background:#eef0f5;border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px;flex:none;
    display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
  .sortbox{display:flex;align-items:center;height:38px;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  #f-sortkey{width:auto;height:100%;border:none;padding:0 6px 0 10px;font-weight:700;font-size:13px;background:transparent}
  .sort-dir{width:32px;height:100%;border:none;border-left:1px solid var(--border);border-radius:0;background:transparent;color:var(--accent);font-weight:800;font-size:13px}
  .sort-dir:hover{background:#f0f2f8}
  .head-actions .btn-primary{height:38px;padding:0 13px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:5px}
  .head-actions .btn-primary .plus{font-size:15px;line-height:1}

  /* --- rozvržení: levý panel (karta filtrů) + široký seznam --- */
  .board{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
  .sidebar{position:sticky;top:14px;display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid var(--border);
    border-radius:9px;padding:13px 10px}
  .sidebar-head{display:flex;align-items:center;gap:6px;padding:0 6px;height:18px}
  .sidebar-title{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.6px}
  .sidebar-count{min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;
    font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .clear-filters{margin-left:auto;border:none;background:transparent;color:var(--accent);font-weight:700;font-size:12px;
    cursor:pointer;text-decoration:underline;padding:0}

  /* --- oblíbené (uložené) sady filtrů: hvězdička vedle "FILTRY" --- */
  .fav-wrap{position:relative;margin-left:auto;flex:none}
  .fav-trigger{width:22px;height:22px;border:1px solid var(--border);border-radius:6px;background:#fff;
    color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .fav-trigger:hover{border-color:var(--accent);color:var(--accent)}
  .fav-trigger.has-items{color:#d97706;border-color:#f3d19e}
  .fav-panel{position:absolute;top:calc(100% + 4px);right:0;z-index:35;background:#fff;border:1px solid var(--border);
    border-radius:9px;box-shadow:0 10px 30px rgba(15,23,42,.16);padding:6px;min-width:210px;
    display:flex;flex-direction:column;gap:2px}
  .fav-item{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:7px;border:none;
    background:transparent;width:100%;text-align:left;font-family:inherit;font-weight:700;font-size:13px;
    color:var(--text);cursor:pointer}
  .fav-item:hover{background:#f3f4f8}
  .fav-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .fav-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fav-edit{flex:none;opacity:.45;font-size:12px;padding:2px 4px;border-radius:5px}
  .fav-edit:hover{opacity:1;background:#e3e6ef}
  .fav-new{border-top:1px solid #eef0f5;margin-top:2px;padding-top:10px;color:var(--accent)}
  .fav-empty{padding:10px 8px;font-size:12px;color:var(--muted)}

  /* --- paleta barev v okně Nový/Upravit filtr --- */
  .color-row{display:flex;gap:6px;flex-wrap:wrap;padding-top:2px}
  .color-dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .color-dot.on{border-color:var(--text);box-shadow:0 0 0 2px #fff inset}
  /* vlastní barva: kolečko s duhou, které otevře systémovou paletu (spektrum + posuvník odstínu);
     po výběru se vybarví zvolenou barvou */
  .color-custom{position:relative;display:block;flex:none;width:26px;height:26px;margin:0;border-radius:50%;
    border:2px solid transparent;cursor:pointer;
    background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .color-custom.on{border-color:var(--text);box-shadow:0 0 0 2px #fff inset}
  .color-custom input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer}
  .filtergroup{display:flex;flex-direction:column;gap:3px;padding-top:11px;border-top:1px solid #eef0f5}
  .filtergroup:first-child{padding-top:0;border-top:none}
  .filtergroup-head{display:flex;align-items:center;gap:6px;padding:0 6px 3px}
  .filtergroup-head .sidebar-title{font-size:10px}
  .filtergroup-sel{font-size:10px;font-weight:800;color:var(--accent)}
  .checklist{display:flex;flex-direction:column;gap:2px}
  .filter-check{position:relative;width:100%;height:31px;display:flex;align-items:center;gap:8px;padding:0 7px;
    border-radius:6px;font-weight:700;font-size:13px;color:var(--text);cursor:pointer}
  .filter-check:hover{background:#f3f4f8}
  .filter-check input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
  .filter-check .fc-box{width:14px;height:14px;border-radius:3px;border:1.5px solid #9aa0b5;background:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent}
  .filter-check .fc-dot{width:8px;height:8px;border-radius:50%;flex:none}
  .filter-check .fc-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filter-check .count{min-width:16px;height:16px;border-radius:8px;background:#eef0f5;color:var(--muted);
    font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .filter-check:has(input:checked){background:var(--accent);color:#fff}
  .filter-check:has(input:checked) .fc-box{background:#fff;border-color:#fff;color:var(--accent)}
  .filter-check:has(input:checked) .fc-box::after{content:'✓'}
  .filter-check:has(input:checked) .count{background:rgba(255,255,255,.2);color:#fff}
  .filter-check .count.count-warn{background:#fdecea;color:var(--danger);font-weight:800}
  .filter-check:has(input:checked) .count.count-warn{background:rgba(255,255,255,.35);color:#fff}
  .filter-check .count.count-danger{background:#fdecea;color:var(--danger);font-weight:800}
  .filter-check .count.count-ok{background:#e6f4ea;color:#1e7d4b;font-weight:800}
  .filter-check:has(input:checked) .count.count-danger,
  .filter-check:has(input:checked) .count.count-ok{background:rgba(255,255,255,.35);color:#fff}

  /* --- Typ (CM/EM): dvě skutečná tlačítka vedle sebe místo řádků pod sebou —
     jen 2 pevné hodnoty, dává smysl je mít jako "přepínače" vedle sebe.
     Pořád stejný .filter-check/checkbox pod kapotou (kombinovatelné), jen
     s viditelným rámečkem/pozadím a barvou podle druhu (--tc, nastavená
     inline stylem z filterGroup() přes opts[].color). --- */
  .checklist.row{flex-direction:row;gap:8px}
  .checklist.row .filter-check{flex:1;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;height:56px;padding:6px 8px;gap:4px;border:1.5px solid var(--tc,var(--border));
    border-radius:8px;background:#fff}
  .checklist.row .filter-check:hover{background:#f7f8fc}
  .checklist.row .filter-check:has(input:checked){background:var(--tc,var(--accent));border-color:var(--tc,var(--accent))}
  .checklist.row .fc-box{display:none}
  .checklist.row .fc-label{flex:none;white-space:normal;line-height:1.2;font-size:12.5px}
  .checklist.row .count{position:static}

  /* --- filtr Linka: zavřené tlačítko + panel s hledáním (může jich časem
     být hodně, na rozdíl od pevných seznamů Typ/Stav/Priorita/Obor) --- */
  .linka-wrap{position:relative}
  .fav-linka-wrap{position:relative}
  .linka-trigger{width:100%;height:34px;display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:0 9px;border:1px solid var(--border);border-radius:7px;background:#fff;font-weight:700;font-size:13px;
    color:var(--text);text-align:left}
  .linka-trigger:hover{border-color:var(--accent)}
  .linka-trigger.has-sel{border-color:var(--accent);color:var(--accent)}
  .linka-trigger .linka-trigger-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .linka-trigger .car{color:var(--muted);font-size:10px;flex:none}
  .linka-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;background:#fff;
    border:1px solid var(--border);border-radius:9px;box-shadow:0 10px 30px rgba(15,23,42,.16);
    padding:8px;display:flex;flex-direction:column;gap:6px}
  .linka-search{width:100%;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:6px;font-size:13px}
  .linka-list{overflow-y:auto;max-height:190px;display:flex;flex-direction:column;gap:2px}
  .page-version{font-size:12px;font-weight:600;color:#b9bece}

  /* --- barevný posuvník priority (formulář nového/upravovaného příkazu) --- */
  .priority-slider{padding:4px 2px 0}
  .priority-slider input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;display:block}
  .priority-slider input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
    background:linear-gradient(90deg,#2f9e6e,#2563a8,#d97706,#c0392b)}
  .priority-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
    border-radius:50%;background:var(--c,#2563a8);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);
    margin-top:-7px;cursor:pointer}
  .priority-slider input[type=range]::-moz-range-track{height:6px;border-radius:3px;
    background:linear-gradient(90deg,#2f9e6e,#2563a8,#d97706,#c0392b)}
  .priority-slider input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;
    background:var(--c,#2563a8);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer}
  .ps-ticks{display:flex;justify-content:space-between;margin-top:2px}
  .ps-tick{font-size:11px;font-weight:700;color:var(--muted)}
  .ps-tick.on{color:var(--c,var(--accent));font-weight:800}

  /* Druh poruchy (EM/CM) se teď vybírá nahoře v modal-tabs (viz
     .modal-tab.on.typ-em níž), ne vlastním přepínačem ve formuláři. */
  @media(max-width:700px){
    .pagehead{grid-template-columns:1fr}
    .viewtile{min-width:0}
    .head-actions{width:100%;justify-content:space-between;flex-wrap:wrap}
    .head-actions .btn-primary{width:100%;order:9}
    .board{grid-template-columns:1fr}
    .sidebar{position:static}
  }

  /* --- seznam příkazů --- */
  .list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.8rem;min-height:210px}
  .list{display:grid;gap:.5rem}
  .order-item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);
    border-left:4px solid #94a3b8;border-radius:var(--radius);padding:.65rem .8rem}
  .order-item:hover{border-color:#b9c6d8;background:#fafbfd}
  .order-item.st-nový{border-left-color:#6366f1}
  .order-item.st-rozpracováno{border-left-color:#ea7317}
  .order-item.st-hotovo{border-left-color:var(--ok)}
  /* havarijka (EM) — červený obrys navíc k barvě podle stavu vlevo;
     EM + kritická zároveň přidá i lehce červenou výplň */
  .order-item.em{box-shadow:0 0 0 1.5px var(--danger)}
  .order-item.em.crit{background:#fdecea}
  .oi-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem;flex-wrap:wrap}
  .oi-title{margin:0 0 .25rem;font-size:.92rem;font-weight:700}
  .oi-meta{font-size:.78rem;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:2.5rem 1rem;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius)}
  .empty2{background:#fff;border:1px dashed #d6dae6;border-radius:var(--radius);min-height:297px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;padding:26px;text-align:center}
  .empty2-icon{font-size:26px;opacity:.8}
  .empty2 h3{margin:0;font-size:15px;font-weight:700}
  .empty2 p{margin:0;color:#6b7190;font-size:13px;max-width:360px}
  .empty2 .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}

  /* --- odznaky --- */
  .badge{display:inline-block;padding:.12rem .5rem;border-radius:999px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
  .badge.st-nový{background:#e0e7ff;color:#3730a3}
  .badge.st-rozpracováno{background:#fef3c7;color:var(--warn)}
  .badge.st-hotovo{background:#dcfce7;color:var(--ok)}
  .badge.p-nízká{background:#e6f4ea;color:#1e7d4b}
  .badge.p-běžná{background:#e9f1fb;color:#2563a8}
  .badge.p-vysoká{background:#ffe3c2;color:#9a4f0e}
  .badge.p-kritická{background:#fdecea;color:var(--danger)}
  .badge.typ-standardní{background:#eef2f7;color:#41506b}
  .badge.typ-havarijní{background:var(--danger);color:#fff}
  .badge.obor-mechanika{background:#eef2f7;color:#41506b}
  .badge.obor-elektro-plc{background:#fff7e0;color:#8a6d1a}
  .badge.obor-nastrojarna{background:#e8f5e9;color:#2e7d32}
  .badge.nd-potreba{background:#fdecea;color:var(--danger)}
  .badge.nd-objednano{background:#fef3c7;color:var(--warn)}
  .badge.nd-prisel{background:#e6f4ea;color:#1e7d4b}

  /* --- modal (Davidovo tělo hlavičky, náš obsah) --- */
  .overlay{position:fixed;inset:0;background:rgba(12,26,48,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto;z-index:70}
  .modal{background:#fff;border-radius:var(--radius);width:100%;max-width:820px;max-height:90vh;margin:auto;
    box-shadow:0 20px 50px rgba(15,23,42,.3);display:flex;flex-direction:column;overflow:hidden}
  .modal-head{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;margin:0;padding:.85rem 1rem;
    font-size:1rem;font-weight:700;display:flex;align-items:center;gap:.6rem;flex:none}
  .modal-head .x{margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5);color:#fff;
    font-size:16px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .modal-head .x:hover{background:rgba(255,255,255,.32)}
  .modal-body{padding:1rem;overflow-y:auto}
  .modal-foot{padding:.75rem 1rem;border-top:1px solid var(--border);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;flex:none;background:#fafbfd}
  .modal-foot .r{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap}
  .msg{font-size:.8rem;color:var(--danger);font-weight:600}

  /* hero = barevný pruh podle stavu, jako v Pracovních příkazech */
  .hero{--accent:#94a3b8;margin:-1rem -1rem 0;padding:1rem;border-bottom:1px solid var(--border);border-top:3px solid var(--accent);
    background:linear-gradient(120deg, color-mix(in srgb, var(--accent) 12%, #fff), transparent 70%), #fff}
  /* Pod záložkami (Info/Historie) už je jasné rozhraní od aktivní podtržené
     tabky — barevný pruh navrch hero by tam jen splýval/matl. */
  .hero.notop{border-top:none}
  .hero.st-nový{--accent:#6366f1}
  .hero.st-rozpracováno{--accent:#ea7317}
  .hero.st-hotovo{--accent:#15803d}
  .hero-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.85rem}
  .hero h2{margin:.5rem 0 0;font-size:1.1rem;line-height:1.3}
  .hero-desc{margin:.5rem 0 0;white-space:pre-wrap;font-size:.9rem}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:.2rem .75rem;margin:.9rem 0 0;font-size:.85rem}
  .meta dt{color:var(--muted);font-weight:600}
  .meta dd{margin:0}
  .sec{display:grid;gap:.5rem;padding:1rem;border-top:1px solid var(--border)}
  .sec-label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  /* Záložky přímo pod modal-head, mimo posuvné .modal-body — vidět pořád,
     i kdyby byl obsah (třeba dlouhá historie) delší než okno. */
  .modal-tabs{display:flex;flex:none;background:#fff;border-bottom:1px solid var(--border)}
  .modal-tab{flex:1;border:none;background:transparent;padding:.7rem 1rem;
    font-family:inherit;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;
    border-bottom:2.5px solid transparent;margin-bottom:-1px}
  .modal-tab:hover{color:var(--text)}
  .modal-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .modal-tab.on.typ-em{color:var(--danger);border-bottom-color:var(--danger)}
  .form-grid{display:grid;gap:.7rem}
  .form-grid.cols2{grid-template-columns:1fr 1fr}
  .hist{font-size:.82rem}
  .hist div{padding:.3rem 0;border-top:1px dotted var(--border)}
  .hist div:first-child{border-top:none}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy-1);color:#fff;padding:.6rem 1.1rem;
    border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:80;font-weight:600;font-size:.85rem}
  .toast.err{background:var(--danger)}.toast.ok{background:var(--ok)}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login{background:#fff;border:1px solid var(--border);border-radius:14px;padding:30px;width:340px;box-shadow:0 12px 40px rgba(0,0,0,.12);text-align:center}
  .login input{margin-bottom:10px}.login button{width:100%;background:var(--navy-2);color:#fff;padding:.65rem;font-size:14px;font-weight:700}
  .loginerr{background:#fdecea;color:var(--danger);border-radius:8px;padding:8px;font-size:12px;margin-bottom:10px}
  @media(max-width:640px){.form-grid.cols2{grid-template-columns:1fr}}

  /* --- WO (číslo externího pracovního příkazu) --- */
  input.wo-input{width:140px}

  /* --- Přiřazeno: tlačítko otevírající okno s výběrem víc lidí --- */
  .assign-trigger{width:100%;text-align:left;padding:.5rem .6rem;border:1px solid var(--border);
    border-radius:8px;background:#fff;font-size:14px;color:var(--text);cursor:pointer;font-family:inherit}
  .assign-trigger:hover:not(:disabled){border-color:var(--accent)}
  .assign-trigger:disabled{background:#f3f4f8;color:var(--muted);cursor:not-allowed}
  .ap-cols{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:6px 1rem;
    font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
  .ap-rows{max-height:360px;overflow-y:auto}
  .ap-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;
    padding:9px 1rem;border-top:1px solid var(--border)}
  .ap-row:hover{background:#f7f8fb}
  .ap-row input[type=checkbox]{width:16px;height:16px;cursor:pointer}
  .ap-person{min-width:0;display:flex;flex-direction:column;gap:1px;cursor:pointer}
  .ap-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ap-pos{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ap-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .ap-badge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;border:none;
    cursor:pointer;font-family:inherit}
  .ap-badge.ap-em{background:#fdecea;color:var(--danger)}
  .ap-badge.ap-cm{background:#eef0f5;color:#4a5170}
  .ap-badge.ap-none{background:transparent;color:var(--muted);font-weight:600;cursor:default}
  .ap-drill{background:#f7f8fb;padding:8px 1rem 10px 60px;font-size:12.5px;display:flex;
    flex-direction:column;gap:5px}
  .ap-drill-line{display:flex;justify-content:space-between;gap:8px}
  .ap-drill-typ{font-weight:800;font-size:10.5px}
  .ap-drill-typ.ap-drill-em{color:var(--danger)}
  .ap-drill-typ.ap-drill-cm{color:#4a5170}

  /* ===== TEST (větev test-tabulka-filtry): rozložení pro počítač =====
     Od 861 px šířky: tabulka s filtrem+řazením v záhlaví každého sloupce a
     úzký panel jen s oblíbenými filtry. Pod tím zůstává dnešní rozložení
     (karty + levý panel filtrů) beze změny — .old-only se na počítači
     schová, .board2 na mobilu neexistuje. */
  .board2{display:none}
  @media(min-width:861px){
    .old-only{display:none!important}
    .pagehead{grid-template-columns:auto 1fr}
    .board2{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;align-items:start}
  }

  /* --- panel oblíbených: vždy úzký pruh (44 px) s barevnými tečkami.
     Oko v pruhu zapíná/vypíná vysouvání: zapnuté = po najetí myší vyjede
     plný panel přes tabulku, po odjetí se schová; vypnuté = zůstává pruh a
     filtry se vybírají tečkami. Třída fp-eye/fp-noeye na #board2, čistě CSS. --- */
  /* z-index nad záhlavím sloupců (.thd má 5), ať vysunutý panel záhlaví nepřekrývá; pod menu sloupce (55) a okny (70) */
  .favpanel{position:sticky;top:14px;z-index:40;align-self:start;min-width:0;width:100%}
  .fp-strip{background:#fff;border:1px solid var(--border);border-radius:9px;width:44px;padding:6px 0;
    display:flex;flex-direction:column;align-items:center;gap:4px}
  .fp-full{position:absolute;left:0;top:0;width:220px;z-index:45;background:#fff;border:1px solid var(--border);
    border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:2px;box-shadow:0 12px 30px rgba(15,23,42,.2);
    visibility:hidden;opacity:0;transform:translateX(-6px);
    transition:opacity .15s ease,transform .15s ease,visibility 0s linear .15s}
  .board2.fp-eye .favpanel:hover .fp-full,.board2.fp-eye .favpanel:has(:focus-visible) .fp-full{visibility:visible;opacity:1;
    transform:none;transition:opacity .15s ease .25s,transform .15s ease .25s,visibility 0s linear .25s}
  .board2.fp-noeye .fp-full{display:none}
  .fp-eyebtn{color:var(--muted)}
  .board2.fp-eye .fp-eyebtn{color:var(--accent);background:#eceefb}
  .board2.fp-eye .fp-eyebtn .ic-off,.board2.fp-noeye .fp-eyebtn .ic-on{display:none}
  .fp-head{display:flex;align-items:center;gap:2px;padding:0 0 6px 6px;min-height:30px}
  .fp-head .sidebar-title{flex:1}
  .fp-ic{width:28px;height:28px;padding:0;border:none;background:transparent;border-radius:7px;color:var(--muted);
    display:flex;align-items:center;justify-content:center;flex:none}
  .fp-ic:hover{background:#eef0f8;color:var(--accent)}
  .fp-ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .fp-dotbtn{width:28px;height:28px;padding:0;border:none;background:transparent;border-radius:7px;
    display:flex;align-items:center;justify-content:center}
  .fp-dotbtn:hover{background:#eef0f8}
  .fp-dotbtn i{width:12px;height:12px;border-radius:50%;display:block}
  .fp-dotbtn.on i{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
  .fp-item{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:7px;border:1px solid transparent;
    background:transparent;width:100%;text-align:left;font-weight:700;font-size:13px;color:var(--text)}
  .fp-item:hover{background:#f3f4f8}
  .fp-item.on{background:#eceefb;border-color:#c9cff0;color:var(--accent-dark)}
  .fp-empty{padding:6px 8px;font-size:12px;color:var(--muted)}
  .fp-act{width:100%;margin-top:6px;padding:8px;border:1px dashed #b7bddc;border-radius:8px;background:transparent;
    font-weight:800;font-size:12.5px;color:var(--accent)}
  .fp-act:not(:disabled):hover{background:#eceefb}

  /* --- tabulka --- */
  .listcard2{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;min-width:0}
  .listcard2 .empty2{border:0;border-radius:0}
  /* Pruh nad záhlavím: vlevo Zobrazeno N z M a štítky zapnutých filtrů, vpravo přepínač Skrýt hotové.
     Bez filtru je bílý a tichý, se zapnutým filtrem se podbarví teple, ať je hned vidět, že seznam je vyfiltrovaný. */
  .sbar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:6px 14px;border-bottom:1px solid var(--border);
    min-height:44px;font-size:12.5px;font-weight:600;background:#f4f5fa}   /* bez filtru velmi světlá modrošedá, ať nesplývá s bílou kartou */
  .sbar .sb-l{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
  .sbar .sb-count{color:var(--muted)}
  .sbar .sb-count b{color:var(--text);font-weight:800}
  .sbar .sb-ico{width:15px;height:15px;flex:none;color:#7a81a0}
  .sbar .sb-ico *{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .sbar.filtered .sb-ico{color:var(--accent)}
  .sbar .sb-nof{color:#636a88;font-weight:600}
  .sbar.filtered{background:#fcfaf3;border-bottom-color:#ebe2c6}   /* krémová: stejně světlá jako #fffaeb (od bílé ~4 % jasu, ať nesplyne), ale s méně žlutosti */
  .sbar.filtered .fchip{background:#fff}
  .sbar.filtered .fchip:hover{background:#f3f5fd}
  .fchip{display:inline-flex;gap:6px;align-items:center;border:1px solid #c9cff0;background:#eceefb;color:var(--accent-dark);
    border-radius:999px;padding:3px 6px 3px 11px;font-size:12.5px;font-weight:600}
  .fchip b{font-weight:800}
  .fchip:hover{background:#e0e4f8}
  .fchip>span[aria-hidden="true"]{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:800;background:#eceefb}
  .sb-clear{border:1px solid #e0d6b6;background:transparent;color:#7a5a07;font:inherit;font-size:12px;font-weight:800;border-radius:8px;padding:3px 10px;cursor:pointer}
  .sb-clear:hover{background:rgba(224,214,182,.3)}
  /* přepínač Skrýt hotové (jen tabulka na počítači) */
  .sb-switch{display:inline-flex;align-items:center;gap:9px;border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:700;
    color:var(--text);cursor:pointer;padding:4px 2px;flex:none}
  .sb-switch .tr{width:36px;height:20px;border-radius:999px;background:#c5cadc;position:relative;flex:none;transition:background .15s}
  .sb-switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.3);transition:left .15s}
  .sb-switch[aria-checked="true"] .tr{background:var(--accent)}
  .sb-switch[aria-checked="true"] .tr::after{left:18px}
  .tscroller{overflow-x:auto}
  /* Pevný horní blok: na dostatečně velké obrazovce se stránka sama nescrolluje. Hlavička portálu, nadpis s
     dlaždicemi, štítky filtrů a záhlaví sloupců zůstávají na místě a rolují jen řádky tabulky (.tscroller).
     Záhlaví sloupců (.thd) je sticky uvnitř tohoto posuvníku, takže se vodorovně posouvá spolu s řádky.
     Na nízkých oknech (<560 px) se vrací běžné scrollování celé stránky. */
  @media (min-width:861px) and (min-height:560px){
    #app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
    #uh-host{flex:none}
    #main-host{flex:1;min-height:0;display:flex;flex-direction:column}
    #main-host>main{flex:1;min-height:0;display:flex;flex-direction:column}
    #main-host>main>.pagehead{flex:none}
    .board2{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
    .listcard2{align-self:start;max-height:100%;min-height:0;display:flex;flex-direction:column}
    .sbar{flex:none}
    .tscroller{flex:0 1 auto;min-height:0;overflow:auto}
    .thd{position:sticky;top:0;z-index:5}
  }
  /* Sloupce bez mezer: odsazení textu dělá padding-left 8px na každé buňce (.tc) i na tlačítku záhlaví (.hc),
     takže text záhlaví i řádků začíná na stejné svislici a tlačítka záhlaví se nikdy nepřekrývají
     (mezi nimi zůstává 2px díky padding 0 1px na obalu). Šířky sloupců počítají s tím odsazením. */
  .tbl{min-width:1130px;--cols:112px 56px 96px 92px minmax(190px,2fr) minmax(128px,1fr) 88px minmax(130px,1fr) 110px 108px}
  .thd,.trow{display:grid;grid-template-columns:var(--cols);column-gap:0;align-items:start;padding:0 12px}
  /* Záhlaví sloupců je ovládací pás: jemně modrošedé podbarvení a pevnější spodní linka, ať se liší od řádků
     (včetně zešedlých hotových) i od pruhu nad ním. Sloupec se zapnutým filtrem je plně tmavě modrý. */
  .thd{background:#e9ecf8;border-bottom:2px solid #c4cbe8;height:44px;align-items:center}
  .thd>div{min-width:0;padding:0 1px}
  .hc{display:flex;align-items:center;gap:5px;width:100%;height:30px;padding:0 6px 0 7px;border:0;
    border-radius:8px;background:transparent;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    color:var(--accent-dark);white-space:nowrap;text-align:left}
  .hc .hc-l{overflow:hidden;text-overflow:ellipsis}
  .hc .hc-i{margin-left:auto;font-size:12px;color:#6f7ab0;letter-spacing:0}
  .hc:hover{background:#dce1f4}
  .hc.sorted,.hc.sorted .hc-i{color:var(--accent)}
  .hc.open{background:#cdd4f0;color:var(--accent-dark)}
  .hc.on{background:var(--accent);color:#fff}
  .hc.on .hc-i{color:#fff}
  .trow{width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);border-radius:0;background:#fff;
    padding-block:10px;min-height:58px;font-size:13px;color:var(--text);box-shadow:inset 4px 0 0 var(--st,#94a3b8)}
  .trow:hover{background:#fafbfd}
  .trow:last-child{border-bottom:0}
  .trow.st-nový{--st:#6366f1}
  .trow.st-rozpracováno{--st:#ea7317}
  .trow.st-hotovo{--st:var(--ok)}
  /* v tabulce nemá havarijka (EM) červený obrys — jen EM + kritická má lehce červenou výplň */
  .trow.em.crit:not(.st-hotovo){background:#fdecea}   /* u hotového už poplach skončil — žádná růžová */
  /* Buňky jsou zarovnané SHORA a první řádek každé buňky má stejnou výšku 20px, takže první řádky ve všech
     sloupcích leží na jedné čáře; druhý řádek je drobný (16px). Stav, typ, priorita, stav dílu a prostoj
     jsou TEXT A BARVA, ne tabletky — štítku (tabletku) má jen havarijka EM. Stejné prvky (.sd .emtag .cmtx
     .pr .dli .pj) se používají i v menu filtrů, ať je tam všechno vidět stejně jako v řádku. */
  .tc{min-width:0;padding-left:8px;display:flex;flex-direction:column;gap:0;align-items:flex-start;
    font-size:13px;line-height:20px}
  .tc b{font-weight:600;font-size:13px;line-height:20px;color:var(--text)}
  .tc small{display:block;font-size:11.5px;line-height:16px;color:#6b7290;font-weight:400;margin-top:2px}
  /* Hierarchie písma: tučný je jen název poruchy; WO a stroj mají střední váhu; zbytek je běžné písmo. */
  .tc .tt{font-weight:800;font-size:14px;line-height:20px;max-width:100%;padding-left:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Název poruchy a stav dílu pod ním začínají o 16 px dál (ikona dílu visí vlevo v tomhle odsazení);
     záhlaví Porucha / díl je odsazené stejně (7 + 16). */
  .hc[data-v="nazev"]{padding-left:23px}
  .tc.tx{font-size:12.5px;color:var(--muted);font-weight:400}
  .tc .dash{color:#9aa0b8}
  .none{font-style:italic;color:#6b7290;font-weight:400}
  .who{color:var(--accent);font-weight:600}
  .tc .who{font-size:12.5px;line-height:20px}
  .tc .who .more{margin-left:5px;font-size:11.5px;font-weight:600;color:#6b7290}
  .sd{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:400;color:var(--muted);line-height:20px;white-space:nowrap}
  .sd i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
  /* Stav: barvu nese jen tečka, písmo se odstupňuje podle toho, kolik pozornosti příkaz potřebuje —
     nový nejtučněji (nikdo se ho ještě nechopil), rozpracováno polotučně, hotovo tence a světle. */
  .sd.s-novy{font-weight:700;color:var(--text)}
  .sd.s-roz{font-weight:600;color:var(--text)}
  .sd.s-hot{font-weight:400;color:#6b7290}
  .sd.s-hot i{opacity:.5}
  .emtag{display:inline-flex;align-items:center;height:18px;margin-block:1px;padding:0 6px;border-radius:4px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em}
  .cmtx{font-size:12.5px;font-weight:400;color:#6b7290;line-height:20px}
  .dec{display:inline-flex;align-items:center;gap:8px;min-width:0}
  .pr{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;line-height:20px;color:var(--c);font-weight:400;white-space:nowrap}
  .pr svg{width:14px;height:14px;flex:none}
  .pr svg rect{fill:#d5d9e6}
  .pr svg rect.on{fill:var(--c)}
  .pr.k-vysoká{font-weight:700}
  .pr.k-kritická{font-weight:800}
  .dl{position:relative;display:block;font-size:11.5px;line-height:16px;font-weight:600;color:var(--c);margin:2px 0 0 16px}
  .dl svg{position:absolute;left:-16px;top:2px;width:12px;height:12px}
  .dli{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;line-height:20px;font-weight:600;color:var(--c);white-space:nowrap}
  .dli svg{width:12px;height:12px;flex:none}
  .dl svg *,.dli svg *{fill:none;stroke:var(--c);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
  .pj{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;line-height:20px;white-space:nowrap;color:var(--pj)}
  .pj svg{width:13px;height:13px;flex:none}
  .pj svg *{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .pj.on{font-weight:700}
  .pj.off{color:#6b7290;font-weight:400}   /* u hotového příkazu je prostoj už nejspíš za námi — ztlumeně */
  /* Hotové řádky ustoupí do pozadí: světle šedé pozadí, slabší bledě zelený pruh vlevo, ztlumené barvy, název o stupeň
     lehčí a štítek EM jemně červený. Po najetí myší se vrátí plné barvy. Ztlumený text má kontrast aspoň 4,5:1
     i na šedém pozadí (proto #676e8c, ne #6b7290). */
  .trow.st-hotovo:not(:hover){background:#f5f6fa;box-shadow:inset 3px 0 0 #b7d9c3}
  .trow.st-hotovo:not(:hover) .tt{font-weight:600;color:#5b6385}
  .trow.st-hotovo:not(:hover) .tc b{color:#5b6385}
  .trow.st-hotovo:not(:hover) .tc.tx,.trow.st-hotovo:not(:hover) .tc small,.trow.st-hotovo:not(:hover) .cmtx,
  .trow.st-hotovo:not(:hover) .pj.off,.trow.st-hotovo:not(:hover) .sd.s-hot{color:#676e8c}
  .trow.st-hotovo:not(:hover) .pr{color:#676e8c;font-weight:400}
  .trow.st-hotovo:not(:hover) .pr svg rect{fill:#dde0ea}
  .trow.st-hotovo:not(:hover) .pr svg rect.on{fill:#8f96b2}
  .trow.st-hotovo:not(:hover) .emtag{background:#f6dedc;color:#a3382f}
  .trow.st-hotovo:not(:hover) .who{color:#5f6aa0}
  .trow.st-hotovo:not(:hover) .who .more{color:#676e8c}
  .trow.st-hotovo:not(:hover) .dl{color:#676e8c;font-weight:400}
  .trow.st-hotovo:not(:hover) .dl svg *{stroke:#676e8c}

  /* --- rozbalovací menu sloupce (filtr + řazení) --- */
  .colmenu{position:fixed;z-index:55;width:252px;background:#fff;border:1px solid var(--border);border-radius:12px;
    box-shadow:0 14px 34px rgba(15,23,42,.22);padding:6px;outline:none}
  .cm-sort{display:flex;gap:8px;align-items:center;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;
    text-align:left;font-weight:700;font-size:13px;color:var(--text)}
  .cm-sort span{width:14px;text-align:center;font-weight:800}
  .cm-sort:hover{background:#f3f4fa}
  .cm-sort.on{background:#eceefb;color:var(--accent)}
  .cm-sep{height:1px;background:var(--border);margin:6px 4px}
  .cm-tabs{display:flex;gap:4px;padding:2px 2px 8px}
  .cm-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 8px;border:1px solid var(--border);
    border-radius:8px;background:#fff;font-weight:800;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
  .cm-tab:hover{background:#f3f4fa}
  .cm-tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .cm-tabn{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.25);font-size:11px;line-height:17px;letter-spacing:0}
  .cm-tab:not(.on) .cm-tabn{background:var(--accent);color:#fff}
  .cm-search{padding:0 2px 6px}
  .cm-search input{height:34px;padding:0 10px;font-weight:600;font-size:13px}
  .cm-list{max-height:240px;overflow-y:auto}   /* výchozí; placeColMenu() ji upraví podle výšky okna */
  /* Vybraná položka v menu sloupce: světlé podbarvení a vyplněné políčko místo celé tmavě modré, ať zůstane
     vidět barva a ikona položky (tečka stavu, proužky priority, krabice dílu, hodiny prostoje). */
  .cm-list .filter-check:has(input:checked){background:#eceefb;color:var(--accent-dark)}
  .cm-list .filter-check:has(input:checked) .fc-box{background:var(--accent);border-color:var(--accent);color:#fff}
  .cm-list .filter-check:has(input:checked) .count{background:#dfe3f7;color:var(--accent-dark)}
  .cm-only{padding:0 2px 6px}
  .cm-onlybtn{height:26px;padding:0 11px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:12px;font-weight:800;color:var(--muted)}
  .cm-onlybtn:not(:disabled):not(.on):hover{background:#f3f4fa}
  .cm-onlybtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .cm-onlybtn.on:hover{background:var(--accent-dark)}   /* bez tohohle přebilo světlé :hover bílé písmo zapnutého tlačítka */
  .cm-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 6px 2px;border-top:1px solid var(--border);margin-top:6px}
  .cm-link{border:0;background:none;padding:4px 6px;color:var(--accent);font-weight:800;font-size:12.5px;text-decoration:underline}
  .cm-done{border:0;background:var(--accent);color:#fff;font-weight:800;font-size:12.5px;padding:6px 14px;border-radius:8px}

     Funkce, filtry a data beze změny. Pod 861 px zůstává dnešní mobilní vzhled. Hodnoty (barvy, rozměry, písmo)

    .trow.st-hotovo:not(:hover){background:#ebe9e3;border-color:#dedbd2;box-shadow:inset 4px 0 0 #3f9a62}   /* tmavší šedá + zelený pruh vlevo (v0.18.14) */

    .trow.st-hotovo:not(:hover) .r2-st b,.trow.st-hotovo:not(:hover) .r2-wn,.trow.st-hotovo:not(:hover) .r2-rel{color:#55514a;font-weight:600}

  /* ===== VZHLED 1d — okna (příkaz, přiřazení, linka/stroj, oblíbený filtr), upozornění, prázdný stav (v0.18.3) =====
     Návrh 1d řešil jen hlavní stránku, takže tohle je ODVOZENO ze stejné palety (teplá béžová, akcent #b8480f,
     oranžová pilulka pro hlavní tlačítko, Figtree). Mění se jen barvy, tvary a písmo, ne funkce. Jen na počítači. */

    .overlay input:focus,.overlay select:focus,.overlay textarea:focus{outline:none;border-color:#b8480f;box-shadow:0 0 0 3px rgba(184,72,15,.14)}
    .overlay input[type=checkbox]{border-radius:4px}
    .overlay input[type=checkbox],.overlay input[type=range]{box-shadow:none}
    .overlay label{color:#58554b}
    .modal{border-radius:18px;border:1px solid #e8e5de;box-shadow:0 18px 44px rgba(30,28,20,.22)}
    .modal-head{background:#fff;color:#1c1b17;border-bottom:1px solid #e8e5de;padding:.95rem 1.1rem;font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
    .modal-head .x{background:#f1efe9;border:0;color:#58554b;border-radius:50%;width:32px;height:32px}
    .modal-head .x:hover{background:#e7e4db}
    .modal-foot{background:#faf9f6;border-top:1px solid #e8e5de}

let me=null, rows=[], users=[], editing=null, editMode=false, errs={}, footMsg='';

async function loadProfile(user){

function teardown(){ if(unsubO)unsubO(); if(unsubU)unsubU(); if(unsubC)unsubC(); if(unsubF)unsubF(); unsubO=unsubU=unsubC=unsubF=null; rows=[]; users=[]; savedFilters=[]; dataReady=false; }
function subscribe(){

    }, ()=>{});
    unsubC=onSnapshot(doc(db,'meta','config'), snap=>{
      const d=snap.data()||{}; cfg={sections:d.sections||[]}; if(!editing) render();
    }, ()=>{});
    unsubF=onSnapshot(doc(db,'udrzbaFilters',me.uid), snap=>{
      savedFilters=(snap.exists()?snap.data().list:[])||[]; if(!editing) render();
    }, ()=>{});
  }catch(e){ fatal=e.message; render(); }
}

/* ===== číslování PP-rok-XXX (transakce nad meta/config.seqUdrzba) ===== */

}

/* ===== render =====
   Hlavička se vykresluje jen jednou (do #uh-host, obnoví se jen když se

function renderShell(inner){

    headerSig=sig;
  }
  // scroll v otevřeném okně se jinak při každém překreslení ztrácel (nový
  // DOM element = scrollTop 0) — zapamatuje se a hned po překreslení vrátí.
  // Bere se POSLEDNÍ (= navrchu, nejspíš ten, co se zrovna scrolluje) —
  // okno Přiřadit pracovníky se umí otevřít NAD oknem příkazu, takže

  const modalBodies=document.querySelectorAll('.overlay .modal-body');

  // tabulka: posun (vodorovný i svislý) se při překreslení (třeba po zaškrtnutí filtru nebo zavření okna
  // příkazu) jinak vracel na začátek
  const tsOld=document.querySelector('.tscroller'), tsLeft=tsOld?tsOld.scrollLeft:0, tsTop=tsOld?tsOld.scrollTop:0;
  // vnitřní seznamy (okno Přiřadit/Vybrat, menu sloupce, panel Linka) — jinak by se po zaškrtnutí vracely nahoru

  const listScroll=LISTS.map(sel=>[...document.querySelectorAll(sel)].map(e=>e.scrollTop));
  mainHost.innerHTML = `<main>${inner}</main>` + (editing?modalView():'') + (assignPicker?assignPickerView():'') + (pickPicker?pickPickerView():'') + (filterModal?filterModalView():'') + (toastMsg?`<div class="toast ${toastKind}">${esc(toastMsg)}</div>`:'');
  if(scrollTop!=null){ const nbs=document.querySelectorAll('.overlay .modal-body'); const nb=nbs[nbs.length-1]; if(nb) nb.scrollTop=scrollTop; }
  LISTS.forEach((sel,k)=>{ document.querySelectorAll(sel).forEach((e,i)=>{ if(listScroll[k][i]) e.scrollTop=listScroll[k][i]; }); });
  if(tsLeft||tsTop){ const tsNew=document.querySelector('.tscroller'); if(tsNew){ tsNew.scrollLeft=tsLeft; tsNew.scrollTop=tsTop; } }
}
function loginView(){

    <h2>minimo · YFAI</h2><p class="muted" style="margin-top:0">Údržba</p>

}
/* ===== filtrování — každá osa se dá vynechat (skip), pro výpočet počtů ===== */
/* ===== hledání ve všem, co příkaz obsahuje =====
   Shoda je PŘESNÁ (včetně diakritiky), nerozlišují se jen velká a malá písmena; víc slov = příkaz musí obsahovat všechna.
   Hledá se v čísle, WO, poruše, popisu, lince, stroji, oboru, jménech, autorovi, stavu, prioritě, typu, stavu dílu,
   datech a v celé historii. */
/* PŘESNÁ shoda s tím, co hledající napíše — včetně diakritiky („či" nenajde „cí", „dveri" nenajde „dveří").
   Jediné, co se nerozlišuje, je velikost písmen (Martin, 2026-10-09). */
const searchWords=()=>(filters.q||'').toLowerCase().split(/\s+/).filter(Boolean);
const lcChar=c=>{ const l=c.toLowerCase(); return l.length===c.length?l:c; };
function findWord(tl,w,firstOnly){          // tl = text jako pole malých znaků, w = hledané slovo (malými)
  const wl=Array.from(w), out=[];
  for(let i=0;i+wl.length<=tl.length;i++){
    let ok=true;
    for(let k=0;k<wl.length;k++){ if(tl[i+k]!==wl[k]){ ok=false; break; } }
    if(ok){ out.push(i); if(firstOnly) return out; }
  }
  return out;
}
const textHas=(text,w)=>findWord(Array.from(String(text==null?'':text)).map(lcChar),w,true).length>0;
// pole, která jsou v řádku tabulky vidět (zvýrazní se přímo tam)
function visibleSearchText(o){
  // Stav, Typ, Priorita, Obor, Stroj, Linka a stav dílu se SCHVÁLNĚ nehledají — na to jsou filtry (Martin, 2026-10-09)
  return ([o.cislo,o.wo,o.nazev,...assignedNames(o).map(pn),
    o.authorName&&pn(o.authorName),
    o.prostojOd&&prostojFull(o.prostojOd),dateCz(o.created)].filter(Boolean).join(' '));
}
/* Řádek historie je „datum · kdo · co se stalo". Hledá se a označuje jen datum, jméno a skutečné hodnoty (stavy, jména
   přiřazených); šablonová slova („upravil příkaz", „založil příkaz", „přiřazeno:", „stav … →", „díl objednán"…) ne. */
const HIST_BOILER=/^(upravil příkaz|založil příkaz|nahlásil chybějící díl|díl objednán|díl dorazil|pokračuje se v opravě|nikdo)$/;
function histParts(h){
  const out=[];
  String(h).split(' · ').forEach((seg,i)=>{
    if(i) out.push({t:' · ',d:false});
    let m;
    if(HIST_BOILER.test(seg)) out.push({t:seg,d:false});
    else if((m=/^přiřazeno: (.*)$/.exec(seg))) out.push({t:'přiřazeno: ',d:false},{t:m[1],d:!HIST_BOILER.test(m[1])});
    else if(/^stav (.+) → (.+)$/.test(seg)) out.push({t:seg,d:false});   // změna stavu = šablona, stav se nehledá
    else out.push({t:seg,d:true});
  });
  return out;
}
const histHtmlLine=h=>histParts(h).map(x=>x.d?`<span class="hv">${esc(x.t)}</span>`:esc(x.t)).join('');
const hiddenSearchText=o=>({popis:String(o.popis||''),hist:(o.hist||[]).map(h=>histParts(h).filter(x=>x.d).map(x=>x.t).join(' ')).join(' ')});
function matchesSearch(o){
  if(!filters.q) return true;
  const words=searchWords(); if(!words.length) return true;
  const hid=hiddenSearchText(o), all=visibleSearchText(o)+' '+hid.popis+' '+hid.hist;
  return words.every(w=>textHas(all,w));
}
// shoda jen v tom, co v řádku není vidět (popis, historie) → v řádku se ukáže drobná nápověda
function searchHiddenHint(o){
  if(!filters.q) return '';
  const vis=visibleSearchText(o), hid=hiddenSearchText(o), where=new Set();

// jako Ctrl+F v dokumentu: nalezený text se označí (po každém překreslení znovu)
/* Označují se JEN hledaná data — vybrané prvky, které obsahují skutečný obsah příkazu (HL_OK). Popisky, tlačítka a pomocné
   texty („Přiřazeno", „Linka", „Vytvořil", „+ Přiřadit", „bez WO"…) se neoznačují. Nové datové políčko = přidat sem. */
const HL_OK='.r2-wo,.r2-pp,.tt,.r2-wn,.r2-pj,.r2-rel,.hv,'
  +'.hero h2,.hero-desc,.meta dd,.oi-title,.oi-top .muted';
const UI_SKIP='.nohl,button,label,dt,.sec-label,.r2-unas,.r2-hit,.r2-wo.none,.dash,.ap-cols,.modal-tabs,.modal-foot,.hero-desc .muted,.meta .muted,.hist .muted';
function applyHighlight(){
  const words=searchWords(); if(!words.length) return;
  const roots=[...document.querySelectorAll('.trow, .order-item')];
  if(editing&&editing._id&&!editMode) roots.push(...document.querySelectorAll('.overlay .modal-body'));
  roots.forEach(root=>{
    const nodes=[], tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:t=>{
      const pe=t.parentElement; if(!pe||/^(SCRIPT|STYLE|TEXTAREA|OPTION|MARK)$/.test(pe.tagName)) return NodeFilter.FILTER_REJECT;
      // označují se jen hledaná DATA, ne popisky a ovládací prvky (dt „Přiřazeno", štítky sekcí, tlačítka, „+ Přiřadit", „bez WO"…)
      const ui=pe.closest(UI_SKIP); if(ui&&ui!==root&&root.contains(ui)) return NodeFilter.FILTER_REJECT;
      if(!pe.closest(HL_OK)) return NodeFilter.FILTER_REJECT;
      return t.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT; }});
    while(tw.nextNode()) nodes.push(tw.currentNode);
    nodes.forEach(t=>{
      const orig=t.nodeValue, chars=Array.from(orig), tl=chars.map(lcChar);
      const mark=new Array(chars.length).fill(false);
      words.forEach(w=>{ const wl=Array.from(w).length; findWord(tl,w).forEach(i=>{ for(let k=i;k<i+wl;k++) mark[k]=true; }); });
      if(!mark.some(Boolean)) return;
      const frag=document.createDocumentFragment(); let buf='', on=false;
      const flush=()=>{ if(!buf) return; if(on){ const m=document.createElement('mark'); m.className='hl'; m.textContent=buf; frag.appendChild(m); } else frag.appendChild(document.createTextNode(buf)); buf=''; };
      chars.forEach((c,i)=>{ if(mark[i]!==on){ flush(); on=mark[i]; } buf+=c; }); flush();
      t.parentNode.replaceChild(frag,t);
    });
  });
}
function matchesView(o){ if(!filters.view) return true; if(filters.view==='nd') return !!o.nd; const v=VIEWS.find(x=>x.k===filters.view); return v?v.test(o):true; }

function passes(o,skip,skip2){
  if(skip!=='who'&&skip2!=='who' && !matchesWho(o)) return false;

  if(skip!=='nazev'&&skip2!=='nazev' && !matchesNazev(o)) return false;
  if(skip!=='autor'&&skip2!=='autor' && !matchesAutor(o)) return false;
  if(skip!=='q'&&skip2!=='q' && !matchesSearch(o)) return false;
  if(skip!=='view'&&skip2!=='view' && !matchesView(o)) return false;
  if(skip!=='typ'&&skip2!=='typ' && !matchesTyp(o)) return false;
  if(skip!=='stav'&&skip2!=='stav' && !matchesStav(o)) return false;
  if(skip!=='priorita'&&skip2!=='priorita' && !matchesPriorita(o)) return false;
  if(skip!=='obor'&&skip2!=='obor' && !matchesObor(o)) return false;

const SORT_OPTS=[{k:'created',label:'Datum'},{k:'priorita',label:'Priorita'},{k:'status',label:'Stav'},
  {k:'typ',label:'Typ'},{k:'wo',label:'WO'},{k:'nazev',label:'Porucha'},{k:'linka',label:'Linka'},
  {k:'obor',label:'Obor'},{k:'who',label:'Přiřazeno'},{k:'prostoj',label:'Prostoj od'}];
const PRIORITA_RANK={'nízká':0,'běžná':1,'vysoká':2,'kritická':3};
const STATUS_RANK={'nový':0,'rozpracováno':1,'hotovo':2};
// null = hodnota chybí; takové řádky jdou vždy na konec, ať je řazení vzestupně nebo sestupně
const SORT_VAL={
  created:o=>o.created||'',
  priorita:o=>PRIORITA_RANK[o.priorita]??0,
  status:o=>STATUS_RANK[o.status]??0,
  typ:o=>typOf(o)==='EM'?1:0,
  wo:o=>o.wo?Number(o.wo):null,
  nazev:o=>(o.nazev||'').toLowerCase(),
  linka:o=>(o.stroj||o.linka)?(((o.stroj||o.linka)+' '+(o.linka||'')).toLowerCase()):null,
  obor:o=>{ const k=oborOf(o)[0]; return k?OBOR.findIndex(x=>x.k===k):null; },
  who:o=>{ const n=assignedNames(o)[0]; return n?pn(n).toLowerCase():null; },

};
function sortRows(r){
  const dir=sortDir==='asc'?1:-1, val=SORT_VAL[sortKey]||SORT_VAL.created, text=['nazev','linka','who'].includes(sortKey);
  // při shodě (nebo když oběma chybí hodnota) se řadí podle data vytvoření, nejnovější nahoře
  const tie=(a,b)=>{ const x=a.created||'', y=b.created||''; return x<y?1:x>y?-1:0; };
  return r.slice().sort((a,b)=>{
    const av=val(a), bv=val(b);
    if(av==null&&bv==null) return tie(a,b); if(av==null) return 1; if(bv==null) return -1;
    const c=text?av.localeCompare(bv,'cs'):(av<bv?-1:av>bv?1:0);
    return c?c*dir:tie(a,b);
  });
}

function r2Who(names,id){

  const av=names.slice(0,3).map((n,i)=>`<span class="r2-av" title="${esc(n)}" style="${i?'margin-left:-9px;':''}--h:${hueOf(n)}">${esc(initials(n))}</span>`).join('');
  return `<span class="r2-who"><span class="r2-avs">${av}</span><span class="r2-wn">${esc(names.slice(0,3).join(', '))}${names.length>3?` +${names.length-3}`:''}</span></span>`;
}
function trHTML(o){
  const em=typOf(o)==='EM', crit=o.priorita==='kritická', names=assignedNames(o).map(pn);
  const obory=oborOf(o).map(k=>(OBOR.find(x=>x.k===k)||{}).label).filter(Boolean);
  const stroj=o.stroj?`<span class="r2-mono">${esc(o.stroj)}</span>${o.linka?`<span class="r2-sub">Linka ${esc(o.linka)}</span>`:''}`:(o.linka?`<span class="r2-mono">${esc(o.linka)}</span>`:'<span class="dash">bez linky</span>');
  return `<button type="button" class="trow st-${o.status}${em?' em':''}${em&&crit?' crit':''}" role="row" data-a="open" data-v="${o._id}">
    <span class="tc">${r2Stav(o)}</span>
    <span class="tc">${r2Typ(typOf(o))}</span>
    <span class="tc">${r2Prio(o.priorita)}</span>
    <span class="tc">${o.wo?`<span class="r2-wo">${esc(o.wo)}</span>`:'<span class="r2-wo none">bez WO</span>'}<span class="r2-pp">${esc(o.cislo||'')}</span></span>
    <span class="tc"><span class="tt" title="${esc(o.nazev||'')}">${esc(o.nazev||'')}</span>${o.nd?r2Part(o.nd):''}${searchHiddenHint(o)}</span>
    <span class="tc">${stroj}</span>
    <span class="tc"><span class="r2-obs">${obory.length?obory.map(x=>`<span class="r2-ob">${esc(x)}</span>`).join(''):'<span class="dash">–</span>'}</span></span>
    <span class="tc" title="${esc(names.join(', '))}">${r2Who(names,o._id)}</span>
    <span class="tc" title="${esc(prostojFull(o.prostojOd))}">${o.prostojOd?`<span class="r2-pj${o.status==='hotovo'?' off':''}">${SVG_CLOCK}${esc(prostojCz(o.prostojOd))}</span>`:'<span class="dash">—</span>'}</span>
    <span class="tc"><span class="r2-rel">${esc(dateCz(o.created).replace(/\.$/,''))}</span>${o.authorName?`<span class="r2-sub hv" title="Vytvořil">${esc(pn(o.authorName))}</span>`:''}</span>
  </button>`;
}
function colMenuHTML(){
  const c=COLS.find(x=>x.k===colOpen); if(!c) return '';
  const sorts=['asc','desc'].map((d,i)=>`<button type="button" class="cm-sort${sortKey===c.sort&&sortDir===d?' on':''}" data-a="col-sort" data-v="${c.sort}|${d}"><span aria-hidden="true">${d==='asc'?'↑':'↓'}</span>${esc(c.s[i])}</button>`).join('');
  const dim=c.tabs?colTab:c.dim;   // u sloupce se záložkami (Stroj | Linka, Porucha | Díl) se filtruje podle zvolené záložky
  const tabCount=t=>TEXT_FILTERS[t.dim]?(filters[t.dim]?1:0):filters[t.dim].length;   // textová záložka = 1, když je v ní něco napsané
  const tabs=c.tabs?`<div class="cm-tabs" role="tablist">${c.tabs.map(t=>`<button type="button" role="tab" aria-selected="${dim===t.dim}" class="cm-tab${dim===t.dim?' on':''}" data-a="col-tab" data-v="${t.dim}">${esc(t.label)}${tabCount(t)?`<span class="cm-tabn">${tabCount(t)}</span>`:''}</button>`).join('')}</div>`:'';
  let body='';
  if(TEXT_FILTERS[dim]){
    const tf=TEXT_FILTERS[dim];
    body=`<div class="cm-sep"></div>${tabs}
      <div class="cm-search"><input type="text" ${tf.digits?'inputmode="numeric" ':''}id="cm-text" data-d="${dim}" placeholder="${esc(tf.ph)}" autocomplete="off" value="${esc(filters[dim])}"></div>
      <div class="cm-foot"><button type="button" class="cm-link" data-a="col-clear" data-v="${dim}">Vymazat</button><button type="button" class="cm-done" data-a="col-close">Hotovo</button></div>`;
  }else if(dim){
    const all=colOptions(dim), q=colQuery.trim().toLowerCase(), sel=filters[dim];
    let shown=colOnly?all.filter(o=>sel.includes(o.k)):all;
    if(q) shown=shown.filter(o=>o.label.toLowerCase().includes(q));
    // hledání i „Jen vybrané" jsou ve VŠECH filtrech se zaškrtávátky, ať je každé menu stejné (Martin)
    const onlyBtn=`<div class="cm-only" style="display:flex;gap:6px"><button type="button" class="cm-onlybtn${colOnly?' on':''}" data-a="col-only" aria-pressed="${colOnly}"${(sel.length||colOnly)?'':' disabled'}>Jen vybrané${sel.length?` · ${sel.length}`:''}</button><button type="button" class="cm-onlybtn" data-a="col-clear" data-v="${dim}"${sel.length?'':' disabled'}>Zrušit vše</button></div>`;
    body=`<div class="cm-sep"></div>${tabs}
      <div class="cm-search"><input type="text" id="cm-q" placeholder="Hledat…" autocomplete="off" value="${esc(colQuery)}"></div>
      ${onlyBtn}
      <div class="checklist cm-list">${shown.length?shown.map(o=>`<label class="filter-check"><input type="checkbox" data-flt="${dim}" value="${esc(o.k)}" ${filters[dim].includes(o.k)?'checked':''}><span class="fc-box"></span>${(o.color&&!o.html)?`<span class="fc-dot" style="background:${o.color}"></span>`:''}<span class="fc-label">${o.html||esc(o.label)}</span><span class="count">${COUNT_FN[dim](o.k)}</span></label>`).join(''):`<div class="muted" style="padding:6px 8px;font-size:12px">${colOnly&&!sel.length?'Nic není vybráno.':'Nic nenalezeno.'}</div>`}</div>
      <div class="cm-foot"><button type="button" class="cm-done" data-a="col-close" style="margin-left:auto">Hotovo</button></div>`;
  }
  return `<div class="colmenu" id="colmenu" tabindex="-1" role="dialog" aria-label="Filtr a řazení: ${esc(c.label)}">${sorts}${body}</div>`;
}

function favIsOn(f){
  return activeFilterCount()>0
    && ['typ','stav','priorita','obor','linka'].every(d=>{ const a=filters[d], b=f[d]||[]; return a.length===b.length&&a.every(x=>b.includes(x)); })
    && !filters.nd.length && !filters.stroj.length && !filters.who.length && !filters.prostoj.length && !filters.autor.length && !filters.wo && !filters.nazev;
}
function favPanelHTML(){
  const items=savedFilters.length?savedFilters.map(f=>`<button type="button" class="fp-item${favIsOn(f)?' on':''}" data-a="fav-apply" data-v="${esc(f.id)}"><span class="fav-dot" style="background:${esc(f.color)}"></span><span class="fav-label">${esc(f.name)}</span><span class="fav-edit" data-a="fav-edit" data-v="${esc(f.id)}" title="Upravit">✎</span></button>`).join(''):'<div class="fp-empty">Zatím žádné uložené filtry.</div>';
  const dots=savedFilters.map(f=>`<button type="button" class="fp-dotbtn${favIsOn(f)?' on':''}" data-a="fav-apply" data-v="${esc(f.id)}" title="${esc(f.name)}"><i style="background:${esc(f.color)}"></i></button>`).join('');
  const eye=`<button type="button" class="fp-ic fp-eyebtn" data-a="panel-eye" aria-pressed="${panelEye}" title="${eyeTitle(panelEye)}">${IC_EYE}</button>`;
  return `<aside class="favpanel" aria-label="Oblíbené filtry">

function setPanelEye(on){
  panelEye=on;
  try{ localStorage.setItem(PANEL_KEY,on?'1':'0'); }catch(e){}
  const b=document.getElementById('board2');
  if(b){ b.classList.toggle('fp-eye',on); b.classList.toggle('fp-noeye',!on); }
  document.querySelectorAll('.fp-eyebtn').forEach(x=>{ x.title=eyeTitle(on); x.setAttribute('aria-pressed',on); });
}
function placeColMenu(){
  const m=document.getElementById('colmenu'), b=document.querySelector('.hc.open');
  if(!m||!b) return;
  const r=b.getBoundingClientRect(), w=m.offsetWidth||252;
  m.style.left=Math.min(Math.max(8,r.left),window.innerWidth-w-8)+'px';
  m.style.top=(r.bottom+6)+'px';
  // seznam se zkrátí podle výšky okna, ať patička („Hotovo") nikdy nevyjede pod okraj; delší seznam se posouvá
  const list=m.querySelector('.cm-list');
  if(list){
    const others=m.offsetHeight-list.offsetHeight;
    const room=window.innerHeight-(r.bottom+6)-others-14;
    list.style.maxHeight=Math.max(110,Math.min(420,Math.floor(room)))+'px';
  }
}

/* ===== modal ===== */
const g = id => { const el=document.getElementById(id); return el?el.value:undefined; };
function collect(){
  if(!editing) return;
  // linka a stroj se sem nesbírají — nastavuje je přímo okno výběru (case 'pick-confirm')
  const map={nazev:'e-nazev',popis:'e-popis',wo:'e-wo',prostojOd:'e-prostoj-od'};
  Object.keys(map).forEach(k=>{ const v=g(map[k]); if(v!==undefined) editing[k]=v; });
  const p=g('e-priorita-range'); if(p!==undefined) editing.priorita=PRIORITA[+p]||PRIORITA[PRIORITA.indexOf('běžná')];
  if(document.getElementById('e-obor-'+OBOR[0].k)){
    editing.obor = OBOR.map(x=>x.k).filter(k=>{ const el=document.getElementById('e-obor-'+k); return el && el.checked; });
  }
  // Přiřazení (víc lidí) se zapisuje přímo do editing.assignedTo/assignedToNames
  // z okna "Přiřadit pracovníky" (case 'assign-confirm') — není co sbírat tady.
}

function validate(){
  errs={}; collect();
  if(!editing.nazev) errs.nazev='Povinné pole';
  if(!editing.linka) errs.linka='Povinné pole';
  const sec=sectionByName(editing.linka), machs=sec?(sec.machines||[]):[];
  if(sec && machs.length && !editing.stroj) errs.stroj='Povinné pole';
  if(!editing.obor || !editing.obor.length) errs.obor='Povinné pole';
  return Object.keys(errs).length===0;
}

/* ===== zápisy ===== */
async function createPrikaz(){
  const cislo=await nextNumber();
  const rec=Object.assign({priorita:'běžná',typ:'CM',obor:[]},editing,{cislo,status:'nový',author:me.uid,authorName:me.name,authorEmail:me.email,
    created:today(),createdTs:serverTimestamp(),hist:[`${today()} · ${me.name} · založil příkaz`]});
  delete rec._id;
  await addDoc(collection(db,'udrzba'),rec);
  return cislo;
}
async function updatePrikaz(){
  const id=editing._id; const old=rows.find(r=>r._id===id)||{};
  const hist=(editing.hist||[]).slice();
  const oldUids=assignedUids(old).slice().sort().join(','), newUids=assignedUids(editing).slice().sort().join(',');
  if(oldUids!==newUids) hist.push(`${today()} · ${me.name} · přiřazeno: ${assignedNames(editing).join(', ')||'nikdo'}`);
  hist.push(`${today()} · ${me.name} · upravil příkaz`);
  const {_id,...data}=editing; data.hist=hist;
  await updateDoc(doc(db,'udrzba',id),data);
}
async function changeStatus(o,newStatus){
  const hist=(o.hist||[]).slice();
  hist.push(`${today()} · ${me.name} · stav ${o.status} → ${newStatus}`);
  const patch={status:newStatus,hist};
  if(newStatus==='hotovo'){ patch.doneAt=today(); patch.doneByName=me.name; }
  await updateDoc(doc(db,'udrzba',o._id),patch);
}

/* ===== akce ===== */
async function act(a,v,el,ev){
  // jakákoli jiná akce než práce s menu sloupce menu zavře (klik na dlaždici, kartu, štítek…)
  if(colOpen && !['col-open','col-sort','col-clear','col-close','col-tab','col-only'].includes(a)) colOpen=null;
  switch(a){
    case 'col-open':{ colOpen=(colOpen===v?null:v); colQuery=''; colOnly=false;
      const cc=COLS.find(x=>x.k===colOpen);
      // výchozí záložka: první; když je zapnutý jen filtr té druhé, otevři ji
      if(cc&&cc.tabs) colTab=(filters[cc.tabs[0].dim].length||!filters[cc.tabs[1].dim].length)?cc.tabs[0].dim:cc.tabs[1].dim;
      break; }
    case 'col-tab': colTab=v; colQuery=''; colOnly=false; break;
    case 'col-only': colOnly=!colOnly; break;
    case 'col-close': colOpen=null; break;
    case 'col-sort':{ const i=v.indexOf('|'); sortKey=v.slice(0,i); sortDir=v.slice(i+1); break; }
    case 'col-clear': if(TEXT_FILTERS[v]) filters[v]=''; else if(Array.isArray(filters[v])) filters[v]=[]; break;
    case 'chip-rm':{ const i=v.indexOf('|'), d=v.slice(0,i), k=v.slice(i+1);
      if(TEXT_FILTERS[d]) filters[d]=''; else if(Array.isArray(filters[d])){ const j=filters[d].indexOf(k); if(j>=0) filters[d].splice(j,1); } break; }
    case 'panel-eye': setPanelEye(!panelEye); return;   // jen přepne třídu na #board2, bez překreslení
    case 'hide-done': hideDone=!hideDone; try{ localStorage.setItem(HIDE_KEY,hideDone?'1':'0'); }catch(e){} break;   // není filtr, „Zrušit filtry" ho nemění
    case 'fav-save-current':{
      filterModal={...newFilterDraft(),typ:[...filters.typ],stav:[...filters.stav],priorita:[...filters.priorita],obor:[...filters.obor],linka:[...filters.linka]};
      favOpen=false; favLinkaOpen=false; favLinkaQuery='';
      if(filters.stroj.length||filters.who.length||filters.prostoj.length||filters.autor.length||filters.wo||filters.nazev) toast('Do oblíbených se ukládá Typ, Stav, Priorita, Obor a Linka. Stroj, Přiřazeno, Prostoj, Vytvořil, WO a Porucha ne.');
      break; }
    case 'login':{ const email=(g('li-email')||'').trim(), pass=g('li-pass')||'';
      if(!email||!pass){loginErr='Vyplň e-mail i heslo.';render();return;}
      loginBusy=true;loginErr='';render();
      try{ await signInWithEmailAndPassword(auth,email,pass); }catch(e){ loginBusy=false; loginErr='Přihlášení selhalo.'; render(); } return; }
    case 'logout': await signOut(auth); return;
    case 'flt-view':
      // odchod z pohledu Náhradní díl na jinou dlaždici zavře i její panel
      // a zruší rozepsaný užší výběr (potřeba/čeká/přišel) — čistý přechod.
      if(filters.view==='nd'){ ndOpen=false; filters.nd=[]; }
      filters.view=(filters.view===v?'':v); break;
    case 'clear-filters': filters.typ=[];filters.stav=[];filters.priorita=[];filters.obor=[];filters.linka=[];filters.nd=[];filters.who=[];filters.prostoj=[];filters.autor=[];filters.stroj=[];filters.wo='';filters.nazev=''; break;
    case 'search-open': searchOpen=true; break;
    case 'nd-clear': filters.nd=[]; break;
    case 'linka-clear': filters.linka=[]; break;
    case 'fav-linka-clear': if(filterModal) filterModal.linka=[]; break;
    case 'fav-clear-all': if(filterModal){ filterModal.typ=[]; filterModal.stav=[]; filterModal.priorita=[]; filterModal.obor=[]; filterModal.linka=[]; } break;
    case 'linka-toggle': linkaOpen=!linkaOpen; if(!linkaOpen) linkaQuery=''; break;
    case 'fav-linka-toggle': favLinkaOpen=!favLinkaOpen; if(!favLinkaOpen) favLinkaQuery=''; break;
    case 'nd-tile-toggle':
      // Klik na dlaždici jen otevírá/zavírá panel (stejně jako klik mimo
      // něj panel zavře) — NEdeaktivuje pohled, ať jde klikáním na
      // dlaždici panel opakovaně znovu otevřít, i když ho předtím zavřel
      // klik mimo. Pohled (filters.view='nd') se vypne jen přechodem na
      // jinou dlaždici (viz 'flt-view' výš).
      ndOpen=!ndOpen;
      if(ndOpen) filters.view='nd';
      break;
    case 'search-close': searchOpen=false; filters.q=''; break;
    case 'new': editing={priorita:'běžná',typ:'CM',obor:[],status:'nový',hist:[]}; editMode=false; errs={};footMsg='';modalTab='info';break;
    case 'set-typ': if(editing){ collect(); editing.typ=v; } break;
    case 'prostoj-toggle':{
      if(!editing) break;
      collect();
      if(editing.prostojOd){ editing.prostojOd=null; }
      else{ const d=new Date(), p=n=>String(n).padStart(2,'0'); editing.prostojOd=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
      break; }
    case 'open': editing=JSON.parse(JSON.stringify(rows.find(r=>r._id===v))); editMode=false; errs={};footMsg='';modalTab='info';break;
    case 'modal-tab': modalTab=v; break;
    case 'edit': collect(); editMode=true; break;
    case 'cancel-edit': editMode=false; errs={}; footMsg=''; editing=JSON.parse(JSON.stringify(rows.find(r=>r._id===editing._id)||editing)); break;
    case 'close': case 'close-bg':
      if(a==='close-bg'){
        if(!downOnOverlay||(ev&&ev.target!==el)){ downOnOverlay=false; return; }
        // rozepsaný formulář (nový příkaz / editace) se kliknutím mimo
        // nezahazuje — musí se použít tlačítko Zrušit nebo Uložit.
        if(!editing._id||editMode){ downOnOverlay=false; return; }
      }
      downOnOverlay=false; editing=null;editMode=false;errs={};footMsg='';break;
    case 'save':{ collect();
      if(!validate()){footMsg='Doplň povinná pole.';render();return;}
      try{ if(!editing._id){ const c=await createPrikaz(); editing=null; toast('Příkaz '+c+' založen.','ok'); }
        else{ await updatePrikaz(); editMode=false; toast('Změny uloženy.','ok'); } }
      catch(e){ footMsg='Uložení selhalo: '+e.message; render(); return; } break; }
    case 'status':{ const o=rows.find(x=>x._id===editing._id); if(!o)return;
      try{ await changeStatus(o,v);
        editing.hist=(editing.hist||[]).concat(`${today()} · ${me.name} · stav ${editing.status} → ${v}`);
        editing.status=v;
        if(v==='hotovo'){ editing.doneAt=today(); editing.doneByName=me.name; }
        toast('Stav změněn.','ok'); }catch(e){ toast(e.message,'err'); } break; }
    case 'nd-set':{ const o=rows.find(x=>x._id===editing._id); if(!o)return;
      const ndLabelHist={potreba:'nahlásil chybějící díl',objednano:'díl objednán',prisel:'díl dorazil','':'pokračuje se v opravě'};
      const hist=(o.hist||[]).slice().concat(`${today()} · ${me.name} · ${ndLabelHist[v]||'změna stavu dílu'}`);
      try{ await updateDoc(doc(db,'udrzba',o._id),{nd:v||null,hist});
        editing.nd=v||null; editing.hist=hist;
        toast('Stav dílu změněn.','ok'); }catch(e){ toast(e.message,'err'); } break; }
    case 'del':{ if(!isAdmin())return;
      if(!editing.confirmDel){ editing.confirmDel=true; break; }
      const o=rows.find(x=>x._id===v);
      try{ await deleteDoc(doc(db,'udrzba',v)); editing=null; toast('Příkaz '+(o?o.cislo:'')+' smazán.','ok'); }catch(e){ toast(e.message,'err'); } break; }
    case 'cancel-del': editing.confirmDel=false; break;
    case 'fav-toggle': favOpen=!favOpen; break;
    case 'fav-new': filterModal=newFilterDraft(); favOpen=false; favLinkaOpen=false; favLinkaQuery=''; break;
    case 'fav-edit':{ const f=savedFilters.find(x=>x.id===v); if(f) filterModal=JSON.parse(JSON.stringify(f)); favOpen=false; favLinkaOpen=false; favLinkaQuery=''; break; }
    case 'fav-apply':{ const f=savedFilters.find(x=>x.id===v); if(f) favApply(f); favOpen=false; break; }
    case 'fav-color': if(filterModal) filterModal.color=v; break;
    case 'fav-close': case 'fav-close-bg':
      // je to pořád rozepsaný formulář (Uložit/Zrušit) — kliknutí mimo
      // ho nezavírá, stejně jako u okna pracovního příkazu v editaci.
      if(a==='fav-close-bg'){ downOnOverlay=false; return; }
      downOnOverlay=false; filterModal=null; favLinkaOpen=false; favLinkaQuery=''; break;
    case 'fav-cancel-del': if(filterModal) filterModal.confirmDel=false; break;
    case 'fav-delete':{ if(!filterModal || !filterModal.id) return;
      if(!filterModal.confirmDel){ filterModal.confirmDel=true; break; }
      const list=savedFilters.filter(x=>x.id!==filterModal.id);
      try{ await setDoc(doc(db,'udrzbaFilters',me.uid),{list}); filterModal=null; favLinkaOpen=false; favLinkaQuery=''; toast('Filtr smazán.','ok'); }catch(e){ toast(e.message,'err'); } break; }
    case 'fav-save':{ const name=(g('fv-name')||'').trim();
      if(!name){ filterModal.err='name'; break; }
      const id=filterModal.id||('f'+Date.now());
      const item={id,name,color:filterModal.color,typ:filterModal.typ,stav:filterModal.stav,priorita:filterModal.priorita,obor:filterModal.obor,linka:filterModal.linka};
      const list=savedFilters.filter(x=>x.id!==id).concat([item]);
      try{ await setDoc(doc(db,'udrzbaFilters',me.uid),{list}); filterModal=null; favLinkaOpen=false; favLinkaQuery=''; toast('Filtr uložen.','ok'); }catch(e){ toast(e.message,'err'); } break; }
    case 'pick-open': collect(); pickPicker={kind:v,sel:(v==='linka'?(editing.linka||''):(editing.stroj||'')),query:'',only:false,drill:null}; break;
    case 'pick-close': case 'pick-close-bg':
      if(a==='pick-close-bg'){ if(!downOnOverlay||(ev&&ev.target!==el)){ downOnOverlay=false; return; } }
      downOnOverlay=false; pickPicker=null; break;
    case 'pick-toggle': pickPicker.sel=(pickPicker.sel===v?'':v); break;   // jedna položka: další zaškrtnutí nahradí předchozí
    case 'pick-only': pickPicker.only=!pickPicker.only; break;
    case 'pick-drill': pickPicker.drill=(pickPicker.drill===v?null:v); break;
    case 'pick-confirm':{
      if(pickPicker.kind==='linka'){ if(editing.linka!==pickPicker.sel) editing.stroj=''; editing.linka=pickPicker.sel; }   // jiná linka = jiné stroje
      else editing.stroj=pickPicker.sel;
      pickPicker=null; break; }
    case 'assign-open': collect(); assignPicker={selected:[...assignedUids(editing)], query:'', drillUid:null, only:false}; break;
    case 'assign-quick':{ // „+ Přiřadit" přímo v řádku tabulky: okno se otevře rovnou a uloží se rovnou
      const o=rows.find(r=>r._id===v); if(!o) break;
      if(!canEditDoc(o)){ toast('Přiřadit pracovníky může jen zadavatel příkazu nebo správce.','err'); break; }
      assignPicker={selected:[...assignedUids(o)], query:'', drillUid:null, only:false, direct:o._id}; break; }
    case 'assign-only': assignPicker.only=!assignPicker.only; break;
    case 'assign-clear': assignPicker.selected=[]; assignPicker.only=false; break;
    case 'assign-close': case 'assign-close-bg':
      if(a==='assign-close-bg'){ if(!downOnOverlay||(ev&&ev.target!==el)){ downOnOverlay=false; return; } }
      downOnOverlay=false; assignPicker=null; break;
    case 'assign-toggle':{ const i=assignPicker.selected.indexOf(v); if(i<0) assignPicker.selected.push(v); else assignPicker.selected.splice(i,1); break; }
    case 'assign-drill': assignPicker.drillUid=(assignPicker.drillUid===v?null:v); break;
    case 'assign-confirm':{
      const uids=[...assignPicker.selected];
      const names=uids.map(uid=>{ const u=users.find(x=>x._id===uid); return u?(u.name||u.email):uid; });
      if(assignPicker.direct){ // uložení rovnou do databáze (okno bylo otevřeno z řádku tabulky)
        const o=rows.find(r=>r._id===assignPicker.direct); assignPicker=null;
        if(o){
          const oldU=assignedUids(o).slice().sort().join(','), newU=uids.slice().sort().join(',');
          if(oldU!==newU){
            try{
              const hist=(o.hist||[]).slice(); hist.push(`${today()} · ${me.name} · přiřazeno: ${names.join(', ')||'nikdo'}`);
              await updateDoc(doc(db,'udrzba',o._id),{assignedTo:uids,assignedToNames:names,hist});
              toast('Přiřazení uloženo.','ok');
            }catch(e){ toast(e.message,'err'); }
          }
        }
        break;
      }
      editing.assignedTo=uids; editing.assignedToNames=names;
      assignPicker=null; break; }
  }
  render();
  if(a==='col-open' && colOpen){ const f=document.getElementById('cm-text')||document.getElementById('cm-q')||document.getElementById('colmenu'); if(f) f.focus(); }
  if(a==='search-open'||a==='search-close'){ const inp=document.getElementById('f-q'); if(inp&&(a==='search-open'||window.matchMedia('(min-width:861px)').matches)) inp.focus(); }
  // tlačítko Linka bývá poslední v seznamu/okně, takže se rozbalený panel

  if(a==='linka-toggle' && linkaOpen){
