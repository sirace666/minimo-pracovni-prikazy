<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20100%20100%27%3E%3Crect%20width=%27100%27%20height=%27100%27%20rx=%2722%27%20fill=%27%231b4b8f%27/%3E%3Ctext%20x=%2750%27%20y=%2776%27%20font-size=%2774%27%20font-family=%27Arial,sans-serif%27%20font-weight=%27bold%27%20fill=%27white%27%20text-anchor=%27middle%27%3Em%3C/text%3E%3C/svg%3E">
<title>Engineering — YFAI minimo</title>
<link rel="stylesheet" href="header.css">
<style>
  :root{--navy-1:#0f2f5f;--navy-2:#1b4b8f;--bg:#f4f6f9;--card:#fff;--line:#dde4ec;--text:#16233a;--muted:#6b7a90;
    --green:#1f9254;--red:#c0392b;--amber:#b7791f;--blue:#2563a8;--purple:#6b46c1;
    --teal:#0d7377;--teal-bg:#e4f2f2;--teal-dark:#0a5b5e;--radius:6px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px}
  button{font-family:inherit;font-size:12px;cursor:pointer;border-radius:var(--radius);border:1px solid transparent;padding:7px 12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--text);width:100%}
  input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid #2a5ea3;outline-offset:1px}
  main{padding:14px 16px 40px}          /* přes celou šířku obrazovky */
  .btn-primary{background:var(--navy-2);color:#fff}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:#41506b}
  .btn-ok{background:var(--green);color:#fff}
  .btn-teal{background:var(--teal);color:#fff;font-weight:700}
  .btn-del{background:#fff;border:1px solid #e3b7b1;color:var(--red);font-weight:600}
  .btn-del:hover{background:var(--red);border-color:var(--red);color:#fff}
  .muted{color:var(--muted)}
  .num{text-align:right;font-variant-numeric:tabular-nums}

  .notice{background:#eef4fc;border:1px solid #cfe0f5;color:#274a74;border-radius:8px;padding:10px 13px;margin-bottom:12px;font-size:12.5px}
  .notice.warn{background:#fdf3e2;border-color:#f2dfb8;color:#7a5410}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
  .panel>h2{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;margin:0;padding:11px 15px;font-size:14px;display:flex;align-items:center;gap:10px}
  .panel>h2 .right{margin-left:auto;font-weight:500;font-size:11px;opacity:.85}
  .panel .body{padding:13px}
  .empty{padding:26px;text-align:center;color:var(--muted)}

  .tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  /* Hlavní menu modulu — velká, zřetelná tlačítka, ať je vidět, kam se kliká. */
  .tab{background:#fff;color:var(--navy-1);border:1.5px solid #c8d6e8;border-radius:9px;
    font-size:14px;font-weight:700;padding:11px 20px;letter-spacing:.1px;
    box-shadow:0 1px 2px rgba(15,47,95,.06);transition:background .12s,border-color .12s,color .12s,transform .12s}
  .tab:hover{background:var(--teal-bg);border-color:var(--teal);color:var(--teal-dark);transform:translateY(-1px)}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal-dark);
    box-shadow:0 2px 6px rgba(13,115,119,.35);transform:none}
  a.tab{display:inline-block;line-height:normal;text-decoration:none}
  /* Import stojí stranou vpravo — není to součást menu, je to nástroj. */
  .tab-imp{background:var(--navy-2);color:#fff;border-color:var(--navy-1)}
  .tab-imp:hover{background:var(--navy-1);border-color:var(--navy-1);color:#fff}
  .tab-imp.on{background:var(--navy-1);border-color:var(--navy-1);box-shadow:0 2px 6px rgba(15,47,95,.35)}
  .tabs .sp{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .rangebtn{background:#fff;border:1px solid var(--line);color:#41506b;font-size:11.5px;padding:6px 11px}
  .rangebtn.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px;margin-bottom:14px}

  /* ===== velké dlaždice procesů na hlavní stránce ===== */
  .ptilebar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
  @media(max-width:1180px){.ptiles{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:760px){.ptiles{grid-template-columns:1fr}}
  .ptile{font-family:Arial,"Helvetica Neue",Helvetica,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;text-align:left;padding:0;background:var(--card);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;font:inherit;color:var(--text);
    box-shadow:0 1px 3px rgba(15,47,95,.07);transition:box-shadow .14s,transform .14s,border-color .14s}
  .ptile:hover{box-shadow:0 8px 22px rgba(15,47,95,.16);transform:translateY(-2px);border-color:#b9cbe6}
  .ptile.alarm{border-color:#e3b7b1}
  .ptile .ph{display:flex;align-items:center;gap:11px;padding:14px 17px;
    background:var(--pc);color:#fff}
  .ptile .ph .ic{font-size:22px;line-height:1}
  .ptile .ph .nm{font-size:18px;font-weight:700;letter-spacing:.2px}
  .ptile .ph .perf{margin-left:auto;font-size:14px;font-weight:700;background:rgba(255,255,255,.22);
    border-radius:20px;padding:4px 12px}
  .ptile .ph .perf.bad{background:#fff;color:var(--red)}
  .pbody{padding:15px 17px;display:flex;flex-direction:column;gap:13px;flex:1}
  .pmain .big{font-size:38px;font-weight:700;line-height:1;color:var(--navy-1)}
  .pmain .big small{font-size:16px;font-weight:700;color:#5a6b80;margin-left:4px}
  .pmain .cap{font-size:12.5px;font-weight:700;letter-spacing:.2px;color:#41506b;margin-top:6px}
  .pmain .sub{font-size:13px;color:#41506b;margin-top:5px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .prow{border-top:1px dotted var(--line);border-bottom:1px dotted var(--line);padding:8px 0;
    display:flex;flex-direction:column;gap:5px}
  .prow>div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .prow .v{flex:none;min-width:62px}
  .prow .v{font-size:20px;font-weight:700}
  .prow .l{font-size:13.5px;color:#41506b}
  .spark{margin:2px 0}
  .spark svg{width:100%;height:60px;display:block}
  .sparkx{display:grid;margin-top:5px;border-top:1px solid var(--line);padding-top:5px}
  .sparkx span{text-align:center;font-size:12px;color:#5a6b80;white-space:nowrap;overflow:hidden}
  .sparkx span.now{color:#16233a;font-weight:700}
  .spark.empty{font-size:13px;color:#41506b;padding:18px 0;text-align:center;
    border:1px dashed var(--line);border-radius:8px}
  .sparkcap{font-size:12px;color:#41506b;margin-top:4px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pgrid>div{background:#f6f8fa;border:1px solid var(--line);border-radius:8px;padding:8px 9px;min-width:0}
  .pgrid>div.bad{background:#fdecea;border-color:#f0c8c2}
  .pgrid .v{display:block;font-size:26px;font-weight:700;line-height:1.1}
  .pgrid>div.bad .v{color:var(--red)}
  .pgrid .l{display:block;font-size:12.5px;color:#41506b;margin-top:4px;line-height:1.4}
  .pfoot{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#2b3a52;line-height:1.45}
  .pgo{background:#f2f6fb;border-top:1px solid var(--line);padding:11px 17px;font-size:13.5px;
    font-weight:700;color:var(--teal-dark);text-align:right}
  .ptile:hover .pgo{background:var(--teal-bg)}
  .tarrow{font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
  .tarrow.up{background:#fdecea;color:var(--red)}
  .tarrow.down{background:#e8f6ee;color:var(--green)}
  .tarrow.flat{background:#eef1f5;color:var(--muted)}
  /* podzáložky procesů v KPI */
  .subtabs{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
  .stab{background:#fff;border:1px solid var(--line);color:#41506b;font-weight:700;font-size:12.5px;
    padding:8px 14px;border-radius:20px}
  .stab:hover{border-color:var(--teal);color:var(--teal-dark)}
  .stab.on{background:var(--navy-2);border-color:var(--navy-1);color:#fff}
  @media(max-width:680px){
    .pmain .big{font-size:30px}
  }
  .kcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:var(--radius);padding:11px 13px}
  .kcard .lbl{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kcard .val{font-size:27px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .kcard .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
  .kcard .note{font-size:11px;color:var(--muted)}
  .kcard.soon{border-left-color:#c8d3e0;background:repeating-linear-gradient(135deg,#fff,#fff 8px,#fafbfd 8px,#fafbfd 16px)}
  .kcard.soon .val{color:var(--muted)}

  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:start}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr}}

  .bars{display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line)}
  .bar:last-child{border-bottom:0}
  .bar .nm{flex:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .bar .tr{flex:1.5;height:14px;background:#eef1f5;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .bar .tr i{display:block;height:100%;border-radius:3px}
  .bar .vl{flex:none;width:120px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  button.bar{width:100%;background:none;border:0;border-bottom:1px dotted var(--line);border-radius:0;
    text-align:left;cursor:pointer;font:inherit;color:inherit;padding:6px 4px}
  button.bar:hover{background:var(--teal-bg)}
  button.bar .ar{flex:none;color:var(--teal-dark);font-weight:800;font-size:15px;width:12px;text-align:center;opacity:.35}
  button.bar:hover .ar{opacity:1}
  .drillhint{margin-top:9px;font-size:11.5px;color:var(--muted)}
  /* ===== generovat pareto ===== */
  .pargrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:14px}
  .pickbtn{display:flex;align-items:center;gap:8px;justify-content:flex-start;width:100%;
    padding:9px 11px;font-size:13px;font-weight:600;min-height:37px;text-align:left}
  .pickbtn .ar{margin-left:auto;color:var(--muted)}
  .pickbtn:hover{border-color:var(--teal);color:var(--teal-dark)}
  .parper{display:flex;gap:6px;flex-wrap:wrap}
  .parcustom{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px}
  .parcustom label{display:flex;align-items:center;gap:6px;font-size:12px;color:#41506b}
  .parcustom input{width:auto}
  .parrun{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px dotted var(--line);padding-top:13px}
  .parrun .btn-teal{font-size:14px;padding:11px 20px;border-radius:8px}
  .parchart{overflow-x:auto}
  .parchart svg{width:100%;min-width:640px;height:auto;display:block}
  .pbar{cursor:pointer}
  .pbar:hover rect{opacity:.78}
  .pbar.on rect{stroke:#16233a;stroke-width:2}
  .pickwrap{padding:14px 18px;max-height:56vh;overflow-y:auto}
  .pickgrp{margin-bottom:14px}
  .pickgrp .h{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text);
    border-bottom:2px solid var(--teal-bg);padding-bottom:5px;margin-bottom:8px}
  .pickgrp .h button{margin-left:auto;padding:3px 9px;font-size:11px}
  .chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px}
  .chk label.check{background:#f6f8fa;border:1px solid var(--line);border-radius:7px;padding:8px 10px;white-space:normal}
  .chk label.check:hover{border-color:var(--teal);background:var(--teal-bg)}
  .gdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
  @media(max-width:680px){ .pargrid{grid-template-columns:1fr} .chk{grid-template-columns:1fr} }
  th.sortth{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortth:hover{background:#22497e}
  th.sortth .sar{margin-left:5px;font-size:10px;opacity:.45}
  th.sortth.on{background:#2a5793}
  th.sortth.on .sar{opacity:1}
  .drillbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#eef4fc;border:1px solid #cfe0f5;
    border-radius:var(--radius);padding:9px 11px;margin-bottom:12px}
  .dchip{background:#fff;border:1px solid #cfe0f5;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;color:#274a74}
  .chart{width:100%;height:auto;display:block}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);background:#fafbfd}
  .filters input,.filters select{width:auto;min-width:150px}
  .filters .grow{flex:1 1 260px;max-width:520px}
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{background:#16355f;color:#fff;text-align:left;padding:9px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  tbody td{padding:8px 10px;border-bottom:1px solid #eef1f5;vertical-align:top}
  tbody tr:hover td{background:#fafbfd}
  tr.long td{background:#fdf1ef}
  td.desc{min-width:180px;max-width:340px}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid transparent;white-space:nowrap}
  .b-grey{background:#eef1f5;color:#4a5a70;border-color:#dfe4ea}
  .b-teal{background:var(--teal-bg);color:var(--teal-dark);border-color:#bfdedd}
  .b-green{background:#e8f6ee;color:var(--green);border-color:#c4e6d3}
  .b-red{background:#fdecea;color:var(--red);border-color:#f5cfca}

  .steps{display:flex;padding:0;margin:0 0 14px;list-style:none;flex-wrap:wrap}
  .steps li{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-right:0;padding:10px 14px;font-size:12px;color:var(--muted);display:flex;gap:9px;align-items:center}
  .steps li:first-child{border-radius:var(--radius) 0 0 var(--radius)}
  .steps li:last-child{border-right:1px solid var(--line);border-radius:0 var(--radius) var(--radius) 0}
  .steps li b{flex:none;width:22px;height:22px;border-radius:50%;background:#eef1f5;color:#4a5a70;display:flex;align-items:center;justify-content:center;font-size:11px}
  .steps li.on{background:var(--teal-bg);color:var(--teal-dark);font-weight:700;border-color:#bfdedd}
  .steps li.on b{background:var(--teal);color:#fff}
  .steps li.done b{background:var(--green);color:#fff}
  /* ===== Akční plán managementu ===== */
  textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);
    background:#fff;color:var(--text);width:100%;resize:vertical}
  textarea:focus{outline:2px solid #2a5ea3;outline-offset:1px}
  .legend2{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:8px 13px;border-bottom:1px solid var(--line);
    background:#fff;font-size:11px;color:var(--muted)}
  .legend2 i{display:inline-block;width:20px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;font-style:normal}
  .tasktbl th.ycol{background:#7a6224}
  .tasktbl th.gcol{background:#41506b}
  .tasktbl td.ycol{background:#fdf6e3}
  .tasktbl td.gcol{background:#f4f6f9}
  .tasktbl tr.late td{background:#fdecea}
  .tasktbl tr.late td.gcol{background:#f9dcd8}
  .tasktbl tr.closed td{background:#e8f6ee;color:#1b5e3a}
  .tasktbl tr.closed td b{color:#1b5e3a}
  .tasktbl tr.wait td{background:#fdf6e6}
  .tasktbl tr.clickable{cursor:pointer}
  .tasktbl{font-size:12px}
  .tasktbl th,.tasktbl td{padding:7px 8px}
  .tasktbl td.desc{min-width:150px;max-width:none;white-space:normal}
  .tasktbl td.nowrap{white-space:nowrap}
  .clip{color:#2563a8;font-weight:700;font-size:11px}
  .ychip{background:#fdf6e3;border:1px solid #f0e0b8;border-radius:4px;padding:1px 6px}
  .gchip{background:#eef1f5;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .ro.gcell{background:#f4f6f9}
  .ybox{background:#fdf6e3;border:1px solid #f0e0b8;border-radius:var(--radius);padding:9px 11px}
  .ybox input{background:#fff}
  .machgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
  .ownerpick{position:relative}
  .ochips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .ochip{background:var(--teal-bg);border:1px solid #bfdedd;color:var(--teal-dark);border-radius:20px;
    padding:3px 6px 3px 11px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
  .ochip button{background:none;border:0;color:var(--teal-dark);font-size:12px;line-height:1;padding:0 3px;cursor:pointer;opacity:.7}
  .ochip button:hover{opacity:1}
  .osugg{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border:1px solid var(--line);
    border-radius:0 0 var(--radius) var(--radius);box-shadow:0 8px 20px rgba(16,35,58,.16);max-height:210px;overflow-y:auto}
  .osug{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #eef1f5;
    padding:8px 11px;font-size:13px;color:var(--text);border-radius:0}
  .osug:last-child{border-bottom:0}
  .osug:hover,.osug:focus{background:var(--teal-bg);color:var(--teal-dark);font-weight:700}
  .filelist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .fileitem{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);padding:7px 10px;font-size:12.5px;flex-wrap:wrap}
  .fileitem .ic{flex:none}
  .fileitem .nm{font-weight:600;word-break:break-word}
  .filters .btn-new{font-size:13px;padding:9px 16px;border-radius:8px;letter-spacing:0;
    background:linear-gradient(180deg,#f6821f,#e8590c);color:#fff;font-weight:800;text-transform:none;
    box-shadow:0 3px 10px rgba(232,89,12,.32)}
  .filters .btn-new:hover{background:linear-gradient(180deg,#e8590c,#c94f0a)}
  @media(max-width:680px){
    .tasktbl td.ycol,.tasktbl td.gcol{background:none}
    .tasktbl tr.late td{background:none}
    .tasktbl tr.late{border-left:4px solid var(--red)}
    .tasktbl tr.closed td{background:none}
    .tasktbl tr.closed{border-left:4px solid var(--green)}
    .tasktbl tr.wait td{background:none}
    .tasktbl tr.wait{border-left:4px solid var(--amber)}
    .filters .btn-new{width:100%}
  }

  /* ===== Řízení výkonu — okno problem solvingu ===== */
  .btn-danger{background:var(--red);color:#fff;font-weight:700}
  label.check{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;color:#41506b;white-space:nowrap;cursor:pointer;font-weight:600}
  label.check input{width:16px;height:16px;min-width:0;margin:0;flex:none}
  .overlay{position:fixed;inset:0;background:rgba(12,26,48,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;z-index:60}
  .modal{background:#fff;border-radius:10px;width:100%;max-width:1060px;margin:auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .modal h3{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;margin:0;padding:14px 18px;font-size:16px;
    border-radius:10px 10px 0 0;display:flex;align-items:center;gap:10px}
  .modal h3 .x{margin-left:auto;background:transparent;border:0;color:#fff;font-size:20px;line-height:1;padding:0 4px}

const ENG_GROUPS = [
  {g:'Porucha stroje',       m:['porucha stroje','machine malfunction','porucha klipova','nefunkční tiskárna','breakdown']},
  {g:'Přestavba a seřízení', m:['tool changeover','seřizování','machine adjustment','výměna nástroje','výměna formy','změna materiálu','uvolnění prvního']},

  {g:'Materiál a logistika', m:['material missing','disturbed material flow','packaging material','čekání na agv','material flow']},
  {g:'Kvalita',              m:['špatná kvalita','quality','zmetk']},
  {g:'Organizace výroby',    m:['production preparation','chybí plán','omezená výroba','výroba na druhé lince','plánované zkoušky']},
  {g:'Lidé a přestávky',     m:['chybí personál','missing personal','operator training','break','end of shift','ohc']},
  {g:'Systém a data',        m:['výpadek symestic','kusy nepočítala']}
];
const GROUP_COLOR = {
  'Porucha stroje':'#c0392b','Přestavba a seřízení':'#b7791f','Technický prostoj':'#8a5a2b',
  'Materiál a logistika':'#2563a8','Kvalita':'#6b46c1','Organizace výroby':'#0d7377',
  'Lidé a přestávky':'#1f9254','Systém a data':'#6b7a90','Nezařazeno':'#98a5b6'
};
const UNKNOWN = 'Nezařazeno';
function engGroup(reason){
  const t=String(reason||'').toLowerCase();
  for(const r of ENG_GROUPS) if(r.m.some(x=>t.includes(x))) return r.g;
  return UNKNOWN;
}
function isChangeover(reason){
  const t=String(reason||'').toLowerCase();
  return t.includes('tool changeover')||t.includes('výměna nástroje')||t.includes('výměna formy');
}
const slug = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,80) || 'x';
const pad2 = n => String(n).padStart(2,'0');

/* Excel drží čas jako číslo (dny od r. 1900). Počítá se v UTC, aby se prostoj
   neposunul o hodinu podle nastavení počítače. */
function fromSerial(v){
  const ms = Math.round((Number(v)-25569)*86400)*1000;
  if(!isFinite(ms)) return null;
  const d = new Date(ms);
  return {iso:`${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}T${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}`,
          date:`${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`, hour:d.getUTCHours(), ms};
}
function mkTime(y,mo,d,H,M,S){
  return {iso:`${y}-${pad2(mo)}-${pad2(d)}T${pad2(H)}:${pad2(M)}:${pad2(S)}`,
          date:`${y}-${pad2(mo)}-${pad2(d)}`, hour:H, ms:Date.UTC(y,mo-1,d,H,M,S)};
}
function fromText(s){
  const t=String(s).trim();
  let m=t.match(/^(\d{4})-(\d{2})-(\d{2})[T ](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m) return mkTime(+m[1],+m[2],+m[3],+m[4],+m[5],+(m[6]||0));
  m=t.match(/^(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m) return mkTime(+m[3],+m[2],+m[1],+m[4],+m[5],+(m[6]||0));
  m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})[, ]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);
  if(m){ let y=+m[3]; if(y<100)y+=2000; let H=+m[4]; const ap=(m[7]||'').toUpperCase();
    if(ap==='PM'&&H<12)H+=12; if(ap==='AM'&&H===12)H=0; return mkTime(y,+m[1],+m[2],H,+m[5],+(m[6]||0)); }
  return null;
}
function engTime(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return fromSerial(v);
  if(v instanceof Date) return mkTime(v.getFullYear(),v.getMonth()+1,v.getDate(),v.getHours(),v.getMinutes(),v.getSeconds());
  return fromText(v);
}
function engDur(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return Math.round(v*86400);
  const t=String(v).trim();
  const m=t.match(/^(\d+):(\d{2})(?::(\d{2}))?$/);
  if(m) return (+m[1])*3600+(+m[2])*60+(+(m[3]||0));
  const n=Number(t.replace(',','.'));
  return isFinite(n)?Math.round(n*60):null;
}
const shiftOf = h => (h>=6&&h<14)?'R':((h>=14&&h<22)?'O':'N');
const SHIFT_LBL = {R:'Ranní',O:'Odpolední',N:'Noční'};

const HEAD = {
  seg:['segment','anlage','linie','line','stroj','linka','machine'],
  reason:['reason','grund','duvod','důvod'],
  start:['start time','start','beginn','zacatek','začátek','od'],
  end:['end time','end','ende','konec','do'],
  dur:['duration','dauer','trvani','trvání'],
  net:['net duration','net','netto'],
  comment:['comment','bemerkung','poznamka','poznámka','note']
};
function engParse(aoa){
  const norm = s => String(s??'').trim().toLowerCase();
  let hi=-1, map=null;
  for(let i=0;i<Math.min(aoa.length,30);i++){
    const cells=(aoa[i]||[]).map(norm), m={};
    for(const key of Object.keys(HEAD)){
      const idx=cells.findIndex(c=>c && HEAD[key].some(h=>c===h));
      if(idx>=0) m[key]=idx;
    }
    if(m.seg!=null && m.reason!=null && m.start!=null){ hi=i; map=m; break; }
  }
  if(hi<0) return {ok:false, err:'V souboru nejsou sloupce Segment, Reason a Start time. Je to opravdu report prostojů ze Symesticu?'};
  const out=[], bad=[];
  for(let i=hi+1;i<aoa.length;i++){
    const r=aoa[i]||[];
    const seg=String(r[map.seg]??'').trim();
    if(!seg) continue;
    const st=engTime(r[map.start]);
    if(!st){ bad.push(i+1); continue; }
    const en = map.end!=null ? engTime(r[map.end]) : null;
    let sec = map.dur!=null ? engDur(r[map.dur]) : null;      // primárně sloupec Duration ze Symesticu
    if(sec==null && en && en.ms>st.ms) sec=Math.round((en.ms-st.ms)/1000);
    if(sec==null||sec<0){ bad.push(i+1); continue; }
    const net = map.net!=null ? engDur(r[map.net]) : null;
    const reason = String(r[map.reason]??'').trim() || '00 Unknown';
    out.push({seg, reason, group:engGroup(reason), co:isChangeover(reason),
      start:st.iso, end:en?en.iso:'', date:st.date, shift:shiftOf(st.hour),
      sec, net:(net==null?sec:net),
      comment: map.comment!=null ? String(r[map.comment]??'').trim().slice(0,500) : '',
      _id:`${st.date}_${slug(seg)}_${Math.round(st.ms/1000)}`});
  }
  return {ok:true, rows:out, bad};
}

/* ==========================================================
   Čtení akčního plánu z Excelu (ME TASK TRACKER)
   Záložka „Task Tracker", hlavička s POPIS PROBLÉMU a ZODPOVĚDNÁ OSOBA.
   Sloupce se hledají podle názvu, na pořadí nezáleží.
   ========================================================== */
const MT_HEAD = {
  no:      ['číslo úkolu','cislo ukolu'],
  created: ['datum vzniku'],
  type:    ['typ úkolu','typ ukolu'],
  task:    ['popis problému','popis problemu'],
  project: ['projekt'],
  prio:    ['priorita'],
  due:     ['plán splnění','plan splneni'],
  status:  ['status','stav'],
  owner:   ['zodpovědná osoba','zodpovedna osoba'],
  now:     ['okamžitá opatření','okamzita opatreni'],
  longs:   ['dlouhodobé úkoly','dlouhodobe ukoly'],
  fix:     ['nápravná opatření','napravna opatreni'],
  note:    ['poznámky','poznamky']
};
const MT_STATUS = {'complete':'DONE','completed':'DONE','hotovo':'DONE','splněno':'DONE',
  'in progress':'IN PROGRESS','probíhá':'IN PROGRESS','on hold':'OPEN','pozastaveno':'OPEN',
  'cancelled':'CANCELLED','canceled':'CANCELLED','zrušeno':'CANCELLED'};
/* Oblast se hádá hlavně z popisu — ten o lince říká víc než sloupec Projekt. */
const MT_AREA_TEXT = [
  [/\bimm\s*0*\d{1,2}\b/i,                      'IMM'],
  [/slush/i,                                    'Slush'],
  [/scoring|foam|pěn|pen(a|y|ov)/i,             'Foaming'],
  [/prefix|g\s*-?\s*463|gclass/i,               'Gclass'],
  [/m\s*-?beam|mbeam/i,                         'Assembly MBEAM'],
  [/ov\s*-?\s*51|ov\s*-?\s*64/i,                'Assembly OV51/64'],
  [/sk\s*-?336|po\s*-?45\d|w\s*-?206/i,         'Assembly SK336/PO455/W206'],
  [/mfa|w\s*-?177|w\s*-?247/i,                  'Assembly MFA2'],
  [/glove\s*box|glovebox|decopart|\bgb\b|\bdp\b/i,'GB/DP']
];
const MT_AREA_PROJECT = {
  'g463':'Gclass', 'sk336':'Assembly SK336/PO455/W206', 'po455':'Assembly SK336/PO455/W206',
  'w206':'Assembly SK336/PO455/W206', 'ov51/64':'Assembly OV51/64',
  'w177':'Assembly MFA2', 'w247':'Assembly MFA2'
};
function mtArea(popis, projekt){
  for(const [re,a] of MT_AREA_TEXT) if(re.test(popis||'')) return a;
  const p=String(projekt||'').trim().toLowerCase();
  if(MT_AREA_PROJECT[p]) return MT_AREA_PROJECT[p];
  return '';
}
/* Stroj z popisu: IMM07 i IMM7 je IMM-007, Slush 2, Scoring 3. */
function mtMachine(popis){
  const t=String(popis||'');
  let m=t.match(/\bimm\s*0*(\d{1,2})\b/i);
  if(m) return 'IMM-'+String(m[1]).padStart(3,'0');
  m=t.match(/\bslush\s*(\d)\b/i);    if(m) return 'Slush '+m[1];
  m=t.match(/\bscoring\s*(\d)\b/i);  if(m) return 'Scoring '+m[1];
  return '';
}
/* „Tadeáš Rešl" → „tadeas.resl"; když takový člověk v minimu je, použije se
   přesně jeho jméno ze seznamu uživatelů. */
function mtOwner(cell){
  const raw=String(cell||'').trim();
  if(!raw) return [];
  return raw.split(/[,;/]|\ba\b/i).map(x=>x.trim()).filter(Boolean).map(one=>{
    const key=one.normalize('NFD').replace(/[̀-ͯ]/g,'')
      .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean).join('.');
    const hit=(people||[]).find(u=>String(u.name||'').toLowerCase()===key);
    return hit ? hit.name : key;
  }).filter(Boolean);
}
function mtParse(wb, XLSX){
  const name=(wb.SheetNames||[]).find(n=>/task\s*tracker/i.test(n)) || wb.SheetNames[0];
  const a=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:true});
  const norm=x=>String(x??'').replace(/\s+/g,' ').trim().toLowerCase();
  let hi=-1, map=null;
  for(let i=0;i<Math.min(a.length,40);i++){
    const cells=(a[i]||[]).map(norm), m={};
    for(const key of Object.keys(MT_HEAD)){
      const idx=cells.findIndex(c=>c && MT_HEAD[key].some(h=>c.startsWith(h)));
      if(idx>=0) m[key]=idx;
    }
    if(m.task!=null && m.owner!=null && m.due!=null){ hi=i; map=m; break; }
  }
  if(hi<0) return {ok:false, err:'V sešitu nejsou sloupce POPIS PROBLÉMU, ZODPOVĚDNÁ OSOBA a PLÁN SPLNĚNÍ. Je to opravdu ME TASK TRACKER?'};
  const txt=(r,k)=>map[k]==null?'':String(r[map[k]]??'').replace(/\r/g,'').trim();
  const dte=(r,k)=>{ if(map[k]==null) return '';
    const v=r[map[k]];
    if(typeof v==='number'){ const d=fromSerial(v); return d?d.date:''; }
    const t=engTime(v); return t?t.date:''; };
  const out=[], bad=[];
  for(let i=hi+1;i<a.length;i++){
    const r=a[i]||[];
    const task=txt(r,'task');
    if(!task) continue;
    const owners=mtOwner(txt(r,'owner'));
    const due=dte(r,'due'), created=dte(r,'created')||today();
    const st=MT_STATUS[txt(r,'status').toLowerCase()] || 'OPEN';
    const area=mtArea(task, txt(r,'project'));
    /* co se nevejde do našich sloupců, ať se neztratí — jde to do poznámky */
    const parts=[];
    const add=(lbl,val)=>{ if(val) parts.push(lbl+': '+val); };
    add('Původní číslo', txt(r,'no'));
    add('Projekt', txt(r,'project'));
    add('Priorita', txt(r,'prio'));
    add('Typ úkolu', txt(r,'type'));
    add('Okamžitá opatření', txt(r,'now'));
    add('Dlouhodobé úkoly', txt(r,'longs'));
    add('Poznámky', txt(r,'note'));
    out.push({
      area: area || TASK_AREAS[0].k, areaGuessed: !area,
      machine: mtMachine(task), type: /management/i.test(txt(r,'type'))?'System':'Operation',
      createdOn: created, createdBy: 'ME TASK TRACKER',
      task, output: txt(r,'fix'), owners,
      dueOrig: due, moves: [], status: st, closedOn: '',
      note: parts.join('\n'), files: [], psId:'', psNo:'',
      _src:'metracker', _row:i+1,
      _id:'mt_'+slug(txt(r,'no')||String(i))+'_'+slug(task).slice(0,40)
    });
    if(!due || !owners.length) bad.push(i+1);
  }
  if(!out.length) return {ok:false, err:'V záložce nejsou žádné úkoly s vyplněným popisem.'};
  return {ok:true, rows:out, bad, sheet:name};
}

/* ==========================================================
   Čtení reportu z G463 (soubor yftool)
   Jiný formát než Symestic: jeden sešit, v něm záložky „Line - <linka>".
   Report nedává jednotlivé prostoje s časem od–do, ale součet minut
   za den a důvod. Z každé buňky proto uděláme jeden záznam na den,
   linku a důvod — id je pevné, takže opakovaný import nic nezdvojí.
   ========================================================== */
const G463_CATS = {
  'změna verze':        'Přestavba a seřízení',
  'plánované prostoje': 'Lidé a přestávky',
  'porucha / seřízení': 'Porucha stroje',
  'logistika':          'Materiál a logistika',
  'lidé':               'Lidé a přestávky',
  'energie':            'Technický prostoj',
  'kvalita':            'Kvalita',
  'zmetky':             'Kvalita'
};
const g463Group = kat => G463_CATS[String(kat||'').trim().toLowerCase()] || UNKNOWN;
/* Poznáme soubor podle toho, že má záložky „Line - …". */
const g463Sheets = wb => (wb.SheetNames||[]).filter(n=>/^\s*line\b/i.test(String(n)));
function g463Parse(wb, XLSX){
  const sheets=g463Sheets(wb);
  if(!sheets.length) return {ok:false, err:'V sešitu nejsou žádné záložky „Line - …". Je to opravdu report z G463?'};
  const out=[], bad=[], lines=new Set();
  for(const name of sheets){
    const a=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:true});
    /* název linky je v hlavičce; kdyby chyběl, vezmeme ho z názvu záložky */
    const seg=String((a[1]&&a[1][7])||String(name).replace(/^\s*line\s*-\s*/i,'')).trim();
    if(!seg) continue;
    /* sloupce dnů — řádek, kde je v jedenáctém sloupci „MTD", za ním data dnů */
    const hi=a.findIndex(r=>r && String(r[10]||'').trim().toUpperCase()==='MTD');
    if(hi<0) continue;
    const days=(a[hi]||[]).map((c,i)=>({i,c}))
      .filter(x=>x.i>10 && typeof x.c==='number' && x.c>40000)
      .map(x=>({col:x.i, d:fromSerial(x.c)})).filter(x=>x.d);
    if(!days.length) continue;
    /* tabulka prostojů začíná řádkem s „Kód" */
    const hd=a.findIndex(r=>r && String(r[1]||'').trim()==='Kód');
    if(hd<0) continue;
    /* počty přestaveb na den, ať changeover KPI nepočítá jednu za den */
    const coRow=a.find(r=>r && /co\s*-\s*total number|co\s*-\s*po[čc]et zm[ěe]n/i.test(String(r[8]||'')));
    let blanks=0;
    for(let i=hd+1;i<a.length;i++){
      const r=a[i]||[];
      const kod2=String(r[2]??'').trim(), popis=String(r[3]??'').trim();
      if(!kod2 && !popis){ if(++blanks>4) break; continue; }
      blanks=0;
      const unit=String(r[6]??'').trim().toLowerCase();
      if(unit && unit!=='[min]') continue;             // [Ks] je rework, ne prostoj
      if(!unit) continue;
      const kat=String(r[7]??'').trim();
      const grp=g463Group(kat);
      const reason=(kod2?kod2+' ':'')+popis;
      const isCo=/změna verze|changeover/i.test(kat+' '+popis);
      for(const day of days){
        const min=Number(r[day.col]);
        if(!isFinite(min) || min<=0) continue;
        const sec=Math.round(min*60);
        const coN = isCo && coRow ? (Number(coRow[day.col])||0) : 0;
        out.push({seg, reason, group:grp, co:isCo, coN:coN||undefined,
          start:day.d.date+'T00:00:00', end:'', date:day.d.date, shift:'',
          sec, net:sec, comment:'', daily:true, src:'g463',
          _id:`${day.d.date}_${slug(seg)}_${slug(kod2||popis)}`});
      }
      lines.add(seg);
    }
  }
  if(!out.length) return {ok:false, err:'V záložkách „Line - …" nejsou žádné prostoje v minutách.'};
  return {ok:true, rows:out, bad, lines:[...lines]};
}

/* Denní souhrn — počítá se vždy z toho, co je v databázi */
function aggregate(list){
  const d={sec:0,net:0,cnt:0,segs:{},groups:{},reasons:{},shifts:{},co:{sec:0,cnt:0}};
  const bump=(o,k,label,sec)=>{ const x=o[k]||(o[k]={label,sec:0,cnt:0}); x.sec+=sec; x.cnt++; };
  for(const e of list){
    const sec=Number(e.sec)||0, net=Number(e.net)||sec;
    d.sec+=sec; d.net+=net; d.cnt++;
    const grp=e.group||engGroup(e.reason);
    const sk=slug(e.seg), gk=slug(grp), rk=slug(e.reason);
    d.segs[sk]    = d.segs[sk]    || {label:e.seg,sec:0,net:0,cnt:0,co:{sec:0,cnt:0},g:{},r:{},sh:{}};
    d.groups[gk]  = d.groups[gk]  || {label:grp,sec:0,cnt:0};
    d.reasons[rk] = d.reasons[rk] || {label:e.reason,sec:0,cnt:0};
    d.shifts[e.shift] = d.shifts[e.shift] || {sec:0,cnt:0};
    const sg=d.segs[sk];
    sg.sec+=sec; sg.net+=net; sg.cnt++;
    /* Rozpad i po lince — jinak by se KPI nedalo filtrovat po procesech. */
    bump(sg.g, gk, grp, sec);
    bump(sg.r, rk, e.reason, sec);
    bump(sg.sh, e.shift||'?', e.shift||'?', sec);
    /* G463 report nese skutečný počet přestaveb za den v poli coN */
    if(e.co){ const cn=Number(e.coN)>0?Number(e.coN):1;
      sg.co.sec+=sec; sg.co.cnt+=cn; d.co.sec+=sec; d.co.cnt+=cn; }
    d.groups[gk].sec+=sec; d.groups[gk].cnt++;
    d.reasons[rk].sec+=sec; d.reasons[rk].cnt++;
    d.shifts[e.shift].sec+=sec; d.shifts[e.shift].cnt++;
  }
  return d;
}


/* ==========================================================
   Čtení reportu SCRAPU
   Scrap se váže na projekt a linku a měří se v eurech proti tržbám
   (scrap € / sales € = procento). Sloupce se zkusí poznat podle názvu,
   a když se to netrefí, přiřadí se ručně v kroku Kontrola.
   ========================================================== */

const SCRAP_HEAD = {
  project:['project','projekt','program','zákazník','zakaznik','customer','produkt','product'],
  line:   ['line','linka','segment','anlage','stroj','machine','pracoviště','pracoviste','workcenter','work center','cost center','nákladové středisko'],
  scrap:  ['scrap','scrap eur','scrap €','scrap value','scrap cost','zmetky','zmetkovitost','hodnota zmetků','hodnota zmetku','náklady','naklady'],
  sales:  ['sales','sales eur','sales €','revenue','turnover','tržby','trzby','obrat','prodej','výroba','vyroba'],
  period: ['date','datum','month','měsíc','mesic','period','období','obdobi','week','týden','tyden']
};
/* Číslo z buňky — zvládne 1234.56, "1 234,56", "1.234,56 €", "(1 234)" */
function toNum(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  let t=String(v).replace(/[\s ]/g,'').replace(/[€$Kk][ČčcC]?/g,'').trim();
  if(!t) return null;
  let neg=false;
  if(/^\(.*\)$/.test(t)){ neg=true; t=t.slice(1,-1); }
  if(t.startsWith('-')){ neg=true; t=t.slice(1); }
  const lc=t.lastIndexOf(','), ld=t.lastIndexOf('.');
  if(lc>-1 && ld>-1){
    if(lc>ld) t=t.replace(/\./g,'').replace(',','.');     // 1.234,56
    else      t=t.replace(/,/g,'');                        // 1,234.56
  }else if(lc>-1){
    t = (t.length-lc-1<=2) ? t.replace(',','.') : t.replace(/,/g,'');
  }else if(ld>-1){
    if(/^\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,'');   // 1.234 = tisíce
  }
  const n=Number(t);
  if(!isFinite(n)) return null;
  return neg?-n:n;
}
/* Měsíc z buňky — datum, "2026-08", "08/2026" */
function monthOf(v){
  const t=engTime(v);
  if(t) return {month:t.date.slice(0,7), date:t.date};
  const s=String(v??'').trim();
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})$/);
  if(m) return {month:`${m[1]}-${pad2(+m[2])}`, date:''};
  m=s.match(/^(\d{1,2})[-\/.](\d{4})$/);
  if(m) return {month:`${m[2]}-${pad2(+m[1])}`, date:''};
  return null;
}
/* Najde řádek hlavičky a nabídne přiřazení sloupců. */
function scrapDetect(aoa){
  const norm = s => String(s??'').trim().toLowerCase();
  let best={score:-1};
  for(let i=0;i<Math.min(aoa.length,30);i++){
    const cells=(aoa[i]||[]).map(norm);
    if(!cells.some(Boolean)) continue;
    const m={}; let score=0;
    for(const key of Object.keys(SCRAP_HEAD)){
      const idx=cells.findIndex(c=>c && SCRAP_HEAD[key].some(h=>c===h || c.startsWith(h+' ') || c.includes(h)));
      if(idx>=0){ m[key]=idx; score++; }
    }
    if(score>best.score) best={score, row:i, map:m, headers:(aoa[i]||[]).map(x=>String(x??''))};
  }
  if(best.score<1) return {ok:false, err:'V souboru se nepodařilo najít hlavičku tabulky. Zkontroluj, že první řádky obsahují názvy sloupců.'};
  return {ok:true, headRow:best.row, map:best.map, headers:best.headers};
}
/* Poskládá řádky podle zvoleného přiřazení sloupců. */
function scrapParse(aoa, headRow, map, fallbackMonth){
  const out=[], bad=[];
  if(map.project==null || map.scrap==null)
    return {ok:false, err:'Musíš určit aspoň sloupec s projektem a sloupec s hodnotou scrapu.'};
  for(let i=headRow+1;i<aoa.length;i++){
    const r=aoa[i]||[];
    const project=String(r[map.project]??'').trim();
    if(!project) continue;
    if(/^(celkem|total|sum|součet|soucet|grand total)/i.test(project)) continue;   // souhrnné řádky přeskoč
    const scrapEur=toNum(r[map.scrap]);
    if(scrapEur==null){ bad.push(i+1); continue; }
    const salesEur = map.sales!=null ? toNum(r[map.sales]) : null;
    const line = map.line!=null ? (String(r[map.line]??'').trim()||'—') : '—';
    let mo = map.period!=null ? monthOf(r[map.period]) : null;
    if(!mo && fallbackMonth) mo={month:fallbackMonth, date:''};
    if(!mo){ bad.push(i+1); continue; }
    out.push({month:mo.month, date:mo.date, project, line,
      scrapEur, salesEur:(salesEur==null?0:salesEur),
      _id:`${mo.date||mo.month}_${slug(project)}_${slug(line)}`});
  }
  /* Když stejný klíč padne víckrát (rozpad po vadách apod.), sečti ho — ať se řádky nepřepisují. */
  const byId={};
  for(const r of out){
    const p=byId[r._id];
    if(p){ p.scrapEur+=r.scrapEur; p.salesEur+=r.salesEur; }
    else byId[r._id]={...r};
  }
  return {ok:true, rows:Object.values(byId), bad};
}
/* Měsíční souhrn z jednotlivých řádků */
function scrapAggregate(list){
  const d={scrapEur:0, salesEur:0, cnt:0, projects:{}, lines:{}};
  for(const e of list){
    const s=Number(e.scrapEur)||0, v=Number(e.salesEur)||0;
    d.scrapEur+=s; d.salesEur+=v; d.cnt++;
    const pk=slug(e.project), lk=slug(e.line||'—');
    d.projects[pk] = d.projects[pk] || {label:e.project, scrapEur:0, salesEur:0};
    d.lines[lk]    = d.lines[lk]    || {label:e.line||'—', scrapEur:0, salesEur:0};
    d.projects[pk].scrapEur+=s; d.projects[pk].salesEur+=v;
    d.lines[lk].scrapEur+=s;    d.lines[lk].salesEur+=v;
  }
  return d;
}
const eur = v => Math.round(Number(v)||0).toLocaleString('cs-CZ')+' €';
const pct = (s,v) => (v>0 ? num(s/v*100,2)+' %' : '—');
const monthCz = m => {
  const MM=['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
  const p=String(m||'').split('-');
  return p.length===2 ? (MM[+p[1]-1]||p[1])+' '+p[0] : (m||'');
};
const monthShort = m => { const p=String(m||'').split('-'); return p.length===2 ? (+p[1])+'/'+p[0].slice(2) : (m||''); };


/* ==========================================================
   ŘÍZENÍ VÝKONU LINEK — standard podle zadání vedení
   Týdenní výkon linky pod prahem (výchozí 90 %) automaticky zakládá
   povinný problem solving na úrovni Process Engineera.
   Drží se pořadí: A3 analýza → kořenová příčina → opatření s ownerem a termínem
   → ověření účinnosti → teprve pak lze problém uzavřít.
   ========================================================== */

const ENGCFG_DEF = {
  plannedHoursPerDay: 22.5,   // plánovaný výrobní čas na linku a den (3 směny po 7,5 h)
  perLine: {},                // výjimky: slug linky -> hodin/den
  threshold: 90,              // výkon pod tímhle % spouští problem solving
  repeatWeeks: 2,             // tolik týdnů po sobě pod prahem = opakovaný problém
  escalationDays: 7,          // akce po termínu déle než tolik dní = eskalace na manažera
  effectivenessDays: 28,      // za kolik dní se ověřuje účinnost opatření
  excludeGroups: [],          // skupiny důvodů, které se do výkonu nepočítají
  machines: {},               // stroje podle oblasti pro akční plán

/* ---------- týdny (ISO) ---------- */
function isoWeekOf(iso){
  const [y,m,d]=String(iso).slice(0,10).split('-').map(Number);
  const t=new Date(Date.UTC(y,m-1,d));
  const day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day);
  const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  const wk=Math.ceil((((t-ys)/86400000)+1)/7);
  return `${t.getUTCFullYear()}-W${pad2(wk)}`;
}
function weekMonday(wk){
  const [y,w]=String(wk).split('-W').map(Number);
  const jan4=new Date(Date.UTC(y,0,4));
  const day=jan4.getUTCDay()||7;
  const mon=new Date(jan4); mon.setUTCDate(jan4.getUTCDate()-day+1+(w-1)*7);
  return mon;
}
function weekLabel(wk){
  const mon=weekMonday(wk), sun=new Date(mon); sun.setUTCDate(mon.getUTCDate()+6);
  const f=d=>d.getUTCDate()+'. '+(d.getUTCMonth()+1)+'.';
  return `${String(wk).split('-W')[1]}. týden (${f(mon)} – ${f(sun)})`;
}
const weekShort = wk => String(wk).split('-W')[1]+'. t.';
const weekPrev = (wk,n)=>{ const mon=weekMonday(wk); mon.setUTCDate(mon.getUTCDate()-7*(n||1)); return isoWeekOf(mon.toISOString()); };

/* ---------- výkon linek po týdnech ---------- */
/* Vstup: denní souhrny dt_days. Výstup: {week: {lineSlug: {label, sec, days, planned, perf}}} */
function weeklyPerf(dayDocs, cfg){
  const ex = new Set(cfg.excludeGroups||[]);
  const weeks={};
  for(const d of dayDocs){
    const wk=isoWeekOf(d.date);
    const w = weeks[wk] || (weeks[wk]={week:wk, days:new Set(), lines:{}, sec:0, groups:{}, reasons:{}});
    w.days.add(d.date);
    for(const [k,v] of Object.entries(d.groups||{})){
      const g=w.groups[k]||(w.groups[k]={label:v.label||k,sec:0,cnt:0});
      g.sec+=v.sec||0; g.cnt+=v.cnt||0;
    }
    for(const [k,v] of Object.entries(d.reasons||{})){
      const r=w.reasons[k]||(w.reasons[k]={label:v.label||k,sec:0,cnt:0});
      r.sec+=v.sec||0; r.cnt+=v.cnt||0;
    }
    for(const [k,v] of Object.entries(d.segs||{})){
      const l=w.lines[k]||(w.lines[k]={slug:k, label:v.label||k, sec:0, cnt:0, days:new Set()});
      l.sec+=v.sec||0; l.cnt+=v.cnt||0; l.days.add(d.date);
      w.sec+=v.sec||0;
    }
  }
  /* Vyloučené skupiny se odečtou poměrně — v denním souhrnu není rozpad skupina×linka. */
  for(const w of Object.values(weeks)){
    let exSec=0;
    for(const [k,v] of Object.entries(w.groups)) if(ex.has(v.label)) exSec+=v.sec;
    const ratio = w.sec>0 ? Math.max(0,(w.sec-exSec)/w.sec) : 1;
    w.dayCount=w.days.size;
    for(const l of Object.values(w.lines)){
      l.dayCount=l.days.size;
      l.countedSec = l.sec*ratio;
      const hpd = (cfg.perLine&&cfg.perLine[l.slug]!=null) ? Number(cfg.perLine[l.slug]) : Number(cfg.plannedHoursPerDay)||0;
      l.planned = hpd*3600*w.dayCount;               // plánujeme jen za dny, ze kterých máme data
      l.perf = l.planned>0 ? Math.max(0, (l.planned-l.countedSec)/l.planned*100) : null;
      delete l.days;
    }
    delete w.days;
  }
  return weeks;
}
const sortedWeeks = obj => Object.keys(obj).sort();
const dnu = n => n+' '+(n===1?'den':(n>=2&&n<=4?'dny':'dní'));

/* Linky, které v daném týdnu spadly pod práh — a jak dlouho po sobě */
function underThreshold(weeks, wk, cfg){
  const w=weeks[wk]; if(!w) return [];
  const out=[];
  for(const l of Object.values(w.lines)){
    if(l.perf==null || l.perf>=cfg.threshold) continue;
    let streak=1;
    for(let i=1;i<8;i++){
      const pw=weeks[weekPrev(wk,i)];
      const pl=pw && pw.lines[l.slug];
      if(pl && pl.perf!=null && pl.perf<cfg.threshold) streak++; else break;
    }
    out.push(Object.assign({}, l, {streak, repeated: streak>=(cfg.repeatWeeks||2)}));
  }
  return out.sort((a,b)=>a.perf-b.perf);
}

function collectTask(){

  });

async function saveTask(){
  const t=collectTask(); if(!t) return;
  if(!t.task){ tMsg='Napiš, co se má udělat (sloupec Task).'; render(); return; }
  if(!taskOwners(t).length){ tMsg='Vyber aspoň jednoho ownera.'; render(); return; }
  if(!t.dueOrig){ tMsg='Vyplň původní termín.'; render(); return; }
  const closing = taskDone(t) && !t.closedOn;
  if(closing) t.closedOn=today();
  if(!taskDone(t)) t.closedOn='';
  try{
    if(!t._id){
      const no=await nextTaskNo();
      const rec={no, area:t.area, machine:t.machine||'', type:t.type, createdOn:t.createdOn, createdBy:t.createdBy,
        task:t.task, output:t.output, owners:t.owners, dueOrig:t.dueOrig, moves:[],
        status:t.status, closedOn:t.closedOn, note:t.note, files:[],
        psId:t.psId||'', psNo:t.psNo||'',
        hist:[`${today()} · ${me.name} · task založen${t.psNo?' k problem solvingu '+t.psNo:''}`]};
      const ref=await addDoc(collection(db,'tasks'), rec);
      /* přílohy vybrané ještě před založením nahrajeme až teď, když máme id */
      if(pendingTaskFiles.length){
        const arr=[], hist=rec.hist.slice();
        for(const f of pendingTaskFiles){
          try{ arr.push(await uploadTaskFile(ref.id,f)); hist.push(`${today()} · ${me.name} · přidal přílohu ${f.name}`); }
          catch(e){ toast('Příloha '+f.name+' se nenahrála: '+((e&&e.message)||e),'err'); }
        }
        if(arr.length){ await updateDoc(ref,{files:arr,hist}); rec.files=arr; rec.hist=hist; }
        pendingTaskFiles=[];
      }
      tasks.unshift(Object.assign({_id:ref.id}, rec));
      toast('Task '+no+' založen.','ok');
    }else{
      const hist=(t.hist||[]).concat(`${today()} · ${me.name} · ${closing?'task uzavřen':'upraveno'}`);
      const {_id,...data}=t; data.hist=hist;
      await updateDoc(doc(db,'tasks',t._id), data);
      t.hist=hist; syncTask(t);
      toast('Uloženo.','ok');
    }
    openTask=null; tMsg='';
  }catch(e){ tMsg='Uložení selhalo. '+writeHint(e); }
  render();
}

async function uploadTaskFile(taskId, f){
  const safe=f.name.replace(/[^\w.\-]+/g,'_').slice(-80);
  const path='tasky/'+taskId+'/'+Date.now()+'_'+Math.floor(Math.random()*1e6)+'_'+safe;
  const s=sref(storage,path);
  await uploadBytes(s,f,{contentType:f.type||'application/octet-stream'});
  return {name:f.name, path, url:await getDownloadURL(s), size:f.size, at:today(), by:me.name};
}
async function handleTaskFiles(list){
  const files=[...(list||[])].filter(Boolean); if(!files.length || !openTask) return;
  const ok=[];
  for(const f of files){
    if(f.size>MAX_TASK_FILE){ toast(`„${f.name}" je větší než 5 MB.`,'err'); continue; }
    ok.push(f);
  }
  if(!ok.length) return;
  collectTask();                                                        // ať se rozepsané hodnoty neztratí
  if(!openTask._id){ pendingTaskFiles.push(...ok); render(); return; }   // nový task → fronta, nahraje se po založení
  tMsg='Nahrávám přílohy…'; render();
  const arr=(openTask.files||[]).slice(), hist=(openTask.hist||[]).slice();
  let n=0;
  for(const f of ok){
    try{ arr.push(await uploadTaskFile(openTask._id,f)); hist.push(`${today()} · ${me.name} · přidal přílohu ${f.name}`); n++; }
    catch(e){ toast('Nenahrálo se: '+f.name+' — '+((e&&e.message)||e),'err'); }
  }
  if(n){
    try{ await updateDoc(doc(db,'tasks',openTask._id), {files:arr, hist}); openTask.files=arr; openTask.hist=hist; syncTask(openTask);
         toast(n===1?'Příloha nahrána.':n+' přílohy nahrány.','ok'); }
    catch(e){ toast('Uložení příloh selhalo. '+writeHint(e),'err'); }
  }
  tMsg=''; render();
}
async function removeTaskFile(i){
  if(!openTask) return;
  collectTask();
  if(!openTask._id){ pendingTaskFiles.splice(i,1); render(); return; }
  const files=(openTask.files||[]).slice(), f=files[i];
  if(!f) return;
  try{ await deleteObject(sref(storage,f.path)); }catch(e){ /* v úložišti už být nemusí */ }
  files.splice(i,1);
  const hist=(openTask.hist||[]).concat(`${today()} · ${me.name} · smazal přílohu ${f.name}`);
  try{ await updateDoc(doc(db,'tasks',openTask._id), {files, hist}); openTask.files=files; openTask.hist=hist; syncTask(openTask); }
  catch(e){ toast('Smazání selhalo. '+writeHint(e),'err'); }
  render();
}

function monthBounds(back){
  const now=new Date(), d=new Date(now.getFullYear(), now.getMonth()-(back||0), 1);
  const y=d.getFullYear(), m=d.getMonth(), last=new Date(y, m+1, 0);
  const iso=x=>`${x.getFullYear()}-${pad2(x.getMonth()+1)}-${pad2(x.getDate())}`;
  return {from:iso(d), to:iso(last), month:`${y}-${pad2(m+1)}`};
}
/* Od kdy do kdy se čtou denní souhrny. `to` prázdné = bez horní meze. */
function rangeBounds(){
  if(range==='m0' || range==='m1'){
    const b=monthBounds(range==='m1'?1:0);
    return {from:b.from, to:b.to, label:monthCz(b.month)};
  }
  const n=Number(range)||7;
  return {from:dateFrom(n), to:'', label:n+' dní'};
}
const dayCz = d => String(d).slice(8,10).replace(/^0/,'')+'. '+String(d).slice(5,7).replace(/^0/,'')+'.';
/* celé datum i s rokem: 2026-08-24 → 24. 8. 2026 */
const dateCz = s => { if(!s) return ''; const p=String(s).slice(0,10).split('-'); return p.length===3 ? `${+p[2]}. ${+p[1]}. ${p[0]}` : String(s); };
function fmtDur(sec){
  if(!sec) return '0 min';
  if(sec<3600) return Math.round(sec/60)+' min';
  return num(sec/3600,1)+' h';
}
function toast(m,k=''){ toastMsg=m; toastKind=k; render(); clearTimeout(toast._t); toast._t=setTimeout(()=>{toastMsg=null;render();},4200); }

/* Server zamítl zápis. Nemá smysl ukazovat anglické „Missing or insufficient
   permissions" — napíšeme, co se s tím dá dělat, a rovnou i pozice, které
   aplikace u přihlášeného vidí. Z toho je hned poznat, kde je problém. */
function writeHint(e){
  const m=String((e&&e.message)||e);
  if(!/permission|insufficient|PERMISSION_DENIED/i.test(m)) return m;
  const pos=(me&&me.positions||[]).filter(Boolean);
  const mine=pos.length ? 'Tvoje pozice: '+pos.join(', ')+'.' : 'V Nastavení nemáš vyplněnou žádnou pozici.';
  const ok=hasEngPosition(pos) || isOwner(me&&me.email);
  return 'Server zápis zamítl. '+mine+' '
    + (ok
      ? 'Pozici na to máš, takže ve Firebase konzoli nejspíš nejsou publikovaná aktuální pravidla Firestore (Firestore → Rules → Publish). Řekni to správci aplikace.'
      : 'Zakládat problem solving a úkoly smí jen procesní inženýr nebo PE koordinátor — ať ti v Nastavení přidají pozici (např. IMM PE nebo PE coordinator).');
}
function ruleHint(e){
  const m=String((e&&e.message)||e);
  if(/permission|insufficient/i.test(m))
    return 'Do prostojů nevidím — ve Firebase konzoli je potřeba publikovat pravidla pro kolekce downtimes, dt_days a dt_imports (Firestore → Rules → Publish).';
  return 'Nepodařilo se načíst data: '+m;
}

/* SheetJS se stahuje, až když se opravdu importuje — stránku to nezdržuje. */
let xlsxP=null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxP) return xlsxP;
  xlsxP = new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX);
    s.onerror=()=>rej(new Error('Nepodařilo se stáhnout knihovnu pro čtení Excelu. Ulož report jako CSV a nahraj ho — CSV umí aplikace přečíst i bez ní.'));
    document.head.appendChild(s);
  });
  return xlsxP;
}
function csvToAoa(text){
  const rows=[]; let row=[], cur='', q=false;
  const push=()=>{row.push(cur);cur='';};
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','||c===';'||c==='\t') push();
    else if(c==='\n'){ push(); rows.push(row); row=[]; }
    else if(c!=='\r') cur+=c;
  }
  push(); if(row.length>1||row[0]) rows.push(row);
  return rows;
}
async function readFile(file){
  const name=(file.name||'').toLowerCase();
  if(name.endsWith('.csv')||name.endsWith('.txt')) return {aoa:csvToAoa(await file.text())};
  const XLSX = await loadXlsx();
  const wb = XLSX.read(await file.arrayBuffer(), {cellDates:false});
  return {wb, XLSX, aoa: XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:null, blankrows:false})};
}
async function takeFile(file){
  if(!canImportDt()) return;
  imp.err=''; imp.name=file.name; imp.prog='Čtu soubor…'; render();
  try{
    const {aoa, wb, XLSX} = await readFile(file);
    if(imp.kind==='tasks'){
      if(!wb){ imp.prog=''; imp.err='Akční plán se načítá jen z Excelu (.xlsx), ne z CSV.'; render(); return; }
      await loadPeople();                       // ať se jména sesouhlasí s uživateli minima
      const res = mtParse(wb, XLSX);
      if(!res.ok){ imp.prog=''; imp.err=res.err; render(); return; }
      imp.rows=res.rows; imp.bad=res.bad; imp.sheet=res.sheet; imp.step=2; imp.prog='';
    }else if(imp.kind==='scrap'){
      const det = scrapDetect(aoa);
      if(!det.ok){ imp.prog=''; imp.err=det.err; render(); return; }
      imp.aoa=aoa; imp.headRow=det.headRow; imp.map=det.map; imp.headers=det.headers;
      imp.month=''; imp.step=2; imp.prog='';
      reparseScrap();
    }else{
      /* Formát se pozná sám: sešit se záložkami „Line - …" je report z G463,
         všechno ostatní se čte jako report Downtimes ze Symesticu. */
      const isG463 = wb && g463Sheets(wb).length>0;
      const res = isG463 ? g463Parse(wb, XLSX) : engParse(aoa);
      if(!res.ok){ imp.prog=''; imp.err=res.err; render(); return; }
      if(!res.rows.length){ imp.prog=''; imp.err='V souboru nejsou žádné prostoje ke zpracování.'; render(); return; }
      imp.src = isG463 ? 'g463' : 'symestic';
      imp.lines = res.lines || [];
      imp.rows=res.rows; imp.bad=res.bad; imp.step=2; imp.prog='';
    }
  }catch(e){ imp.prog=''; imp.err=String((e&&e.message)||e); }
  render();
}
/* Přepočítá scrap po změně přiřazení sloupců nebo měsíce */
function reparseScrap(){
  const res = scrapParse(imp.aoa, imp.headRow, imp.map, imp.month);
  if(!res.ok){ imp.rows=[]; imp.bad=[]; imp.err=res.err; return; }
  imp.rows=res.rows; imp.bad=res.bad;
  imp.err = res.rows.length ? '' : 'Z těchhle sloupců nevznikl ani jeden použitelný řádek. Zkontroluj přiřazení, případně doplň měsíc.';
}

async function runImportScrap(){
  const list=imp.rows||[];
  if(!list.length) return;
  const months=[...new Set(list.map(r=>r.month))].sort();
  try{
    for(let i=0;i<list.length;i+=400){
      const b=writeBatch(db);
      list.slice(i,i+400).forEach(e=>{ const {_id,...data}=e; b.set(doc(db,'scrap',_id), data); });
      await b.commit();
      imp.prog=`Zapisuji řádky… ${Math.min(i+400,list.length)} z ${list.length}`; render();
    }
    for(let i=0;i<months.length;i++){
      const m=months[i];
      imp.prog=`Počítám souhrn za ${monthCz(m)} (${i+1} z ${months.length})…`; render();
      const qs = await getDocs(query(collection(db,'scrap'), where('month','==',m)));
      await setDoc(doc(db,'sc_months',m), Object.assign({month:m, updated:new Date().toISOString()},
        scrapAggregate(qs.docs.map(x=>x.data()))));
    }
    const sumS=list.reduce((a,r)=>a+r.scrapEur,0), sumV=list.reduce((a,r)=>a+r.salesEur,0);
    await addDoc(collection(db,'dt_imports'), {kind:'scrap', file:imp.name, rows:list.length, bad:imp.bad.length,
      from:months[0], to:months[months.length-1], days:months.length,
      at:new Date().toISOString(), by:me.uid, byName:me.name});
    imp.done={rows:list.length, days:months.length, from:months[0], to:months[months.length-1],
              scrapEur:sumS, salesEur:sumV};
    imp.step=3; imp.prog='';
    scLoaded=false; await loadScrap(true);
    toast('Import scrapu hotový — '+list.length.toLocaleString('cs-CZ')+' řádků.','ok');
  }catch(e){ imp.prog=''; imp.err=ruleHint(e); render(); }
}

   z čítače, ne 115 transakcemi. Co už v plánu je (stejné id), se přeskočí,
   aby přeimportování nepřepsalo, co se mezitím v aplikaci upravilo. */
async function runImportTasks(){
  const list=imp.rows||[];
  if(!list.length) return;
  try{
    imp.prog='Načítám, co už v akčním plánu je…'; render();
    await loadTasks(true);
    const have=new Set(tasks.map(t=>t._id));
    const nove=list.filter(r=>!have.has(r._id));
    if(!nove.length){
      imp.done={rows:0, skip:list.length}; imp.step=3; imp.prog='';
      toast('Všechny úkoly z toho souboru už v akčním plánu jsou.','ok'); render(); return;
    }
    /* jedním vrzem si zaberu blok pořadových čísel */
    imp.prog='Přiděluji čísla úkolů…'; render();
    const ref=doc(db,'meta','engcfg');
    const start=await runTransaction(db, async tx=>{
      const snap=await tx.get(ref);
      const cur=(((snap.data()||{}).seqTask)||0);
      const next=cur+nove.length;
      if(snap.exists()) tx.update(ref,{seqTask:next});
      else tx.set(ref, Object.assign({}, ENGCFG_DEF, {seqTask:next}));
      return cur;
    });
    const stamp=today();
    for(let i=0;i<nove.length;i+=400){
      const b=writeBatch(db);
      nove.slice(i,i+400).forEach((r,j)=>{
        const {_id,_src,_row,areaGuessed,...data}=r;
        data.no=String(start+i+j+1);
        data.hist=[`${stamp} · ${me.name} · převzato z Excelu ME TASK TRACKER (řádek ${_row})`];
        b.set(doc(db,'tasks',_id), data);
      });
      await b.commit();
      imp.prog=`Zapisuji úkoly… ${Math.min(i+400,nove.length)} z ${nove.length}`; render();
    }
    await addDoc(collection(db,'dt_imports'), {kind:'akční plán', file:imp.name,
      rows:nove.length, bad:imp.bad.length, skip:list.length-nove.length,
      at:new Date().toISOString(), by:me.uid, byName:me.name});
    imp.done={rows:nove.length, skip:list.length-nove.length, from:start+1, to:start+nove.length};
    imp.step=3; imp.prog='';
    tLoaded=false; await loadTasks(true);
    toast('Převzato '+nove.length+' úkolů do akčního plánu.','ok');
  }catch(e){ imp.prog=''; imp.err=writeHint(e); render(); }
}

/* ===== souhrny pro přehled ===== */
/* Souhrn za vybrané období. Když je vybraný proces, sečte se jen z jeho linek —
   proto import ukládá rozpad důvodů i po lince (pole `g`, `r`, `sh` u každé linky). */
function totals(proc){
  const t={sec:0,net:0,cnt:0,segs:{},groups:{},reasons:{},shifts:{},co:{sec:0,cnt:0},noSplit:0};
  const add=(o,k,label,sec,cnt)=>{ const x=o[k]||(o[k]={label,sec:0,net:0,cnt:0}); x.sec+=sec||0; x.cnt+=cnt||0; };
  for(const d of days){
    if(!proc){
      t.sec+=d.sec||0; t.net+=d.net||0; t.cnt+=d.cnt||0;
      t.co.sec+=(d.co&&d.co.sec)||0; t.co.cnt+=(d.co&&d.co.cnt)||0;
      for(const key of ['segs','groups','reasons']){
        for(const [k,v] of Object.entries(d[key]||{})){
          const o=t[key][k]||(t[key][k]={label:v.label||k,sec:0,net:0,cnt:0});
          o.sec+=v.sec||0; o.net+=v.net||0; o.cnt+=v.cnt||0;
        }
      }
      for(const [k,v] of Object.entries(d.shifts||{})){
        const o=t.shifts[k]||(t.shifts[k]={sec:0,cnt:0}); o.sec+=v.sec||0; o.cnt+=v.cnt||0;
      }
      continue;
    }
    for(const [sk,v] of Object.entries(d.segs||{})){
      if(procOfLine(v.label)!==proc) continue;
      t.sec+=v.sec||0; t.net+=v.net||0; t.cnt+=v.cnt||0;
      const o=t.segs[sk]||(t.segs[sk]={label:v.label||sk,sec:0,net:0,cnt:0});
      o.sec+=v.sec||0; o.net+=v.net||0; o.cnt+=v.cnt||0;
      t.co.sec+=(v.co&&v.co.sec)||0; t.co.cnt+=(v.co&&v.co.cnt)||0;
      if(!v.g && !v.r){ t.noSplit+=v.sec||0; continue; }   // starší import bez rozpadu
      for(const [k,g] of Object.entries(v.g||{})) add(t.groups,k,g.label,g.sec,g.cnt);
      for(const [k,r] of Object.entries(v.r||{})) add(t.reasons,k,r.label,r.sec,r.cnt);
      for(const [k,sh] of Object.entries(v.sh||{})){
        const o2=t.shifts[k]||(t.shifts[k]={sec:0,cnt:0}); o2.sec+=sh.sec||0; o2.cnt+=sh.cnt||0;
      }
    }
  }
  return t;
}
const top = (obj,n) => Object.values(obj||{}).sort((a,b)=>b.sec-a.sec).slice(0,n||99);

/* Když má položka `drill`, je celý řádek tlačítko — kliknutím se otevřou
   Prostoje vyfiltrované na tuhle linku / důvod / směnu za stejné období. */
function bars(items,color){
  if(!items.length) return `<div class="empty">Zatím žádná data.</div>`;
  const max=Math.max(...items.map(i=>i.sec))||1;
  return `<div class="bars">`+items.map(i=>{
    const inner=`
      <div class="nm" title="${esc(i.label)}">${esc(i.label)}</div>
      <div class="tr"><i style="width:${Math.max(1,i.sec/max*100).toFixed(1)}%;background:${i.color||color||'#1b4b8f'}"></i></div>
      <div class="vl">${fmtDur(i.sec)}<span class="muted" style="font-weight:400"> · ${i.cnt}×</span></div>`;
    return i.drill
      ? `<button class="bar go" data-a="kpi-drill" data-v="${esc(i.drill)}" title="Ukázat jednotlivé prostoje">${inner}<span class="ar">›</span></button>`
      : `<div class="bar">${inner}</div>`;
  }).join('')+`</div>`;
}
function trend(proc){
  const secOf = d => proc
    ? Object.values(d.segs||{}).filter(v=>procOfLine(v.label)===proc).reduce((a,v)=>a+(v.sec||0),0)
    : (d.sec||0);
  const dd=days.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(d=>Object.assign({},d,{sec:secOf(d)}));
  if(!dd.length) return '';
  const W=720,H=175,ml=46,mr=10,mt=12,mb=32,iw=W-ml-mr,ih=H-mt-mb;
  const peak=Math.max(...dd.map(d=>d.sec))||1;
  const nice=[1,2,5,10,20,25,50,100,200,250,500,1000];
  const stepH=nice.find(n=>n*3>=peak/3600)||Math.ceil(peak/3600/3);
  const max=stepH*3*3600, step=iw/dd.length, bw=Math.min(46,step-8);
  let g='';
  for(let i=0;i<=3;i++){ const y=mt+ih-ih*i/3;
    g+=`<line x1="${ml}" y1="${y}" x2="${ml+iw}" y2="${y}" stroke="#eef1f5"/>
        <text x="${ml-6}" y="${y+3}" text-anchor="end" font-size="10" fill="#6b7a90">${stepH*i} h</text>`; }
  const bb=dd.map((d,i)=>{
    const h=ih*d.sec/max, x=ml+step*i+(step-bw)/2, y=mt+ih-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,h)}" rx="3" fill="#1b4b8f"><title>${esc(dayCz(d.date))} — ${fmtDur(d.sec)}, ${d.cnt} událostí</title></rect>
      <text x="${x+bw/2}" y="${mt+ih+15}" text-anchor="middle" font-size="10" fill="#6b7a90">${dayCz(d.date)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Prostoje po dnech">${g}${bb}
    <line x1="${ml}" y1="${mt+ih}" x2="${ml+iw}" y2="${mt+ih}" stroke="#c8d3e0"/></svg>`;
}

async function nextNo(field, prefix){
  const ref=doc(db,'meta','engcfg');

  const n=await runTransaction(db, async tx=>{

/* Dokumenty, které se kvůli problému musely upravit — zaškrtávátka v A3. */
const PS_DOCS = ['Karta parametrů','ODS','TPM','Work instruction','JobSetup'];

/* ---------- pomocné nad problémy a akcemi ---------- */
/* Nápravná opatření k problému jsou obyčejné tasky akčního plánu s vazbou psId. */
const tasksOfPs = pid => tasks.filter(t=>t.psId===pid);
/* Uzavření je na dva kroky: koordinátor pošle ke schválení, manažer to schválí.
   Koordinátor = supervizor daného problému, kdokoli s pozicí „PE coordinator",
   nebo správce. Manažer = ten, kdo je v nastavení uvedený jako Engineering Manager. */
const nameKey = x => String(x||'').trim().toLowerCase();
const isPsCoordinator = p => !!me && (
  (p.coordinator && nameKey(me.name)===nameKey(p.coordinator)) ||
  (me.positions||[]).some(IS_COORD) || canImport());
const isEngManager = () => !!me && (
  (engcfg.manager && nameKey(me.name)===nameKey(engcfg.manager)) || canImport());

/* Prošvihnutý termín uzavření problem solvingu — kvůli tomu svítí všude červeně. */
const psLate = p => p.status!=='uzavřeno' && !!p.dueDate && p.dueDate < today();
const psLateDays = p => psLate(p) ? Math.floor((Date.parse(today())-Date.parse(p.dueDate))/86400000) : 0;
/* Kdy byl uzavřen poslední hotový úkol k problému — datum poslední akce. */
function lastActionClosed(pid){
  const d=tasksOfPs(pid).filter(taskDone).map(t=>t.closedOn).filter(Boolean).sort();
  return d.length ? d[d.length-1] : '';
}
const actsOf = pid => actions.filter(a=>a.problemId===pid);
const openActs = list => list.filter(a=>a.status!=='hotová' && a.status!=='zrušená');
const isOverdue = a => a.status!=='hotová' && a.status!=='zrušená' && a.due && a.due < today();
const overdueDays = a => isOverdue(a) ? Math.floor((Date.parse(today())-Date.parse(a.due))/86400000) : 0;
const problemFor = (wk,slug) => problems.find(p=>p.week===wk && p.lineSlug===slug);
function needsEscalation(p){
  if(p.status==='uzavřeno') return false;
  const worst=Math.max(0, ...tasksOfPs(p._id).map(lateDays), ...actsOf(p._id).map(overdueDays));
  return worst > (engcfg.escalationDays||7);
}
function canClose(p){
  if(!p.rootCause) return 'Nejdřív doplň kořenovou příčinu.';
  if(!p.effResult) return 'Před uzavřením musíš vyplnit ověření účinnosti.';
  return '';
}

/* ---------- ruční založení A3 ze záložky Problem solving ----------
   Dřív se problém dal založit jen u linky pod prahem na hlavní stránce.
   Tohle okno dovolí komukoli otevřít A3 na jakýkoli problém. */
const PS_TRIGGERS = ['výkon pod prahem','opakovaný problém','porucha stroje','kvalita / zmetky',
  'bezpečnost','přestavba / seřízení','podnět z auditu','jiný důvod'];
let psNew=null;        // rozepsané založení: {line, week, trigger, title, err}

/* Linky a stroje na výběr: co přišlo z importu prostojů + stroje z nastavení
   + linky už založených problémů. Slug držíme stejný jako v importu, aby se
   problém spároval se svým procesem v KPI. */
function psLineOpts(){
  const m=new Map();
  const put=(label,sl)=>{ const l=String(label||'').trim(); if(l && !m.has(l)) m.set(l, sl||slug(l)); };
  mgDays.forEach(d=>Object.entries(d.segs||{}).forEach(([k,v])=>put(v.label||k,k)));
  Object.values(engcfg.machines||{}).forEach(arr=>(arr||[]).forEach(x=>put(x)));
  problems.forEach(p=>put(p.line,p.lineSlug));
  return [...m].map(([label,sl])=>({label,slug:sl})).sort((a,b)=>a.label.localeCompare(b.label,'cs'));
}
/* Týdny na výběr: co je v datech, doplněné o posledních osm týdnů do dneška. */
function psWeekOpts(){
  const set=new Set(mgDays.map(d=>isoWeekOf(d.date)));
  let wk=isoWeekOf(today());
  for(let i=0;i<8;i++){ set.add(wk); wk=weekPrev(wk); }
  return [...set].sort().reverse();
}

/* ---------- zakládání a ukládání ---------- */
async function createProblem(wk, line, trigger, opts){
  try{
    const no=await nextNo('seqPs','PS');
    const eff=new Date(); eff.setDate(eff.getDate()+(engcfg.effectivenessDays||28));
    const rec={no, week:wk, line:line.label, lineSlug:line.slug,
      title:(opts&&opts.title) ? opts.title
        : (line.perf!=null ? `${line.label} — výkon ${num(line.perf,1)} % v ${weekShort(wk)}`
                           : `${line.label} — ${trigger||'problém'} (${weekShort(wk)})`),
      trigger: trigger||'výkon pod prahem', status:'nový',
      owner:engEngineers()[0]||'', coordinator:engCoordinators()[0]||'',
      opened:today(), downtimeSec:Math.round(line.sec||0), perf:line.perf==null?null:+line.perf.toFixed(1),
      problemDesc:'', immediate:'', rootCause:'', corrective:'', docs:[], files:[],
      dueDate:eff.toISOString().slice(0,10),
      effCheckDue:eff.toISOString().slice(0,10), effResult:'', escalated:false,
      hist:[`${today()} · ${me.name} · problém založen (${trigger||'výkon pod prahem'})`]};
    const ref=await addDoc(collection(db,'problems'), rec);
    problems.unshift(Object.assign({_id:ref.id}, rec));
    openPs=ref.id; render();
    toast('Založeno '+no+'.','ok');
  }catch(e){ toast('Nepovedlo se založit. '+writeHint(e),'err'); }
}
/* Přenese rozepsané hodnoty z okna do paměti, aby se při překreslení neztratily. */
function collectPs(){
  const p=problems.find(x=>x._id===openPs); if(!p) return null;
  const el=document.getElementById('ps-root'); if(!el) return p;   // okno není vykreslené
  const g=id=>{const e=document.getElementById(id); return e?e.value.trim():'';};
  const min=Number(g('ps-min'));
  Object.assign(p,{
    owner:g('ps-owner'), coordinator:g('ps-coord'),
    problemDesc:g('ps-desc'), immediate:g('ps-immediate'),
    rootCause:g('ps-root'), corrective:g('ps-corrective'),
    docs:[...document.querySelectorAll('[data-psdoc]')].filter(c=>c.checked).map(c=>c.dataset.psdoc),
    dueDate:g('ps-due'), effCheckDue:g('ps-effdue'), effResult:g('ps-effres'),
    status:g('ps-status')||p.status
  });
  if(isFinite(min) && min>=0) p.downtimeSec=Math.round(min*60);
  return p;
}
/* Vyplněná pole problému — společné pro Uložit i pro uzavření. */
function psPatch(p){
  return {
    owner:p.owner, coordinator:p.coordinator,
    problemDesc:p.problemDesc, immediate:p.immediate,
    rootCause:p.rootCause, corrective:p.corrective, docs:p.docs||[],
    downtimeSec:p.downtimeSec||0, dueDate:p.dueDate||'',
    effCheckDue:p.effCheckDue, effResult:p.effResult
  };
}
async function saveProblem(){
  const p=collectPs(); if(!p) return;
  const next=psPatch(p);
  /* Uzavřený stav ani „ke schválení" se ručně nastavit nedá — jen tlačítky. */
  next.status = PS_LOCKED.includes(p.status) ? p.status : (p.status||'nový');
  next.hist=(p.hist||[]).concat(`${today()} · ${me.name} · upraveno`);
  try{
    await updateDoc(doc(db,'problems',p._id), next);
    Object.assign(p,next); psMsg=''; openPs=null;
    toast('Uloženo.','ok');
  }catch(e){ psMsg='Uložení selhalo. '+writeHint(e); render(); }
}
/* Koordinátor uzavře svou část — problém jde ke schválení manažerovi. */
async function submitPsForApproval(){

  next.status='ke schválení';
  next.closeRequestedBy=me.name; next.closeRequestedAt=today();

/* Smazat celý problem solving i s jeho opatřeními. Smí jen správce — na serveru
   to stejně hlídá pravidlo `allow write: if isAdmin()` u kolekcí problems a actions. */
/* ---------- přílohy u problem solvingu ---------- */
const MAX_PS_FILE = 5*1024*1024;      // 5 MB na soubor, stejně jako u nákupu
const PHOTO_EDGE = 1600, PHOTO_Q = 0.72;
/* Fotku z telefonu zmenšíme rovnou v prohlížeči, ať v úložišti nezabírá megabajty.
   Když se to z jakéhokoli důvodu nepovede, nahraje se originál. */
async function shrinkImage(f){
  if(!/^image\//i.test(f.type||'') || /svg/i.test(f.type||'')) return f;
  try{
    const bmp = await createImageBitmap(f, {imageOrientation:'from-image'});
    const sc = Math.min(1, PHOTO_EDGE/Math.max(bmp.width, bmp.height));
    if(sc>=1 && f.size<=900*1024){ bmp.close && bmp.close(); return f; }
    const w=Math.max(1,Math.round(bmp.width*sc)), h=Math.max(1,Math.round(bmp.height*sc));
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const cx=cv.getContext('2d'); cx.drawImage(bmp,0,0,w,h);
    bmp.close && bmp.close();
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',PHOTO_Q));
    if(!blob || blob.size>=f.size) return f;
    return new File([blob], f.name.replace(/\.[^.]+$/,'')+'.jpg', {type:'image/jpeg', lastModified:Date.now()});
  }catch(e){ return f; }
}
async function uploadPsFile(psId, f){
  const safe=f.name.replace(/[^\w.\-]+/g,'_').slice(-80);
  const path='ps/'+psId+'/'+Date.now()+'_'+Math.floor(Math.random()*1e6)+'_'+safe;
  const st=sref(storage,path);
  await uploadBytes(st,f,{contentType:f.type||'application/octet-stream'});
  return {name:f.name, path, url:await getDownloadURL(st), size:f.size, at:today(), by:me.name};
}
async function handlePsFiles(list){
  const p=collectPs(); if(!p) return;
  const raw=[...(list||[])].filter(Boolean); if(!raw.length) return;
  psMsg='Zpracovávám přílohy…'; render();
  const ok=[];
  for(const f0 of raw){
    const f=await shrinkImage(f0);
    if(f.size>MAX_PS_FILE){ toast(`„${f.name}" je i po zmenšení větší než 5 MB.`,'err'); continue; }
    ok.push(f);
  }
  if(!ok.length){ psMsg=''; render(); return; }
  psMsg='Nahrávám přílohy…'; render();
  const arr=(p.files||[]).slice(), hist=(p.hist||[]).slice();
  let n=0;
  for(const f of ok){
    try{ arr.push(await uploadPsFile(p._id,f)); hist.push(`${today()} · ${me.name} · přidal přílohu ${f.name}`); n++; }
    catch(e){ toast('Nenahrálo se: '+f.name+' — '+((e&&e.message)||e),'err'); }
  }
  if(n){
    try{ await updateDoc(doc(db,'problems',p._id),{files:arr, hist}); p.files=arr; p.hist=hist;
         toast(n===1?'Příloha nahrána.':n+' přílohy nahrány.','ok'); }
    catch(e){ toast('Uložení příloh selhalo. '+writeHint(e),'err'); }
  }
  psMsg=''; render();
}
async function removePsFile(i){
  const p=collectPs(); if(!p) return;
  const files=(p.files||[]).slice(), f=files[i]; if(!f) return;
  if(!confirm(`Odebrat přílohu „${f.name}"?`)) return;
  try{ await deleteObject(sref(storage,f.path)); }catch(e){ /* v úložišti už být nemusí */ }
  files.splice(i,1);
  const hist=(p.hist||[]).concat(`${today()} · ${me.name} · smazal přílohu ${f.name}`);
  try{ await updateDoc(doc(db,'problems',p._id),{files, hist}); p.files=files; p.hist=hist; }
  catch(e){ toast('Smazání selhalo. '+writeHint(e),'err'); }
  render();
}
