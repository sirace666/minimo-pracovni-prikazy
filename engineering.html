<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20100%20100%27%3E%3Crect%20width=%27100%27%20height=%27100%27%20rx=%2722%27%20fill=%27%231b4b8f%27/%3E%3Ctext%20x=%2750%27%20y=%2776%27%20font-size=%2774%27%20font-family=%27Arial,sans-serif%27%20font-weight=%27bold%27%20fill=%27white%27%20text-anchor=%27middle%27%3Em%3C/text%3E%3C/svg%3E">
<title>Engineering — YFAI minimo</title>
<link rel="stylesheet" href="header.css">
<style>
  :root{--navy-1:#0f2f5f;--navy-2:#1b4b8f;--bg:#f4f6f9;--card:#fff;--line:#dde4ec;--text:#16233a;--muted:#6b7a90;
    --green:#1f9254;--red:#c0392b;--amber:#b7791f;--blue:#2563a8;--purple:#6b46c1;
    --teal:#0d7377;--teal-bg:#e4f2f2;--teal-dark:#0a5b5e;--radius:6px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px}
  button{font-family:inherit;font-size:12px;cursor:pointer;border-radius:var(--radius);border:1px solid transparent;padding:7px 12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--text);width:100%}
  input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid #2a5ea3;outline-offset:1px}
  main{padding:14px 16px 40px}          /* přes celou šířku obrazovky */
  .btn-primary{background:var(--navy-2);color:#fff}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:#41506b}
  .btn-ok{background:var(--green);color:#fff}
  .btn-teal{background:var(--teal);color:#fff;font-weight:700}
  .muted{color:var(--muted)}
  .num{text-align:right;font-variant-numeric:tabular-nums}

  .notice{background:#eef4fc;border:1px solid #cfe0f5;color:#274a74;border-radius:8px;padding:10px 13px;margin-bottom:12px;font-size:12.5px}
  .notice.warn{background:#fdf3e2;border-color:#f2dfb8;color:#7a5410}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
  .panel>h2{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;margin:0;padding:11px 15px;font-size:14px;display:flex;align-items:center;gap:10px}
  .panel>h2 .right{margin-left:auto;font-weight:500;font-size:11px;opacity:.85}
  .panel .body{padding:13px}
  .empty{padding:26px;text-align:center;color:var(--muted)}

  .tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .tab{background:#eef1f5;color:#41506b;border:1px solid var(--line);font-weight:600;padding:8px 14px}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  a.tab{display:inline-block;font-size:12px;line-height:normal;border-radius:var(--radius);text-decoration:none}
  a.tab:hover{background:#e2e8f0}
  .tabs .sp{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .rangebtn{background:#fff;border:1px solid var(--line);color:#41506b;font-size:11.5px;padding:6px 11px}
  .rangebtn.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px;margin-bottom:14px}
  .kcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:var(--radius);padding:11px 13px}
  .kcard .lbl{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kcard .val{font-size:27px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .kcard .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
  .kcard .note{font-size:11px;color:var(--muted)}
  .kcard.soon{border-left-color:#c8d3e0;background:repeating-linear-gradient(135deg,#fff,#fff 8px,#fafbfd 8px,#fafbfd 16px)}
  .kcard.soon .val{color:var(--muted)}

  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:start}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr}}

  .bars{display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line)}
  .bar:last-child{border-bottom:0}
  .bar .nm{flex:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .bar .tr{flex:1.5;height:14px;background:#eef1f5;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .bar .tr i{display:block;height:100%;border-radius:3px}
  .bar .vl{flex:none;width:120px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .chart{width:100%;height:auto;display:block}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);background:#fafbfd}
  .filters input,.filters select{width:auto;min-width:150px}
  .filters .grow{flex:1 1 260px;max-width:520px}
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{background:#16355f;color:#fff;text-align:left;padding:9px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  tbody td{padding:8px 10px;border-bottom:1px solid #eef1f5;vertical-align:top}
  tbody tr:hover td{background:#fafbfd}
  tr.long td{background:#fdf1ef}
  td.desc{min-width:180px;max-width:340px}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid transparent;white-space:nowrap}
  .b-grey{background:#eef1f5;color:#4a5a70;border-color:#dfe4ea}
  .b-teal{background:var(--teal-bg);color:var(--teal-dark);border-color:#bfdedd}
  .b-green{background:#e8f6ee;color:var(--green);border-color:#c4e6d3}
  .b-red{background:#fdecea;color:var(--red);border-color:#f5cfca}

  .steps{display:flex;padding:0;margin:0 0 14px;list-style:none;flex-wrap:wrap}
  .steps li{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-right:0;padding:10px 14px;font-size:12px;color:var(--muted);display:flex;gap:9px;align-items:center}
  .steps li:first-child{border-radius:var(--radius) 0 0 var(--radius)}
  .steps li:last-child{border-right:1px solid var(--line);border-radius:0 var(--radius) var(--radius) 0}
  .steps li b{flex:none;width:22px;height:22px;border-radius:50%;background:#eef1f5;color:#4a5a70;display:flex;align-items:center;justify-content:center;font-size:11px}
  .steps li.on{background:var(--teal-bg);color:var(--teal-dark);font-weight:700;border-color:#bfdedd}
  .steps li.on b{background:var(--teal);color:#fff}
  .steps li.done b{background:var(--green);color:#fff}
  /* ===== Akční plán managementu ===== */
  textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);
    background:#fff;color:var(--text);width:100%;resize:vertical}
  textarea:focus{outline:2px solid #2a5ea3;outline-offset:1px}
  .legend2{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:8px 13px;border-bottom:1px solid var(--line);
    background:#fff;font-size:11px;color:var(--muted)}
  .legend2 i{display:inline-block;width:20px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;font-style:normal}
  .tasktbl th.ycol{background:#7a6224}
  .tasktbl th.gcol{background:#41506b}
  .tasktbl td.ycol{background:#fdf6e3}
  .tasktbl td.gcol{background:#f4f6f9}
  .tasktbl tr.late td{background:#fdecea}
  .tasktbl tr.late td.gcol{background:#f9dcd8}
  .tasktbl tr.closed td{opacity:.62}
  .tasktbl tr.clickable{cursor:pointer}
  .tasktbl{font-size:12px}
  .tasktbl th,.tasktbl td{padding:7px 8px}
  .tasktbl td.desc{min-width:150px;max-width:none;white-space:normal}
  .tasktbl td.nowrap{white-space:nowrap}
  .clip{color:#2563a8;font-weight:700;font-size:11px}
  .ychip{background:#fdf6e3;border:1px solid #f0e0b8;border-radius:4px;padding:1px 6px}
  .gchip{background:#eef1f5;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .ro.gcell{background:#f4f6f9}
  .ybox{background:#fdf6e3;border:1px solid #f0e0b8;border-radius:var(--radius);padding:9px 11px}
  .ybox input{background:#fff}
  .machgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
  .ownerpick{position:relative}
  .ochips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .ochip{background:var(--teal-bg);border:1px solid #bfdedd;color:var(--teal-dark);border-radius:20px;
    padding:3px 6px 3px 11px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
  .ochip button{background:none;border:0;color:var(--teal-dark);font-size:12px;line-height:1;padding:0 3px;cursor:pointer;opacity:.7}
  .ochip button:hover{opacity:1}
  .osugg{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border:1px solid var(--line);
    border-radius:0 0 var(--radius) var(--radius);box-shadow:0 8px 20px rgba(16,35,58,.16);max-height:210px;overflow-y:auto}
  .osug{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #eef1f5;
    padding:8px 11px;font-size:13px;color:var(--text);border-radius:0}
  .osug:last-child{border-bottom:0}
  .osug:hover,.osug:focus{background:var(--teal-bg);color:var(--teal-dark);font-weight:700}
  .filelist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .fileitem{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);padding:7px 10px;font-size:12.5px;flex-wrap:wrap}
  .fileitem .ic{flex:none}
  .fileitem .nm{font-weight:600;word-break:break-word}
  .filters .btn-new{font-size:13px;padding:9px 16px;border-radius:8px;letter-spacing:0;
    background:linear-gradient(180deg,#f6821f,#e8590c);color:#fff;font-weight:800;text-transform:none;
    box-shadow:0 3px 10px rgba(232,89,12,.32)}
  .filters .btn-new:hover{background:linear-gradient(180deg,#e8590c,#c94f0a)}
  @media(max-width:680px){
    .tasktbl td.ycol,.tasktbl td.gcol{background:none}
    .tasktbl tr.late td{background:none}
    .tasktbl tr.late{border-left:4px solid var(--red)}
    .filters .btn-new{width:100%}
  }

  /* ===== Řízení výkonu — okno problem solvingu ===== */
  .btn-danger{background:var(--red);color:#fff;font-weight:700}
  label.check{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;color:#41506b;white-space:nowrap;cursor:pointer;font-weight:600}
  label.check input{width:16px;height:16px;min-width:0;margin:0;flex:none}
  .overlay{position:fixed;inset:0;background:rgba(12,26,48,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;z-index:60}
  .modal{background:#fff;border-radius:10px;width:100%;max-width:1060px;margin:auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .modal h3{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;margin:0;padding:14px 18px;font-size:16px;
    border-radius:10px 10px 0 0;display:flex;align-items:center;gap:10px}
  .modal h3 .x{margin-left:auto;background:transparent;border:0;color:#fff;font-size:20px;line-height:1;padding:0 4px}
  .robar{padding:9px 16px;background:#eef1f5;border-bottom:1px solid var(--line);font-size:12px;color:#41506b;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .form{padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .f{display:flex;flex-direction:column;gap:4px}
  .f label{font-size:12.5px;font-weight:700;color:#41506b}
  .f .ro{background:#fafbfd;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;min-height:35px}
  .f.span2{grid-column:span 2}.f.span3{grid-column:span 3}.f.span4{grid-column:span 4}
  .sect{grid-column:span 4;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--teal-dark);
    border-bottom:2px solid var(--teal-bg);padding-bottom:5px;margin-top:6px}
  .why{grid-column:span 4;display:flex;flex-direction:column;gap:8px}
  .why .row{display:flex;gap:10px;align-items:center}
  .why .n{flex:none;width:74px;font-size:11px;font-weight:800;color:#fff;background:var(--teal);border-radius:4px;padding:7px 8px;text-align:center}
  .why .n.root{background:var(--red)}
  .why .t{flex:1}
  .addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .addrow input,.addrow select{width:auto;min-width:130px}
  .addrow input#na-text{flex:1;min-width:220px}
  .hist{padding:0 18px 14px;font-size:11px;color:var(--muted)}
  .hist div{padding:3px 0;border-top:1px dotted var(--line)}

  /* ===== A3 problem solving — 8 boxů podle standardu (Kaufman Global) ===== */
  .a3wrap{padding:16px 18px}
  .a3top{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
  .a3head{display:grid;grid-template-columns:2fr 1.5fr 1.1fr 1fr;border:1px solid #cfe0dc;border-radius:8px;overflow:hidden;margin-bottom:12px;background:#fff}
  .a3head .c{padding:6px 11px;border-right:1px solid #e4edeb;display:flex;flex-direction:column;gap:2px;min-width:0}
  .a3head .c:last-child{border-right:0}
  .a3head .lb{font-size:10px;font-weight:800;letter-spacing:.5px;color:#7c8aa0;text-transform:uppercase}
  .a3head input{border:0;background:transparent;padding:2px 0;font-size:13px;font-weight:600;color:var(--text);width:100%}
  .a3grid{display:flex;gap:12px;align-items:stretch}
  .a3col{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
  .a3box{border:1px solid var(--teal);border-radius:8px;background:#fff;display:flex;flex-direction:column;overflow:hidden}
  .a3box.grow{flex:1}
  .a3box>.bh{font-size:13px;font-weight:800;color:var(--text);padding:8px 11px;border-bottom:1px solid var(--teal-bg);display:flex;align-items:center;gap:7px}
  .a3box>.bh .n{color:var(--teal-dark)}
  .a3box>.bb{padding:10px;display:flex;flex-direction:column;gap:9px;flex:1}
  .a3box textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 9px;font:inherit;font-size:12.5px;line-height:1.45;resize:vertical;background:#f6f8fa;color:var(--text)}
  .a3box textarea:focus{background:#fff;border-color:var(--teal);outline:none}
  .a3lbl{font-size:11px;font-weight:700;color:#41506b;margin-bottom:-3px}

  @media(max-width:960px){.a3top{grid-template-columns:1fr 1fr}.a3head{grid-template-columns:1fr 1fr}}
  @media(max-width:680px){.a3wrap{padding:12px}.a3grid{flex-direction:column}.a3top{grid-template-columns:1fr}.a3head{grid-template-columns:1fr}}
  @media(max-width:900px){.form{grid-template-columns:repeat(2,1fr)}.f.span3,.f.span4,.sect,.why{grid-column:span 2}}
  @media(max-width:680px){
    .form{grid-template-columns:1fr;padding:14px}
    .f.span2,.f.span3,.f.span4,.sect,.why{grid-column:span 1}
    .overlay{padding:8px}
    .why .row{flex-wrap:wrap}.why .n{width:100%}
    .addrow input,.addrow select,.addrow button{width:100%}
  }
  .kindpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:14px}
  .kind{display:flex;align-items:center;gap:11px;text-align:left;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:13px 15px;font-size:13px;color:var(--text)}
  .kind:hover{border-color:#b9cbe6}
  .kind.on{border-color:var(--teal);background:var(--teal-bg);box-shadow:inset 0 0 0 1px var(--teal)}
  .kind .i{font-size:22px;flex:none}
  .kind b{display:block;font-size:14px}
  .kind i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px}
  .drop{border:2px dashed #b9c8da;border-radius:10px;background:#fbfcfe;padding:30px 18px;text-align:center;color:var(--muted)}
  .drop.hot{border-color:var(--teal);background:var(--teal-bg)}
  .drop .big{font-size:16px;font-weight:700;color:var(--text)}
  .filebtn{border:1px dashed #c8d3e0;background:#fafbfd;border-radius:var(--radius);padding:7px 11px;font-size:12.5px;color:#41506b;cursor:pointer;display:inline-block}
  .filebtn input{display:none}
  .foot{padding:12px 13px;border-top:1px solid var(--line);background:#fafbfd;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .file{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;margin-bottom:12px;flex-wrap:wrap}
  .file .nm{font-weight:700}
  .file .sz{color:var(--muted);font-size:11.5px}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f2f5f,#2a5ea3);padding:16px}
  .login{background:#fff;border-radius:14px;width:340px;padding:24px;box-shadow:0 22px 55px rgba(0,0,0,.35)}
  .login h2{margin:0 0 2px;font-size:18px;text-align:center}
  .login p{font-size:11.5px;color:var(--muted);text-align:center;margin:0 0 16px}
  .login input{margin-bottom:10px}
  .login button{width:100%;padding:10px;font-size:13px;background:var(--navy-2);color:#fff;font-weight:700}
  .loginerr{background:#fdecea;border:1px solid #f5cfca;color:#c0392b;font-size:11.5px;padding:8px 10px;border-radius:8px;margin-bottom:10px;font-weight:600}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#16233a;color:#fff;
    padding:10px 16px;border-radius:8px;font-size:12.5px;box-shadow:0 10px 26px rgba(0,0,0,.3);z-index:90}
  .toast.ok{background:#157347}
  .toast.err{background:#c0392b}

  @media(max-width:680px){
    main{padding:12px 10px 34px}
    .filters{flex-direction:column;align-items:stretch}
    .filters input,.filters select,.filters .grow{width:100%;max-width:none}
    .tblwrap{overflow-x:visible}
    thead{display:none}
    tbody tr{display:block;border:1px solid var(--line);border-radius:8px;margin:0 0 11px;padding:6px 12px;background:#fff}
    tbody td{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border:0;border-bottom:1px solid #eef1f5;text-align:right}
    tbody td:last-child{border-bottom:0}
    tbody td::before{content:attr(data-label);font-weight:700;color:var(--muted);text-align:left;flex:none;font-size:11px;text-transform:uppercase}
    tr.long td{background:none}
    tr.long{border-left:4px solid var(--red)}
    td.desc{max-width:none}
    .bar{flex-wrap:wrap}
    .bar .nm{flex:1 0 100%}
    .bar .vl{width:auto}
    .tabs .sp{margin-left:0;width:100%}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="login-wrap"><div class="login"><h2>Načítám…</h2><p>Připojuji se k Firebase.</p></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc,
  query, where, orderBy, limit, writeBatch, runTransaction }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL, deleteObject }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-storage.js";

/* Společný Firebase projekt pro celý portál. Veřejné frontendové klíče —
   je správné je mít v kódu, zabezpečení řeší pravidla Firestore. */
/* DOČASNĚ přepnuto na testovací projekt kvůli vývoji modulu Údržba.
   PŘED PR DAVIDOVI VRÁTIT na nakupni-pozadavky (config viz CLAUDE.md dodatek)! */
const firebaseConfig = {
  apiKey: "AIzaSyDXqMTTryH9mkgzA9o5PrndHRH4C_yUQLY",
  authDomain: "minimo-pracovni-prikazy.firebaseapp.com",

const pad2 = n => String(n).padStart(2,'0');

/* Excel drží čas jako číslo (dny od r. 1900). Počítá se v UTC, aby se prostoj
   neposunul o hodinu podle nastavení počítače. */
function fromSerial(v){
  const ms = Math.round((Number(v)-25569)*86400)*1000;
  if(!isFinite(ms)) return null;
  const d = new Date(ms);
  return {iso:`${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}T${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}`,
          date:`${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`, hour:d.getUTCHours(), ms};
}
function mkTime(y,mo,d,H,M,S){
  return {iso:`${y}-${pad2(mo)}-${pad2(d)}T${pad2(H)}:${pad2(M)}:${pad2(S)}`,
          date:`${y}-${pad2(mo)}-${pad2(d)}`, hour:H, ms:Date.UTC(y,mo-1,d,H,M,S)};
}
function fromText(s){
  const t=String(s).trim();
  let m=t.match(/^(\d{4})-(\d{2})-(\d{2})[T ](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m) return mkTime(+m[1],+m[2],+m[3],+m[4],+m[5],+(m[6]||0));
  m=t.match(/^(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m) return mkTime(+m[3],+m[2],+m[1],+m[4],+m[5],+(m[6]||0));
  m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})[, ]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);
  if(m){ let y=+m[3]; if(y<100)y+=2000; let H=+m[4]; const ap=(m[7]||'').toUpperCase();
    if(ap==='PM'&&H<12)H+=12; if(ap==='AM'&&H===12)H=0; return mkTime(y,+m[1],+m[2],H,+m[5],+(m[6]||0)); }
  return null;
}
function engTime(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return fromSerial(v);
  if(v instanceof Date) return mkTime(v.getFullYear(),v.getMonth()+1,v.getDate(),v.getHours(),v.getMinutes(),v.getSeconds());
  return fromText(v);
}
function engDur(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return Math.round(v*86400);
  const t=String(v).trim();
  const m=t.match(/^(\d+):(\d{2})(?::(\d{2}))?$/);
  if(m) return (+m[1])*3600+(+m[2])*60+(+(m[3]||0));
  const n=Number(t.replace(',','.'));
  return isFinite(n)?Math.round(n*60):null;
}
const shiftOf = h => (h>=6&&h<14)?'R':((h>=14&&h<22)?'O':'N');
const SHIFT_LBL = {R:'Ranní',O:'Odpolední',N:'Noční'};

const HEAD = {
  seg:['segment','anlage','linie','line','stroj','linka','machine'],
  reason:['reason','grund','duvod','důvod'],
  start:['start time','start','beginn','zacatek','začátek','od'],
  end:['end time','end','ende','konec','do'],
  dur:['duration','dauer','trvani','trvání'],
  net:['net duration','net','netto'],
  comment:['comment','bemerkung','poznamka','poznámka','note']
};
function engParse(aoa){
  const norm = s => String(s??'').trim().toLowerCase();
  let hi=-1, map=null;
  for(let i=0;i<Math.min(aoa.length,30);i++){
    const cells=(aoa[i]||[]).map(norm), m={};
    for(const key of Object.keys(HEAD)){
      const idx=cells.findIndex(c=>c && HEAD[key].some(h=>c===h));
      if(idx>=0) m[key]=idx;
    }
    if(m.seg!=null && m.reason!=null && m.start!=null){ hi=i; map=m; break; }
  }
  if(hi<0) return {ok:false, err:'V souboru nejsou sloupce Segment, Reason a Start time. Je to opravdu report prostojů ze Symesticu?'};
  const out=[], bad=[];
  for(let i=hi+1;i<aoa.length;i++){
    const r=aoa[i]||[];
    const seg=String(r[map.seg]??'').trim();
    if(!seg) continue;
    const st=engTime(r[map.start]);
    if(!st){ bad.push(i+1); continue; }
    const en = map.end!=null ? engTime(r[map.end]) : null;
    let sec = map.dur!=null ? engDur(r[map.dur]) : null;      // primárně sloupec Duration ze Symesticu
    if(sec==null && en && en.ms>st.ms) sec=Math.round((en.ms-st.ms)/1000);
    if(sec==null||sec<0){ bad.push(i+1); continue; }
    const net = map.net!=null ? engDur(r[map.net]) : null;
    const reason = String(r[map.reason]??'').trim() || '00 Unknown';
    out.push({seg, reason, group:engGroup(reason), co:isChangeover(reason),
      start:st.iso, end:en?en.iso:'', date:st.date, shift:shiftOf(st.hour),
      sec, net:(net==null?sec:net),
      comment: map.comment!=null ? String(r[map.comment]??'').trim().slice(0,500) : '',
      _id:`${st.date}_${slug(seg)}_${Math.round(st.ms/1000)}`});
  }
  return {ok:true, rows:out, bad};
}
/* Denní souhrn — počítá se vždy z toho, co je v databázi */
function aggregate(list){
  const d={sec:0,net:0,cnt:0,segs:{},groups:{},reasons:{},shifts:{},co:{sec:0,cnt:0}};
  for(const e of list){
    const sec=Number(e.sec)||0, net=Number(e.net)||sec;
    d.sec+=sec; d.net+=net; d.cnt++;
    const sk=slug(e.seg), gk=slug(e.group||engGroup(e.reason)), rk=slug(e.reason);
    d.segs[sk]    = d.segs[sk]    || {label:e.seg,sec:0,net:0,cnt:0};
    d.groups[gk]  = d.groups[gk]  || {label:e.group||engGroup(e.reason),sec:0,cnt:0};
    d.reasons[rk] = d.reasons[rk] || {label:e.reason,sec:0,cnt:0};
    d.shifts[e.shift] = d.shifts[e.shift] || {sec:0,cnt:0};
    d.segs[sk].sec+=sec; d.segs[sk].net+=net; d.segs[sk].cnt++;
    d.groups[gk].sec+=sec; d.groups[gk].cnt++;
    d.reasons[rk].sec+=sec; d.reasons[rk].cnt++;
    d.shifts[e.shift].sec+=sec; d.shifts[e.shift].cnt++;
    if(e.co){ d.co.sec+=sec; d.co.cnt++; }
  }
  return d;
}

const SCRAP_HEAD = {
  project:['project','projekt','program','zákazník','zakaznik','customer','produkt','product'],
  line:   ['line','linka','segment','anlage','stroj','machine','pracoviště','pracoviste','workcenter','work center','cost center','nákladové středisko'],
  scrap:  ['scrap','scrap eur','scrap €','scrap value','scrap cost','zmetky','zmetkovitost','hodnota zmetků','hodnota zmetku','náklady','naklady'],
  sales:  ['sales','sales eur','sales €','revenue','turnover','tržby','trzby','obrat','prodej','výroba','vyroba'],
  period: ['date','datum','month','měsíc','mesic','period','období','obdobi','week','týden','tyden']
};
/* Číslo z buňky — zvládne 1234.56, "1 234,56", "1.234,56 €", "(1 234)" */
function toNum(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  let t=String(v).replace(/[\s ]/g,'').replace(/[€$Kk][ČčcC]?/g,'').trim();
  if(!t) return null;
  let neg=false;
  if(/^\(.*\)$/.test(t)){ neg=true; t=t.slice(1,-1); }
  if(t.startsWith('-')){ neg=true; t=t.slice(1); }
  const lc=t.lastIndexOf(','), ld=t.lastIndexOf('.');
  if(lc>-1 && ld>-1){
    if(lc>ld) t=t.replace(/\./g,'').replace(',','.');     // 1.234,56
    else      t=t.replace(/,/g,'');                        // 1,234.56
  }else if(lc>-1){
    t = (t.length-lc-1<=2) ? t.replace(',','.') : t.replace(/,/g,'');
  }else if(ld>-1){
    if(/^\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,'');   // 1.234 = tisíce
  }
  const n=Number(t);
  if(!isFinite(n)) return null;
  return neg?-n:n;
}
/* Měsíc z buňky — datum, "2026-08", "08/2026" */
function monthOf(v){
  const t=engTime(v);
  if(t) return {month:t.date.slice(0,7), date:t.date};
  const s=String(v??'').trim();
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})$/);
  if(m) return {month:`${m[1]}-${pad2(+m[2])}`, date:''};
  m=s.match(/^(\d{1,2})[-\/.](\d{4})$/);
  if(m) return {month:`${m[2]}-${pad2(+m[1])}`, date:''};
  return null;
}
/* Najde řádek hlavičky a nabídne přiřazení sloupců. */
function scrapDetect(aoa){
  const norm = s => String(s??'').trim().toLowerCase();
  let best={score:-1};
  for(let i=0;i<Math.min(aoa.length,30);i++){
    const cells=(aoa[i]||[]).map(norm);
    if(!cells.some(Boolean)) continue;
    const m={}; let score=0;
    for(const key of Object.keys(SCRAP_HEAD)){
      const idx=cells.findIndex(c=>c && SCRAP_HEAD[key].some(h=>c===h || c.startsWith(h+' ') || c.includes(h)));
      if(idx>=0){ m[key]=idx; score++; }
    }
    if(score>best.score) best={score, row:i, map:m, headers:(aoa[i]||[]).map(x=>String(x??''))};
  }
  if(best.score<1) return {ok:false, err:'V souboru se nepodařilo najít hlavičku tabulky. Zkontroluj, že první řádky obsahují názvy sloupců.'};
  return {ok:true, headRow:best.row, map:best.map, headers:best.headers};
}
/* Poskládá řádky podle zvoleného přiřazení sloupců. */
function scrapParse(aoa, headRow, map, fallbackMonth){
  const out=[], bad=[];
  if(map.project==null || map.scrap==null)
    return {ok:false, err:'Musíš určit aspoň sloupec s projektem a sloupec s hodnotou scrapu.'};
  for(let i=headRow+1;i<aoa.length;i++){
    const r=aoa[i]||[];
    const project=String(r[map.project]??'').trim();
    if(!project) continue;
    if(/^(celkem|total|sum|součet|soucet|grand total)/i.test(project)) continue;   // souhrnné řádky přeskoč
    const scrapEur=toNum(r[map.scrap]);
    if(scrapEur==null){ bad.push(i+1); continue; }
    const salesEur = map.sales!=null ? toNum(r[map.sales]) : null;
    const line = map.line!=null ? (String(r[map.line]??'').trim()||'—') : '—';
    let mo = map.period!=null ? monthOf(r[map.period]) : null;
    if(!mo && fallbackMonth) mo={month:fallbackMonth, date:''};
    if(!mo){ bad.push(i+1); continue; }
    out.push({month:mo.month, date:mo.date, project, line,
      scrapEur, salesEur:(salesEur==null?0:salesEur),
      _id:`${mo.date||mo.month}_${slug(project)}_${slug(line)}`});
  }
  /* Když stejný klíč padne víckrát (rozpad po vadách apod.), sečti ho — ať se řádky nepřepisují. */
  const byId={};
  for(const r of out){
    const p=byId[r._id];
    if(p){ p.scrapEur+=r.scrapEur; p.salesEur+=r.salesEur; }
    else byId[r._id]={...r};
  }
  return {ok:true, rows:Object.values(byId), bad};
}

  const d={scrapEur:0, salesEur:0, cnt:0, projects:{}, lines:{}};

/* ---------- týdny (ISO) ---------- */
function isoWeekOf(iso){
  const [y,m,d]=String(iso).slice(0,10).split('-').map(Number);
  const t=new Date(Date.UTC(y,m-1,d));
  const day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day);
  const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  const wk=Math.ceil((((t-ys)/86400000)+1)/7);
  return `${t.getUTCFullYear()}-W${pad2(wk)}`;
}
function weekMonday(wk){
  const [y,w]=String(wk).split('-W').map(Number);
  const jan4=new Date(Date.UTC(y,0,4));
  const day=jan4.getUTCDay()||7;
  const mon=new Date(jan4); mon.setUTCDate(jan4.getUTCDate()-day+1+(w-1)*7);
  return mon;
}
function weekLabel(wk){
  const mon=weekMonday(wk), sun=new Date(mon); sun.setUTCDate(mon.getUTCDate()+6);
  const f=d=>d.getUTCDate()+'. '+(d.getUTCMonth()+1)+'.';
  return `${String(wk).split('-W')[1]}. týden (${f(mon)} – ${f(sun)})`;
}
const weekShort = wk => String(wk).split('-W')[1]+'. t.';
const weekPrev = (wk,n)=>{ const mon=weekMonday(wk); mon.setUTCDate(mon.getUTCDate()-7*(n||1)); return isoWeekOf(mon.toISOString()); };

/* Vstup: denní souhrny dt_days. Výstup: {week: {lineSlug: {label, sec, days, planned, perf}}} */
function weeklyPerf(dayDocs, cfg){

      const g=w.groups[k]||(w.groups[k]={label:v.label||k,sec:0,cnt:0});
      g.sec+=v.sec||0; g.cnt+=v.cnt||0;

      l.sec+=v.sec||0; l.cnt+=v.cnt||0; l.days.add(d.date);

    }
  }
  /* Vyloučené skupiny se odečtou poměrně — v denním souhrnu není rozpad skupina×linka. */
  for(const w of Object.values(weeks)){
    let exSec=0;
    for(const [k,v] of Object.entries(w.groups)) if(ex.has(v.label)) exSec+=v.sec;
    const ratio = w.sec>0 ? Math.max(0,(w.sec-exSec)/w.sec) : 1;
    w.dayCount=w.days.size;
    for(const l of Object.values(w.lines)){
      l.dayCount=l.days.size;
      l.countedSec = l.sec*ratio;
      const hpd = (cfg.perLine&&cfg.perLine[l.slug]!=null) ? Number(cfg.perLine[l.slug]) : Number(cfg.plannedHoursPerDay)||0;
      l.planned = hpd*3600*w.dayCount;               // plánujeme jen za dny, ze kterých máme data
      l.perf = l.planned>0 ? Math.max(0, (l.planned-l.countedSec)/l.planned*100) : null;
      delete l.days;
    }
    delete w.days;
  }
  return weeks;
}
const sortedWeeks = obj => Object.keys(obj).sort();
const dnu = n => n+' '+(n===1?'den':(n>=2&&n<=4?'dny':'dní'));

/* Linky, které v daném týdnu spadly pod práh — a jak dlouho po sobě */
function underThreshold(weeks, wk, cfg){
  const w=weeks[wk]; if(!w) return [];
  const out=[];
  for(const l of Object.values(w.lines)){
    if(l.perf==null || l.perf>=cfg.threshold) continue;
    let streak=1;
    for(let i=1;i<8;i++){
      const pw=weeks[weekPrev(wk,i)];
      const pl=pw && pw.lines[l.slug];
      if(pl && pl.perf!=null && pl.perf<cfg.threshold) streak++; else break;
    }
    out.push(Object.assign({}, l, {streak, repeated: streak>=(cfg.repeatWeeks||2)}));
  }
  return out.sort((a,b)=>a.perf-b.perf);
}

async function saveTask(){
  const t=collectTask(); if(!t) return;
  if(!t.task){ tMsg='Napiš, co se má udělat (sloupec Task).'; render(); return; }
  if(!taskOwners(t).length){ tMsg='Vyber aspoň jednoho ownera.'; render(); return; }
  if(!t.dueOrig){ tMsg='Vyplň původní termín.'; render(); return; }
  const closing = taskDone(t) && !t.closedOn;
  if(closing) t.closedOn=today();
  if(!taskDone(t)) t.closedOn='';
  try{
    if(!t._id){
      const no=await nextTaskNo();
      const rec={no, area:t.area, machine:t.machine||'', type:t.type, createdOn:t.createdOn, createdBy:t.createdBy,
        task:t.task, output:t.output, owners:t.owners, dueOrig:t.dueOrig, moves:[],
        status:t.status, closedOn:t.closedOn, note:t.note, files:[],
        hist:[`${today()} · ${me.name} · task založen`]};
      const ref=await addDoc(collection(db,'tasks'), rec);
      /* přílohy vybrané ještě před založením nahrajeme až teď, když máme id */
      if(pendingTaskFiles.length){
        const arr=[], hist=rec.hist.slice();
        for(const f of pendingTaskFiles){
          try{ arr.push(await uploadTaskFile(ref.id,f)); hist.push(`${today()} · ${me.name} · přidal přílohu ${f.name}`); }
          catch(e){ toast('Příloha '+f.name+' se nenahrála: '+((e&&e.message)||e),'err'); }
        }
        if(arr.length){ await updateDoc(ref,{files:arr,hist}); rec.files=arr; rec.hist=hist; }
        pendingTaskFiles=[];
      }
      tasks.unshift(Object.assign({_id:ref.id}, rec));
      toast('Task '+no+' založen.','ok');
    }else{
      const hist=(t.hist||[]).concat(`${today()} · ${me.name} · ${closing?'task uzavřen':'upraveno'}`);
      const {_id,...data}=t; data.hist=hist;
      await updateDoc(doc(db,'tasks',t._id), data);
      t.hist=hist; syncTask(t);
      toast('Uloženo.','ok');

  }catch(e){ tMsg='Uložení selhalo: '+((e&&e.message)||e); }
  render();
}

async function uploadTaskFile(taskId, f){
  const safe=f.name.replace(/[^\w.\-]+/g,'_').slice(-80);
  const path='tasky/'+taskId+'/'+Date.now()+'_'+Math.floor(Math.random()*1e6)+'_'+safe;
  const s=sref(storage,path);
  await uploadBytes(s,f,{contentType:f.type||'application/octet-stream'});
  return {name:f.name, path, url:await getDownloadURL(s), size:f.size, at:today(), by:me.name};

async function handleTaskFiles(list){
  const files=[...(list||[])].filter(Boolean); if(!files.length || !openTask) return;
  const ok=[];
  for(const f of files){
    if(f.size>MAX_TASK_FILE){ toast(`„${f.name}" je větší než 5 MB.`,'err'); continue; }
    ok.push(f);
  }
  if(!ok.length) return;
  collectTask();                                                        // ať se rozepsané hodnoty neztratí
  if(!openTask._id){ pendingTaskFiles.push(...ok); render(); return; }   // nový task → fronta, nahraje se po založení
  tMsg='Nahrávám přílohy…'; render();
  const arr=(openTask.files||[]).slice(), hist=(openTask.hist||[]).slice();
  let n=0;
  for(const f of ok){
    try{ arr.push(await uploadTaskFile(openTask._id,f)); hist.push(`${today()} · ${me.name} · přidal přílohu ${f.name}`); n++; }
    catch(e){ toast('Nenahrálo se: '+f.name+' — '+((e&&e.message)||e),'err'); }
  }
  if(n){
    try{ await updateDoc(doc(db,'tasks',openTask._id), {files:arr, hist}); openTask.files=arr; openTask.hist=hist; syncTask(openTask);
         toast(n===1?'Příloha nahrána.':n+' přílohy nahrány.','ok'); }
    catch(e){ toast('Uložení příloh selhalo: '+((e&&e.message)||e),'err'); }
  }
  tMsg=''; render();
}
async function removeTaskFile(i){
  if(!openTask) return;
  collectTask();
  if(!openTask._id){ pendingTaskFiles.splice(i,1); render(); return; }
  const files=(openTask.files||[]).slice(), f=files[i];
  if(!f) return;
  try{ await deleteObject(sref(storage,f.path)); }catch(e){ /* v úložišti už být nemusí */ }

  const hist=(openTask.hist||[]).concat(`${today()} · ${me.name} · smazal přílohu ${f.name}`);

  catch(e){ toast('Smazání selhalo: '+((e&&e.message)||e),'err'); }
  render();

/* SheetJS se stahuje, až když se opravdu importuje — stránku to nezdržuje. */
let xlsxP=null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxP) return xlsxP;
  xlsxP = new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX);
    s.onerror=()=>rej(new Error('Nepodařilo se stáhnout knihovnu pro čtení Excelu. Ulož report jako CSV a nahraj ho — CSV umí aplikace přečíst i bez ní.'));
    document.head.appendChild(s);
  });
  return xlsxP;
}
function csvToAoa(text){
  const rows=[]; let row=[], cur='', q=false;
  const push=()=>{row.push(cur);cur='';};
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','||c===';'||c==='\t') push();
    else if(c==='\n'){ push(); rows.push(row); row=[]; }
    else if(c!=='\r') cur+=c;
  }
  push(); if(row.length>1||row[0]) rows.push(row);
  return rows;
}
async function readFile(file){
  const name=(file.name||'').toLowerCase();
  if(name.endsWith('.csv')||name.endsWith('.txt')) return csvToAoa(await file.text());
  const XLSX = await loadXlsx();
  const wb = XLSX.read(await file.arrayBuffer(), {cellDates:false});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:null, blankrows:false});
}
async function takeFile(file){
  if(!canImport()) return;
  imp.err=''; imp.name=file.name; imp.prog='Čtu soubor…'; render();
  try{
    const aoa = await readFile(file);
    if(imp.kind==='scrap'){
      const det = scrapDetect(aoa);
      if(!det.ok){ imp.prog=''; imp.err=det.err; render(); return; }
      imp.aoa=aoa; imp.headRow=det.headRow; imp.map=det.map; imp.headers=det.headers;
      imp.month=''; imp.step=2; imp.prog='';
      reparseScrap();
    }else{
      const res = engParse(aoa);
      if(!res.ok){ imp.prog=''; imp.err=res.err; render(); return; }
      if(!res.rows.length){ imp.prog=''; imp.err='V souboru nejsou žádné prostoje ke zpracování.'; render(); return; }
      imp.rows=res.rows; imp.bad=res.bad; imp.step=2; imp.prog='';
    }
  }catch(e){ imp.prog=''; imp.err=String((e&&e.message)||e); }
  render();
}
/* Přepočítá scrap po změně přiřazení sloupců nebo měsíce */
function reparseScrap(){
  const res = scrapParse(imp.aoa, imp.headRow, imp.map, imp.month);
  if(!res.ok){ imp.rows=[]; imp.bad=[]; imp.err=res.err; return; }
  imp.rows=res.rows; imp.bad=res.bad;
  imp.err = res.rows.length ? '' : 'Z těchhle sloupců nevznikl ani jeden použitelný řádek. Zkontroluj přiřazení, případně doplň měsíc.';
}

/* ===== zápis importu ===== */
async function runImport(){
  if(imp.kind==='scrap') return runImportScrap();
  return runImportDt();
}
async function runImportScrap(){
  const list=imp.rows||[];
  if(!list.length) return;
  const months=[...new Set(list.map(r=>r.month))].sort();
  try{
    for(let i=0;i<list.length;i+=400){
      const b=writeBatch(db);
      list.slice(i,i+400).forEach(e=>{ const {_id,...data}=e; b.set(doc(db,'scrap',_id), data); });
      await b.commit();
      imp.prog=`Zapisuji řádky… ${Math.min(i+400,list.length)} z ${list.length}`; render();
    }
    for(let i=0;i<months.length;i++){
      const m=months[i];
      imp.prog=`Počítám souhrn za ${monthCz(m)} (${i+1} z ${months.length})…`; render();
      const qs = await getDocs(query(collection(db,'scrap'), where('month','==',m)));
      await setDoc(doc(db,'sc_months',m), Object.assign({month:m, updated:new Date().toISOString()},
        scrapAggregate(qs.docs.map(x=>x.data()))));
    }
    const sumS=list.reduce((a,r)=>a+r.scrapEur,0), sumV=list.reduce((a,r)=>a+r.salesEur,0);
    await addDoc(collection(db,'dt_imports'), {kind:'scrap', file:imp.name, rows:list.length, bad:imp.bad.length,
      from:months[0], to:months[months.length-1], days:months.length,
      at:new Date().toISOString(), by:me.uid, byName:me.name});
    imp.done={rows:list.length, days:months.length, from:months[0], to:months[months.length-1],
              scrapEur:sumS, salesEur:sumV};
    imp.step=3; imp.prog='';
    scLoaded=false; await loadScrap(true);
    toast('Import scrapu hotový — '+list.length.toLocaleString('cs-CZ')+' řádků.','ok');
  }catch(e){ imp.prog=''; imp.err=ruleHint(e); render(); }
}
async function runImportDt(){
  const list=imp.rows||[];
  if(!list.length) return;
  const dates=[...new Set(list.map(r=>r.date))].sort();
  try{
    /* 1) prostoje po dávkách — stejné id = přepis, dvojí import nic nezduplikuje */
    for(let i=0;i<list.length;i+=400){
      const b=writeBatch(db);
      list.slice(i,i+400).forEach(e=>{ const {_id,...data}=e; b.set(doc(db,'downtimes',_id), data); });
      await b.commit();
      imp.prog=`Zapisuji prostoje… ${Math.min(i+400,list.length)} z ${list.length}`; render();
    }
    /* 2) denní souhrny — přepočítané z databáze, ne z importovaného souboru */
    for(let i=0;i<dates.length;i++){
      const d=dates[i];
      imp.prog=`Počítám souhrn za ${dayCz(d)} (${i+1} z ${dates.length})…`; render();
      const qs = await getDocs(query(collection(db,'downtimes'), where('date','==',d)));
      await setDoc(doc(db,'dt_days',d), Object.assign({date:d, updated:new Date().toISOString()}, aggregate(qs.docs.map(x=>x.data()))));
    }
    /* 3) záznam do historie */
    await addDoc(collection(db,'dt_imports'), {kind:'prostoje', file:imp.name, rows:list.length, bad:imp.bad.length,
      from:dates[0], to:dates[dates.length-1], days:dates.length,
      at:new Date().toISOString(), by:me.uid, byName:me.name});
    imp.done={rows:list.length, days:dates.length, from:dates[0], to:dates[dates.length-1]};
    imp.step=3; imp.prog='';
    loaded=false; evLoaded=''; mgLoaded=false;     // řízení se přepočítá z čerstvých dat
    await loadDays(true);
    toast('Import hotový — '+list.length.toLocaleString('cs-CZ')+' prostojů.','ok');
  }catch(e){ imp.prog=''; imp.err=ruleHint(e); render(); }
}

/* ===== souhrny pro přehled ===== */
function totals(){
  const t={sec:0,net:0,cnt:0,segs:{},groups:{},reasons:{},shifts:{},co:{sec:0,cnt:0}};
  for(const d of days){
    t.sec+=d.sec||0; t.net+=d.net||0; t.cnt+=d.cnt||0;
    t.co.sec+=(d.co&&d.co.sec)||0; t.co.cnt+=(d.co&&d.co.cnt)||0;
    for(const key of ['segs','groups','reasons']){
      for(const [k,v] of Object.entries(d[key]||{})){
        const o=t[key][k]||(t[key][k]={label:v.label||k,sec:0,net:0,cnt:0});
        o.sec+=v.sec||0; o.net+=v.net||0; o.cnt+=v.cnt||0;
      }
    }
    for(const [k,v] of Object.entries(d.shifts||{})){
      const o=t.shifts[k]||(t.shifts[k]={sec:0,cnt:0}); o.sec+=v.sec||0; o.cnt+=v.cnt||0;
    }
  }
  return t;
}
const top = (obj,n) => Object.values(obj||{}).sort((a,b)=>b.sec-a.sec).slice(0,n||99);

function bars(items,color){
  if(!items.length) return `<div class="empty">Zatím žádná data.</div>`;
  const max=Math.max(...items.map(i=>i.sec))||1;
  return `<div class="bars">`+items.map(i=>`
    <div class="bar">
      <div class="nm" title="${esc(i.label)}">${esc(i.label)}</div>
      <div class="tr"><i style="width:${Math.max(1,i.sec/max*100).toFixed(1)}%;background:${i.color||color||'#1b4b8f'}"></i></div>
      <div class="vl">${fmtDur(i.sec)}<span class="muted" style="font-weight:400"> · ${i.cnt}×</span></div>
    </div>`).join('')+`</div>`;
}
function trend(){
  const dd=days.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!dd.length) return '';
  const W=720,H=175,ml=46,mr=10,mt=12,mb=32,iw=W-ml-mr,ih=H-mt-mb;
  const peak=Math.max(...dd.map(d=>d.sec))||1;
  const nice=[1,2,5,10,20,25,50,100,200,250,500,1000];
  const stepH=nice.find(n=>n*3>=peak/3600)||Math.ceil(peak/3600/3);
  const max=stepH*3*3600, step=iw/dd.length, bw=Math.min(46,step-8);
  let g='';
  for(let i=0;i<=3;i++){ const y=mt+ih-ih*i/3;
    g+=`<line x1="${ml}" y1="${y}" x2="${ml+iw}" y2="${y}" stroke="#eef1f5"/>
        <text x="${ml-6}" y="${y+3}" text-anchor="end" font-size="10" fill="#6b7a90">${stepH*i} h</text>`; }
  const bb=dd.map((d,i)=>{
    const h=ih*d.sec/max, x=ml+step*i+(step-bw)/2, y=mt+ih-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,h)}" rx="3" fill="#1b4b8f"><title>${esc(dayCz(d.date))} — ${fmtDur(d.sec)}, ${d.cnt} událostí</title></rect>
      <text x="${x+bw/2}" y="${mt+ih+15}" text-anchor="middle" font-size="10" fill="#6b7a90">${dayCz(d.date)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Prostoje po dnech">${g}${bb}
    <line x1="${ml}" y1="${mt+ih}" x2="${ml+iw}" y2="${mt+ih}" stroke="#c8d3e0"/></svg>`;
}


/* ===== Scrap — načítání, přehled, grafy ===== */
async function loadScrap(force){
  if(scLoaded && !force) return;
  try{
    const qs = await getDocs(query(collection(db,'sc_months'), orderBy('month','desc'), limit(12)));
    scMonths = qs.docs.map(d=>Object.assign({month:d.id}, d.data())).sort((a,b)=>a.month.localeCompare(b.month));
    scLoaded=true;
  }catch(e){ if(!errMsg) errMsg=ruleHint(e); }
}
const scLatest = () => scMonths.length ? scMonths[scMonths.length-1] : null;

function scrapBars(items){
  if(!items.length) return `<div class="empty">Zatím žádná data.</div>`;
  const max=Math.max(...items.map(i=>i.scrapEur))||1;
  return `<div class="bars">`+items.slice(0,12).map(i=>`
    <div class="bar">
      <div class="nm" title="${esc(i.label)}">${esc(i.label)}</div>
      <div class="tr"><i style="width:${Math.max(1,i.scrapEur/max*100).toFixed(1)}%;background:#c0392b"></i></div>
      <div class="vl">${eur(i.scrapEur)}<span class="muted" style="font-weight:400"> · ${pct(i.scrapEur,i.salesEur)}</span></div>
    </div>`).join('')+`</div>`;
}
function scrapTrend(){
  const mm=scMonths;
  if(!mm.length) return '';
  const W=720,H=190,ml=64,mr=10,mt=22,mb=32,iw=W-ml-mr,ih=H-mt-mb;
  const peak=Math.max(...mm.map(m=>m.scrapEur))||1;
  const nice=[100,200,500,1000,2000,5000,10000,20000,50000,100000,200000,500000,1000000];
  const stepV=nice.find(n=>n*3>=peak)||Math.ceil(peak/3);
  const max=stepV*3, step=iw/mm.length, bw=Math.min(52,step-10);
  let g='';
  for(let i=0;i<=3;i++){ const y=mt+ih-ih*i/3;
    g+=`<line x1="${ml}" y1="${y}" x2="${ml+iw}" y2="${y}" stroke="#eef1f5"/>
        <text x="${ml-6}" y="${y+3}" text-anchor="end" font-size="10" fill="#6b7a90">${(stepV*i).toLocaleString('cs-CZ')} €</text>`; }
  const bb=mm.map((m,i)=>{
    const h=ih*(m.scrapEur||0)/max, x=ml+step*i+(step-bw)/2, y=mt+ih-h;
    const rr=m.salesEur>0?m.scrapEur/m.salesEur*100:null;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,h)}" rx="3" fill="#c0392b">
        <title>${monthCz(m.month)} — ${eur(m.scrapEur)}${rr!=null?', '+num(rr,2)+' % z tržeb':''}</title></rect>
      ${rr!=null?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="10" font-weight="700" fill="#16233a">${num(rr,2)} %</text>`:''}
      <text x="${x+bw/2}" y="${mt+ih+15}" text-anchor="middle" font-size="10" fill="#6b7a90">${monthShort(m.month)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Vývoj scrapu po měsících">${g}${bb}
    <line x1="${ml}" y1="${mt+ih}" x2="${ml+iw}" y2="${mt+ih}" stroke="#c8d3e0"/></svg>`;
}


/* ---------- načítání dat pro Řízení ---------- */
async function loadMgmt(force){
  if(mgLoaded && !force) return;
  busy='Načítám data pro řízení…'; render();
  try{
    const from=dateFrom(84);
    const qs = await getDocs(query(collection(db,'dt_days'), where('date','>=',from), orderBy('date','desc')));
    mgDays = qs.docs.map(d=>Object.assign({date:d.id}, d.data()));
    const cs = await getDoc(doc(db,'meta','engcfg'));
    engcfg = Object.assign({}, ENGCFG_DEF, cs.exists()?cs.data():{});
    await loadPeople();
    const ps = await getDocs(query(collection(db,'problems'), orderBy('opened','desc'), limit(200)));
    problems = ps.docs.map(d=>Object.assign({_id:d.id}, d.data()));
    const ac = await getDocs(query(collection(db,'actions'), orderBy('due','asc'), limit(500)));
    actions = ac.docs.map(d=>Object.assign({_id:d.id}, d.data()));
    mgLoaded=true;
  }catch(e){ errMsg=ruleHint(e); }
  busy=''; render();
}
async function saveEngcfg(patch){
  engcfg=Object.assign({}, engcfg, patch);
  try{ await setDoc(doc(db,'meta','engcfg'), engcfg, {merge:true}); toast('Nastavení uloženo.','ok'); }
  catch(e){ toast('Nastavení se neuložilo: '+((e&&e.message)||e),'err'); }
}
async function nextNo(field, prefix){
  const ref=doc(db,'meta','engcfg');
  const year=new Date().getFullYear();
  const n=await runTransaction(db, async tx=>{
    const s=await tx.get(ref);
    const cur=(((s.data()||{})[field])||0)+1;
    const patch={}; patch[field]=cur;
    if(s.exists()) tx.update(ref,patch); else tx.set(ref, Object.assign({}, ENGCFG_DEF, patch));
    return cur;
  });
  return `${prefix}-${year}-${String(n).padStart(3,'0')}`;
}

/* ---------- pomocné nad problémy a akcemi ---------- */
const actsOf = pid => actions.filter(a=>a.problemId===pid);
const openActs = list => list.filter(a=>a.status!=='hotová' && a.status!=='zrušená');
const isOverdue = a => a.status!=='hotová' && a.status!=='zrušená' && a.due && a.due < today();
const overdueDays = a => isOverdue(a) ? Math.floor((Date.parse(today())-Date.parse(a.due))/86400000) : 0;
const problemFor = (wk,slug) => problems.find(p=>p.week===wk && p.lineSlug===slug);
function needsEscalation(p){
  if(p.status==='uzavřeno') return false;
  const worst=Math.max(0,...actsOf(p._id).map(overdueDays));
  return worst > (engcfg.escalationDays||7);
}
function canClose(p){
  const acts=actsOf(p._id);
  if(!p.rootCause) return 'Nejdřív doplň kořenovou příčinu.';
  if(!acts.length) return 'Problém nejde uzavřít bez jediného opatření.';
  if(!acts.some(a=>a.type==='preventive')) return 'Chybí preventivní opatření — bez něj se problém vrátí.';
  if(openActs(acts).length) return 'Nejdřív dokonči nebo zruš všechna opatření.';
  if(!p.effResult) return 'Před uzavřením musíš vyplnit ověření účinnosti.';
  return '';
}

/* ---------- zakládání a ukládání ---------- */
async function createProblem(wk, line, trigger){
  try{
    const no=await nextNo('seqPs','PS');
    const eff=new Date(); eff.setDate(eff.getDate()+(engcfg.effectivenessDays||28));
    const rec={no, week:wk, line:line.label, lineSlug:line.slug,
      title:`${line.label} — výkon ${num(line.perf,1)} % v ${weekShort(wk)}`,
      trigger: trigger||'výkon pod prahem', status:'nový',
      owner:engEngineers()[0]||'', coordinator:engCoordinators()[0]||'',
      opened:today(), downtimeSec:Math.round(line.sec||0), perf:line.perf==null?null:+line.perf.toFixed(1),
      immediate:'', analysis:'', rootCause:'',
      a3Title:`${line.label} — výkon ${num(line.perf,1)} % v ${weekShort(wk)}`,
      a3Loc:line.label, a3Author:me.name||'', a3Date:today(),
      problemDesc:'',
      currentState:`Výkon ${num(line.perf,1)} %, prostoje ${fmtDur(line.sec||0)} (${weekLabel(wk)}).`,
      goal:`Výkon linky zpět nad ${engcfg.threshold||90} %.`,
      implPlan:'', stdWork:'',
      effCheckDue:eff.toISOString().slice(0,10), effResult:'', escalated:false,
      hist:[`${today()} · ${me.name} · problém založen (${trigger||'výkon pod prahem'})`]};
    const ref=await addDoc(collection(db,'problems'), rec);
    problems.unshift(Object.assign({_id:ref.id}, rec));
    openPs=ref.id; render();
    toast('Založeno '+no+'.','ok');
  }catch(e){ toast('Nepovedlo se založit: '+((e&&e.message)||e),'err'); }
}
/* Přenese rozepsané hodnoty z okna do paměti, aby se při překreslení neztratily. */
function collectPs(){
  const p=problems.find(x=>x._id===openPs); if(!p) return null;
  const el=document.getElementById('ps-root'); if(!el) return p;   // okno není vykreslené
  const g=id=>{const e=document.getElementById(id); return e?e.value.trim():'';};
  Object.assign(p,{
    owner:g('ps-owner'), coordinator:g('ps-coord'),
    immediate:g('ps-immediate'), rootCause:g('ps-root'),
    analysis:g('a3-analysis'),
    effCheckDue:g('ps-effdue'), effResult:g('ps-effres'),
    a3Title:g('a3-title'), a3Loc:g('a3-loc'), a3Author:g('a3-author'), a3Date:g('a3-date'),
    problemDesc:g('a3-desc'), currentState:g('a3-cur'), goal:g('a3-goal'),
    implPlan:g('a3-impl'), stdWork:g('a3-std'),
    status:g('ps-status')||p.status
  });
  return p;
}
async function saveProblem(){
  const p=collectPs(); if(!p) return;
  const next={
    owner:p.owner, coordinator:p.coordinator,
    immediate:p.immediate, rootCause:p.rootCause, analysis:p.analysis,
    a3Title:p.a3Title, a3Loc:p.a3Loc, a3Author:p.a3Author, a3Date:p.a3Date,
    problemDesc:p.problemDesc, currentState:p.currentState, goal:p.goal,
    implPlan:p.implPlan, stdWork:p.stdWork,
    effCheckDue:p.effCheckDue, effResult:p.effResult, status:p.status
  };
  if(next.status==='uzavřeno'){
    const why=canCloseWith(p);
    if(why){ psMsg=why; render(); return; }
    next.closedAt=today();
  }
  const hist=(p.hist||[]).slice();
  hist.push(`${today()} · ${me.name} · ${next.status==='uzavřeno'?'problém uzavřen':'upraveno'}`);
  next.hist=hist;
  try{
    await updateDoc(doc(db,'problems',p._id), next);
    Object.assign(p,next); psMsg=''; openPs=null;
    toast('Uloženo.','ok');
  }catch(e){ psMsg='Uložení selhalo: '+((e&&e.message)||e); render(); }
}
function canCloseWith(p){
  const acts=actsOf(p._id);
  if(!p.rootCause) return 'Bez kořenové příčiny problém uzavřít nejde.';
  if(!acts.length) return 'Problém nejde uzavřít bez jediného opatření.';
  if(!acts.some(a=>a.type==='preventive')) return 'Chybí preventivní opatření (preventive) — bez něj se problém vrátí.';
  if(openActs(acts).length) return 'Nejdřív dokonči nebo zruš všechna opatření.';
  if(!p.effResult) return 'Před uzavřením vyplň ověření účinnosti.';
  return '';
}
async function addAction(){
  const p=collectPs(); if(!p) return;
  const g=id=>{const el=document.getElementById(id); return el?el.value.trim():'';};
  const text=g('na-text');
  if(!text){ psMsg='Napiš, co se má udělat.'; render(); return; }
  const owner=g('na-owner'), due=g('na-due'), type=g('na-type')||'corrective';
  if(!owner || !due){ psMsg='Každé opatření musí mít ownera a termín.'; render(); return; }
  try{
    const no=await nextNo('seqAct','AK');
    const rec={no, problemId:p._id, problemNo:p.no, line:p.line, text, type, owner, due,
      status:'nová', created:today(), createdBy:me.name,
      hist:[`${today()} · ${me.name} · opatření založeno`]};
    const ref=await addDoc(collection(db,'actions'), rec);
    actions.push(Object.assign({_id:ref.id}, rec));
    psMsg='';
    if(p.status==='nový'||p.status==='analýza'){
      await updateDoc(doc(db,'problems',p._id),{status:'opatření'}); p.status='opatření';
    }
    render();
  }catch(e){ psMsg='Opatření se neuložilo: '+((e&&e.message)||e); render(); }
}
async function setActionStatus(id, st){
  const a=actions.find(x=>x._id===id); if(!a) return;
  if(openPs) collectPs();
  const patch={status:st, hist:(a.hist||[]).concat(`${today()} · ${me.name} · stav ${a.status} → ${st}`)};
  if(st==='hotová') patch.closedAt=today();
  try{ await updateDoc(doc(db,'actions',id), patch); Object.assign(a,patch);
    const p=problems.find(x=>x._id===a.problemId);
    if(p && p.status==='opatření' && !openActs(actsOf(p._id)).length){
      await updateDoc(doc(db,'problems',p._id),{status:'ověřování'}); p.status='ověřování';
      toast('Všechna opatření hotová — '+p.no+' čeká na ověření účinnosti.','ok');
    }
    render();
  }catch(e){ toast('Změna se neuložila: '+((e&&e.message)||e),'err'); }
}
async function toggleEscalation(id){
  if(openPs) collectPs();
  const p=problems.find(x=>x._id===id); if(!p) return;
  const v=!p.escalated;
  const h=(p.hist||[]).concat(`${today()} · ${me.name} · ${v?'eskalováno na Engineering Managera':'eskalace zrušena'}`);
  try{ await updateDoc(doc(db,'problems',id),{escalated:v, hist:h}); p.escalated=v; p.hist=h; render(); }
  catch(e){ toast(((e&&e.message)||e),'err'); }
}

function perfTrend(weeks,wks){
  const list=wks.slice(-10).map(k=>{
    const ls=Object.values(weeks[k].lines).filter(l=>l.perf!=null);
    return {week:k, avg: ls.length? ls.reduce((a,l)=>a+l.perf,0)/ls.length : 0,
            under: ls.filter(l=>l.perf<engcfg.threshold).length};
  });
  if(!list.length) return '';
  const W=720,H=190,ml=42,mr=10,mt=18,mb=34,iw=W-ml-mr,ih=H-mt-mb;
  const step=iw/list.length, bw=Math.min(48,step-10);
  let g='';
  for(let i=0;i<=4;i++){ const y=mt+ih-ih*i/4;
    g+=`<line x1="${ml}" y1="${y}" x2="${ml+iw}" y2="${y}" stroke="#eef1f5"/>
        <text x="${ml-6}" y="${y+3}" text-anchor="end" font-size="10" fill="#6b7a90">${i*25} %</text>`; }
  const ty=mt+ih-ih*(engcfg.threshold/100);
  const bb=list.map((d,i)=>{
    const h=ih*d.avg/100, x=ml+step*i+(step-bw)/2, y=mt+ih-h;
    const ok=d.avg>=engcfg.threshold;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,h)}" rx="3" fill="${ok?'#1f9254':'#c0392b'}">
        <title>${weekLabel(d.week)} — průměr ${num(d.avg,1)} %, ${d.under} linek pod prahem</title></rect>
      <text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="10" font-weight="700" fill="#16233a">${num(d.avg,0)}</text>
      <text x="${x+bw/2}" y="${mt+ih+15}" text-anchor="middle" font-size="10" fill="#6b7a90">${weekShort(d.week)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Trend výkonu po týdnech">${g}${bb}
    <line x1="${ml}" y1="${ty}" x2="${ml+iw}" y2="${ty}" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="${ml+iw}" y="${ty-5}" text-anchor="end" font-size="10" font-weight="700" fill="#b7791f">práh ${engcfg.threshold} %</text>
    <line x1="${ml}" y1="${mt+ih}" x2="${ml+iw}" y2="${mt+ih}" stroke="#c8d3e0"/></svg>`;
}

/* ---------- obrazovka Problem solving (A3) ---------- */
function psVisible(){
  let r=problems.slice();
  if(psF.status) r=r.filter(p=>p.status===psF.status);
  if(psF.line)   r=r.filter(p=>p.line===psF.line);
  if(psF.owner)  r=r.filter(p=>p.owner===psF.owner);
  if(psHideClosed) r=r.filter(p=>p.status!=='uzavřeno');
  if(psF.q){ const q=psF.q.toLowerCase();
    r=r.filter(p=>[p.no,p.title,p.line,p.owner,p.coordinator,p.rootCause,p.analysis||'',(p.whys||[]).join(' ')].join(' ').toLowerCase().includes(q)); }
  /* nejdřív to, co hoří: eskalace, pak po termínu, pak podle stáří */
  return r.sort((a,b)=>{
    const ea=(a.escalated||needsEscalation(a))?0:1, eb=(b.escalated||needsEscalation(b))?0:1;
    if(ea!==eb) return ea-eb;
    const la=openActs(actsOf(a._id)).some(isOverdue)?0:1, lb=openActs(actsOf(b._id)).some(isOverdue)?0:1;
    if(la!==lb) return la-lb;
    return String(a.opened||'').localeCompare(String(b.opened||''));
  });
}

function exportPsCsv(){
  const rows=psVisible();
  const line=a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';');
  const head=['Č.','Linka','Týden','Spouštěč','Problém','Výkon %','Prostoje (min)','Stav','Vlastník A3','Supervizor',
    'Okamžité opatření','Analýza','Kořenová příčina',
    'Opatření hotovo','Opatření celkem','Ověřit do','Výsledek ověření','Eskalace'];
  const csv=[line(head)].concat(rows.map(p=>{
    const acts=actsOf(p._id), analysis=p.analysis || (p.whys||[]).filter(Boolean).join(' | ');
    return line([p.no,p.line,p.week,p.trigger,p.title,p.perf!=null?num(p.perf,1):'',Math.round((p.downtimeSec||0)/60),
      p.status,p.owner,p.coordinator,p.immediate,analysis,p.rootCause,
      acts.length-openActs(acts).length,acts.length,p.effCheckDue,p.effResult,(p.escalated||needsEscalation(p))?'ano':'']);
  })).join('\n');
  const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='problem_solving_'+today()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function visibleTasks(){
  let r=tasks.slice();
  if(tF.area)   r=r.filter(t=>t.area===tF.area);
  if(tF.owner)  r=r.filter(t=>taskOwners(t).includes(tF.owner));
  if(tF.status) r=r.filter(t=>t.status===tF.status);
  if(tF.type)   r=r.filter(t=>t.type===tF.type);
  if(tHideClosed) r=r.filter(t=>!taskDone(t));
  if(tF.q){ const q=tF.q.toLowerCase();
    r=r.filter(t=>[t.no,t.task,t.output,ownersLabel(t),t.createdBy,t.note,t.machine,t.area].join(' ').toLowerCase().includes(q)); }
  if(tSort==='review'){
    /* na review: nejdřív po termínu (nejdéle), pak nejbližší termíny, uzavřené naposled */
    r.sort((a,b)=>{
      const da=taskDone(a)?1:0, db2=taskDone(b)?1:0;
      if(da!==db2) return da-db2;
      const la=lateDays(a), lb=lateDays(b);
      if(la!==lb) return lb-la;
      return String(dueValid(a)||'9999').localeCompare(String(dueValid(b)||'9999'));
    });
  }else{
    r.sort((a,b)=>String(b.createdOn||'').localeCompare(String(a.createdOn||'')) || String(a.no).localeCompare(String(b.no)));
  }
  return r;
}

function exportTasksCsv(){
  const rows=visibleTasks();
  const line=a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';');
  const head=['Č.','Oblast','Stroj','Typ','Zadáno','Zadal','Task','Očekávaný výstup – důkaz','Owner',
    'Termín původní','Posun 1','Posun 2','Posun 3','Platný termín','Posunů','Stav','Po termínu (dní)','Uzavřeno'];
  const csv=[line(head)].concat(rows.map(t=>{
    const m=(t.moves||[]).map(x=>x.date);
    return line([t.no,t.area,t.machine||'',t.type,t.createdOn,t.createdBy,t.task,t.output,ownersLabel(t),t.dueOrig,
      m[0]||'',m[1]||'',m[2]||'',dueValid(t),moveCount(t),t.status,taskLate(t)?lateDays(t):'',t.closedOn||'']);
  })).join('\n');
  const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='akcni_plan_'+today()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function dashView(){
  if(!days.length) return emptyView();
  const t=totals();
  const segs=top(t.segs,12), groups=top(t.groups);
  const unk=Object.values(t.groups||{}).find(g=>g.label===UNKNOWN);
  const unkPct = t.sec ? Math.round((unk?unk.sec:0)/t.sec*100) : 0;
  const coAvg = t.co.cnt ? Math.round(t.co.sec/t.co.cnt/60) : 0;
  const worst = segs[0];
  const n=days.length;
  return `
  <div class="cards">
    <div class="kcard" style="border-left-color:#1b4b8f">
      <div class="lbl">Prostoje celkem</div>
      <div class="val">${num(t.sec/3600,0)}<small> h</small></div>

      <div class="note">průměr na přestavbu · ${t.co.cnt}× · celkem ${fmtDur(t.co.sec)}</div>
    </div>
    <div class="kcard" style="border-left-color:${unkPct>10?'#c0392b':'#6b7a90'}">
      <div class="lbl">Nezařazené prostoje</div>
      <div class="val">${unkPct}<small> %</small></div>

    ${(function(){

        <div class="val">${rr!=null?num(rr,2):'—'}<small> %</small></div>
        <div class="note">${monthCz(L.month)} · ${eur(L.scrapEur)}</div></div>`;
    })()}
    <div class="kcard soon"><div class="lbl">Cycle time linky</div><div class="val">—</div>
      <div class="note">čeká na report ze Symesticu</div></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>Prostoje po linkách<span class="right">${Object.keys(t.segs).length} linek · TOP 12</span></h2>
      <div class="body">${bars(segs,'#1b4b8f')}</div>
    </div>
    <div class="panel">
      <h2>Podle důvodu</h2>

function exportCsv(){
  let r=events.slice();
  if(f.seg) r=r.filter(x=>x.seg===f.seg);
  if(f.group) r=r.filter(x=>(x.group||'')===f.group);
  if(f.shift) r=r.filter(x=>x.shift===f.shift);
  if(f.q){ const q=f.q.toLowerCase(); r=r.filter(x=>[x.seg,x.reason,x.comment].join(' ').toLowerCase().includes(q)); }
  const line=a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';');
  const csv=[line(['Datum','Směna','Linka','Začátek','Konec','Trvání (min)','Netto (min)','Skupina','Důvod','Poznámka'])]
    .concat(r.map(e=>line([e.date,e.shift,e.seg,String(e.start).slice(11,19),e.end?String(e.end).slice(11,19):'',
      Math.round(e.sec/60),Math.round((e.net||e.sec)/60),e.group,e.reason,e.comment||'']))).join('\n');
  const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='prostoje_'+today()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

/* ===== ovládání ===== */
function bind(){
  const lf=document.getElementById('loginForm');
  if(lf) lf.onsubmit=async e=>{
    e.preventDefault();
    const email=document.getElementById('li-email').value.trim();
    const pass=document.getElementById('li-pass').value;
    loginBusy=true; loginErr=''; render();
    try{ await signInWithEmailAndPassword(auth,email,pass); }
    catch(err){ loginBusy=false; loginErr=loginErrMsg(err.code); render(); }
  };
  const lo=document.getElementById('btn-logout'); if(lo) lo.onclick=()=>signOut(auth);
  document.querySelectorAll('[data-a]').forEach(el=>{ el.onclick=ev=>{ ev.stopPropagation(); act(el.dataset.a, el.dataset.v); }; });

  const q=document.getElementById('f-q');
  if(q) q.oninput=()=>{ f.q=q.value; const p=q.selectionStart; render();
    const n=document.getElementById('f-q'); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  [['f-seg','seg'],['f-group','group'],['f-shift','shift']].forEach(([id,k])=>{
    const el=document.getElementById(id); if(el) el.onchange=()=>{ f[k]=el.value; render(); };
  });

  document.querySelectorAll('[data-map]').forEach(el=>{
    el.onchange=()=>{ const k=el.dataset.map;
      if(el.value==='') delete imp.map[k]; else imp.map[k]=Number(el.value);
      reparseScrap(); render(); };
  });
  const mo=document.getElementById('imp-month');
  if(mo) mo.onchange=()=>{ imp.month=mo.value; reparseScrap(); render(); };

  const pq=document.getElementById('ps-q');
  if(pq) pq.oninput=()=>{ psF.q=pq.value; const pos=pq.selectionStart; render();
    const n=document.getElementById('ps-q'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } };
  [['ps-fline','line'],['ps-fowner','owner'],['ps-fstatus','status']].forEach(([id,k])=>{
    const el=document.getElementById(id); if(el) el.onchange=()=>{ psF[k]=el.value; render(); };
  });
  const ph=document.getElementById('ps-hide');
  if(ph) ph.onchange=()=>{ psHideClosed=ph.checked; render(); };

  const tq=document.getElementById('tk-q');
  if(tq) tq.oninput=()=>{ tF.q=tq.value; const pos=tq.selectionStart; render();
    const n=document.getElementById('tk-q'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } };
  [['tk-farea','area'],['tk-fowner','owner'],['tk-fstatus','status'],['tk-ftype','type']].forEach(([id,k])=>{
    const el=document.getElementById(id); if(el) el.onchange=()=>{ tF[k]=el.value; render(); };
  });
  const th=document.getElementById('tk-hide');
  if(th) th.onchange=()=>{ tHideClosed=th.checked; render(); };

    oq.oninput=()=>{ ownQ=oq.value; collectTask(); render();
      const n=document.getElementById('tk-ownq'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } };
    oq.onkeydown=e=>{
      if(e.key==='Escape'){ e.stopPropagation(); ownQ=''; collectTask(); render(); }

        e.preventDefault();
        const first=document.querySelector('.osug');
        if(first) first.click();
      }
    };

  const ovl=document.getElementById('ovl');
  if(ovl) ovl.onclick=e=>{ if(e.target.id==='ovl'){ openPs=null; psMsg=''; openTask=null; tMsg=''; render(); } };

  const fi=document.getElementById('file');
  if(fi) fi.onchange=()=>{ if(fi.files&&fi.files[0]) takeFile(fi.files[0]); };
  const dz=document.getElementById('drop');
  if(dz){
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('hot');}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('hot');}));
    dz.addEventListener('drop',e=>{ const file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(file) takeFile(file); });
  }
}
async function act(a,v){
  switch(a){
    case 'tab':
      engTab=v;
      if(v==='list') loadEvents();
      if(v==='mgmt') loadMgmt();
      if(v==='ps') loadMgmt();
      if(v==='tasks') loadTasks();
      if(v==='scrap'){ location.href=SCRAP_URL; return; }
      if(v==='imp' && imp.step===3) imp=newImp(imp.kind);
      break;
    case 'range':
      range=Number(v)||7; loaded=false; evLoaded='';
      loadDays(true); if(engTab==='list') loadEvents();
      break;
    case 'reload':
      loaded=false; evLoaded=''; scLoaded=false; mgLoaded=false; tLoaded=false;
      if(engTab==='mgmt'||engTab==='ps') loadMgmt(true);
      if(engTab==='tasks') loadTasks(true);
      loadDays(true); if(engTab==='list') loadEvents();
      break;
    /* ----- akční plán ----- */
    case 'tk-ownadd':{ collectTask(); const o=openTask&&taskOwners(openTask);
      if(o && !o.includes(v)) openTask.owners=o.concat(v);
      ownQ=''; break; }
    case 'tk-ownrm':{ collectTask();
      if(openTask) openTask.owners=taskOwners(openTask).filter(x=>x!==v);
      break; }
    case 'tk-new': openTask=emptyTask(); pendingTaskFiles=[]; moveDraft={date:'',why:''}; ownQ=''; tMsg=''; break;
    case 'tk-open': openTask=JSON.parse(JSON.stringify(tasks.find(x=>x._id===v)||{})); moveDraft={date:'',why:''}; ownQ=''; tMsg=''; break;
    case 'tk-close': openTask=null; pendingTaskFiles=[]; moveDraft={date:'',why:''}; ownQ=''; tMsg=''; break;
    case 'tk-save': await saveTask(); return;
    case 'tk-addmove': await addMove(); return;
    case 'tk-delfile': await removeTaskFile(Number(v)); return;
    case 'tk-review': tSort = tSort==='review'?'new':'review'; break;
    case 'tk-all': tF={area:'',owner:'',status:'',type:'',q:''}; tHideClosed=false; break;
    case 'tk-export': exportTasksCsv(); return;
    case 'ps-export': exportPsCsv(); return;

    /* ----- řízení výkonu ----- */
    case 'mg-week': mgWeek=v; break;
    case 'mg-open': openPs=v; psMsg=''; break;
    case 'mg-close': openPs=null; psMsg=''; break;
    case 'mg-save': await saveProblem(); break;
    case 'mg-addaction': await addAction(); return;
    case 'mg-adone': await setActionStatus(v,'hotová'); return;
    case 'mg-escalate': await toggleEscalation(v); return;
    case 'mg-create':{
      const [wk,slug]=String(v).split('|');
      const weeks=weeklyPerf(mgDays, engcfg);
      const line=(weeks[wk]&&weeks[wk].lines[slug]);
      if(!line) return;
      const u=underThreshold(weeks,wk,engcfg).find(x=>x.slug===slug);
      await createProblem(wk, line, u&&u.repeated?'opakovaný problém':'výkon pod prahem');
      return;
    }
    case 'mg-createall':{
      const weeks=weeklyPerf(mgDays, engcfg);
      const miss=underThreshold(weeks,v,engcfg).filter(l=>!problemFor(v,l.slug));
      for(const l of miss) await createProblem(v, l, l.repeated?'opakovaný problém':'výkon pod prahem');
      openPs=null; render(); return;
    }
    case 'imp-reset': imp=newImp(imp.kind); break;
    case 'imp-kind': imp=newImp(v); break;
    case 'imp-run':
      if(!canImport()) return;
      imp.err=''; imp.prog='Připravuji zápis…'; render();
      await runImport();
      break;
    case 'export': exportCsv(); return;
  }
  render();
}
function loginErrMsg(code){
  const m={'auth/invalid-email':'Neplatný e-mail.','auth/user-not-found':'Účet neexistuje.',
    'auth/wrong-password':'Nesprávné heslo.','auth/invalid-credential':'Nesprávný e-mail nebo heslo.',
    'auth/too-many-requests':'Příliš mnoho pokusů, zkuste to za chvíli.',
    'auth/operation-not-allowed':'Přihlašování e-mailem není ve Firebase zapnuté.'};
  return m[code]||('Přihlášení se nezdařilo ('+code+').');
}

/* Klik mimo našeptávač ownerů ho zavře, ať nepřekrývá políčka pod sebou. */
document.addEventListener('mousedown', e=>{
  if(!ownQ) return;
  if(e.target.closest && e.target.closest('.ownerpick')) return;
  ownQ=''; collectTask(); render();
});

render();
