/* ==========================================================
   Čísla pro dlaždice procesů na hlavní stránce.
   Všechno se počítá z denních souhrnů dt_days, které už máme v paměti —
   žádné další čtení z Firestore navíc.
   ========================================================== */
/* Do jakého procesu patří task akčního plánu — nejdřív podle stroje, pak podle oblasti. */
function procOfTask(t){
  const byMachine = t.machine ? procOfLine(t.machine) : 'OTHER';
  if(byMachine!=='OTHER') return byMachine;
  return procOfLine(t.area||'');
}
function procStats(){
  const weeks=weeklyPerf(mgDays, engcfg);
  const wks=sortedWeeks(weeks);
  const nowWk=isoWeekOf(today());
  /* „Minulý týden" = poslední uzavřený týden, ne rozdělaný. */
  const lastWk = wks.filter(k=>k<nowWk).slice(-1)[0] || wks.slice(-1)[0] || '';
  const prevWk = lastWk ? weekPrev(lastWk,1) : '';
  /* „Tento měsíc" = měsíc posledních dat. Když se na začátku měsíce ještě nic
     nenaimportovalo, ukáže se poslední měsíc s daty, ne prázdná nula. */
  const newest = mgDays.map(d=>d.date).sort().slice(-1)[0] || today();
  const month  = newest.slice(0,7);
  const prevMonth = (()=>{ const [y,m]=month.split('-').map(Number);
    return m===1 ? `${y-1}-12` : `${y}-${pad2(m-1)}`; })();

  /* Dlaždice ukazují buď celý měsíc, nebo jeden vybraný týden (tileWk). */
  const wk = (tileWk && weeks[tileWk]) ? tileWk : '';
  const prevOfWk = wk ? weekPrev(wk,1) : '';
  const inMain = d => wk ? isoWeekOf(d.date)===wk       : String(d.date).slice(0,7)===month;
  const inPrev = d => wk ? isoWeekOf(d.date)===prevOfWk : String(d.date).slice(0,7)===prevMonth;
  const mainLabel = wk ? weekLabel(wk) : monthCz(month);
  const prevLabel = wk ? weekShort(prevOfWk) : monthCz(prevMonth);

  const out={};
  const blank=k=>({k, sec:0, secPrev:0, cnt:0, lines:{},
    coSec:0, coCnt:0, spark:[], hasCo:false,
    secWeek:0, secPrevWeek:0, perfWeek:null, worst:null, groups:{}, days:new Set()});
  for(const p of PROCESSES) out[p.k]=blank(p.k);
  out.OTHER=blank('OTHER');

  /* součty za vybrané období z denních souhrnů */
  for(const d of mgDays){
    const main=inMain(d), prev=inPrev(d);
    if(!main && !prev) continue;
    for(const v of Object.values(d.segs||{})){
      const pk=procOfLine(v.label), o=out[pk]; if(!o) continue;
      if(main){
        o.sec+=v.sec||0; o.cnt+=v.cnt||0; o.days.add(d.date);
        const L=o.lines[v.label]||(o.lines[v.label]={label:v.label,sec:0,coCnt:0,coSec:0});
        L.sec+=v.sec||0;
        if(v.co){ o.hasCo=true;
          o.coSec+=v.co.sec||0; o.coCnt+=v.co.cnt||0;
          L.coSec+=v.co.sec||0; L.coCnt+=v.co.cnt||0; }
        for(const [gk,g] of Object.entries(v.g||{})){
          const x=o.groups[gk]||(o.groups[gk]={label:g.label,sec:0}); x.sec+=g.sec||0;
        }
      } else o.secPrev+=v.sec||0;
    }
  }
  /* posledních 8 týdnů pro malý graf trendu v dlaždici */
  const last8=wks.slice(-8);
  for(const o of Object.values(out)) o.spark=last8.map(k=>({wk:k, sec:0, on:k===wk}));
  last8.forEach((k,i)=>{
    const w=weeks[k]; if(!w) return;
    for(const l of Object.values(w.lines)){
      const o=out[procOfLine(l.label)]; if(!o) continue;
      o.spark[i].sec += l.sec||0;
    }
  });

  /* výkon a doplňkový řádek — v režimu měsíce poslední uzavřený týden,
     v režimu týdne ten vybraný */
  const perfWk = wk || lastWk;
  const sideWk = wk ? '' : lastWk;
  for(const [k,target] of [[perfWk,'_perf'],[sideWk,'secWeek'],[sideWk?prevWk:'','secPrevWeek']]){
    const w=k?weeks[k]:null; if(!w) continue;
    for(const l of Object.values(w.lines)){
      const o=out[procOfLine(l.label)]; if(!o) continue;
      if(target==='_perf'){ if(l.perf!=null){ o._pp=(o._pp||0)+l.perf; o._pn=(o._pn||0)+1; } }
      else o[target]+=l.sec||0;
    }
  }
  for(const o of Object.values(out)){
    o.perfWeek = o._pn ? o._pp/o._pn : null;
    o.worst = Object.values(o.lines).sort((a,b)=>b.sec-a.sec)[0]||null;
    o.coWorst = Object.values(o.lines).filter(l=>l.coCnt>0).sort((a,b)=>b.coCnt-a.coCnt)[0]||null;
    o.topGroup = Object.values(o.groups).sort((a,b)=>b.sec-a.sec)[0]||null;
    o.sparkAvg = o.spark.length ? o.spark.reduce((a,x)=>a+x.sec,0)/o.spark.length : 0;
    o.dayCount = o.days.size; delete o.days; delete o._pp; delete o._pn;
    o.openPs    = problems.filter(p=>p.status!=='uzavřeno' && procOfLine(p.line)===o.k);
    o.psLate    = o.openPs.filter(p=>psLate(p)||needsEscalation(p));
    o.openTasks = tasks.filter(t=>!taskDone(t) && procOfTask(t)===o.k);
    o.lateTasks = o.openTasks.filter(taskLate);
  }
  return {out, lastWk, prevWk, month, weeks, wk, mainLabel, prevLabel, wks:last8};
}
const trendArrow = (now, before) => {
  if(!before) return '';
  const d=(now-before)/before*100;
  if(Math.abs(d)<3) return '<span class="tarrow flat">→ beze změny</span>';
  return d>0 ? `<span class="tarrow up">▲ +${num(d,0)} %</span>`
             : `<span class="tarrow down">▼ ${num(d,0)} %</span>`;
};

/* Malý sloupcový graf prostojů po týdnech do dlaždice procesu.
   Poslední sloupec je zvýrazněný, čárkovaně je průměr — ať je hned vidět trend. */
function sparkWeeks(series, color){
  const data=(series||[]).filter(Boolean);
  if(data.length<2 || !data.some(d=>d.sec>0))
    return '<div class="spark empty">Na trend zatím není dost týdnů.</div>';
  const W=300, H=60;
  const max=Math.max(...data.map(d=>d.sec))||1;
  const avg=data.reduce((a,d)=>a+d.sec,0)/data.length;
  const step=W/data.length, bw=step*0.62;
  const ay=H-(avg/max)*(H-4);
  /* Sloupce jsou v SVG roztaženém na šířku dlaždice. Popisky týdnů proto NEJSOU
     v SVG — roztažení by z písma udělalo nečitelnou kaši — ale pod ním jako
     obyčejný text ve stejně širokých sloupcích. */
  const bars=data.map((d,i)=>{
    const h=Math.max(d.sec>0?2.5:0.8,(d.sec/max)*(H-4));
    const x=i*step+(step-bw)/2, y=H-h;
    const last=data.some(z=>z.on) ? !!d.on : i===data.length-1;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
      fill="${color}" opacity="${last?1:.42}"><title>${weekShort(d.wk)} — ${fmtDur(d.sec)}</title></rect>`;
  }).join('');
  const anyOn=data.some(z=>z.on);
  const labs=data.map((d,i)=>{
    const last=anyOn ? !!d.on : i===data.length-1;
    return `<span class="${last?'now':''}" title="${weekShort(d.wk)} — ${fmtDur(d.sec)}">${weekShort(d.wk)}</span>`;
  }).join('');
  return `<div class="spark">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Prostoje po týdnech">
      <line x1="0" y1="${ay.toFixed(1)}" x2="${W}" y2="${ay.toFixed(1)}" stroke="#9aa8ba" stroke-width="1" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
      ${bars}
    </svg>
    <div class="sparkx" style="grid-template-columns:repeat(${data.length},1fr)">${labs}</div>
    <div class="sparkcap">prostoje po týdnech · čárkovaně průměr ${fmtDur(avg)}</div>
  </div>`;
}

/* ---------- dlaždice procesů na hlavní stránce ---------- */
function procTiles(){
  const {out, lastWk, month, wk, mainLabel, prevLabel, wks} = procStats();
  const card = p => {
    const o=out[p.k], hMain=(o.sec||0)/3600, hWeek=(o.secWeek||0)/3600;
    const bad = o.perfWeek!=null && o.perfWeek < (engcfg.threshold||90);
    const alarm = o.psLate.length || o.lateTasks.length;
    return `
    <button class="ptile ${alarm?'alarm':''}" data-a="proc-kpi" data-v="${p.k}"
      title="Otevře KPI procesu ${esc(p.label)}">
      <div class="ph" style="--pc:${p.color}">
        <span class="ic">${p.icon}</span>
        <span class="nm">${esc(p.label)}</span>
        ${o.perfWeek!=null?`<span class="perf ${bad?'bad':'ok'}" title="Výkon linek ${esc(wk?weekLabel(wk):(lastWk?weekLabel(lastWk):''))}">${num(o.perfWeek,1)} %</span>`:''}
      </div>
      <div class="pbody">
        <div class="pmain">

function perfTrend(weeks,wks){
  const list=wks.slice(-10).map(k=>{
    const ls=Object.values(weeks[k].lines).filter(l=>l.perf!=null);
    return {week:k, avg: ls.length? ls.reduce((a,l)=>a+l.perf,0)/ls.length : 0,
            under: ls.filter(l=>l.perf<engcfg.threshold).length};
  });
  if(!list.length) return '';
  const W=720,H=190,ml=42,mr=10,mt=18,mb=34,iw=W-ml-mr,ih=H-mt-mb;
  const step=iw/list.length, bw=Math.min(48,step-10);
  let g='';
  for(let i=0;i<=4;i++){ const y=mt+ih-ih*i/4;
    g+=`<line x1="${ml}" y1="${y}" x2="${ml+iw}" y2="${y}" stroke="#eef1f5"/>
        <text x="${ml-6}" y="${y+3}" text-anchor="end" font-size="10" fill="#6b7a90">${i*25} %</text>`; }
  const ty=mt+ih-ih*(engcfg.threshold/100);
  const bb=list.map((d,i)=>{
    const h=ih*d.avg/100, x=ml+step*i+(step-bw)/2, y=mt+ih-h;
    const ok=d.avg>=engcfg.threshold;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,h)}" rx="3" fill="${ok?'#1f9254':'#c0392b'}">
        <title>${weekLabel(d.week)} — průměr ${num(d.avg,1)} %, ${d.under} linek pod prahem</title></rect>
      <text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="10" font-weight="700" fill="#16233a">${num(d.avg,0)}</text>
      <text x="${x+bw/2}" y="${mt+ih+15}" text-anchor="middle" font-size="10" fill="#6b7a90">${weekShort(d.week)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Trend výkonu po týdnech">${g}${bb}
    <line x1="${ml}" y1="${ty}" x2="${ml+iw}" y2="${ty}" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="${ml+iw}" y="${ty-5}" text-anchor="end" font-size="10" font-weight="700" fill="#b7791f">práh ${engcfg.threshold} %</text>
    <line x1="${ml}" y1="${mt+ih}" x2="${ml+iw}" y2="${mt+ih}" stroke="#c8d3e0"/></svg>`;
}

function problemModal(){
  const p=problems.find(x=>x._id===openPs); if(!p) return '';

/* ---------- obrazovka Problem solving (A3) ---------- */
function psVisible(){
  let r=problems.slice();
  if(psF.status) r=r.filter(p=>p.status===psF.status);
  if(psF.line)   r=r.filter(p=>p.line===psF.line);
  if(psF.owner)  r=r.filter(p=>p.owner===psF.owner);
  if(psHideClosed) r=r.filter(p=>p.status!=='uzavřeno');   // ke schválení se schovat nesmí
  if(psF.q){ const q=psF.q.toLowerCase();
    r=r.filter(p=>[p.no,p.title,p.line,p.owner,p.coordinator,p.problemDesc||'',p.immediate||'',
      p.rootCause,p.corrective||''].join(' ').toLowerCase().includes(q)); }
  /* nejdřív to, co hoří: eskalace, pak po termínu, pak podle stáří */
  return r.sort((a,b)=>{
    const ca=a.status==='uzavřeno'?1:0, cb=b.status==='uzavřeno'?1:0;
    if(ca!==cb) return ca-cb;
    const da=psLate(a)?0:1, db2=psLate(b)?0:1;
    if(da!==db2) return da-db2;
    const ea=(a.escalated||needsEscalation(a))?0:1, eb=(b.escalated||needsEscalation(b))?0:1;
    if(ea!==eb) return ea-eb;
    const la=tasksOfPs(a._id).some(taskLate)?0:1, lb=tasksOfPs(b._id).some(taskLate)?0:1;
    if(la!==lb) return la-lb;
    return String(a.opened||'').localeCompare(String(b.opened||''));
  });
}

function exportPsCsv(){
  const rows=psVisible();
  const line=a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';');
  const head=['Č.','Linka','Týden','Spouštěč','Problém','Výkon %','Prostoj (min)','Stav','Vlastník','Supervizor',
    'Popis problému','Okamžité opatření','Kořenová příčina','Nápravné opatření','Upravené dokumenty',
    'Úkoly hotovo','Úkoly celkem','Poslední akce uzavřena','Termín uzavření','Dní po termínu',
    'Ověřit do','Výsledek ověření','Příloh','Eskalace',
    'Uzavřel koordinátor','Kdy','Schválil manažer','Uzavřeno dne'];
  const csv=[line(head)].concat(rows.map(p=>{
    const mine=tasksOfPs(p._id);
    return line([p.no,p.line,p.week,p.trigger,p.title,p.perf!=null?num(p.perf,1):'',Math.round((p.downtimeSec||0)/60),
      p.status,p.owner,p.coordinator,p.problemDesc,p.immediate,p.rootCause,p.corrective,(p.docs||[]).join(', '),
      mine.filter(taskDone).length,mine.length,lastActionClosed(p._id),p.dueDate,psLate(p)?psLateDays(p):'',
      p.effCheckDue,p.effResult,(p.files||[]).length,(p.escalated||needsEscalation(p))?'ano':'',
      p.closeRequestedBy||'',p.closeRequestedAt||'',p.approvedBy||'',p.closedAt||'']);
  })).join('\n');
  const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='problem_solving_'+today()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

/* ---------- obrazovka Akční plán ---------- */
function visibleTasks(){
  let r=tasks.slice();
  if(tF.area)   r=r.filter(t=>t.area===tF.area);
  if(tF.owner)  r=r.filter(t=>taskOwners(t).includes(tF.owner));
  if(tF.status) r=r.filter(t=>t.status===tF.status);
  if(tF.type)   r=r.filter(t=>t.type===tF.type);
  if(tHideClosed) r=r.filter(t=>!taskDone(t));
  if(tF.q){ const q=tF.q.toLowerCase();
    r=r.filter(t=>[t.no,t.task,t.output,ownersLabel(t),t.createdBy,t.note,t.machine,t.area].join(' ').toLowerCase().includes(q)); }
  if(tSort==='review'){
    /* na review: nejdřív po termínu (nejdéle), pak nejbližší termíny, uzavřené naposled */
    r.sort((a,b)=>{
      const da=taskDone(a)?1:0, db2=taskDone(b)?1:0;
      if(da!==db2) return da-db2;
      const la=lateDays(a), lb=lateDays(b);
      if(la!==lb) return lb-la;
      return String(dueValid(a)||'9999').localeCompare(String(dueValid(b)||'9999'));
    });
  }else{
    r.sort((a,b)=>String(b.createdOn||'').localeCompare(String(a.createdOn||'')) || String(a.no).localeCompare(String(b.no)));
  }
  return r;
}

function exportTasksCsv(){
  const rows=visibleTasks();
  const line=a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';');
  const head=['Č.','Oblast','Stroj','Typ','Zadáno','Zadal','Task','Očekávaný výstup – důkaz','Owner',
    'Termín původní','Posun 1','Posun 2','Posun 3','Platný termín','Posunů','Stav','Po termínu (dní)','Uzavřeno'];
  const csv=[line(head)].concat(rows.map(t=>{
    const m=(t.moves||[]).map(x=>x.date);
    return line([t.no,t.area,t.machine||'',t.type,t.createdOn,t.createdBy,t.task,t.output,ownersLabel(t),t.dueOrig,
      m[0]||'',m[1]||'',m[2]||'',dueValid(t),moveCount(t),t.status,taskLate(t)?lateDays(t):'',t.closedOn||'']);
  })).join('\n');
  const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='akcni_plan_'+today()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function dashView(){
  if(!days.length) return dashSubtabs()+emptyView();

  const segs=top(t.segs,12).map(x=>Object.assign({},x,{drill:'seg:'+x.label}));
  const groups=top(t.groups).map(x=>Object.assign({},x,{drill:'group:'+x.label}));
  const unk=Object.values(t.groups||{}).find(g=>g.label===UNKNOWN);
  const unkPct = t.sec ? Math.round((unk?unk.sec:0)/t.sec*100) : 0;
  const coAvg = t.co.cnt ? Math.round(t.co.sec/t.co.cnt/60) : 0;
  const worst = segs[0];
  const n=days.length;
  if(proc && !t.sec){
    return dashSubtabs()+`<div class="panel"><div class="body" style="text-align:center;padding:30px 18px">

    </div></div>`;
  }
  return dashSubtabs()+
  (t.noSplit?`<div class="notice warn">Část dat (${fmtDur(t.noSplit)}) je ze staršího importu, který ještě neukládal rozpad
    důvodů po linkách — v grafech „Podle důvodu", „Podle směny" a „TOP 10 důvodů" tahle část chybí.
    Stačí ten report nahrát znovu.</div>`:'')+`
  <div class="cards">
    <div class="kcard" style="border-left-color:#1b4b8f">
      <div class="lbl">Prostoje celkem</div>
      <div class="val">${num(t.sec/3600,0)}<small> h</small></div>
      <div class="note">${t.cnt.toLocaleString('cs-CZ')} událostí ${
        String(range).startsWith('m') ? '· '+rangeBounds().label+' ('+n+' '+(n===1?'den':(n<5?'dny':'dní'))+' s daty)'

    </div>
    <div class="kcard" style="border-left-color:${unkPct>10?'#c0392b':'#6b7a90'}">

/* Prostoje po filtrech a v pořadí, které si David naklikal ve hlavičce tabulky. */
function visibleEvents(){
  let r=events.slice();
  if(f.proc) r=r.filter(x=>procOfLine(x.seg)===f.proc);
  if(f.seg) r=r.filter(x=>x.seg===f.seg);
  if(f.group) r=r.filter(x=>(x.group||'')===f.group);
  if(f.reason) r=r.filter(x=>(x.reason||'')===f.reason);
  if(f.shift) r=r.filter(x=>x.shift===f.shift);
  if(f.q){ const q=f.q.toLowerCase(); r=r.filter(x=>[x.seg,x.reason,x.comment].join(' ').toLowerCase().includes(q)); }
  const col=EV_COLS.find(c=>c.k===evSort.k) || EV_COLS[0];
  const sign=evSort.dir==='desc'?-1:1;
  return r.sort((a,b)=>{
    const x=col.get(a), y=col.get(b);
    let d = col.num===true && typeof x==='number' ? x-y : String(x).localeCompare(String(y),'cs',{numeric:true});
    if(d===0) d = String(b.start||'').localeCompare(String(a.start||''));   // stejné hodnoty: novější napřed
    else d*=sign;
    return d;
  });
}
/* ==========================================================
   GENEROVAT PARETO
   Vyber si linky, období a typy prostojů a vypadne Paretův graf.
   Rozpad umí tři úrovně: skupina důvodu, konkrétní důvod ze Symesticu
   a — to je ta zajímavá — shluky podle poznámek, aby se opakující
   „metalbolty" sečetly do jednoho sloupce.
   ========================================================== */
const PAR_PERIODS = [
  {k:'thisweek',  t:'Tento týden'},
  {k:'lastweek',  t:'Minulý týden'},
  {k:'thismonth', t:'Tento měsíc'},
  {k:'lastmonth', t:'Minulý měsíc'},
  {k:'custom',    t:'Vlastní období'}
];
const PAR_DIMS = [
  {k:'group',   t:'Skupina důvodu',  d:'Porucha stroje, Přestavba a seřízení…'},
  {k:'reason',  t:'Konkrétní důvod', d:'kódy tak, jak chodí ze Symesticu'},
  {k:'comment', t:'Poznámky ve shlucích', d:'opakující se slova z poznámek se sečtou'}
];
let par = {lines:[], period:'lastweek', from:'', to:'', groups:[], dim:'group',
           rows:[], loaded:false, key:'', busy:'', err:'', sel:null,
           pick:'', q:''};

/* pondělí daného týdne, posun o n týdnů zpět */
function parWeekBounds(back){
  const d=new Date(); const day=(d.getDay()||7);
  d.setDate(d.getDate()-day+1-7*(back||0));
  const mon=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const iso=x=>`${x.getFullYear()}-${pad2(x.getMonth()+1)}-${pad2(x.getDate())}`;
  return {from:iso(mon), to:iso(sun)};
}
function parMonthBounds(back){
  const n=new Date(), d=new Date(n.getFullYear(), n.getMonth()-(back||0), 1);
  const last=new Date(d.getFullYear(), d.getMonth()+1, 0);
  const iso=x=>`${x.getFullYear()}-${pad2(x.getMonth()+1)}-${pad2(x.getDate())}`;
  return {from:iso(d), to:iso(last), month:`${d.getFullYear()}-${pad2(d.getMonth()+1)}`};
}
function parBounds(){
  if(par.period==='thisweek'){  const b=parWeekBounds(0);  return {...b, label:'tento týden ('+dayCz(b.from)+' – '+dayCz(b.to)+')'}; }
  if(par.period==='lastweek'){  const b=parWeekBounds(1);  return {...b, label:'minulý týden ('+dayCz(b.from)+' – '+dayCz(b.to)+')'}; }
  if(par.period==='thismonth'){ const b=parMonthBounds(0); return {from:b.from,to:b.to, label:monthCz(b.month)}; }
  if(par.period==='lastmonth'){ const b=parMonthBounds(1); return {from:b.from,to:b.to, label:monthCz(b.month)}; }
  const from=par.from||today(), to=par.to||today();
  return {from, to, label:dayCz(from)+' – '+dayCz(to)};
}
/* Nabídka linek — co opravdu přišlo z importu, doplněné o stroje z nastavení. */
function parAllLines(){
  const set=new Set();
  mgDays.forEach(d=>Object.values(d.segs||{}).forEach(v=>v.label&&set.add(v.label)));
  Object.values(engcfg.machines||{}).forEach(arr=>(arr||[]).forEach(m=>m&&set.add(m)));
  return [...set].sort((a,b)=>a.localeCompare(b,'cs'));
}
const PAR_GROUPS = ENG_GROUPS.map(g=>g.g).concat([UNKNOWN]);

async function parGenerate(){
  const b=parBounds();
  if(b.from>b.to){ par.err='Datum „od" je až za datem „do".'; render(); return; }
  par.busy='Načítám prostoje…'; par.err=''; par.sel=null; render();
  try{
    const qs=await getDocs(query(collection(db,'downtimes'),
      where('date','>=',b.from), where('date','<=',b.to), orderBy('date','desc'), limit(6000)));
    par.rows=qs.docs.map(d=>Object.assign({_id:d.id}, d.data()));
    par.more=qs.docs.length>=6000;
    par.loaded=true; par.key=b.from+'…'+b.to;
  }catch(e){ par.err=ruleHint(e); }
  par.busy=''; render();
}
/* Co z načtených prostojů projde výběrem linek a typů. */
function parFiltered(){
  let r=par.rows.slice();
  if(par.lines.length) r=r.filter(x=>par.lines.includes(x.seg));
  if(par.groups.length) r=r.filter(x=>par.groups.includes(x.group||engGroup(x.reason)));
  return r;
}

/* ---------- shlukování poznámek ----------
   Poznámky píšou lidi volně, takže se nedají srovnat na přesnou shodu.
   Postup: poznámku zbavíme diakritiky a interpunkce, slova zkrátíme na kmen
   (metalbolty / metalboltu / metalbolt → metalb) a hledáme slova a dvojice
   slov, které se opakují. Každý prostoj se přiřadí k tomu nejsilnějšímu
   výrazu, který obsahuje. Co nikam nepasuje, spadne do „Ostatní".        */
const PAR_STOP = new Set(('a i v k o u s z na se je po do za od to the of and or pro byl byla bylo byly kvuli pri pred nebo ale jen uz tak co ze si ke ku bez pod nad mezi pak asi moc vic min hod hodin hodiny minut minuty cca atd apod ale tam tady ted zase znovu nove novy nova stara stary vse vsechno nic neni bylo jsme jsem bylo mel mela melo musel museli nutne potreba treba prostoj prostoje stroj stroje linka linky smena smeny').split(' '));
const parNorm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-z0-9]+/g,' ').trim();
const parStem = w => w.length<=5 ? w : w.slice(0,6);
function parTokens(txt){
  const words=parNorm(txt).split(' ').filter(w=>w.length>=3 && !PAR_STOP.has(w) && !/^\d+$/.test(w));
  const out=[];
  words.forEach((w,i)=>{
    out.push({key:parStem(w), surf:w});
    if(i+1<words.length) out.push({key:parStem(w)+' '+parStem(words[i+1]), surf:w+' '+words[i+1]});
  });
  return out;
}
function clusterComments(rows){
  const terms=new Map();       // kmen -> {sec, idx:Set, surf:Map}
  rows.forEach((r,i)=>{
    const seen=new Set();
    for(const t of parTokens(r.comment)){
      if(seen.has(t.key)) continue; seen.add(t.key);
      const o=terms.get(t.key)||{sec:0,cnt:0,idx:new Set(),surf:new Map()};
      o.sec+=Number(r.sec)||0; o.cnt++; o.idx.add(i);
      o.surf.set(t.surf,(o.surf.get(t.surf)||0)+1);
      terms.set(t.key,o);
    }
  });
  /* dvojice slov popisují problém líp než jedno slovo — malá výhoda */
  const cand=[...terms.entries()].map(([k,o])=>({k,o,w:o.sec*(k.includes(' ')?1.35:1)}))
    .sort((a,b)=>b.w-a.w);
  const taken=new Set(), out=[];
  for(const c of cand){
    const mine=[...c.o.idx].filter(i=>!taken.has(i));
    if(mine.length<2) continue;                       // shluk dává smysl od dvou výskytů
    mine.forEach(i=>taken.add(i));
    const label=[...c.o.surf.entries()].sort((a,b)=>b[1]-a[1])[0][0];
    out.push({label:label.charAt(0).toUpperCase()+label.slice(1),
      sec:mine.reduce((a,i)=>a+(Number(rows[i].sec)||0),0), cnt:mine.length, items:mine.map(i=>rows[i])});
  }
  const rest=rows.map((r,i)=>i).filter(i=>!taken.has(i));
  const empty=rest.filter(i=>!parNorm(rows[i].comment));
  const single=rest.filter(i=>parNorm(rows[i].comment));
  if(single.length) out.push({label:'Ostatní (jednotlivé případy)', other:true,
    sec:single.reduce((a,i)=>a+(Number(rows[i].sec)||0),0), cnt:single.length, items:single.map(i=>rows[i])});
  if(empty.length) out.push({label:'Bez poznámky', other:true,
    sec:empty.reduce((a,i)=>a+(Number(rows[i].sec)||0),0), cnt:empty.length, items:empty.map(i=>rows[i])});
  return out.sort((a,b)=>b.sec-a.sec);
}
/* Položky Paretova grafu podle zvoleného rozpadu. */
function parItems(){
  const rows=parFiltered();
  if(par.dim==='comment') return clusterComments(rows);
  const key = par.dim==='reason' ? (r=>r.reason||'—') : (r=>r.group||engGroup(r.reason));
  const m=new Map();
  for(const r of rows){
    const k=key(r), o=m.get(k)||{label:k, sec:0, cnt:0, items:[]};
    o.sec+=Number(r.sec)||0; o.cnt++; o.items.push(r); m.set(k,o);
  }
  return [...m.values()].sort((a,b)=>b.sec-a.sec);
}

/* Paretův graf: sloupce od největšího a kumulativní křivka s hranicí 80 %.
   Sloupce jdou rozkliknout — pod grafem se vypíšou jednotlivé prostoje. */
function paretoChart(items){
  const top=items.slice(0,14);
  if(!top.length) return '<div class="empty">Za zvolené období a filtr nejsou žádné prostoje.</div>';
  const total=items.reduce((a,i)=>a+i.sec,0)||1;
  const W=980, H=330, ml=58, mr=48, mt=16, mb=74;
  const iw=W-ml-mr, ih=H-mt-mb;
  const max=Math.max(...top.map(i=>i.sec))||1;
  const step=iw/top.length, bw=Math.min(62, step*0.66);
  const yh=v=>ih-(v/max)*ih;
  /* osa vlevo v hodinách */
  const ticks=4, grid=[];
  for(let i=0;i<=ticks;i++){
    const v=max/ticks*i, y=mt+yh(v);
    grid.push(`<line x1="${ml}" y1="${y.toFixed(1)}" x2="${ml+iw}" y2="${y.toFixed(1)}" stroke="#e6ebf2"/>
      <text x="${ml-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#7b8ba3">${num(v/3600,v/3600>=10?0:1)} h</text>`);
  }
  /* osa vpravo v procentech */
  for(let i=0;i<=4;i++){
    const y=mt+ih-(ih*i/4);
    grid.push(`<text x="${ml+iw+8}" y="${(y+4).toFixed(1)}" font-size="11" fill="#7b8ba3">${i*25} %</text>`);
  }
  let cum=0; const pts=[], bars=[], labs=[];
  top.forEach((it,i)=>{
    const x=ml+i*step+(step-bw)/2, h=ih-yh(it.sec), y=mt+yh(it.sec);
    const on=par.sel===i;
    bars.push(`<g class="pbar ${on?'on':''}" data-a="par-sel" data-v="${i}">
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,h).toFixed(1)}" rx="3"
        fill="${it.other?'#98a5b6':(GROUP_COLOR[it.label]||'#1b4b8f')}"/>
      <title>${esc(it.label)} — ${fmtDur(it.sec)} · ${it.cnt}×</title>
      <text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="11.5"
        font-weight="700" fill="#16233a">${fmtDur(it.sec)}</text></g>`);
    cum+=it.sec;
    pts.push([ml+i*step+step/2, mt+ih-(cum/total)*ih]);
    const short = it.label.length>16 ? it.label.slice(0,15)+'…' : it.label;
    labs.push(`<text x="${(ml+i*step+step/2).toFixed(1)}" y="${(mt+ih+16).toFixed(1)}" text-anchor="end"
      font-size="11" fill="#41506b" transform="rotate(-35 ${(ml+i*step+step/2).toFixed(1)} ${(mt+ih+16).toFixed(1)})">${esc(short)}</text>`);
  });
  const y80=mt+ih-0.8*ih;
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<div class="parchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Paretův graf prostojů">
    ${grid.join('')}
    <line x1="${ml}" y1="${y80.toFixed(1)}" x2="${ml+iw}" y2="${y80.toFixed(1)}" stroke="#c0392b" stroke-dasharray="6 4"/>
    <text x="${ml+iw-2}" y="${(y80-6).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#c0392b" font-weight="700">80 %</text>
    ${bars.join('')}
    <path d="${line}" fill="none" stroke="#0d7377" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#fff" stroke="#0d7377" stroke-width="2">
      <title>kumulativně ${num((top.slice(0,i+1).reduce((a,x)=>a+x.sec,0))/total*100,1)} %</title></circle>`).join('')}
    <line x1="${ml}" y1="${(mt+ih).toFixed(1)}" x2="${ml+iw}" y2="${(mt+ih).toFixed(1)}" stroke="#b9c8da"/>
    ${labs.join('')}
  </svg></div>
  ${items.length>14?`<div class="muted" style="font-size:11.5px;padding:0 4px 6px">V grafu je 14 největších položek z ${items.length}. Zbytek je v tabulce pod ním.</div>`:''}`;
}

/* Export jen toho, co je rozkliknuté v okně. */
function parExportDetail(){
  const items=parItems(), it=items[par.sel]; if(!it) return;
  const rows=it.items.slice().sort((x,y)=>(Number(y.sec)||0)-(Number(x.sec)||0));
  const line=a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';');
  const csv=[line(['Datum','Směna','Linka','Od','Do','Trvání (min)','Skupina','Důvod','Poznámka'])]
    .concat(rows.map(e=>line([e.date,e.shift,e.seg,String(e.start).slice(11,19),
      e.end?String(e.end).slice(11,19):'',Math.round((e.sec||0)/60),
      e.group||engGroup(e.reason),e.reason,e.comment]))).join('\n');
  const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url;
  a.download='pareto_'+slug(it.label)+'_'+today()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function parExportCsv(){
  const items=parItems(), total=items.reduce((a,i)=>a+i.sec,0)||1;
  const line=a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';');
  let c=0;
  const csv=[line(['#','Položka','Čas (min)','Případů','Podíl %','Kumulativně %'])]
    .concat(items.map((it,i)=>{ c+=it.sec;
      return line([i+1,it.label,Math.round(it.sec/60),it.cnt,(it.sec/total*100).toFixed(1),(c/total*100).toFixed(1)]); })).join('\n');
  const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='pareto_'+today()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

  if(s.step===3){

    body=`<div class="body" style="text-align:center;padding:30px 18px">

        : `Uloženo <b>${(d.rows||0).toLocaleString('cs-CZ')}</b> prostojů za ${d.days} dní (${dayCz(d.from||'')} – ${dayCz(d.to||'')}).`}</div>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        ${s.kind==='tasks'

          ? `<a class="btn-primary" style="display:inline-block;padding:8px 14px;border-radius:var(--radius);text-decoration:none;font-size:12px;font-weight:600" href="${SCRAP_URL}">Otevřít Quality loss report ↗</a>`
          : `<button class="btn-primary" data-a="tab" data-v="dash">Zobrazit přehled</button>`}
        <button class="btn-ghost" data-a="imp-reset">Importovat další soubor</button>
      </div>
    </div>`;
  }
  const stepsHtml = `<ul class="steps">${[['1','Vybrat a nahrát'],['2','Kontrola'],['3','Hotovo']].map(([n,t],i)=>{
    const idx=i+1; return `<li class="${idx===s.step?'on':''} ${idx<s.step?'done':''}"><b>${idx<s.step?'✓':n}</b>${t}</li>`;}).join('')}</ul>`;
  return stepsHtml + `
  <div class="panel"><h2>Import — ${s.kind==='scrap'?'scrap':(s.kind==='tasks'?'akční plán':(s.src==='g463'?'prostoje z G463':'prostoje'))}<span class="right">krok ${s.step} ze 3</span></h2>${body}</div>
  <div class="panel">
    <h2>Historie importů</h2>
    <div class="tblwrap"><table>
      <thead><tr><th>Kdy</th><th>Co</th><th>Kdo</th><th>Soubor</th><th>Řádků</th><th>Období</th></tr></thead>
      <tbody>${history.map(h=>`<tr>
        <td data-label="Kdy">${esc(String(h.at||'').slice(0,16).replace('T',' '))}</td>
        <td data-label="Co"><span class="badge ${h.kind==='scrap'?'b-red':'b-teal'}">${h.kind==='scrap'?'scrap':'prostoje'}</span></td>
        <td data-label="Kdo">${esc(h.byName||'')}</td>
        <td data-label="Soubor" class="desc">${esc(h.file||'')}</td>
        <td data-label="Řádků" class="num">${(h.rows||0).toLocaleString('cs-CZ')}</td>
        <td data-label="Období">${h.kind==='scrap'?monthCz(h.from||'')+' – '+monthCz(h.to||''):dayCz(h.from||'')+' – '+dayCz(h.to||'')}</td>
      </tr>`).join('') || `<tr><td colspan="6" class="empty">Zatím žádný import.</td></tr>`}
      </tbody></table></div>
  </div>`;
}

function exportCsv(){
  const r=visibleEvents();
  const line=a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';');
  const csv=[line(['Datum','Směna','Linka','Začátek','Konec','Trvání (min)','Netto (min)','Skupina','Důvod','Poznámka'])]
    .concat(r.map(e=>line([e.date,e.shift,e.seg,String(e.start).slice(11,19),e.end?String(e.end).slice(11,19):'',
      Math.round(e.sec/60),Math.round((e.net||e.sec)/60),e.group,e.reason,e.comment||'']))).join('\n');
  const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='prostoje_'+today()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

/* ===== ovládání ===== */
function bind(){
  const lf=document.getElementById('loginForm');
  if(lf) lf.onsubmit=async e=>{
    e.preventDefault();
    const email=document.getElementById('li-email').value.trim();
    const pass=document.getElementById('li-pass').value;
    loginBusy=true; loginErr=''; render();
    try{ await signInWithEmailAndPassword(auth,email,pass); }
    catch(err){ loginBusy=false; loginErr=loginErrMsg(err.code); render(); }
  };
  const lo=document.getElementById('btn-logout'); if(lo) lo.onclick=()=>signOut(auth);
  document.querySelectorAll('[data-a]').forEach(el=>{ el.onclick=ev=>{ ev.stopPropagation(); act(el.dataset.a, el.dataset.v); }; });

  document.querySelectorAll('[data-parline]').forEach(el=>{
    el.onchange=()=>{ const l=el.dataset.parline;
      par.lines = el.checked ? [...new Set(par.lines.concat(l))] : par.lines.filter(x=>x!==l);
      render(); };
  });
  document.querySelectorAll('[data-pargrp]').forEach(el=>{
    el.onchange=()=>{ const g=el.dataset.pargrp;
      par.groups = el.checked ? [...new Set(par.groups.concat(g))] : par.groups.filter(x=>x!==g);
      render(); };
  });
  const parq=document.getElementById('par-q');
  if(parq) parq.oninput=()=>{ par.q=parq.value; const c=parq.selectionStart; render();
    const n=document.getElementById('par-q'); if(n){ n.focus(); n.setSelectionRange(c,c); } };
  const pdim=document.getElementById('par-dim');
  if(pdim) pdim.onchange=()=>{ par.dim=pdim.value; par.sel=null; render(); };
  [['par-from','from'],['par-to','to']].forEach(([id,k])=>{
    const el=document.getElementById(id); if(el) el.onchange=()=>{ par[k]=el.value; render(); };
  });

  const q=document.getElementById('f-q');
  if(q) q.oninput=()=>{ f.q=q.value; const p=q.selectionStart; render();
    const n=document.getElementById('f-q'); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  [['f-seg','seg'],['f-group','group'],['f-shift','shift'],['f-reason','reason'],['f-proc','proc']].forEach(([id,k])=>{
    const el=document.getElementById(id); if(el) el.onchange=()=>{ f[k]=el.value; render(); };
  });

  document.querySelectorAll('[data-map]').forEach(el=>{
    el.onchange=()=>{ const k=el.dataset.map;
      if(el.value==='') delete imp.map[k]; else imp.map[k]=Number(el.value);
      reparseScrap(); render(); };
  });
  const mo=document.getElementById('imp-month');
  if(mo) mo.onchange=()=>{ imp.month=mo.value; reparseScrap(); render(); };

  const pq=document.getElementById('ps-q');
  if(pq) pq.oninput=()=>{ psF.q=pq.value; const pos=pq.selectionStart; render();
    const n=document.getElementById('ps-q'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } };
  [['ps-fline','line'],['ps-fowner','owner'],['ps-fstatus','status']].forEach(([id,k])=>{
    const el=document.getElementById(id); if(el) el.onchange=()=>{ psF[k]=el.value; render(); };
  });
  const ph=document.getElementById('ps-hide');
  if(ph) ph.onchange=()=>{ psHideClosed=ph.checked; render(); };

  const tq=document.getElementById('tk-q');
  if(tq) tq.oninput=()=>{ tF.q=tq.value; const pos=tq.selectionStart; render();
    const n=document.getElementById('tk-q'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } };
  [['tk-farea','area'],['tk-fowner','owner'],['tk-fstatus','status'],['tk-ftype','type']].forEach(([id,k])=>{
    const el=document.getElementById(id); if(el) el.onchange=()=>{ tF[k]=el.value; render(); };
  });
  const th=document.getElementById('tk-hide');
  if(th) th.onchange=()=>{ tHideClosed=th.checked; render(); };
  const oq=document.getElementById('tk-ownq');
  if(oq){
    oq.oninput=()=>{ ownQ=oq.value; collectTask(); render();
      const n=document.getElementById('tk-ownq'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } };
    oq.onkeydown=e=>{
      if(e.key==='Escape'){ e.stopPropagation(); ownQ=''; collectTask(); render(); }
      if(e.key==='Enter'){                       // Enter vezme první návrh
        e.preventDefault();
        const first=document.querySelector('.osug');
        if(first) first.click();
      }
    };
  }
  const tka=document.getElementById('tk-area');
  if(tka) tka.onchange=()=>{ collectTask(); render(); };   // ať se přenačtou stroje k oblasti
  ['ps-file','ps-cam'].forEach(id=>{ const el=document.getElementById(id);
    if(el) el.onchange=()=>{ if(el.files&&el.files.length) handlePsFiles(el.files); }; });
  const pdz=document.getElementById('ps-drop');
  if(pdz){
    ['dragenter','dragover'].forEach(ev=>pdz.addEventListener(ev,e=>{e.preventDefault();pdz.classList.add('hot');}));
    ['dragleave','drop'].forEach(ev=>pdz.addEventListener(ev,e=>{e.preventDefault();pdz.classList.remove('hot');}));
    pdz.addEventListener('drop',e=>{ if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length) handlePsFiles(e.dataTransfer.files); });
  }
  const tfi=document.getElementById('tk-file');
  if(tfi) tfi.onchange=()=>{ if(tfi.files&&tfi.files.length) handleTaskFiles(tfi.files); };
  const tdz=document.getElementById('tk-drop');
  if(tdz){
    ['dragenter','dragover'].forEach(ev=>tdz.addEventListener(ev,e=>{e.preventDefault();tdz.classList.add('hot');}));
    ['dragleave','drop'].forEach(ev=>tdz.addEventListener(ev,e=>{e.preventDefault();tdz.classList.remove('hot');}));
    tdz.addEventListener('drop',e=>{ if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length) handleTaskFiles(e.dataTransfer.files); });
  }

  const mo2=document.getElementById('mg-owner');
  if(mo2) mo2.onchange=()=>{ mgOwner=mo2.value; render(); };
  const oo=document.getElementById('mg-onlyopen');
  if(oo) oo.onchange=()=>{ mgOnlyOpen=oo.checked; render(); };
  const ovl=document.getElementById('ovl');
  if(ovl) ovl.onclick=e=>{ if(e.target.id==='ovl'){ collectPsNew(); openPs=null; psMsg=''; openTask=null; tMsg=''; psNew=null; render(); } };

  const fi=document.getElementById('file');
  if(fi) fi.onchange=()=>{ if(fi.files&&fi.files[0]) takeFile(fi.files[0]); };
  const dz=document.getElementById('drop');
  if(dz){
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('hot');}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('hot');}));
    dz.addEventListener('drop',e=>{ const file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(file) takeFile(file); });
  }
}
async function act(a,v){
  collectPsNew();
  switch(a){
    case 'tab':
      engTab=v;
      if(v==='list') loadEvents();
      if(v==='mgmt') loadMgmt();
      if(v==='ps') loadMgmt();
      if(v==='tasks') loadTasks();
      if(v==='scrap'){ location.href=SCRAP_URL; return; }
      if(v==='dash') loadDays();
      if(v==='par') loadMgmt();
      if(v==='imp' && imp.step===3) imp=newImp(imp.kind);
      break;
    case 'range':
      range=String(v||'7'); loaded=false; evLoaded='';
      loadDays(true); if(engTab==='list') loadEvents();
      break;
    case 'reload':
      loaded=false; evLoaded=''; scLoaded=false; mgLoaded=false; tLoaded=false;
      if(engTab==='mgmt'||engTab==='ps') loadMgmt(true);
      if(engTab==='tasks') loadTasks(true);
      loadDays(true); if(engTab==='list') loadEvents();
      break;
    /* ----- akční plán ----- */
    case 'tk-ownadd':{ collectTask(); const o=openTask&&taskOwners(openTask);
      if(o && !o.includes(v)) openTask.owners=o.concat(v);
      ownQ=''; break; }
    case 'tk-ownrm':{ collectTask();
      if(openTask) openTask.owners=taskOwners(openTask).filter(x=>x!==v);
      break; }
    case 'tk-new': openTask=emptyTask(); pendingTaskFiles=[]; moveDraft={date:'',why:''}; ownQ=''; tMsg=''; break;
    case 'tk-open': if(openPs) collectPs();
      openTask=JSON.parse(JSON.stringify(tasks.find(x=>x._id===v)||{})); moveDraft={date:'',why:''}; ownQ=''; tMsg=''; break;
    case 'tk-close': openTask=null; pendingTaskFiles=[]; moveDraft={date:'',why:''}; ownQ=''; tMsg=''; break;
    case 'tk-del': await deleteTask(v); return;
    case 'tk-save': await saveTask(); return;
    case 'tk-addmove': await addMove(); return;
    case 'tk-delfile': await removeTaskFile(Number(v)); return;
    case 'tk-review': tSort = tSort==='review'?'new':'review'; break;
    case 'tk-all': tF={area:'',owner:'',status:'',type:'',q:''}; tHideClosed=false; break;
    case 'tk-export': exportTasksCsv(); return;
    case 'ps-export': exportPsCsv(); return;

    /* ----- řízení výkonu ----- */
    case 'mg-week': mgWeek=v; break;
    /* Vybraný týden v dlaždicích posune i tabulku výkonu linek pod nimi,
       ať na stránce nesvítí dva různé týdny. */
    case 'tile-wk': tileWk=v||''; if(v) mgWeek=v; break;
    case 'dash-proc': dashProc=v||''; break;
    /* ----- generovat pareto ----- */
    case 'par-pick':      par.pick=v; par.q=''; break;
    case 'par-pickclose': par.pick=''; par.q=''; break;
    case 'par-period':    par.period=v; if(v==='custom'&&!par.from){ const b=parBounds(); par.from=b.from; par.to=b.to; } break;
    case 'par-lines-all': par.lines=parAllLines(); break;
    case 'par-lines-none':par.lines=[]; break;
    case 'par-proc-all':{ const add=parAllLines().filter(l=>procOfLine(l)===v);
      const has=add.every(l=>par.lines.includes(l));
      par.lines = has ? par.lines.filter(l=>!add.includes(l)) : [...new Set(par.lines.concat(add))];
      break; }
    case 'par-grp-all':   par.groups=PAR_GROUPS.slice(); break;
    case 'par-grp-none':  par.groups=[]; break;
    case 'par-sel':       par.sel=Number(v); break;
    case 'par-close':     par.sel=null; break;
    case 'par-export-one': parExportDetail(); return;
    case 'par-export':    parExportCsv(); return;
    case 'par-run':       await parGenerate(); return;
    /* Proklik z grafu v KPI do Prostojů — stejné období, jen zúžené na to,
       na co jsem klikl. Ostatní filtry se přitom vynulují. */
    case 'kpi-drill':{
      const i=String(v).indexOf(':'), kind=String(v).slice(0,i), val=String(v).slice(i+1);
      f={seg:'', group:'', shift:'', reason:'', proc:dashProc||'', q:''};
      if(kind==='seg'){ f.seg=val; f.proc=''; }      // konkrétní linka proces nepotřebuje
      else if(kind==='group')  f.group=val;
      else if(kind==='shift')  f.shift=val;
      else if(kind==='reason') f.reason=val;
      drillFrom=dashProc||''; engTab='list'; loadEvents();
      break; }
    case 'drill-back': engTab='dash'; dashProc=drillFrom||''; break;
    case 'drill-clear': f={seg:'',group:'',shift:'',reason:'',proc:'',q:''}; break;
    /* Klik na sloupec: nový sloupec začne od největšího (u textu od A),
       další klik na ten samý pořadí otočí. */
    case 'ev-sort':{
      const col=EV_COLS.find(c=>c.k===v); if(!col) break;
      evSort = evSort.k===v
        ? {k:v, dir: evSort.dir==='desc'?'asc':'desc'}
        : {k:v, dir: col.num?'desc':'asc'};
      break; }
    case 'proc-kpi': dashProc=v||''; engTab='dash'; loadDays(); break;
    case 'mg-open': openPs=v; psMsg=''; await loadTasks(); break;
    case 'ps-newtask':{
      collectPs();
      const p=problems.find(x=>x._id===openPs); if(!p) break;
      openTask=Object.assign(emptyTask(), {psId:p._id, psNo:p.no,
        area:areaForLine(p.line), machine:p.line||'',
        output:'Problém se neopakuje, výkon linky zpět nad '+(engcfg.threshold||90)+' %.'});
      pendingTaskFiles=[]; moveDraft={date:'',why:''}; ownQ=''; tMsg='';
      break; }
    case 'mg-close': openPs=null; psMsg=''; break;
    case 'mg-save': await saveProblem(); break;
    case 'mg-addaction': await addAction(); return;
    case 'mg-adone': await setActionStatus(v,'hotová'); return;
    case 'mg-escalate': await toggleEscalation(v); return;
    case 'mg-del': await deleteProblem(v); return;
    case 'ps-delfile': await removePsFile(Number(v)); return;
    case 'ps-submit':  await submitPsForApproval(); return;
    case 'ps-approve': await approvePs(); return;
    case 'ps-reject':  await rejectPs(); return;
    case 'ps-new':
      psNew={line:'', week:isoWeekOf(today()), trigger:PS_TRIGGERS[0], title:'', err:''};
      await loadTasks();
      break;
    case 'ps-newclose': psNew=null; break;
    case 'ps-newgo':{
      const d=psNew; if(!d) break;
      if(!d.line){ d.err='Napiš, o kterou linku nebo stroj jde.'; break; }
      if(!d.title){ d.err='Napiš krátký popis problému.'; break; }
      d.err='';
      const wk=d.week||isoWeekOf(today());
      const known=psLineOpts().find(l=>l.label.toLowerCase()===d.line.toLowerCase());
      const label=known?known.label:d.line, sl=known?known.slug:slug(d.line);
      /* když o té lince máme data za vybraný týden, vezmi z nich výkon a prostoj */
      const w=weeklyPerf(mgDays, engcfg)[wk];
      const found=w && Object.values(w.lines).find(l=>l.slug===sl);
      const line=found || {label, slug:sl, perf:null, sec:0};
      psNew=null;
      await createProblem(wk, line, d.trigger, {title:d.title});
      return;
    }
    case 'mg-create':{
      const [wk,slug]=String(v).split('|');
      const weeks=weeklyPerf(mgDays, engcfg);
      const line=(weeks[wk]&&weeks[wk].lines[slug]);
      if(!line) return;
      const u=underThreshold(weeks,wk,engcfg).find(x=>x.slug===slug);
      await createProblem(wk, line, u&&u.repeated?'opakovaný problém':'výkon pod prahem');
      return;
    }
    case 'mg-createall':{
      const weeks=weeklyPerf(mgDays, engcfg);
      const miss=underThreshold(weeks,v,engcfg).filter(l=>!problemFor(v,l.slug));
      for(const l of miss) await createProblem(v, l, l.repeated?'opakovaný problém':'výkon pod prahem');
      openPs=null; render(); return;
    }
    case 'imp-reset': imp=newImp(imp.kind); break;
    case 'imp-kind': imp=newImp(v==='scrap' && !canImport() ? 'dt' : v); break;
    case 'imp-run':
      if(!canImportDt()) return;
      if(imp.kind==='scrap' && !canImport()){ toast('Scrap nahrává správce.','err'); return; }
      imp.err=''; imp.prog='Připravuji zápis…'; render();
      await runImport();
      break;
    case 'export': exportCsv(); return;
  }
  render();
}
function loginErrMsg(code){
  const m={'auth/invalid-email':'Neplatný e-mail.','auth/user-not-found':'Účet neexistuje.',
    'auth/wrong-password':'Nesprávné heslo.','auth/invalid-credential':'Nesprávný e-mail nebo heslo.',
    'auth/too-many-requests':'Příliš mnoho pokusů, zkuste to za chvíli.',
    'auth/operation-not-allowed':'Přihlašování e-mailem není ve Firebase zapnuté.'};
  return m[code]||('Přihlášení se nezdařilo ('+code+').');
}

/* Klik mimo našeptávač ownerů ho zavře, ať nepřekrývá políčka pod sebou. */
document.addEventListener('mousedown', e=>{
  if(!ownQ) return;
  if(e.target.closest && e.target.closest('.ownerpick')) return;
  ownQ=''; collectTask(); render();
});

render();
</script>
<script src="header.js"></script>
