<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20100%20100%27%3E%3Crect%20width=%27100%27%20height=%27100%27%20rx=%2722%27%20fill=%27%231b4b8f%27/%3E%3Ctext%20x=%2750%27%20y=%2776%27%20font-size=%2774%27%20font-family=%27Arial,sans-serif%27%20font-weight=%27bold%27%20fill=%27white%27%20text-anchor=%27middle%27%3Em%3C/text%3E%3C/svg%3E">
<title>Shopfloor walk — YFAI minimo</title>
<link rel="stylesheet" href="header.css">
<style>
  :root{--navy-1:#0f2f5f;--navy-2:#1b4b8f;--bg:#f4f6f9;--card:#fff;--line:#dde4ec;--text:#16233a;--muted:#6b7a90;
    --green:#1f9254;--red:#c0392b;--amber:#b7791f;--blue:#2563a8;
    --teal:#0d7377;--teal-bg:#e4f2f2;--teal-dark:#0a5b5e;--radius:6px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px}
  button{font-family:inherit;font-size:12px;cursor:pointer;border-radius:var(--radius);border:1px solid transparent;padding:7px 12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
    border-radius:var(--radius);background:#fff;color:var(--text);width:100%}
  textarea{resize:vertical}
  input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid #2a5ea3;outline-offset:1px}
  main{padding:14px 16px 40px}
  .btn-primary{background:var(--navy-2);color:#fff}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:#41506b}
  .btn-ok{background:var(--green);color:#fff}
  .btn-teal{background:var(--teal);color:#fff;font-weight:700}
  .btn-del{background:#fff;border:1px solid #e3b7b1;color:var(--red);font-weight:600}
  .btn-del:hover{background:var(--red);border-color:var(--red);color:#fff}
  .muted{color:var(--muted)}
  .num{text-align:right;font-variant-numeric:tabular-nums}

  .notice{background:#eef4fc;border:1px solid #cfe0f5;color:#274a74;border-radius:8px;padding:10px 13px;margin-bottom:12px;font-size:12.5px}
  .notice.warn{background:#fdf3e2;border-color:#f2dfb8;color:#7a5410}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
  .panel>h2{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;margin:0;padding:11px 15px;
    font-size:14px;display:flex;align-items:center;gap:10px}
  .panel>h2 .right{margin-left:auto;font-weight:500;font-size:11px;opacity:.85}
  .panel .body{padding:13px}
  .empty{padding:26px;text-align:center;color:var(--muted)}

  .tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .tab{background:#fff;color:var(--navy-1);border:1.5px solid #c8d6e8;border-radius:9px;
    font-size:14px;font-weight:700;padding:11px 20px;box-shadow:0 1px 2px rgba(15,47,95,.06);
    transition:background .12s,border-color .12s,color .12s,transform .12s}
  .tab:hover{background:var(--teal-bg);border-color:var(--teal);color:var(--teal-dark);transform:translateY(-1px)}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal-dark);box-shadow:0 2px 6px rgba(13,115,119,.35);transform:none}
  .tabs .sp{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin-bottom:14px}
  .kcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy-2);border-radius:var(--radius);padding:11px 13px}
  .kcard .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
  .kcard .val{font-size:23px;font-weight:800;margin:3px 0 1px}
  .kcard .note{font-size:11px;color:var(--muted)}

  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid transparent;white-space:nowrap}
  .b-grey{background:#eef1f5;color:#4a5a70;border-color:#dfe4ea}
  .b-teal{background:var(--teal-bg);color:var(--teal-dark);border-color:#bfdedd}
  .b-green{background:#e8f6ee;color:var(--green);border-color:#c4e6d3}
  .b-red{background:#fdecea;color:var(--red);border-color:#f5cfca}
  .b-amber{background:#fdf6e6;color:var(--amber);border-color:#f0e0b8}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);background:#fafbfd}
  .filters input,.filters select{width:auto;min-width:150px}
  .filters .grow{flex:1 1 240px;max-width:460px}
  label.check{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;color:#41506b;white-space:nowrap;cursor:pointer;font-weight:600}
  label.check input{width:16px;height:16px;min-width:0;margin:0;flex:none}

  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{background:#16355f;color:#fff;text-align:left;padding:9px 10px;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  thead th.ycol{background:#7a6224}
  thead th.gcol{background:#41506b}
  tbody td{padding:7px 8px;border-bottom:1px solid #eef1f5;vertical-align:top}
  tbody tr:hover td{background:#fafbfd}
  tbody tr.clickable{cursor:pointer}
  tbody td.ycol{background:#fdf6e3}
  tbody td.gcol{background:#f4f6f9}
  tbody tr.late td{background:#fdecea}
  tbody tr.late td.gcol{background:#f9dcd8}
  tbody tr.closed td{background:#e8f6ee;color:#1b5e3a}
  tbody tr.closed td b{color:#1b5e3a}
  td.desc{min-width:160px;white-space:normal}
  td.nowrap{white-space:nowrap}
  .legend2{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:8px 13px;border-bottom:1px solid var(--line);
    background:#fff;font-size:11px;color:var(--muted)}
  .legend2 i{display:inline-block;width:20px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;font-style:normal}
  .clip{color:#2563a8;font-weight:700;font-size:11px}

  /* ===== Obchůzka — karty pro telefon ===== */
  .bignew{display:block;width:100%;font-size:17px;font-weight:800;padding:16px;border-radius:12px;
    background:linear-gradient(180deg,#f6821f,#e8590c);color:#fff;box-shadow:0 4px 14px rgba(232,89,12,.34);margin-bottom:14px}
  .bignew:hover{background:linear-gradient(180deg,#e8590c,#c94f0a)}
  .walkbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .wbtn{background:#fff;border:1px solid var(--line);color:#41506b;font-size:12.5px;padding:8px 14px;border-radius:20px}
  .wbtn.on{background:var(--teal);border-color:var(--teal-dark);color:#fff;font-weight:700}
  .wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .wcard{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy-2);
    border-radius:10px;padding:12px;cursor:pointer;text-align:left;width:100%;align-items:flex-start;
    box-shadow:0 1px 3px rgba(15,47,95,.06);transition:box-shadow .12s,transform .12s}
  .wcard:hover{box-shadow:0 8px 20px rgba(15,47,95,.13);transform:translateY(-1px)}
  .wcard.late{border-left-color:var(--red)}
  .wcard.done{border-left-color:var(--green);background:#f6fcf8}
  .wcard .th{flex:none;width:76px;height:76px;border-radius:8px;object-fit:cover;background:#eef1f5;
    display:flex;align-items:center;justify-content:center;font-size:26px;color:#b4c0cf}
  .wcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .wcard .hd{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
  .wcard .hd b{color:var(--navy-1);font-size:12.5px}
  .wcard .fi{font-size:14px;font-weight:700;line-height:1.35;word-break:break-word}
  .wcard .mt{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .wcard .ow{font-weight:700;color:#41506b}

  /* ===== okno nálezu ===== */
  .overlay{position:fixed;inset:0;background:rgba(12,26,48,.55);display:flex;align-items:flex-start;
    justify-content:center;padding:24px 14px;overflow:auto;z-index:60}
  .modal{background:#fff;border-radius:10px;width:100%;max-width:880px;margin:auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .modal h3{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;margin:0;padding:14px 18px;
    font-size:16px;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:10px}
  .modal h3 .x{margin-left:auto;background:transparent;border:0;color:#fff;font-size:20px;line-height:1;padding:0 4px}
  .robar{padding:9px 16px;background:#eef1f5;border-bottom:1px solid var(--line);font-size:12px;color:#41506b;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .form{padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .f{display:flex;flex-direction:column;gap:4px}
  .f label{font-size:12.5px;font-weight:700;color:#41506b}
  .f .ro{background:#fafbfd;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;min-height:35px}
  .f .ro.gcell{background:#f4f6f9}
  .f.span2{grid-column:span 2}.f.span4{grid-column:span 4}
  .sect{grid-column:span 4;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
    color:var(--teal-dark);border-bottom:2px solid var(--teal-bg);padding-bottom:5px;margin-top:6px}
  .ybox{background:#fdf6e3;border:1px solid #f0e0b8;border-radius:var(--radius);padding:9px 11px;grid-column:span 4}
  .ybox input{background:#fff}
  .addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:7px}
  .addrow>div{flex:1 1 170px;display:flex;flex-direction:column;gap:4px}
  .foot{padding:12px 13px;border-top:1px solid var(--line);background:#fafbfd;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .hist{padding:0 18px 14px;font-size:11px;color:var(--muted)}
  .hist div{padding:3px 0;border-top:1px dotted var(--line)}

  .ownerpick{position:relative}
  .ochips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .ochip{background:var(--teal-bg);border:1px solid #bfdedd;color:var(--teal-dark);border-radius:20px;
    padding:3px 6px 3px 11px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
  .ochip button{background:none;border:0;color:var(--teal-dark);font-size:12px;line-height:1;padding:0 3px;cursor:pointer;opacity:.7}
  .ochip button:hover{opacity:1}
  .osugg{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border:1px solid var(--line);
    border-radius:0 0 var(--radius) var(--radius);box-shadow:0 8px 20px rgba(16,35,58,.16);max-height:210px;overflow-y:auto}
  .osug{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #eef1f5;
    padding:8px 11px;font-size:13px;color:var(--text);border-radius:0}
  .osug:last-child{border-bottom:0}
  .osug:hover,.osug:focus{background:var(--teal-bg);color:var(--teal-dark);font-weight:700}

  /* fotky */
  .photobtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .btn-cam{display:inline-flex;align-items:center;gap:7px;background:var(--teal);color:#fff;font-weight:700;
    border-radius:var(--radius);padding:10px 15px;font-size:13.5px;cursor:pointer}
  .btn-cam:hover{background:var(--teal-dark)}
  .btn-cam input{display:none}
  .filebtn{border:1px dashed #c8d3e0;background:#fafbfd;border-radius:var(--radius);padding:10px 15px;
    font-size:13px;color:#41506b;cursor:pointer;display:inline-block}
  .filebtn input{display:none}
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:9px}
  .photo{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f4f6f9}
  .photo img{display:block;width:100%;height:104px;object-fit:cover}
  .photo .doc{display:flex;align-items:center;justify-content:center;height:104px;font-size:26px;color:#8ea0b6}
  .photo .nm{font-size:10.5px;padding:4px 6px;color:var(--muted);word-break:break-word;background:#fff}
  .photo .rm{position:absolute;top:4px;right:4px;background:rgba(192,57,43,.92);color:#fff;border:0;
    border-radius:50%;width:24px;height:24px;font-size:13px;line-height:1;padding:0}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0f2f5f,#2a5ea3);padding:16px}
  .login{background:#fff;border-radius:14px;width:340px;padding:24px;box-shadow:0 22px 55px rgba(0,0,0,.35)}
  .login h2{margin:0 0 2px;font-size:18px;text-align:center}
  .login p{font-size:11.5px;color:var(--muted);text-align:center;margin:0 0 16px}
  .login input{margin-bottom:10px}
  .login button{width:100%;padding:10px;font-size:13px;background:var(--navy-2);color:#fff;font-weight:700}
  .loginerr{background:#fdecea;border:1px solid #f5cfca;color:#c0392b;font-size:11.5px;padding:8px 10px;
    border-radius:8px;margin-bottom:10px;font-weight:600}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#16233a;color:#fff;
    padding:10px 16px;border-radius:8px;font-size:12.5px;box-shadow:0 10px 26px rgba(0,0,0,.3);z-index:90}
  .toast.ok{background:#157347}
  .toast.err{background:#c0392b}

  @media(max-width:900px){.form{grid-template-columns:repeat(2,1fr)}.f.span4,.sect,.ybox{grid-column:span 2}}
  /* Telefon: okno přes celou obrazovku, tlačítka dole po ruce, políčka nad 16 px (iOS jinak zoomuje). */
  @media(max-width:680px){
    main{padding:12px 10px 34px}
    .tab{flex:1 1 calc(50% - 4px);padding:12px 8px;font-size:13.5px}
    .tabs .sp{width:100%;margin-left:0}
    .filters{flex-direction:column;align-items:stretch}
    .filters input,.filters select,.filters .grow{width:100%;max-width:none}
    .wlist{grid-template-columns:1fr}
    .tblwrap{overflow-x:visible}
    thead{display:none}
    tbody tr{display:block;border:1px solid var(--line);border-radius:8px;margin:0 0 11px;padding:6px 12px;background:#fff}
    tbody td{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border:0;border-bottom:1px solid #eef1f5;text-align:right}
    tbody td:last-child{border-bottom:0}
    tbody td::before{content:attr(data-label);font-weight:700;color:var(--muted);text-align:left;flex:none;
      font-size:11px;text-transform:uppercase}
    tbody td.ycol,tbody td.gcol{background:none}
    tbody tr.late td{background:none}
    tbody tr.late{border-left:4px solid var(--red)}
    tbody tr.closed td{background:none}
    tbody tr.closed{border-left:4px solid var(--green)}
    .overlay{padding:0}
    .modal{border-radius:0;max-width:none;margin:0;min-height:100%}
    .modal h3{border-radius:0;position:sticky;top:0;z-index:3;padding:13px 14px;font-size:15px}
    .modal h3 .x{font-size:26px;padding:0 6px}
    .form{grid-template-columns:1fr;padding:14px}
    .f.span2,.f.span4,.sect,.ybox{grid-column:span 1}
    .addrow>div{flex:1 1 100%}
    .foot{position:sticky;bottom:0;z-index:3;box-shadow:0 -3px 10px rgba(16,35,58,.12);padding:9px 10px;gap:6px}
    .foot>span:first-child{width:100%}
    .foot>span:last-child{width:100%;display:flex;gap:6px;margin-left:0!important}
    .foot button{flex:1 1 0;min-width:0;padding:12px 6px;font-size:12.5px;white-space:nowrap}
    input,select,textarea{font-size:16px}
    .btn-cam,.filebtn{flex:1 1 100%;justify-content:center;text-align:center}
    .wide{display:none}
  }
</style>
</head>
<body>
<div id="app"><div class="login-wrap"><div class="login"><h2>Načítám…</h2><p>Připojuji se k Firebase.</p></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc,
         setDoc, query, orderBy, limit, runTransaction }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL, deleteObject }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-storage.js";

/* Společný Firebase projekt celého portálu. Veřejné frontendové klíče —
   je správné je mít v kódu, zabezpečení řeší pravidla Firestore. */
/* DOČASNĚ přepnuto na testovací projekt kvůli vývoji modulu Údržba (stejně jako ostatní moduly).
   PŘED PR DAVIDOVI VRÁTIT na nakupni-pozadavky (config viz CLAUDE.md dodatek, nebo git show upstream/main:shopfloor.html)! */
const firebaseConfig = {
  apiKey: "AIzaSyDXqMTTryH9mkgzA9o5PrndHRH4C_yUQLY",
  authDomain: "minimo-pracovni-prikazy.firebaseapp.com",
  projectId: "minimo-pracovni-prikazy",
  storageBucket: "minimo-pracovni-prikazy.firebasestorage.app",
  messagingSenderId: "727579407281",
  appId: "1:727579407281:web:fb749f43e707cf4e7ec390"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const storage = getStorage(fbApp);

/* ==========================================================
   Kdo do modulu smí
   Výchozí stav: správci podle e-mailu a PE koordinátoři smí zapisovat,
   ostatní modul vůbec nevidí. Komukoli dalšímu se přístup nastaví
   v Nastavení → uživatel → Přístup k modulům → Shopfloor walk
   (Skryté / Jen číst / Zapisovat). Ruční nastavení má vždy přednost,
   takže jde i koordinátorovi přístup odebrat.
   Stejná logika je v index.html, header.js, nastaveni.html
   a v pravidlech Firestore — když ji měníš, uprav ji všude.
   ========================================================== */
const OWNERS = ['david.varhan@yanfeng.com','varhan@minimo.yfai','varhandavid19@gmail.com'];
const SFW_POSITIONS = ['PE coordinator'];
const isOwner = e => OWNERS.includes(String(e||'').trim().toLowerCase());
const sfwAccess = u => {
  if(!u) return 'none';
  const set=(u.modules||{}).shopfloor;
  if(set==='none'||set==='read'||set==='write') return set;
  if(isOwner(u.email)) return 'write';
  if((u.positions||[]).some(p=>SFW_POSITIONS.includes(String(p).trim()))) return 'write';
  return 'none';
};
const canEnter = () => sfwAccess(me)!=='none';
const canWrite = () => sfwAccess(me)==='write';
const canDelete = () => !!me && (me.role==='admin' || isOwner(me.email));

/* ===== číselníky ===== */
const AREAS = ['IMM','Slush','Foaming / Scoring','Assembly IP','Glovebox / Decopart','G463',
               'Sklad a logistika','Údržba a dílna','Kvalita','Zázemí a okolí','Ostatní'];
const STATUS = [
  {k:'OPEN',        cls:'b-red',   done:false},
  {k:'IN PROGRESS', cls:'b-amber', done:false},
  {k:'DONE',        cls:'b-green', done:true},
  {k:'CANCELLED',   cls:'b-grey',  done:true}
];
const MAX_FILE = 5*1024*1024;      // 5 MB na soubor, stejně jako jinde v minimu
const PHOTO_EDGE = 1600;           // delší hrana fotky po zmenšení
const PHOTO_Q = 0.72;              // kvalita JPEG — typicky pětinová velikost

/* ===== drobné pomůcky ===== */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const today = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const dateCz = s => { if(!s) return ''; const p=String(s).slice(0,10).split('-');
  return p.length===3 ? `${+p[2]}. ${+p[1]}. ${p[0]}` : String(s); };
const daysAgo = n => { const d=new Date(); d.setDate(d.getDate()-n);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const fileSize = b => b>=1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' kB';
const isImg = f => /^image\//i.test(f.type||'') || /\.(jpe?g|png|gif|webp|heic)$/i.test(f.name||'');

const stDef = k => STATUS.find(s=>s.k===k) || STATUS[0];
const isDone = t => stDef(t.status).done;
/* Platný termín = poslední posun, jinak původní. Nikdy se neukládá, počítá se. */
const dueValid = t => { const m=(t.moves||[]).filter(x=>x&&x.date); return m.length ? m[m.length-1].date : (t.dueOrig||''); };
const moveCount = t => (t.moves||[]).filter(x=>x&&x.date).length;
const isLate = t => !isDone(t) && dueValid(t) && dueValid(t) < today();
const lateDays = t => isLate(t) ? Math.floor((Date.parse(today())-Date.parse(dueValid(t)))/86400000) : 0;
const owners = t => (t && Array.isArray(t.owners) && t.owners.length) ? t.owners : ((t&&t.owner)?[t.owner]:[]);
const ownersLabel = t => owners(t).join(', ');

/* Server zamítl zápis — anglické „Missing or insufficient permissions" nikomu nepomůže. */
function writeHint(e){
  const code=(e&&(e.code||e.message))||'';
  if(/permission|insufficient/i.test(String(code))){
    const a=sfwAccess(me);
    return a==='read'
      ? 'Do Shopfloor walku máš přístup jen na čtení. O zápis požádej Davida — nastaví ho v Nastavení u tvého jména.'
      : 'Server zápis odmítl. Zkontroluj v Nastavení, že máš u Shopfloor walku „Zapisovat". Pokud ano, nejspíš nejsou publikovaná pravidla Firestore.';
  }
  return String((e&&e.message)||e||'Neznámá chyba');
}

async function load(force){

  }catch(e){ errMsg=writeHint(e); }

/* Lidi bereme z uživatelů celého minima, ať se jména nepíšou ručně. */
async function loadPeople(){
  if(people.length) return;
  try{
    const us=await getDocs(collection(db,'users'));
    people=us.docs.map(d=>{const u=d.data()||{}; return (u.name||u.email||d.id);})
      .filter(Boolean).sort((a,b)=>a.localeCompare(b,'cs'));
  }catch(e){ /* bez jmen se dá pracovat dál, jen se nic nenabídne */ }
}
function ownerChoices(extra){
  const set=new Set(people);
  items.forEach(t=>owners(t).forEach(o=>set.add(o)));
  (extra||[]).forEach(o=>o&&set.add(o));
  return [...set].sort((a,b)=>a.localeCompare(b,'cs'));
}
/* Číslo nálezu je prosté pořadové číslo — 1, 2, 3… Generuje se TRANSAKCÍ,
   jinak by dva lidi na obchůzce naráz dostali stejné. */
async function nextNo(){
  const ref=doc(db,'meta','sfwcfg');
  const n=await runTransaction(db, async tx=>{
    const s=await tx.get(ref);
    const cur=(((s.data()||{}).seq)||0)+1;
    if(s.exists()) tx.update(ref,{seq:cur}); else tx.set(ref,{seq:cur});
    return cur;
  });
  return String(n);
}
function sync(t){
  if(!t||!t._id) return;
  const i=items.findIndex(x=>x._id===t._id);
  if(i>=0) items[i]=JSON.parse(JSON.stringify(t));
}
function emptyItem(){

    createdOn:today(), createdBy:me.name, hist:[]};
}

/* ===== zápis ===== */
/* Rozepsané hodnoty z okna do paměti, ať je překreslení nesmaže. */
function collect(){
  if(!open) return null;
  const g=id=>{const e=document.getElementById(id); return e?e.value.trim():'';};
  if(!document.getElementById('sf-finding')) return open;     // okno není vykreslené
  Object.assign(open,{
    walkDate:g('sf-date'), area:g('sf-area'), place:g('sf-place'),
    finding:g('sf-finding'), action:g('sf-action'),
    dueOrig:g('sf-due'), status:g('sf-status')||open.status, note:g('sf-note')
  });
  moveDraft={date:g('sf-newmove'), why:g('sf-movewhy')};
  return open;
}
async function save(){
  const t=collect(); if(!t) return;
  if(!canWrite()){ oMsg='Máš přístup jen na čtení.'; render(); return; }
  if(!t.finding){ oMsg='Napiš, co jsi na obchůzce našel.'; render(); return; }
  if(!owners(t).length){ oMsg='Vyber aspoň jednoho ownera — kdo to má vyřešit.'; render(); return; }
  if(!t.dueOrig){ oMsg='Vyplň termín.'; render(); return; }
  const closing = isDone(t) && !t.closedOn;
  if(closing) t.closedOn=today();
  if(!isDone(t)) t.closedOn='';
  oMsg='Ukládám…'; render();
  try{
    if(!t._id){
      const no=await nextNo();
      const rec={no, walkDate:t.walkDate, area:t.area, place:t.place||'', finding:t.finding,
        action:t.action||'', owners:t.owners, dueOrig:t.dueOrig, moves:[],
        status:t.status, closedOn:t.closedOn, note:t.note||'', files:[],
        createdOn:today(), createdBy:me.name,
        hist:[`${today()} · ${me.name} · nález založen při obchůzce ${dateCz(t.walkDate)}`]};
      const ref=await addDoc(collection(db,'sfw'), rec);
      /* fotky vyfocené ještě před uložením nahrajeme teď, když máme id */
      if(pending.length){
        const arr=[], hist=rec.hist.slice();
        for(const fl of pending){
          try{ arr.push(await upload(ref.id,fl)); hist.push(`${today()} · ${me.name} · přidal fotku ${fl.name}`); }
          catch(e){ toast('Fotka '+fl.name+' se nenahrála: '+((e&&e.message)||e),'err'); }
        }
        if(arr.length){ await updateDoc(ref,{files:arr,hist}); rec.files=arr; rec.hist=hist; }
        pending=[];
      }
      items.unshift(Object.assign({_id:ref.id}, rec));
      toast('Nález '+no+' uložen.','ok');
    }else{
      const hist=(t.hist||[]).concat(`${today()} · ${me.name} · ${closing?'nález uzavřen':'upraveno'}`);
      const {_id,...data}=t; data.hist=hist;
      await updateDoc(doc(db,'sfw',t._id), data);
      t.hist=hist; sync(t);
      toast('Uloženo.','ok');
    }
    open=null; oMsg='';
  }catch(e){ oMsg='Uložení selhalo. '+writeHint(e); }
  render();
}
/* Posun termínu jen s důvodem — aby se termíny neposouvaly bez stopy. */
async function addMove(){
  const t=collect(); if(!t) return;
  if(!canWrite()){ oMsg='Máš přístup jen na čtení.'; render(); return; }
  if(!moveDraft.date){ oMsg='Vyber nový termín.'; render(); return; }
  if(!moveDraft.why){ oMsg='K posunu termínu napiš důvod.'; render(); return; }
  if(!t._id){ oMsg='Nález nejdřív ulož, teprve pak jde posouvat termín.'; render(); return; }
  const moves=(t.moves||[]).concat({date:moveDraft.date, why:moveDraft.why, at:today(), by:me.name});
  const hist=(t.hist||[]).concat(`${today()} · ${me.name} · posun termínu na ${dateCz(moveDraft.date)} — ${moveDraft.why}`);
  try{
    await updateDoc(doc(db,'sfw',t._id), {moves, hist});
    t.moves=moves; t.hist=hist; sync(t); moveDraft={date:'',why:''}; oMsg='';
  }catch(e){ oMsg='Posun se neuložil. '+writeHint(e); }
  render();
}
async function removeItem(id){
  const t=items.find(x=>x._id===id); if(!t) return;
  if(!canDelete()) return;
  const n=(t.files||[]).length;
  if(!confirm(`Opravdu smazat nález ${t.no}?\n\n„${(t.finding||'').slice(0,90)}"`
    +(n?`\nSmaže se i ${n===1?'1 fotka':n+' fotek'}.`:'')+'\n\nTohle se nedá vrátit.')) return;
  busy='Mažu nález…'; render();
  try{

}

/* ===== fotky ===== */
/* Fotku zmenšíme ještě v telefonu, než se nahraje — jinak by šly do úložiště
   čtyřmegové originály. Delší hrana 1600 px, JPEG 0.72. */
async function shrink(f){
  if(!/^image\//i.test(f.type||'') || /svg/i.test(f.type||'')) return f;
  try{
    const bmp=await createImageBitmap(f,{imageOrientation:'from-image'});
    const sc=Math.min(1, PHOTO_EDGE/Math.max(bmp.width,bmp.height));
    if(sc>=1 && f.size<=900*1024){ bmp.close && bmp.close(); return f; }
    const w=Math.max(1,Math.round(bmp.width*sc)), h=Math.max(1,Math.round(bmp.height*sc));
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(bmp,0,0,w,h);
    bmp.close && bmp.close();
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',PHOTO_Q));
    if(!blob || blob.size>=f.size) return f;
    return new File([blob], f.name.replace(/\.[^.]+$/,'')+'.jpg', {type:'image/jpeg', lastModified:Date.now()});
  }catch(e){ return f; }
}
async function upload(id, f){
  const safe=f.name.replace(/[^\w.\-]+/g,'_').slice(-80);
  const path='sfw/'+id+'/'+Date.now()+'_'+Math.floor(Math.random()*1e6)+'_'+safe;
  const st=sref(storage,path);
  await uploadBytes(st,f,{contentType:f.type||'application/octet-stream'});
  return {name:f.name, path, url:await getDownloadURL(st), size:f.size, at:today(), by:me.name};
}
async function addFiles(list){
  const t=collect(); if(!t) return;
  if(!canWrite()){ toast('Máš přístup jen na čtení.','err'); return; }
  const raw=[...(list||[])].filter(Boolean); if(!raw.length) return;
  oMsg='Zpracovávám fotky…'; render();
  const ok=[];
  for(const f0 of raw){
    const fl=await shrink(f0);
    if(fl.size>MAX_FILE){ toast(`„${fl.name}" je i po zmenšení větší než 5 MB.`,'err'); continue; }
    ok.push(fl);
  }
  if(!ok.length){ oMsg=''; render(); return; }
  if(!t._id){ pending.push(...ok); oMsg=''; render(); return; }   // nový nález → nahraje se po uložení
  oMsg='Nahrávám fotky…'; render();
  const arr=(t.files||[]).slice(), hist=(t.hist||[]).slice();
  let n=0;
  for(const fl of ok){
    try{ arr.push(await upload(t._id,fl)); hist.push(`${today()} · ${me.name} · přidal fotku ${fl.name}`); n++; }
    catch(e){ toast('Nenahrálo se: '+fl.name+' — '+((e&&e.message)||e),'err'); }
  }
  if(n){
    try{ await updateDoc(doc(db,'sfw',t._id), {files:arr, hist});
         t.files=arr; t.hist=hist; sync(t);
         toast(n===1?'Fotka nahrána.':n+' fotek nahráno.','ok'); }
    catch(e){ toast('Uložení fotek selhalo. '+writeHint(e),'err'); }
  }
  oMsg=''; render();
}
async function removeFile(i){
  const t=collect(); if(!t) return;
  if(!canWrite()) return;
  if(!t._id){ pending.splice(i,1); render(); return; }
  const files=(t.files||[]).slice(), fl=files[i]; if(!fl) return;
  try{ await deleteObject(sref(storage,fl.path)); }catch(e){ /* v úložišti už být nemusí */ }
  files.splice(i,1);
  const hist=(t.hist||[]).concat(`${today()} · ${me.name} · smazal fotku ${fl.name}`);
  try{ await updateDoc(doc(db,'sfw',t._id), {files, hist}); t.files=files; t.hist=hist; sync(t); }
  catch(e){ toast('Smazání selhalo. '+writeHint(e),'err'); }
  render();
}

/* ===== výběr řádků ===== */
function visible(){
  let r=items.slice();
  if(f.area)   r=r.filter(t=>t.area===f.area);
  if(f.owner)  r=r.filter(t=>owners(t).includes(f.owner));
  if(f.status) r=r.filter(t=>t.status===f.status);
  if(hideClosed) r=r.filter(t=>!isDone(t));
  const q=f.q.trim().toLowerCase();
  if(q) r=r.filter(t=>[t.no,t.finding,t.action,t.place,t.area,t.note,ownersLabel(t)]
    .some(v=>String(v||'').toLowerCase().includes(q)));
  /* po termínu nahoru, pak podle platného termínu, uzavřené dospod */
  return r.sort((a,b)=>{
    if(isDone(a)!==isDone(b)) return isDone(a)?1:-1;
    if(isLate(a)!==isLate(b)) return isLate(a)?-1:1;
    return String(dueValid(a)||'9999').localeCompare(String(dueValid(b)||'9999'));
  });
}
function walkRows(){
  let r=items.slice();
  if(walkRange==='0') r=r.filter(t=>t.walkDate===today());
  else if(walkRange) r=r.filter(t=>t.walkDate>=daysAgo(Number(walkRange)));
  return r.sort((a,b)=>String(b.walkDate).localeCompare(String(a.walkDate))
    || Number(b.no||0)-Number(a.no||0));
}

          <td data-label="Oblast" class="nowrap">${esc(t.area)}</td>
          <td data-label="Místo">${esc(t.place||'')||'<span class="muted">—</span>'}</td>
          <td data-label="Nález" class="desc">${esc(t.finding)}</td>
          <td data-label="Opatření" class="desc muted">${esc(t.action||'')}</td>
          <td data-label="Owner"><b>${esc(ownersLabel(t))}</b></td>
          <td data-label="Termín původní" class="nowrap">${dateCz(t.dueOrig)}</td>
          <td data-label="Posuny" class="ycol nowrap">${mc?(t.moves||[]).map(m=>dateCz(m.date)).join('<br>'):'<span class="muted">—</span>'}</td>
          <td data-label="Platný termín" class="gcol nowrap"><b${lt?' style="color:var(--red)"':''}>${dateCz(dv)}</b></td>
          <td data-label="Posunů" class="gcol num">${mc}</td>
          <td data-label="Stav"><span class="badge ${stDef(t.status).cls}">${esc(t.status)}</span></td>
          <td data-label="Po termínu" class="gcol num">${lt?`<b style="color:var(--red)">${lateDays(t)} dní</b>`:'<span class="muted">—</span>'}</td>
          <td data-label="Uzavřeno" class="nowrap">${t.closedOn?dateCz(t.closedOn):'<span class="muted">—</span>'}</td>
          <td data-label="" class="nowrap"><button class="btn-ghost" style="padding:3px 9px;font-size:11px">Otevřít</button>${
            canDelete()?` <button class="btn-del" style="padding:3px 9px;font-size:11px" data-a="del" data-v="${t._id}" title="Smazat nález">Smazat</button>`:''}</td>
        </tr>`;}).join('') || `<tr><td colspan="15" class="empty">Nic neodpovídá filtru.</td></tr>`}
      </tbody></table></div>
  </div>`;
}

function itemModal(){
  const t=open; if(!t) return '';
  const isNew=!t._id, ro=!canWrite();
  const dv=dueValid(t), mc=moveCount(t), lt=isLate(t);
  const files=isNew ? pending.map(fl=>({name:fl.name,size:fl.size,pending:true,url:'',type:fl.type}))
                    : (t.files||[]);
  const sel=owners(t);
  const q=ownQ.trim().toLowerCase();
  const sugg=ownerChoices(sel).filter(o=>!sel.includes(o)).filter(o=>!q||o.toLowerCase().includes(q)).slice(0,8);
  return `
  <div class="overlay" id="ovl"><div class="modal" role="dialog" aria-modal="true" aria-label="Nález z obchůzky">
    <h3>${isNew?'Nový nález z obchůzky':esc(t.no)+' — '+esc(t.area)}
      <button class="x" data-a="close" aria-label="Zavřít">✕</button></h3>
    <div class="robar">
      ${ro?'<span class="badge b-grey">jen čtení</span>':'bílé vyplňuješ ty · <span class="badge b-amber">žluté</span> až při posunu termínu'}
      ${!isNew&&lt?`<span class="badge b-red" style="margin-left:auto">po termínu ${lateDays(t)} dní</span>`:''}
    </div>
    <div class="form">
      <div class="f"><label>Datum obchůzky</label>
        <input id="sf-date" type="date" value="${esc(t.walkDate||'')}" ${ro?'disabled':''}></div>
      <div class="f"><label>Oblast <span style="color:var(--red)">*</span></label>
        <select id="sf-area" ${ro?'disabled':''}>${AREAS.map(a=>`<option ${t.area===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div>
      <div class="f span2"><label>Konkrétní místo</label>
        <input id="sf-place" value="${esc(t.place||'')}" placeholder="např. u lisu IMM07, regál B3" ${ro?'disabled':''}></div>

      <div class="f span4"><label>1 · Co jsme našli <span style="color:var(--red)">*</span></label>
        <textarea id="sf-finding" rows="3" placeholder="Popiš nález tak, jak ho uvidí ten, kdo ho bude řešit" ${ro?'disabled':''}>${esc(t.finding||'')}</textarea></div>
      <div class="f span4"><label>2 · Co se s tím udělá</label>
        <textarea id="sf-action" rows="3" placeholder="Opatření a podle čeho poznáme, že je hotovo" ${ro?'disabled':''}>${esc(t.action||'')}</textarea></div>

      <div class="f span2"><label>3 · Owner <span style="color:var(--red)">*</span>
        <span class="muted" style="font-weight:400">— může jich být víc</span></label>
        <div class="ownerpick">
          ${sel.length?`<div class="ochips">${sel.map(o=>`<span class="ochip">${esc(o)}${
            ro?'':`<button data-a="ownrm" data-v="${esc(o)}" title="Odebrat">✕</button>`}</span>`).join('')}</div>`:''}
          ${ro?'':`<input id="sf-ownq" value="${esc(ownQ)}" autocomplete="off"
            placeholder="${sel.length?'Přidat dalšího — začni psát jméno':'Začni psát jméno…'}">
          ${q?`<div class="osugg">${sugg.length
            ? sugg.map(o=>`<button class="osug" data-a="ownadd" data-v="${esc(o)}">${esc(o)}</button>`).join('')
            : '<div class="muted" style="padding:7px 10px;font-size:12px">Nikdo takový tu není. Lidi se přidávají v Nastavení minima.</div>'}</div>`:''}`}
        </div></div>
      <div class="f"><label>4 · Termín <span style="color:var(--red)">*</span></label>
        <input id="sf-due" type="date" value="${esc(t.dueOrig||'')}" ${ro?'disabled':''}></div>
      <div class="f"><label>Stav</label>
        <select id="sf-status" ${ro?'disabled':''}>${STATUS.map(s=>`<option ${t.status===s.k?'selected':''}>${s.k}</option>`).join('')}</select></div>

      ${isNew?'':`
      <div class="f"><label>Platný termín</label>
        <div class="ro gcell"${lt?' style="color:var(--red);font-weight:700"':''}>${dateCz(dv)||'—'}</div></div>
      <div class="f"><label>Posunů</label><div class="ro gcell">${mc}</div></div>
      <div class="f"><label>Uzavřeno</label><div class="ro gcell">${t.closedOn?dateCz(t.closedOn):'—'}</div></div>
      <div class="f"><label>Zadal</label><div class="ro">${esc(t.createdBy||'')}</div></div>`}

      ${(!isNew && !ro)?`<div class="ybox">
        <b style="font-size:12.5px">Posun termínu</b>
        <div class="muted" style="font-size:11.5px;margin-top:2px">Termín jde posunout jen s důvodem — každý posun zůstane v historii.</div>
        ${mc?`<div class="muted" style="font-size:11.5px;margin-top:6px">${(t.moves||[]).map(m=>
          `${dateCz(m.date)} — ${esc(m.why)} <i>(${esc(m.by)}, ${dateCz(m.at)})</i>`).join('<br>')}</div>`:''}
        <div class="addrow">
          <div><label style="font-size:12px;font-weight:700;color:#41506b">Nový termín</label>
            <input id="sf-newmove" type="date" value="${esc(moveDraft.date||'')}"></div>
          <div style="flex:2 1 240px"><label style="font-size:12px;font-weight:700;color:#41506b">Důvod posunu</label>
            <input id="sf-movewhy" value="${esc(moveDraft.why||'')}" placeholder="Proč se termín posouvá"></div>
          <button class="btn-ghost" data-a="move" style="flex:none">Posunout termín</button>
        </div>
      </div>`:''}

      <div class="sect">Fotky z obchůzky</div>
      <div class="f span4">
        ${ro?'':`<div class="photobtns">
          <label class="btn-cam">📷 Vyfotit<input type="file" id="sf-cam" accept="image/*" capture="environment" multiple></label>
          <label class="filebtn">🖼️ Vybrat z galerie<input type="file" id="sf-file" accept="image/*,application/pdf" multiple></label>
        </div>`}
        ${files.length?`<div class="photos">${files.map((fl,i)=>`
          <div class="photo">
            ${(fl.url&&isImg(fl))?`<a href="${esc(fl.url)}" target="_blank" rel="noopener">
              <img src="${esc(fl.url)}" alt="${esc(fl.name)}" loading="lazy"></a>`
              :`<div class="doc">${fl.pending?'⏳':'📄'}</div>`}
            <div class="nm">${esc(fl.name)}<br><span class="muted">${fileSize(fl.size||0)}${fl.pending?' · uloží se po uložení nálezu':''}</span></div>
            ${ro?'':`<button class="rm" data-a="delfile" data-v="${i}" title="Odebrat">✕</button>`}
          </div>`).join('')}</div>`
          :`<div class="muted" style="font-size:12.5px">Zatím bez fotek.${ro?'':' Na telefonu otevře „Vyfotit" rovnou fotoaparát — fotka se před nahráním sama zmenší.'}</div>`}
      </div>

      <div class="f span4"><label>Poznámka</label>
        <textarea id="sf-note" rows="2" placeholder="Cokoli dalšího k nálezu" ${ro?'disabled':''}>${esc(t.note||'')}</textarea></div>
    </div>
    ${(t.hist||[]).length?`<div class="hist">${(t.hist||[]).slice().reverse().slice(0,8).map(h=>`<div>${esc(h)}</div>`).join('')}</div>`:''}
    <div class="foot">
      ${oMsg?`<span style="color:var(--red);font-weight:700;font-size:12px">${esc(oMsg)}</span>`
            :`<span class="muted" style="font-size:11.5px">${isNew?'Číslo se přidělí po uložení.':'Změny se zapíšou do historie.'}</span>`}
      <span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
        ${(!isNew && canDelete())?`<button class="btn-del" data-a="del" data-v="${t._id}">Smazat</button>`:''}
        ${ro?'':`<button class="btn-ok" data-a="save">${isNew?'Uložit nález':'Uložit'}</button>`}
        <button class="btn-ghost" data-a="close">Zavřít</button>
      </span>
    </div>
  </div></div>`;
}

function exportCsv(){
  const rows=visible();
  const line=a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';');
  const head=['Č.','Datum obchůzky','Oblast','Místo','Nález','Opatření','Owner','Termín původní',
    'Posun 1','Posun 2','Posun 3','Platný termín','Posunů','Stav','Po termínu (dní)','Uzavřeno','Fotek','Poznámka','Zadal'];
  const csv=[line(head)].concat(rows.map(t=>{
    const m=(t.moves||[]).map(x=>x.date);
    return line([t.no,t.walkDate,t.area,t.place||'',t.finding,t.action||'',ownersLabel(t),t.dueOrig,
      m[0]||'',m[1]||'',m[2]||'',dueValid(t),moveCount(t),t.status,isLate(t)?lateDays(t):'',
      t.closedOn||'',(t.files||[]).length,t.note||'',t.createdBy||'']);
  })).join('\n');
  const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='shopfloor_walk_'+today()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

/* ==========================================================
   Vykreslení a ovládání
   ========================================================== */
function render(){
  if(!me){ appEl.innerHTML=loginView(); bind(); return; }
  if(!canEnter()){ appEl.innerHTML=shell(noAccessView()); bind(); return; }
  const inner = tab==='walk' ? walkView() : planView();
  appEl.innerHTML = shell(`
    <div class="tabs">
      <button class="tab ${tab==='walk'?'on':''}" data-a="tab" data-v="walk">🚶 Obchůzka</button>
      <button class="tab ${tab==='plan'?'on':''}" data-a="tab" data-v="plan">📋 Akční plán</button>
      <span class="sp">
        <span class="muted" style="font-size:11.5px">${tab==='walk'
          ? 'Na telefonu zapisuješ nálezy, na počítači je pak čteš v akčním plánu.'
          : 'Plán ukazuje všechny nálezy — po termínu nahoře, hotové dospod.'}</span>
        <button class="btn-ghost" data-a="reload">↻ Načíst znovu</button>
      </span>
    </div>
    ${errMsg?`<div class="notice warn">${esc(errMsg)}</div>`:''}
    ${busy?`<div class="notice">${esc(busy)}</div>`:''}
    ${inner}`)
    + (open?itemModal():'')
    + (toastMsg?`<div class="toast ${toastKind}">${esc(toastMsg)}</div>`:'');
  bind();
}
function noAccessView(){
  return `<div class="panel"><div class="body empty">
    <div style="font-size:34px">🔒</div>
    <div style="font-size:17px;font-weight:800;margin:8px 0 6px">Do Shopfloor walku zatím nemáš přístup</div>
    <p class="muted" style="max-width:520px;margin:0 auto">
      Přístup nastavuje David v <b>Nastavení → uživatel → Přístup k modulům → Shopfloor walk</b>.
      Napiš mu, jestli potřebuješ jen číst, nebo i zapisovat.</p>
  </div></div>`;
}
function shell(inner){
  const uh = window.uheaderHTML ? window.uheaderHTML({module:'Shopfloor walk', cur:'shopfloor',
    user:esc(me.email), email:esc(me.email), level:(LEVEL_LABEL[me.level]||''),
    positions:me.positions||[], mods:me.modules||{}, logoutAttr:'id="btn-logout"',
    modules:['portal','nakup','dovolenky','nastaveni','opravy','engineering','shopfloor']}) : '';
  return uh + `<main>${inner}</main>`;
}
function loginView(){
  return `<div class="login-wrap"><form class="login" id="loginForm">
    <h2>minimo · YFAI</h2><p>Shopfloor walk — nálezy z obchůzky</p>
    ${loginErr?`<div class="loginerr">${esc(loginErr)}</div>`:''}
    <input type="email" id="li-email" placeholder="E-mail" autocomplete="username">
    <input type="password" id="li-pass" placeholder="Heslo" autocomplete="current-password">
    <button type="submit" ${loginBusy?'disabled':''}>${loginBusy?'Přihlašuji…':'Přihlásit se'}</button>
  </form></div>`;
}

function bind(){
  const lf=document.getElementById('loginForm');
  if(lf) lf.onsubmit=async e=>{
    e.preventDefault();
    const email=document.getElementById('li-email').value.trim();
    const pass=document.getElementById('li-pass').value;
    loginBusy=true; loginErr=''; render();
    try{ await signInWithEmailAndPassword(auth,email,pass); }
    catch(err){ loginBusy=false; loginErr=loginErrMsg(err.code); render(); }
  };
  const lo=document.getElementById('btn-logout'); if(lo) lo.onclick=()=>signOut(auth);
  document.querySelectorAll('[data-a]').forEach(el=>{
    el.onclick=ev=>{ ev.stopPropagation(); act(el.dataset.a, el.dataset.v); };
  });
  /* filtry v plánu */
  const q=document.getElementById('sf-q');
  if(q) q.oninput=()=>{ f.q=q.value; const p=q.selectionStart; render();
    const n=document.getElementById('sf-q'); if(n){ n.focus(); try{n.setSelectionRange(p,p);}catch(e){} } };
  for(const [id,key] of [['sf-farea','area'],['sf-fowner','owner'],['sf-fstatus','status']]){
    const el=document.getElementById(id); if(el) el.onchange=()=>{ f[key]=el.value; render(); };
  }
  const hc=document.getElementById('sf-hide'); if(hc) hc.onchange=()=>{ hideClosed=hc.checked; render(); };
  /* našeptávač ownerů */
  const oq=document.getElementById('sf-ownq');
  if(oq) oq.oninput=()=>{ ownQ=oq.value; const p=oq.selectionStart; collect(); render();
    const n=document.getElementById('sf-ownq'); if(n){ n.focus(); try{n.setSelectionRange(p,p);}catch(e){} } };
  /* fotky — fotoaparát i galerie */
  ['sf-cam','sf-file'].forEach(id=>{ const el=document.getElementById(id);
    if(el) el.onchange=()=>{ if(el.files&&el.files.length) addFiles(el.files); }; });
  const ovl=document.getElementById('ovl');
  if(ovl) ovl.onclick=e=>{ if(e.target.id==='ovl'){ collect(); open=null; oMsg=''; ownQ=''; render(); } };
}

async function act(a,v){
  switch(a){
    case 'tab': tab=v; break;
    case 'wr':  walkRange=v||''; break;
    case 'reload': loaded=false; people=[]; await load(true); return;
    case 'new':
      if(!canWrite()) return;
      open=emptyItem(); pending=[]; oMsg=''; ownQ=''; moveDraft={date:'',why:''};
      await load();
      break;
    case 'open':
      open=JSON.parse(JSON.stringify(items.find(x=>x._id===v)||{}));
      if(!open._id) open=null;
      pending=[]; oMsg=''; ownQ=''; moveDraft={date:'',why:''};
      break;
    case 'close': collect(); open=null; oMsg=''; ownQ=''; break;
    case 'save': await save(); return;
    case 'move': await addMove(); return;
    case 'del':  await removeItem(v); return;
    case 'delfile': await removeFile(Number(v)); return;
    case 'ownadd':{
      const t=collect(); if(!t) break;
      const list=owners(t); if(!list.includes(v)) list.push(v);
      t.owners=list; t.owner=''; ownQ='';
      break;
    }
    case 'ownrm':{
      const t=collect(); if(!t) break;
      t.owners=owners(t).filter(o=>o!==v); t.owner='';
      break;
    }
    case 'export': exportCsv(); return;
  }
  render();
}
function loginErrMsg(code){
  const m={'auth/invalid-email':'Neplatný e-mail.','auth/user-not-found':'Účet neexistuje.',
    'auth/wrong-password':'Nesprávné heslo.','auth/invalid-credential':'Nesprávný e-mail nebo heslo.',
    'auth/too-many-requests':'Příliš mnoho pokusů, zkuste to za chvíli.',
    'auth/operation-not-allowed':'Přihlašování e-mailem není ve Firebase zapnuté.'};
  return m[code]||('Přihlášení se nezdařilo ('+code+').');
}
/* Klik mimo našeptávač ownerů ho zavře, ať nepřekrývá políčka pod sebou. */
document.addEventListener('mousedown', e=>{
  if(!ownQ) return;
  if(e.target.closest && e.target.closest('.ownerpick')) return;
  ownQ=''; collect(); render();
});

render();
</script>
