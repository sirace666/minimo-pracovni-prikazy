<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20100%20100%27%3E%3Crect%20width=%27100%27%20height=%27100%27%20rx=%2722%27%20fill=%27%231b4b8f%27/%3E%3Ctext%20x=%2750%27%20y=%2776%27%20font-size=%2774%27%20font-family=%27Arial,sans-serif%27%20font-weight=%27bold%27%20fill=%27white%27%20text-anchor=%27middle%27%3Em%3C/text%3E%3C/svg%3E">
<title>Nákupní požadavky — YFAI minimo</title>
<link rel="stylesheet" href="header.css">
<style>
  :root{
    --navy-1:#0f2f5f; --navy-2:#1b4b8f; --panel:#1e4c8a;
    --bg:#f4f6f9; --card:#ffffff; --line:#dde4ec; --text:#16233a; --muted:#6b7a90;
    --green:#1f9254; --green-bg:#e8f6ee; --red:#c0392b; --red-bg:#fdecea;
    --amber:#b7791f; --amber-bg:#fdf3e2; --blue:#2563a8; --blue-bg:#e9f1fb;
    --purple:#6b46c1; --purple-bg:#f0ebfa; --grey:#6b7a90; --grey-bg:#eef1f5;
    --radius:6px; font-synthesis-weight:none;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px}
  button{font-family:inherit;font-size:12px;cursor:pointer;border-radius:var(--radius);border:1px solid transparent;padding:7px 12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select,textarea{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--text);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid #2a5ea3;outline-offset:0;border-color:#2a5ea3}
  a{color:#2563a8}

  header{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  header h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.3px;line-height:1.1}
  header .sub{font-size:11.5px;opacity:.72;margin-top:3px}
  .brand{background:#fff;border-radius:8px;padding:9px 14px;display:flex;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.22);flex:none}
  .brand svg{display:block;height:56px;width:auto}
  .login .brand{margin:0 auto 16px;box-shadow:none;border:1px solid var(--line);padding:12px 18px}
  .login .brand svg{height:64px}
  @media(max-width:640px){header h1{font-size:20px}.brand svg{height:42px}}
  .chips{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:4px 11px;font-size:11px;white-space:nowrap}
  .chip.green{background:#1f9254;border-color:#1f9254}
  .chip.role{background:#6b46c1;border-color:#6b46c1}
  .btn-logout{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;font-size:11px;padding:4px 12px}

  .tabbar{background:#fff;border-bottom:1px solid var(--line);padding:9px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tab{background:#eef1f5;color:#41506b;border:1px solid var(--line);font-weight:600}
  .tab.active{background:var(--navy-2);color:#fff;border-color:var(--navy-2)}
  .tab.violet.active{background:#6b46c1;border-color:#6b46c1}
  .spacer{margin-left:auto;display:flex;gap:8px}
  .btn-primary{background:var(--navy-2);color:#fff}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:#41506b}
  .btn-danger{background:#c0392b;color:#fff}
  .btn-ok{background:#1f9254;color:#fff}

  main{padding:14px 18px 40px}
  .notice{background:var(--blue-bg);border:1px solid #cbdff5;border-radius:var(--radius);padding:9px 12px;margin-bottom:12px;font-size:12px;color:#28456e}
  .notice.warn{background:var(--amber-bg);border-color:#f2dfb8;color:#7a5410}

  .dashbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px;padding:8px 12px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
  .dashbar .dl{font-size:12px;font-weight:700;color:#41506b}
  .dchip{background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 12px;font-size:12px;font-weight:600;color:#41506b;cursor:pointer}
  .dchip:hover{border-color:#9db4d4;background:#f5f8fd}
  .dchip.on{border-color:#16355f;box-shadow:0 0 0 1px #16355f inset;background:#eef3fb;color:#16355f}
  .dashbar .dnote{font-size:11.5px;color:var(--muted);margin-left:auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
  .kcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--grey);border-radius:var(--radius);padding:11px 13px}
  .kcard .lbl{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kcard .val{font-size:26px;font-weight:700;margin:4px 0 2px}
  .kcard .note{font-size:11px;color:var(--muted)}

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
  .panel > h2{background:var(--panel);color:#fff;margin:0;font-size:13px;font-weight:700;padding:9px 13px;display:flex;align-items:center;gap:10px}
  .panel > h2 .right{margin-left:auto;font-weight:500;font-size:11px;opacity:.85}
  .panel .body{padding:13px}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);background:#fafbfd}
  .filters input,.filters select{width:auto;min-width:130px;font-size:14px}
  .filters input::placeholder{color:#5f6d84}
  .filters .fnum{min-width:0;width:135px;flex:none;font-size:14px;font-weight:600}
  .filters .grow{flex:1 1 320px;max-width:560px;min-width:200px}
  label.check{display:inline-flex;gap:7px;align-items:center;justify-content:flex-start;font-size:14px;color:#41506b;white-space:nowrap;cursor:pointer;font-weight:700}
  label.check input{width:18px;height:18px;min-width:0;margin:0;flex:none;cursor:pointer}

  .tblwrap{overflow:auto;max-height:66vh}
  /* Druhý vodorovný posuvník NAHOŘE (nad popisky sloupců) – pro menší monitory,
     ať se k rolování do strany nemusí scrollovat až pod všechny řádky. */
  .tbltop{overflow-x:auto;overflow-y:hidden}
  .tbltop>div{height:1px}
  table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
  thead th{background:#16355f;color:#fff;text-align:left;padding:8px 10px;font-size:10px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;user-select:none;position:sticky;top:0;z-index:3}
  thead th.no-sort{cursor:default}
  thead tr.colf th{background:#20406a;padding:4px 5px;cursor:default;text-transform:none;letter-spacing:0;position:sticky;top:29px;z-index:2}
  thead tr.colf input,thead tr.colf select{width:100%;min-width:0;font-size:11px;padding:4px 6px;border:1px solid #3a5a86;border-radius:5px;background:#fff;color:#16233a}
  thead tr.colf input:focus,thead tr.colf select:focus{outline:2px solid #7fb0ff;border-color:#7fb0ff}
  tbody td{padding:8px 10px;border-bottom:1px solid #eef1f5;vertical-align:top;background:var(--row,transparent)}
  tbody tr:hover td{filter:brightness(.975)}
  tr.crit td{background:#f8d2ce}
  tr.crit td:first-child{box-shadow:inset 4px 0 0 var(--red)}
  .legend{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:9px 13px;border-bottom:1px solid var(--line);background:#fff;font-size:11px;color:var(--muted)}
  .legend .lg-h{font-weight:700;color:#41506b;margin-right:2px}
  .legend .lg-sep{width:1px;align-self:stretch;background:var(--line);margin:0 3px}
  .stchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:4px 11px;font-size:11.5px;color:#41506b;cursor:pointer;line-height:1.3;font-weight:600}
  .stchip i{display:inline-block;width:16px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.12);font-style:normal}
  .stchip:hover{border-color:#9db4d4;background:#f5f8fd}
  .stchip.on{border-color:#16355f;box-shadow:0 0 0 1px #16355f inset;background:#eef3fb;color:#16355f}
  .stchip.grp{font-weight:700}
  .datefilter{display:flex;align-items:center;gap:5px;font-size:12px;color:#41506b;white-space:nowrap}
  .datefilter input{width:auto;min-width:0;padding:6px 7px;font-size:12px}
  td.desc{white-space:normal;min-width:230px;max-width:330px}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .empty{padding:26px;text-align:center;color:var(--muted)}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid transparent}
  .b-grey{background:var(--grey-bg);color:#4a5a70;border-color:#dfe4ea}
  .b-blue{background:var(--blue-bg);color:var(--blue);border-color:#cbdff5}
  .b-amber{background:var(--amber-bg);color:var(--amber);border-color:#f2dfb8}
  .b-green{background:var(--green-bg);color:var(--green);border-color:#c4e6d3}
  .b-green-dark{background:#157347;color:#fff;border-color:#0f5c37}
  .b-purple{background:var(--purple-bg);color:var(--purple);border-color:#ddd2f5}
  .b-red{background:var(--red-bg);color:var(--red);border-color:#f5cfca}
  .b-white{background:#fff;color:#41506b;border-color:#d5deea}
  .b-yellow{background:#fdf4c8;color:#7a5b06;border-color:#efe1a0}
  .b-orange{background:#ffe3c2;color:#9a4f0e;border-color:#f6cfa5}
  .b-navy{background:#1b4b8f;color:#fff;border-color:#143a70}
  .ordcell{font-size:10.5px;line-height:1.4;white-space:nowrap;color:#41506b}
  .ordcell div{padding:1px 0}
  .newbar{margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .btn-new{background:linear-gradient(180deg,#f6821f,#e8590c);color:#fff;font-size:18px;font-weight:800;padding:16px 36px;border-radius:10px;
    box-shadow:0 4px 14px rgba(232,89,12,.4);letter-spacing:.4px;text-transform:uppercase}
  .btn-new:hover{background:linear-gradient(180deg,#e8590c,#c94f0a);box-shadow:0 6px 18px rgba(232,89,12,.5)}
  .btn-manage{background:#fff;border:1px solid var(--navy-2);color:var(--navy-2);font-size:14px;font-weight:700;padding:14px 22px;border-radius:10px}
  .btn-manage:hover{background:#eef3fb}
  .btn-manage.on{background:var(--navy-2);color:#fff}
  .btn-manage.drag{background:var(--navy-2);color:#fff;box-shadow:0 0 0 3px rgba(37,90,158,.35)}
  .colshead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .colsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
  .colrow{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;cursor:pointer}
  .colrow .cc{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#41506b}
  .colrow .colw{width:84px;flex:none;padding:5px 7px}
  .mgrbox{border:1px solid #cddaf0;box-shadow:0 3px 12px rgba(27,75,143,.12)}
  .mgrbox > h2{background:#eef3fb}
  .mgrhint{padding:9px 14px;font-size:12px;color:#41506b;background:#f8fafd;border-bottom:1px solid var(--line)}
  .mgrgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px;padding:14px}
  .mgrgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#41506b}
  .mgrgrid .inline{display:flex;gap:6px}
  .mgrbtns{display:flex;gap:10px;align-items:center;padding:0 14px 14px;flex-wrap:wrap}
  .selcol{width:34px;text-align:center;cursor:default}
  .selcol input{width:17px;height:17px;cursor:pointer;margin:0}
  .recvbox{margin:14px;border:1px solid #cddaf0;border-radius:8px;overflow:hidden}
  .recvh{background:#eef3fb;padding:8px 12px;font-weight:700;font-size:12.5px;color:var(--navy-2);display:flex;align-items:center;gap:10px}
  .recv-editbtn{margin-left:auto;background:#fff;border:1px solid var(--navy-2);color:var(--navy-2);font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:7px;cursor:pointer}
  .recv-editbtn:hover{background:#dbe6f7}
  .recvedit{grid-template-columns:repeat(2,1fr)}
  .recvedit label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:#41506b}
  .recvedit .inline{display:flex;gap:6px}
  .recvsave{padding:0 12px 12px}
  /* Přílohy / nabídky */
  .attbox{margin:14px;border:1px solid #cddaf0;border-radius:8px;overflow:hidden}
  .atth{background:#eef3fb;padding:8px 12px;font-weight:700;font-size:12.5px;color:var(--navy-2);display:flex;align-items:center;gap:10px}
  .att-add{margin-left:auto;background:var(--navy-2);color:#fff;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:7px;cursor:pointer}
  .att-add:hover{background:#153c74}
  .att-add.busy{opacity:.6;cursor:default}
  .attlist{padding:8px 12px;display:flex;flex-direction:column;gap:6px}
  .attrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .attlink{font-weight:600;color:var(--blue);text-decoration:none;word-break:break-all}
  .attlink:hover{text-decoration:underline}
  .attmeta{font-size:10.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .att-del{background:#fdecea;border:1px solid #f5cfca;color:var(--red);border-radius:6px;width:26px;height:26px;padding:0;font-size:13px;cursor:pointer;flex:none}
  .attempty{padding:10px 12px;font-size:12px;color:var(--muted)}
  .atthint{padding:0 12px 10px;font-size:10.5px;color:var(--muted)}
  .clip{font-size:11px;color:#41506b;white-space:nowrap}
  /* záložky v detailu */
  .mtabs{display:flex;gap:8px;margin:12px 14px 2px;padding:5px;background:#f1f4f8;border-radius:11px}
  .mtab{flex:1;background:#fff;border:1px solid var(--line);color:#41506b;padding:11px 12px;font-size:13px;font-weight:800;cursor:pointer;border-radius:8px;text-align:center;white-space:nowrap}
  .mtab:hover{background:#eaf1fb;border-color:#a9c6ec;color:#255a9e}
  .mtab.on{background:linear-gradient(180deg,#2f6bbf,#255a9e);color:#fff;border-color:#255a9e;box-shadow:0 3px 10px rgba(37,90,158,.35)}
  .mtabwrap{min-height:360px}
  .histfull{padding:14px}
  .histfull b{display:block;margin-bottom:8px;font-size:13.5px;color:#41506b}
  .histfull div{font-size:12.5px;padding:5px 2px}
  .attnote{padding:8px 12px;font-size:11.5px;color:#41506b;background:#f8fafd;border-bottom:1px solid var(--line)}
  .attbusy{font-weight:600;color:var(--green);font-size:11px}
  .attcats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
  .attcat{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .attcat-h{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#f4f6f9;font-weight:700;font-size:12px;color:#41506b}
  .attcat-h .att-add{margin-left:auto}
  .attdrop{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:46px}
  .attdrop.drag{background:#eaf2ff;outline:2px dashed var(--navy-2);outline-offset:-4px}
  .att-dl{background:#eef3fb;border:1px solid #cddaf0;color:var(--navy-2);border-radius:6px;width:26px;height:26px;padding:0;font-size:13px;cursor:pointer;flex:none}
  .att-dl:hover{background:#dbe6f7}
  @media(max-width:700px){ .attcats{grid-template-columns:1fr} }
  .recvgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;padding:12px}
  .recvgrid > div{display:flex;flex-direction:column;gap:2px}
  .recvgrid span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .recvgrid .span2{grid-column:span 2}
  .critlist{margin-top:5px;display:flex;flex-direction:column;gap:2px}
  .critline{display:flex;align-items:center;gap:6px;font-size:11px;padding:2px 4px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden}
  .critline:hover{background:var(--red-bg)}
  .critline .cno{font-weight:700;color:#c0392b;font-variant-numeric:tabular-nums}
  .critline .cwhat{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .critline .cwhere{color:var(--muted);font-weight:600}
  .rowbtn{background:#fff;border:1px solid var(--line);color:#41506b;padding:3px 8px;font-size:11px;margin:0 4px 3px 0}
  .rowbtn.ok{border-color:#c4e6d3;background:var(--green-bg);color:var(--green);font-weight:700}
  .rowbtn.no{border-color:#f5cfca;background:var(--red-bg);color:var(--red);font-weight:700}
  .stock-warn{color:var(--red);font-weight:700}
  .late{color:var(--red);font-weight:700}

  .overlay{position:fixed;inset:0;background:rgba(12,26,48,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;z-index:50}
  .modal{background:#fff;border-radius:10px;width:min(1040px,95vw);height:min(90vh,880px);margin:auto;box-shadow:0 18px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
  .modalbody{flex:1 1 auto;overflow-y:auto;min-height:0}
  .modal > h3,.modal > .mtabs,.modal > .foot{flex:none}
  .modal h3{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;margin:0;padding:14px 18px;font-size:17px;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:10px}
  .modal h3 .x{margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5);color:#fff;font-size:18px;line-height:1;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,transform .05s}
  .modal h3 .x:hover{background:rgba(255,255,255,.32)}
  .modal h3 .x:active{background:rgba(255,255,255,.5);transform:scale(.9)}
  .robar{padding:9px 15px;background:var(--grey-bg);border-bottom:1px solid var(--line);font-size:11.5px;color:#4a5a70}
  .form{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
  .f{display:flex;flex-direction:column;gap:4px}
  .f label{font-size:12.5px;font-weight:700;color:#41506b}
  .f .req{color:var(--red)}
  .f.span2{grid-column:span 2}.f.span4{grid-column:span 4}
  .f .calc{background:#f4f6f9;border:1px dashed #c8d3e0;border-radius:var(--radius);padding:7px 9px;font-weight:700;font-variant-numeric:tabular-nums}
  .f .ro{background:#fafbfd;border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;min-height:33px;white-space:pre-wrap;word-break:break-word}
  .f .err{font-size:10px;color:var(--red);font-weight:600}
  .f.invalid input,.f.invalid select,.f.invalid textarea{border-color:var(--red);background:#fff8f7}
  .modal .foot{padding:12px 15px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:#fafbfd;border-radius:0 0 8px 8px;flex-wrap:wrap}
  .modal .foot .msg{font-size:12px;color:var(--red);font-weight:600}
  .modal .foot .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .modal .form input,.modal .form select,.modal .form textarea{font-size:14.5px;padding:9px 11px}
  .modal .form .f label{font-size:13px}
  .modal .form .f .ro,.modal .form .f .calc{font-size:14px}
  .stockbox{grid-column:span 4;display:flex;align-items:center;gap:11px;background:#eef6ff;border:1px solid #cbdff5;border-radius:var(--radius);padding:12px 14px}
  .stockbox input{width:auto;transform:scale(1.25)}
  .stockbox label{font-size:14px;font-weight:700;color:#28456e;cursor:pointer;margin:0}
  .hist{padding:0 15px 12px;font-size:11px;color:var(--muted)}
  .hist div{padding:3px 0;border-top:1px dotted var(--line)}

  #qr-reader{width:100%;border-radius:6px;overflow:hidden}
  #qr-reader video{width:100%!important;height:auto!important;border-radius:6px;display:block}
  .qrbtn{background:#eef6ff;border:1px solid #cbdff5;color:#28456e;font-weight:700}

  return isNakupRO() ? {label:base.label, lvl:base.lvl, edit:false, approve:false, del:false, admin:false} : base; };

/* Filtry a volby jsou POUZE tvoje – ukládají se jen do tvého prohlížeče (localStorage),
   nejdou do databáze, takže ostatní uživatele nijak neovlivní a mají svoje vlastní. */
function saveView(){ try{ localStorage.setItem('minimo-nakup-view', JSON.stringify({filters,sort,dashRange,colHide,colW})); }catch(e){} }
function loadView(){ try{ const v=JSON.parse(localStorage.getItem('minimo-nakup-view')||'null');
  if(v){ if(v.filters) filters=Object.assign(filters,v.filters); filters.col=Object.assign(emptyCol(),filters.col||{}); if(v.sort) sort=v.sort; if(v.dashRange) dashRange=Object.assign(dashRange,v.dashRange); if(v.colHide) colHide=v.colHide; if(v.colW) colW=v.colW; } }catch(e){} }
loadView();
function monthRange(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),p=x=>String(x).padStart(2,'0'),last=new Date(y,m+1,0).getDate();return {od:`${y}-${p(m+1)}-01`,do:`${y}-${p(m+1)}-${p(last)}`};}
function yearRange(){const y=new Date().getFullYear();return {od:y+'-01-01',do:y+'-12-31'};}
function dashPreset(){ if(!dashRange.od&&!dashRange.do) return 'all';
  const m=monthRange(),y=yearRange();
  if(dashRange.od===m.od&&dashRange.do===m.do) return 'month';
  if(dashRange.od===y.od&&dashRange.do===y.do) return 'year';
  return ''; }
const dateCz = d => d ? String(d).slice(0,10).split('-').reverse().map(x=>String(Number(x))).join('. ')+'.' : '—';
const acc = c => (cfg?.accounts||[]).find(a=>a.code===c);
const accName = c => (acc(c)||{}).name || '';
const accLabel = c => c ? (accName(c)?c+' — '+accName(c):c) : '';
const cc = c => (cfg?.costCenters||[]).find(a=>a.code===c);
const ccName = c => (cc(c)||{}).name || '';
const ccLabel = c => c ? (ccName(c)?c+' — '+ccName(c):c) : '';
/* Podbarvení řádků dle stavu (klíče stavů zůstávají): nový=bílá, poptáno=žlutá,
   schváleno=oranžová, PO ve schvalování=světle modrá, PO odesláno=tmavší modrá,
   doručeno=zelená, zamítnuto=šedá. */
const ROW_TINT = {'nový':'#ffffff','poptáno':'#fdf7d6','schváleno':'#ffe9d1','ve schvalování':'#e7eefb','odesláno':'#c2d6f5','doručeno':'#d3f1dc','zamítnuto':'#eef1f5'};
const needsPoptat = r => (Number(r.cena)||0)===0 && r.status==='nový' && !r.approvedBy;
const toAskGlobal = () => rows.filter(needsPoptat).length;

/* ==========================================================
   FIREBASE — auth, načítání, zápis
   ========================================================== */
let unsubRows=null, unsubUsers=null;

onAuthStateChanged(auth, async (user)=>{
  authReady=true;
  loginBusy=false;                       // po (od)přihlášení vždy uvolnit přihlašovací formulář
  if(!user){ me=null; loginErr=''; fatalErr=''; teardown(); render(); return; }
  try{
    me = await loadProfile(user);
    if(nakupBlocked()){ render(); return; }   // modul skrytý – nenačítáme data
    await ensureConfig();
    subscribeRows();
    if(P().admin) subscribeUsers();
    render();
  }catch(e){ fatalErr = 'Chyba při načítání dat: '+e.message; render(); }
});

function teardown(){ if(unsubRows){unsubRows();unsubRows=null;} if(unsubUsers){unsubUsers();unsubUsers=null;} rows=[]; usersList=[]; dataReady=false; }

async function ensureConfig(){
  const ref = doc(db,'meta','config');
  const snap = await getDoc(ref);
  if(!snap.exists()){
    await setDoc(ref, DEFAULT_CONFIG);        // první přihlášený založí výchozí konfiguraci
    cfg = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  }else{
    cfg = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), snap.data());
  }
}

async function loadProfile(user){
  const ref = doc(db,'users',user.uid);
  const snap = await getDoc(ref);
  const forced = isForcedAdmin(user.email);
  if(snap.exists()){
    const d = snap.data();
    const role = forced ? 'admin' : (d.role||'zadavatel');
    // účet ze seznamu "vždy admin", ale v databázi admina nemá → doplníme ho
    if(forced && d.role!=='admin'){ try{ await updateDoc(ref,{role:'admin'}); }catch(e){} }
    // doplň/oprav e-mail v profilu podle přihlašovacího e-mailu (dřív se u některých neuložil)
    if(user.email && d.email!==user.email){ try{ await updateDoc(ref,{email:user.email}); }catch(e){} }
    const level = (d.level && LEVEL_RANK[d.level]) ? d.level : (ROLE2LEVEL[role]||'basic');
    return {uid:user.uid, email:user.email, name:d.name||user.email, role, team:d.team||'—', level, modules:d.modules||{}, photoURL:d.photoURL||'', firstName:d.firstName||'', lastName:d.lastName||''};
  }
  // první uživatel v systému = admin; účty ze seznamu taky; ostatní zadavatelé
  const anyUsers = await getDocs(collection(db,'users'));
  const role = (forced || anyUsers.empty) ? 'admin' : 'zadavatel';
  const prof = {name:user.email.split('@')[0], email:user.email, role, team: role==='admin'?'Administrátor':'—'};
  await setDoc(ref, prof);
  return Object.assign({uid:user.uid, email:user.email, level:ROLE2LEVEL[role]||'basic', modules:{}}, prof);
}

function subscribeRows(){
  if(unsubRows) return;
  const q1 = query(collection(db,'requests'), orderBy('createdTs','desc'));
  unsubRows = onSnapshot(q1, snap=>{
    rows = snap.docs.map(d=>Object.assign({_id:d.id}, d.data()));
    dataReady=true;
    // Nepřekresluj na pozadí, když je otevřený rozepsaný požadavek (nebo skener) –
    // překreslení by zahodilo hodnoty, které uživatel ještě nestihl uložit (dodavatel,
    // e-mail o naskladnění, poznámka…). Data se tiše aktualizují a projeví se po zavření/uložení.
    if(!qrOpen && !editing) render();
  }, err=>{ fatalErr='Nemám přístup k datům: '+err.message; render(); });
}
function subscribeUsers(){
  if(unsubUsers) return;
  unsubUsers = onSnapshot(collection(db,'users'), snap=>{
    usersList = snap.docs.map(d=>Object.assign({uid:d.id}, d.data()));
    if(tab==='admin') render();
  }, ()=>{});
}

async function saveConfig(){
  try{ await setDoc(doc(db,'meta','config'), cfg); }
  catch(e){ toast('Nastavení se neuložilo: '+e.message,'err'); }
}

/* Založí nový přihlašovací účet (e-mail + heslo) ve Firebase Authentication.
   Používá dočasnou druhou instanci aplikace, aby vytvořením účtu NEODHLÁSILO
   admina — ten zůstane přihlášený pod svým účtem. Vrací uid nového účtu. */
async function createUserAccount(email,password){
  const secApp = initializeApp(firebaseConfig,'userCreator');
  const secAuth = getAuth(secApp);
  try{
    const cred = await createUserWithEmailAndPassword(secAuth,email,password);
    const uid = cred.user.uid;
    await signOut(secAuth);
    return uid;
  }finally{
    await deleteApp(secApp);
  }
}

/* ==========================================================
   RENDER
   ========================================================== */
function render(){
  const app=document.getElementById('app');
  if(!authReady){ app.innerHTML=splash('Připojuji se k Firebase…'); return; }
  if(fatalErr){ app.innerHTML=splash(fatalErr,true); bind(); return; }
  if(!me){ app.innerHTML=loginView()+dlgView()+`<div id="toast-node">${toastView()}</div>`; bind(); return; }
  if(nakupBlocked()){ app.innerHTML=noAccessView(); bind(); return; }
  if(!dataReady){ app.innerHTML=splash('Načítám požadavky…'); return; }
  saveView();   // zapamatuj si tvoje filtry jen v tomto prohlížeči
  // zapamatuj pozici scrollu, ať po otevření/zavření detailu seznam nepřeskočí nahoru
  const _pw=document.getElementById('tblwrap'); const _sTbl=_pw?_pw.scrollTop:null; const _sWin=window.scrollY;
  const _pi=document.getElementById('imp-tblwrap'); const _sImp=_pi?_pi.scrollTop:null;
  app.innerHTML = shell()+dlgView()+(qrOpen?qrScanView():'')+`<div id="toast-node">${toastView()}</div>`;
  bind();
  const _nw=document.getElementById('tblwrap'); if(_nw&&_sTbl!=null) _nw.scrollTop=_sTbl;
  const _ni=document.getElementById('imp-tblwrap'); if(_ni&&_sImp!=null) _ni.scrollTop=_sImp;
  if(_sWin) window.scrollTo(0,_sWin);
  const di=document.getElementById('dlg-input'); if(di){di.focus();di.select();}
}

/* ---------- seznam ---------- */
function visibleRows(){
  let r=rows.slice();
  if(filters.mine) r=r.filter(x=>x.author===me.uid);
  if(filters.grp==='open') r=r.filter(x=>!['doručeno','zamítnuto'].includes(x.status));
  else if(filters.grp==='closed') r=r.filter(x=>['doručeno','zamítnuto'].includes(x.status));
  if(filters.status) r=r.filter(x=>x.status===filters.status);
  if(filters.priorita) r=r.filter(x=>x.priorita===filters.priorita);
  if(filters.ucet) r=r.filter(x=>x.ucet===filters.ucet);
  if(filters.usek) r=r.filter(x=>x.usek===filters.usek);
  if(filters.typ) r=r.filter(x=>(x.typ||'Nový požadavek')===filters.typ);
  if(filters.od) r=r.filter(x=>(x.created||'')>=filters.od);
  if(filters.do) r=r.filter(x=>(x.created||'')<=filters.do);
  const has=(v,q)=>String(v||'').toLowerCase().includes(q.toLowerCase());
  if(filters.reqNo) r=r.filter(x=>has(x.reqNo,filters.reqNo));
  if(filters.rfqNo) r=r.filter(x=>has(x.rfqNo,filters.rfqNo));
  if(filters.orderNo) r=r.filter(x=>has(x.orderNo,filters.orderNo));
  // filtry pod záhlavím sloupců (textové sloupce)
  const cf=filters.col||{};
  if(cf.poradove) r=r.filter(x=>has(x.poradove,cf.poradove));
  if(cf.created)  r=r.filter(x=>has(dateCz(x.created),cf.created));
  if(cf.sklad)    r=r.filter(x=>has(x.sklad,cf.sklad));
  if(cf.popis)    r=r.filter(x=>has((x.popis||'')+' '+(x.duvod||'')+' '+(x.poznamka||''),cf.popis));
  if(cf.mnozstvi) r=r.filter(x=>has(x.mnozstvi,cf.mnozstvi));
  if(cf.cena)     r=r.filter(x=>has(x.cena,cf.cena));
  if(cf.total)    r=r.filter(x=>has(total(x),cf.total));
  if(cf.celkem)   r=r.filter(x=>has(totalEur(x),cf.celkem));
  if(cf.dodavatel)r=r.filter(x=>has(x.dodavatel,cf.dodavatel));
  if(cf.vyrobce)  r=r.filter(x=>has(x.vyrobce,cf.vyrobce));
  if(cf.objednavka)r=r.filter(x=>has([x.reqNo,x.rfqNo,x.orderNo,x.dssiItem].join(' '),cf.objednavka));
  if(cf.datum){ const dq=cf.datum.toLowerCase().replace(/\s/g,'');
    r=r.filter(x=>((dateCz(x.datum)+' '+(x.datum||'')).toLowerCase().replace(/\s/g,'')).includes(dq)); }
  if(cf.zadal)    r=r.filter(x=>has(x.authorName,cf.zadal));
  if(cf.schvalil) r=r.filter(x=>has(x.approvedBy,cf.schvalil));
  if(filters.q){const q=filters.q.toLowerCase();
    r=r.filter(x=>[x.poradove,x.sklad,x.popis,x.duvod,x.vyrobce,x.poznamka,x.reqNo,x.rfqNo,x.orderNo,x.dssiItem].join(' ').toLowerCase().includes(q));}
  const c=sort.col;
  r.sort((a,b)=>{
    let x=(c==='celkem'||c==='total')?totalEur(a):a[c], y=(c==='celkem'||c==='total')?totalEur(b):b[c];
    if(typeof x==='number'||typeof y==='number') return ((x||0)-(y||0))*sort.dir;
    return String(x??'').localeCompare(String(y??''),'cs')*sort.dir;
  });
  return r;
}
/* Dynamické CSS pro skrytí sloupců a jejich šířku (podle voleb uživatele). */
function colStyleCss(){
  let css='';
  for(const c of COLS) if(colHide[c.k]) css+=`[data-col="${c.k}"]{display:none!important}`;
  for(const c of COLS){ const w=colW[c.k]; if(w) css+=`th[data-col="${c.k}"],td[data-col="${c.k}"]{width:${w}px;min-width:${w}px;max-width:${w}px;white-space:normal;overflow:hidden;word-break:break-word}`; }
  return css;
}

    <div class="colsgrid">${COLS.map(c=>`<label class="colrow"><span class="cc"><input type="checkbox" data-a="col-vis" data-v="${c.k}" ${colHide[c.k]?'':'checked'}> ${esc(c.l)}</span>

function roleNotice(){
  if(P().admin) return `<div class="notice">Máš plná práva. Povinná pole, uživatele a účty spravuješ v záložce Administrace.</div>`;
  if(me.role==='skladnik') return `<div class="notice">Jako skladník měníš stav požadavků, datum dodání, účet i ostatní údaje. ${toAskGlobal()?`<b>${toAskGlobal()} nových požadavků nemá cenu — poptej je u dodavatele</b> tlačítkem Poptat.`:'Doplníš-li cenu, požadavek se sám posune ke schválení.'}</div>`;
  if(me.role==='schvalovatel') return `<div class="notice">Otevři požadavek a odklikni <b>Schválit</b> nebo <b>Zamítnout</b>. Stačí schválení jednoho ze schvalovatelů — schválit můžeš i požadavek bez ceny. Ostatní údaje upravuje sklad.</div>`;
  return `<div class="notice">Zakládáš požadavky a sleduješ jejich stav. Cenu vyplň, jen když ji znáš. Odeslaný požadavek už neupravíš — změnu napiš skladu.</div>`;
}
function listView(){
  const rr=visibleRows();
  const allSelected = rr.length>0 && rr.every(r=>mgrSel.has(r._id));   // „vybrat vše" dle aktuálního filtru
  // ukazatele (dashboard) se počítají za zvolené období podle data vytvoření
  const inDash = r => (!dashRange.od||(r.created||'')>=dashRange.od) && (!dashRange.do||(r.created||'')<=dashRange.do);
  const dashRows=rows.filter(inDash);
  const open=dashRows.filter(r=>['nový','ve schvalování','poptáno'].includes(r.status)).length;
  const waiting=dashRows.filter(r=>!r.approvedBy && !['zamítnuto','doručeno'].includes(r.status)).length;
  const toAsk=dashRows.filter(needsPoptat).length;
  const crit=dashRows.filter(r=>r.priorita==='kritická'&&!['doručeno','zamítnuto'].includes(r.status)).length;
  const critRows=dashRows.filter(r=>r.priorita==='kritická'&&!['doručeno','zamítnuto'].includes(r.status)).sort((a,b)=>String(a.created).localeCompare(String(b.created)));
  const sumEur=dashRows.filter(r=>r.status!=='zamítnuto').reduce((a,r)=>a+totalEur(r),0);
  const card=(l,v,n,c)=>`<div class="kcard" style="border-left-color:${c}"><div class="lbl">${l}</div><div class="val" style="color:${c}">${v}</div><div class="note">${n}</div></div>`;
  const th=(c,l)=>`<th data-col="${c}" data-a="sort" data-v="${c}">${l}${sort.col===c?(sort.dir===1?' ▲':' ▼'):''}</th>`;
  const shorten=(t,n=42)=>t&&t.length>n?t.slice(0,n-1).trim()+'…':t;
  const critCard=`<div class="kcard" style="border-left-color:${crit?'#c0392b':'#6b7a90'}">
    <div class="lbl">Kritická priorita</div><div class="val" style="color:${crit?'#c0392b':'#6b7a90'}">${crit}</div>
    ${crit?`<div class="critlist">${critRows.slice(0,4).map(r=>`<div class="critline" data-a="open" data-v="${r._id}" title="${esc(r.popis||r.duvod)}">
        <span class="cno">${esc((r.poradove||'—').replace('NP-2026-','#'))}</span><span class="cwhat">${esc(shorten(r.popis||r.duvod))}</span>
        <span class="cwhere">${esc(r.stroj||r.usek||'—')}</span>
        <span class="badge ${(STATUSES.find(s=>s.k===r.status)||{}).cls}" style="font-size:9px">${esc(statusLabel(r.status))}</span></div>`).join('')}${crit>4?`<div class="note" style="margin-top:4px">…a další ${crit-4}</div>`:''}</div>`:`<div class="note">nevyřízené</div>`}
  </div>`;
  const closedStatuses=['doručeno','zamítnuto'];
  const openCount=rows.filter(r=>!closedStatuses.includes(r.status)).length;
  const closedCount=rows.filter(r=>closedStatuses.includes(r.status)).length;
  const anyFilter = filters.q||filters.grp||filters.status||filters.priorita||filters.ucet||filters.usek||filters.typ||filters.od||filters.do||filters.mine||filters.reqNo||filters.rfqNo||filters.orderNo||Object.values(filters.col||{}).some(Boolean);
  const dashActive = k => (dashPreset()===k?'on':'');
  const periodTxt = (dashRange.od||dashRange.do) ? `${dashRange.od?dateCz(dashRange.od):'…'} – ${dashRange.do?dateCz(dashRange.do):'…'}` : 'celá historie';
  return `
  <style>${colStyleCss()}</style>
  <div class="dashbar">
    <span class="dl">Ukazatele za období:</span>
    <button class="dchip ${dashActive('all')}" data-a="dash-all">Vše</button>
    <button class="dchip ${dashActive('month')}" data-a="dash-month">Tento měsíc</button>
    <button class="dchip ${dashActive('year')}" data-a="dash-year">Tento rok</button>
    <span class="datefilter">Od <input type="date" id="d-od" value="${esc(dashRange.od)}">–<input type="date" id="d-do" value="${esc(dashRange.do)}"></span>
    <span class="dnote">${dashRows.length} z ${rows.length} požadavků · ${esc(periodTxt)}</span>
  </div>
  <div class="cards">
    ${card('Otevřené požadavky',open,'poptáno · nový · ve schvalování','#16355f')}
    ${card('K poptání u dodavatele',toAsk,'nové požadavky bez ceny',toAsk?'#b7791f':'#6b7a90')}
    ${critCard}
    ${card('Hodnota požadavků',num(sumEur,0)+' €','za období, bez zamítnutých · kurz '+num(cfg.rates.CZK,2)+' CZK/EUR','#6b46c1')}

      <button class="btn-ghost" data-a="mgr-clear">Vyčistit</button>

const czCount = n => `${n} požadavk${n===1?'':(n>=2&&n<=4?'y':'ů')}`;
async function mgrApply(receiveComplete){
  if(!P().edit){ toast('Na hromadné úpravy nemáš právo.','err'); return; }
  const sel=rows.filter(r=>mgrSel.has(r._id));
  if(!sel.length){ toast('Nejdřív zaškrtni aspoň jeden požadavek.','err'); return; }
  if(!receiveComplete){
    const anyField = mgr.reqNo!==''||mgr.rfqNo!==''||mgr.orderNo!==''||mgr.dssiItem!==''||mgr.recvQty!==''||mgr.recvDate!==''||mgr.docType!==''||mgr.docNo!==''||mgr.comment!==''||mgr.status!=='';
    if(!anyField){ toast('Vyplň aspoň jedno políčko, které se má změnit.','err'); return; }
  }
  let ok=0, fail=0;
  for(const r of sel){
    const patch={}, ch=[];
    if(receiveComplete){
      patch.receivedQty=Number(r.mnozstvi)||0; patch.receivedDate=today(); patch.status='doručeno';
      ch.push(`přijato kompletně (${patch.receivedQty} ks) → doručeno`);
    } else {
      if(mgr.reqNo!==''){ patch.reqNo=mgr.reqNo.trim(); ch.push('Req no. '+patch.reqNo); }
      if(mgr.rfqNo!==''){ patch.rfqNo=mgr.rfqNo.trim(); ch.push('RFQ no. '+patch.rfqNo); }
      if(mgr.orderNo!==''){ patch.orderNo=mgr.orderNo.trim(); ch.push('Order no. '+patch.orderNo); }
      if(mgr.dssiItem!==''){ patch.dssiItem=mgr.dssiItem.trim(); ch.push('DSSI item '+patch.dssiItem); }
      if(mgr.recvQty!==''){ patch.receivedQty=Number(mgr.recvQty)||0; ch.push('přijato '+patch.receivedQty+' ks'); }
      if(mgr.recvDate!==''){ patch.receivedDate=mgr.recvDate; ch.push('datum přijetí '+dateCz(mgr.recvDate)); }
      if(mgr.docType!==''||mgr.docNo!==''){ patch.docType=mgr.docType; patch.docNo=mgr.docNo.trim(); ch.push('doklad '+((mgr.docType||'')+' '+(mgr.docNo||'')).trim()); }
      if(mgr.comment!==''){ patch.skladComment=mgr.comment.trim(); ch.push('komentář skladu'); }
      if(mgr.status!==''){ patch.status=mgr.status; ch.push('stav → '+mgr.status); }
    }
    if(!Object.keys(patch).length) continue;
    patch.hist=(r.hist||[]).concat(`${today()} · ${me.name} · hromadná úprava: ${ch.join(', ')}`);
    try{ await updateDoc(doc(db,'requests',r._id),patch); ok++; }
    catch(e){ fail++; }
  }
  mgrSel.clear();
  mgr={reqNo:'',rfqNo:'',orderNo:'',dssiItem:'',recvQty:'',recvDate:'',docType:'',docNo:'',comment:'',status:''};  // po použití vyprázdnit políčka, ať se nepřenesou na další dávku
  toast(`Upraveno ${czCount(ok)}.`+(fail?` (${fail} se nepovedlo — zkus to znovu)`:''), fail?'err':'ok');
  render();
}

/* ---------- modal ---------- */
function canEditRow(isNew, r){
  if(isNew || P().edit) return true;
  // autor smí doplnit údaje (hlavně cenu) u vlastního požadavku, dokud je „nový", bez ceny a neschválený
  if(r && r.status==='nový' && !r.approvedBy && (Number(r.cena)||0)===0 && r.author===(me&&me.uid)) return true;
  return false;
}
function machineSelect(r){
  const sec=cfg.sections.find(x=>x.name===r.usek); const ms=sec?sec.machines:[];
  if(!sec) return `<select id="e-stroj" disabled><option value="">nejdřív vyber linku</option></select>`;
  if(!ms.length) return `<select id="e-stroj" disabled><option value="">linka nemá stroje</option></select>`;
  return `<select id="e-stroj"><option value="">— celá linka (bez stroje) —</option>${ms.map(m=>`<option ${r.stroj===m?'selected':''}>${esc(m)}</option>`).join('')}</select>`;
}

      ${wrapL('typ','Druh požadavku',`<select id="e-typ">${TYPES.map(t=>`<option ${(r.typ||'Nový požadavek')===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`,'span2')}

      ${wrapL('vyrobce','Výrobce',`<input id="e-vyrobce" list="vyrobci-list" value="${esc(r.vyrobce)}" placeholder="nepovinné — Hasco, Engel, Wera…"><datalist id="vyrobci-list">${vyrobci.map(m=>`<option value="${esc(m)}"></option>`).join('')}</datalist>`)}

      ${roL('Důvod objednání',r.duvod,'span4')}
      ${ro('mnozstvi',(r.mnozstvi!==''&&r.mnozstvi!=null)?(r.mnozstvi+' '+(r.jednotka||'ks')):'')}

      <div class="f"><label>Cena celkem</label><div class="calc">${(Number(r.cena)||0)?num(total(r))+' '+esc(r.mena):'—'}</div></div>
      <div class="f"><label>Cena v EUR</label><div class="calc">${(Number(r.cena)||0)?num(totalEur(r))+' €':'—'}</div></div>
      ${roL('Dodavatel',r.dodavatel)}
      ${roL('Výrobce',r.vyrobce)}
      ${ro('ucet',accLabel(r.ucet))}
      ${roL('CostCenter',ccLabel(r.costcenter))}
      <div class="f"><label>Linka / stroj</label><div class="ro">${r.usek?esc(r.usek)+(r.stroj?' · '+esc(r.stroj):''):'<span class="muted">—</span>'}</div></div>
      ${roL('Předpokládané datum dodání',dateCz(r.datum))}

  const roleBar = ed
      ? `<div class="robar">Vyplň ručně, nebo klikni na 📷 u <b>skladového čísla</b> a naskenuj štítek dílu. Pokud položka skladové číslo nemá, zaškrtni <b>TXT</b>.</div>`
      : (me.role==='schvalovatel'
      ? `<div class="robar">Jako schvalovatel požadavek neupravuješ — rozhoduješ o něm tlačítky dole. Změny údajů zadej skladu.</div>`
      : `<div class="robar">Požadavek je jen ke čtení. Změnu domluv se skladem.</div>`);
  const hasRecv = !isNew && (r.reqNo||r.rfqNo||r.orderNo||r.dssiItem||r.receivedDate||r.docType||r.docNo||r.skladComment||(r.receivedQty!==undefined&&r.receivedQty!==''));
  const recvEditable = !isNew && P().edit;                 // přepsat req. čísla smí jen skladník/admin
  const showRecv = hasRecv || recvEditable;
  const recvBody = (recvEdit && recvEditable) ? `<div class="recvgrid recvedit">
      <label>Req no.<input id="e-reqno" value="${esc(r.reqNo||'')}"></label>
      <label>RFQ no.<input id="e-rfqno" value="${esc(r.rfqNo||'')}"></label>
      <label>Order no.<input id="e-orderno" value="${esc(r.orderNo||'')}"></label>
      <label>DSSI item<input id="e-dssi" value="${esc(r.dssiItem||'')}"></label>
      <label>Přijaté množství<input id="e-recvqty" type="number" min="0" step="1" value="${esc((r.receivedQty===undefined||r.receivedQty==='')?'':r.receivedQty)}"></label>
      <label>Datum přijetí<input id="e-recvdate" type="date" value="${esc(r.receivedDate||'')}"></label>
      <label>Doklad<div class="inline">
        <select id="e-doctype"><option value="">— typ —</option>${DOCTYPES.map(t=>`<option ${r.docType===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
        <input id="e-docno" value="${esc(r.docNo||'')}" placeholder="číslo dokladu"></div></label>
      <label class="span2">Komentář skladu<input id="e-skladcomment" value="${esc(r.skladComment||'')}" placeholder="nepřepíše Poznámku"></label>
    </div>
    <div class="recvsave"><button class="btn-ok" data-a="recv-save">Uložit příjem/sklad</button></div>` : `<div class="recvgrid">
      <div><span>Req no.</span><b>${esc(r.reqNo||'—')}</b></div>
      <div><span>RFQ no.</span><b>${esc(r.rfqNo||'—')}</b></div>
      <div><span>Order no.</span><b>${esc(r.orderNo||'—')}</b></div>
      <div><span>DSSI item</span><b>${esc(r.dssiItem||'—')}</b></div>
      <div><span>Přijaté množství</span><b>${(r.receivedQty!==undefined&&r.receivedQty!=='')?esc(r.receivedQty)+' / '+esc(r.mnozstvi||0)+' ks':'—'}</b></div>
      <div><span>Datum přijetí</span><b>${r.receivedDate?esc(dateCz(r.receivedDate)):'—'}</b></div>
      <div><span>Doklad</span><b>${(r.docType||r.docNo)?esc(((r.docType||'')+' '+(r.docNo||'')).trim()):'—'}</b></div>
      <div class="span2"><span>Komentář skladu</span><b>${esc(r.skladComment||'—')}</b></div>
    </div>`;
  const receiveInfo = !isNew ? `<div class="recvbox"><div class="recvh">📦 Příjem / sklad${recvEditable?`<button class="recv-editbtn" data-a="recv-edit">${recvEdit?'✕ Zrušit editaci':'✎ Editace'}</button>`:''}</div>${recvBody}</div>` : '';
  const attCan = canAttach(r);
  const attBlock = renderAttachments(r,isNew,attCan);
  const histContent = (r.hist&&r.hist.length)
    ? `<div class="hist histfull"><b>Historie požadavku</b>${r.hist.slice().reverse().map(h=>`<div>${esc(h)}</div>`).join('')}</div>`
    : `<div class="attempty">Zatím žádné záznamy v historii.</div>`;
  const tabbar = !isNew ? `<div class="mtabs">
      <button class="mtab ${modalTab==='pozadavek'?'on':''}" data-a="mtab" data-v="pozadavek">Požadavek</button>
      <button class="mtab ${modalTab==='prijem'?'on':''}" data-a="mtab" data-v="prijem">Příjem / Sklad</button>
      <button class="mtab ${modalTab==='prilohy'?'on':''}" data-a="mtab" data-v="prilohy">Přílohy${(r.files&&r.files.length)?` (${r.files.length})`:''}</button>
      <button class="mtab ${modalTab==='historie'?'on':''}" data-a="mtab" data-v="historie">Historie</button>
    </div>` : '';
  let content;
  if(isNew) content = `${roleBar}<div class="form">${body}</div>${attBlock}`;
  else if(modalTab==='prijem') content = receiveInfo;
  else if(modalTab==='prilohy') content = attBlock;
  else if(modalTab==='historie') content = histContent;
  else content = `${roleBar}<div class="form">${body}</div>`;
  return `<div class="overlay"><div class="modal">
    <h3>${isNew?'Nový nákupní požadavek':esc(r.poradove)}${!isNew?` <span style="font-weight:400;opacity:.8;font-size:12px">${esc(r.authorName||'')}</span>`:''}<button class="x" data-a="close">✕</button></h3>
    ${tabbar}
    <div class="modalbody">${content}</div>
    <div class="foot">
      ${footMsg?`<span class="msg">${esc(footMsg)}</span>`:(ed?`<span class="muted">Pole s <span style="color:#c0392b">*</span> jsou povinná.</span>`:'')}
      <div class="r">
        ${(!isNew&&P().edit&&needsPoptat(r))?`<button class="btn-ghost" data-a="poptat" data-v="${r._id}">Poptat</button>`:''}
        ${(!isNew&&P().approve&&!r.approvedBy&&r.status!=='zamítnuto')?`<button class="btn-danger" data-a="reject" data-v="${r._id}">✕ Zamítnout</button><button class="btn-ok" data-a="approve" data-v="${r._id}">✔ Schválit za sebe</button>`:''}
        ${(!isNew&&!isNakupRO())?`<button class="btn-ghost" data-a="dup" data-v="${r._id}">Kopie</button>`:''}
        ${(!isNew&&P().del&&r.status!=='doručeno')?`<button class="btn-danger" data-a="del" data-v="${r._id}">Smazat</button>`:''}
        <button class="btn-ghost" data-a="close">${ed?'Zrušit':'Zavřít'}</button>
        ${ed?`<button class="btn-primary" data-a="save">${isNew?'Založit požadavek':'Uložit změny'}</button>`:''}
      </div>
    </div>
  </div></div>`;
}

/* Přílohy rozdělené do kategorií (Nabídka / PO / Dodací list / Faktura / Ostatní). */
function renderAttachments(r,isNew,attCan){
  const note = isNew
    ? `<div class="attnote">ℹ️ Přílohy se nahrají do úložiště <b>až po uložení požadavku</b> (po kliknutí „Založit požadavek"). Zatím jsou jen připravené.</div>`
    : `<div class="attnote">Soubor otevřeš klikem na název, stáhneš tlačítkem ⬇ (nebo zkus přetáhnout na plochu). Nahrát můžeš i <b>přetažením souboru</b> do dlaždice. Max 5 MB.</div>`;
  const cats = ATT_CATS.map(c=>{
    let items='';
    if(isNew){
      items = pendingFiles.map((p,i)=>({p,i})).filter(x=>(x.p.cat||'ostatni')===c.key)
        .map(x=>`<div class="attrow"><span class="attlink">📄 ${esc(x.p.file.name)}</span><span class="attmeta">${esc(fmtSize(x.p.file.size))} · připraveno</span>${attCan?`<button class="att-del" data-a="unqueue-file" data-v="${x.i}" title="Odebrat">✕</button>`:''}</div>`).join('');
    } else {
      items = (r.files||[]).map((f,i)=>({f,i})).filter(x=>(x.f.cat||'ostatni')===c.key)
        .map(x=>`<div class="attrow" draggable="true" data-dl="${x.i}"><a class="attlink" href="${esc(x.f.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Otevřít ${esc(x.f.name)}">📄 ${esc(x.f.name)}</a><span class="attmeta">${x.f.size?esc(fmtSize(x.f.size)):''}${x.f.by?' · '+esc(x.f.by):''}</span><button class="att-dl" data-a="dl-file" data-v="${x.i}" title="Stáhnout">⬇</button>${attCan?`<button class="att-del" data-a="del-file" data-v="${x.i}" title="Smazat">✕</button>`:''}</div>`).join('');
    }
    return `<div class="attcat">
      <div class="attcat-h">${esc(c.label)}${attCan?`<label class="att-add">+ soubor<input type="file" data-a="upload-file" data-v="${c.key}" accept="${ATT_ACCEPT}" multiple hidden></label>`:''}</div>
      <div class="attdrop ${attCan?'':'ro'}" data-cat="${c.key}">${items||`<div class="attempty">${attCan?'Přetáhni sem soubor nebo „+ soubor".':'Žádné soubory.'}</div>`}</div>
    </div>`;
  }).join('');
  return `<div class="attbox"><div class="atth">📎 Přílohy${uploadBusy?' <span class="attbusy">— nahrávám…</span>':''}</div>${note}<div class="attcats">${cats}</div></div>`;
}

function startQr(){
  if(qr) return;
  const msg=t=>{const m=document.getElementById('qr-msg');if(m){m.style.display='block';m.textContent=t;}};
  if(!window.Html5Qrcode){ msg('Čtečka se nenačetla — zkontroluj připojení k internetu a zkus to znovu.'); return; }
  try{
    qr=new Html5Qrcode('qr-reader');
    qr.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},
      txt=>onQrScan(txt), ()=>{}
    ).catch(e=>{ qr=null; msg('Kameru se nepodařilo spustit: '+(e&&e.message?e.message:e)); });
  }catch(e){ qr=null; msg('Kameru se nepodařilo spustit.'); }
}
function stopQr(){ if(qr){ const x=qr; qr=null; try{ x.stop().then(()=>x.clear()).catch(()=>{}); }catch(e){} } }
function onQrScan(text){ if(!qr) return; stopQr(); applyScan(text); }
function applyScan(text){
  qrOpen=false;
  let data=null;
  try{ const j=JSON.parse(text); if(j&&typeof j==='object'&&!Array.isArray(j)) data=j; }catch(e){}
  if(editing){
    if(data){
      ['sklad','popis','duvod','vyrobce','ucet','usek','stroj','url','mnozstvi','cena','mena','priorita'].forEach(k=>{
        if(data[k]!==undefined&&data[k]!==null&&data[k]!=='') editing[k]=data[k];
      });
    }else{
      editing.sklad=String(text).trim();
    }
  }
  render();
  toast('Načteno z QR kódu.','ok');
}
function toast(msg,kind=''){
  toastMsg=msg;toastKind=kind;clearTimeout(toast._t);
  const host=document.getElementById('app');
  if(host){let n=document.getElementById('toast-node');if(!n){n=document.createElement('div');n.id='toast-node';host.appendChild(n);}n.innerHTML=`<div class="toast ${kind}">${esc(msg)}</div>`;}
  toast._t=setTimeout(()=>{toastMsg=null;const n=document.getElementById('toast-node');if(n)n.innerHTML='';},4500);
}

/* ---------- formulář: sběr, přepočet, validace ---------- */
function collect(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:undefined;};
  // čísla čti jen když pole opravdu existuje (jinak by se při přepnutí záložky přepsala na 0)
  const gnum=id=>{const el=document.getElementById(id);return el?(Number(el.value)||0):undefined;};
  const set={status:g('e-status'),typ:g('e-typ'),sklad:g('e-sklad'),popis:g('e-popis'),duvod:g('e-duvod'),priorita:g('e-priorita'),
    mnozstvi:gnum('e-mnozstvi'),jednotka:g('e-jednotka'),cena:gnum('e-cena'),mena:g('e-mena'),dodavatel:g('e-dodavatel'),vyrobce:g('e-vyrobce'),
    ucet:g('e-ucet'),costcenter:g('e-costcenter'),usek:g('e-usek'),stroj:g('e-stroj'),datum:g('e-datum'),
    min:gnum('e-min'),max:gnum('e-max'),url:g('e-url'),notifyEmail:g('e-notify'),poznamka:g('e-poznamka')};
  Object.keys(set).forEach(k=>{if(set[k]!==undefined)editing[k]=set[k];});
  const ns=document.getElementById('e-newstock'); if(ns) editing.newStock=ns.checked;
  // editace sekce Příjem/sklad (jen pokud jsou její pole na stránce)
  if(document.getElementById('e-reqno')){
    editing.reqNo=g('e-reqno')||''; editing.rfqNo=g('e-rfqno')||''; editing.orderNo=g('e-orderno')||''; editing.dssiItem=g('e-dssi')||'';
    const rq=g('e-recvqty'); editing.receivedQty=(rq===''||rq===undefined)?'':Number(rq);
    editing.receivedDate=g('e-recvdate')||''; editing.docType=g('e-doctype')||''; editing.docNo=g('e-docno')||''; editing.skladComment=g('e-skladcomment')||'';
  }
}
function recalc(){
  collect();
  const t=document.getElementById('c-total'),e=document.getElementById('c-eur');
  if(t)t.textContent=num(total(editing))+' '+editing.mena;
  if(e)e.textContent=num(totalEur(editing))+' €';
  const h=document.getElementById('auto-hint');
  if(h){const isNew=!editing._id;
    h.className='autohint grey';
    h.textContent=isNew?'Nový požadavek se vždy založí ve stavu „nový". Stav pak mění ručně jen sklad nebo admin.':'Stav mění ručně jen sklad nebo admin — doplnění ceny stav automaticky nezmění.';}
}
function validate(){
  errs={};
  const empty=v=>v===''||v===null||v===undefined||(typeof v==='number'&&v===0);
  cfg.fields.forEach(f=>{
    if(!f.req || f.id==='status' || f.id==='popis') return;
    if((f.id==='min'||f.id==='max') && !editing.newStock) return;   // MIN/MAX se vyžadují jen při zakládání skladové položky
    if(empty(editing[f.id])) errs[f.id]='Povinné pole';
  });
  if(empty(editing.duvod))errs.duvod='Povinné pole';
  if(editing.url&&!/^https?:\/\//i.test(editing.url))errs.url='Odkaz musí začínat http:// nebo https://';
  if(editing.min&&editing.max&&Number(editing.min)>Number(editing.max))errs.max='MAX musí být ≥ MIN';
  return Object.keys(errs).length===0;
}
const AUTO_FROM=['nový','poptáno'];
function applyAutoStatus(row,oldStatus,touched){
  if(row.approvedBy||touched) return null;
  if((Number(row.cena)||0)>0 && AUTO_FROM.includes(row.status)){ row.status='ve schvalování'; return `stav ${oldStatus} → ve schvalování (automaticky po doplnění ceny)`; }
  return null;
}

/* ---------- přílohy: nahrání jednoho souboru + dávka ---------- */
async function uploadOne(reqId,f,cat){
  const safe=f.name.replace(/[^\w.\-]+/g,'_').slice(-80);
  const path='nabidky/'+reqId+'/'+Date.now()+'_'+Math.floor(Math.random()*1e6)+'_'+safe;
  const s=sref(storage,path);
  await uploadBytes(s,f,{contentType:f.type||'application/octet-stream'});
  const url=await getDownloadURL(s);
  return {name:f.name,path,url,size:f.size,cat:cat||'ostatni',at:today(),by:me.name};
}
/* Zpracuje vybrané/přetažené soubory: u nového požadavku je zařadí do fronty,
   u existujícího je rovnou nahraje do úložiště. */
async function handleFiles(fileList,cat){
  const files=[...(fileList||[])].filter(Boolean); if(!files.length) return;
  cat=cat||'ostatni';
  if(!editing) return;
  if(!editing._id){   // nový požadavek → fronta, nahraje se po založení
    for(const f of files){ if(f.size>MAX_FILE){ toast(`„${f.name}" je větší než 5 MB.`,'err'); continue; } pendingFiles.push({file:f,cat}); }
    render(); return;
  }
  const cur=rows.find(x=>x._id===editing._id)||editing;
  if(!canAttach(cur)){ toast('Na přidání přílohy nemáš právo.','err'); return; }
  uploadBusy=true; render();
  const base=rows.find(x=>x._id===editing._id)||editing;
  const filesArr=(base.files||[]).slice(); const hist=(base.hist||[]).slice(); let ok=0;
  for(const f of files){
    if(f.size>MAX_FILE){ toast(`„${f.name}" je větší než 5 MB.`,'err'); continue; }
    try{ const meta=await uploadOne(editing._id,f,cat); filesArr.push(meta); hist.push(`${today()} · ${me.name} · přidal přílohu ${f.name} (${catLabel(cat)})`); ok++; }
    catch(e){ toast(`Nahrání „${f.name}" selhalo: `+e.message,'err'); }
  }
  if(ok){ try{ await updateDoc(doc(db,'requests',editing._id),{files:filesArr,hist}); editing.files=filesArr; editing.hist=hist; toast(ok===1?'Příloha nahrána.':ok+' přílohy nahrány.','ok'); }
    catch(e){ toast('Uložení selhalo: '+e.message,'err'); } }
  uploadBusy=false; render();
}

/* ---------- Import podlimitních položek z Maxima (Excel) ---------- */
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(loadXLSX._p) return loadXLSX._p;
  loadXLSX._p=new Promise((res,rej)=>{ const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX); s.onerror=()=>rej(new Error('Nepodařilo se načíst knihovnu pro Excel (zkontroluj internet).'));
    document.head.appendChild(s); });
  return loadXLSX._p;
}
const IMP_MENA={'EUR':'EUR','CZK':'CZK','USD':'USD','€':'EUR','KČ':'CZK','KC':'CZK','CZ':'CZK'};
const normHdr=s=>String(s??'').trim().toLowerCase();
async function parseImportFile(file){
  const XLSX=await loadXLSX();
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const hi=aoa.findIndex(r=>Array.isArray(r)&&r.some(c=>normHdr(c)==='maxitem'));
  if(hi<0) throw new Error('V souboru jsem nenašel hlavičku „Maxitem". Je to správný export z Maxima?');
  const hdr=aoa[hi].map(normHdr); const col=n=>hdr.indexOf(n);
  const cMax=col('maxitem'),cDesc=col('description'),cQty=col('quantity'),cCost=col('unit cost'),cCur=col('currency'),cBrand=col('brand'),cRem=col('remark 1'),cVend=col('prodejce');
  const items=[];
  for(let i=hi+1;i<aoa.length;i++){ const r=aoa[i]; if(!Array.isArray(r)) continue;
    const g=idx=>idx>=0?r[idx]:null;
    const sklad=String(g(cMax)??'').trim(), popis=String(g(cDesc)??'').trim();
    if(!sklad&&!popis) continue;
    items.push({ sklad, popis, mnozstvi:Number(g(cQty))||0, cena:Math.round((Number(g(cCost))||0)*100)/100,
      mena:'EUR', vyrobce:String(g(cBrand)??'').trim(), poznamka:String(g(cRem)??'').trim(), dodavatel:String(g(cVend)??'').trim() }); }
  return items;
}
function markDuplicates(items){
  // Duplicity hledáme jen mezi požadavky označenými „Doplnění skladu" a jen v aktivních
  // stavech — položky ve stavu doručeno/zamítnuto se ignorují (můžou se objednat znovu).
  const open=rows.filter(x=>x.typ==='Doplnění skladu' && !['doručeno','zamítnuto'].includes(x.status));
  return items.map(d=>{ const dup=d.sklad!=='' && open.some(x=>String(x.sklad||'').trim()===d.sklad && (Number(x.mnozstvi)||0)===(Number(d.mnozstvi)||0));
    return {d, dup, sel:!dup}; });
}
/* Načtení Excelu z Maxima — voláno z výběru souboru i z přetažení na tlačítko. */
async function startImport(file){
  if(!P().edit) return;
  if(!file) return;
  toast('Načítám Excel…');
  try{ const items=await parseImportFile(file);
    if(!items.length){ toast('V souboru nejsou žádné položky k importu.','err'); return; }
    importState={items:markDuplicates(items),busy:false,done:0}; render();
  }catch(e){ toast(e.message||'Nepodařilo se načíst soubor.','err'); }
}

  </div></div>`;
}
/* Zaškrtnutí/odškrtnutí jednoho řádku importu — aktualizuje jen počítadlo a tlačítko,
   nepřekresluje celou tabulku (aby to u stovek řádků neblikalo a nepřeskakovalo). */
function refreshImportFoot(){
  if(!importState) return;
  const it=importState.items||[]; const selN=it.filter(x=>x.sel).length;
  const c=document.getElementById('imp-count'); if(c) c.innerHTML=`Vybráno k založení: <b>${selN}</b> z ${it.length}`;
  const b=document.getElementById('imp-confirm'); if(b){ b.textContent=`Založit vybrané (${selN})`; b.disabled=!selN; }
  const sa=document.querySelector('input[data-a="import-selall"]'); if(sa) sa.checked = it.length>0 && it.every(x=>x.sel);
}
async function runImport(){
  const sel=importState.items.filter(x=>x.sel);
  importState.busy=true; importState.done=0; render();
  let ok=0, fail=0;
  for(const x of sel){ const d=x.d;
    try{
      const poradove=await nextNumber();
      const rec={ poradove, status:'nový', typ:'Doplnění skladu', sklad:d.sklad, popis:d.popis, duvod:'Podlimitní položka (import z Maxima)',
        priorita:'běžná', mnozstvi:d.mnozstvi||0, cena:d.cena||0, mena:'EUR', dodavatel:d.dodavatel||'', vyrobce:d.vyrobce||'',
        ucet:'511305', costcenter:'', usek:'Maintenance', stroj:'', datum:'', min:0, max:0, newStock:false, url:'', notifyEmail:'', poznamka:d.poznamka||'',
        author:me.uid, authorName:me.name, authorEmail:me.email, created:today(), createdTs:serverTimestamp(),
        approvedBy:null, approvedAt:null, hist:[`${today()} · ${me.name} · založeno importem z Maxima (doplnění skladu, účet 511305, linka Maintenance)`] };
      // Podlimitní položky jsou pod schvalovací hranicí → rovnou schváleno.
      // Pravidla Firestore dovolují založit jen „nový"/„ve schvalování", proto po založení
      // hned přepneme na „schváleno" (import smí jen admin, který na to má právo).
      const ref=await addDoc(collection(db,'requests'),rec);
      await updateDoc(ref,{ status:'schváleno', approvedBy:me.name, approvedAt:today(),
        hist:rec.hist.concat(`${today()} · ${me.name} · automaticky schváleno (podlimitní položka)`) });
      ok++;
    }catch(e){ fail++; }
    importState.done=ok+fail; if(importState) render();
  }
  importState=null; render();
  toast(`Import hotový: založeno ${ok} požadavků`+(fail?`, ${fail} se nepovedlo`:'')+'.', fail?'err':'ok');
}

/* ---------- zápisy do Firestore ---------- */
async function createRequest(){
  const poradove=await nextNumber();
  const rec=Object.assign({},editing,{
    poradove, status:'nový', author:me.uid, authorName:me.name, authorEmail:me.email, created:today(), createdTs:serverTimestamp(),
    approvedBy:null, approvedAt:null, hist:[`${today()} · ${me.name} · založil požadavek`]
  });
  // Nově založený požadavek je VŽDY ve stavu „nový" — nezáleží na ceně ani ostatních polích.
  // Do „ve schvalování" ho posune až sklad/schvalovatel (nebo se cena doplní později u existujícího požadavku).
  delete rec._id; delete rec.files;
  const refNew=await addDoc(collection(db,'requests'),rec);
  // připravené přílohy nahraj až teď, když máme id požadavku
  if(pendingFiles.length){
    const filesArr=[]; const hist=rec.hist.slice();
    for(const p of pendingFiles){ try{ const meta=await uploadOne(refNew.id,p.file,p.cat); filesArr.push(meta); hist.push(`${today()} · ${me.name} · přidal přílohu ${p.file.name} (${catLabel(p.cat)})`); }catch(e){} }
    if(filesArr.length){ try{ await updateDoc(refNew,{files:filesArr,hist}); }catch(e){} }
  }
  pendingFiles=[];
  return poradove;
}
async function updateRequest(){
  const id=editing._id; const old=rows.find(r=>r._id===id)||{};
  const touched=old.status!==editing.status;
  const hist=(editing.hist||[]).slice();
  if(touched) hist.push(`${today()} · ${me.name} · stav ${old.status} → ${editing.status}`);
  else hist.push(`${today()} · ${me.name} · upravil požadavek`);
  // Automatická změna stavu po doplnění ceny je PROZATÍM VYPNUTÁ (na přání Davida) —
  // stav mění ručně jen skladník/admin ve výběru „Stav schvalování".
  const {_id,...data}=editing; data.hist=hist;
  await updateDoc(doc(db,'requests',id),data);
}

  document.querySelectorAll('select[data-cfsel]').forEach(el=>{el.onchange=()=>{filters[el.dataset.cfsel]=el.value;render();};});
  ['od','do'].forEach(k=>{const el=document.getElementById('d-'+k);if(el)el.onchange=()=>{dashRange[k]=el.value;render();};});
  const m=document.getElementById('f-mine');if(m)m.onchange=()=>{filters.mine=m.checked;render();};
  ['e-cena','e-mnozstvi'].forEach(id=>{const el=document.getElementById(id);if(el){el.oninput=recalc;el.onchange=recalc;}});
  const mena=document.getElementById('e-mena');if(mena)mena.onchange=()=>{collect();render();};  // změna měny překreslí (přepočet EUR)
  const tx=document.getElementById('e-txt');if(tx)tx.onchange=()=>{collect();editing.sklad=tx.checked?'TXT':(editing.sklad==='TXT'?'':editing.sklad);render();};
  document.querySelectorAll('[data-draft]').forEach(el=>{const h=()=>{drafts[el.dataset.draft]=el.value;};el.oninput=h;el.onchange=h;});
  // políčka panelu Správa požadavků — drží se ve stavu, aby přežila překreslení (živá data z Firestore)
  document.querySelectorAll('[data-mg]').forEach(el=>{const h=()=>{mgr[el.dataset.mg]=el.value;};el.oninput=h;el.onchange=h;});
  const us=document.getElementById('e-usek');if(us)us.onchange=()=>{collect();editing.stroj='';render();};
  const ns=document.getElementById('e-newstock');if(ns)ns.onchange=()=>{collect();render();};
  const lp=document.getElementById('lg-pass');if(lp)lp.onkeydown=e=>{if(e.key==='Enter')act('login');};
