/* Přetažení Excelu z Maxima přímo na tlačítko Import z Maxima. */
function bindImportDnD(){
  const z=document.getElementById('import-drop'); if(!z) return;
  z.addEventListener('dragover',e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){ e.preventDefault(); z.classList.add('drag'); } });
  z.addEventListener('dragleave',()=>z.classList.remove('drag'));
  z.addEventListener('drop',e=>{ e.preventDefault(); z.classList.remove('drag');
    const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) startImport(f); });
}
/* Přetažení souboru DO dlaždice (nahrání) a přetažení souboru Z appky na plochu (stažení). */
function bindAttachDnD(){
  document.querySelectorAll('.attdrop').forEach(z=>{
    if(z.classList.contains('ro')) return;
    z.addEventListener('dragover',e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){ e.preventDefault(); z.classList.add('drag'); } });
    z.addEventListener('dragleave',()=>z.classList.remove('drag'));
    z.addEventListener('drop',e=>{ e.preventDefault(); z.classList.remove('drag');
      if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length) handleFiles(e.dataTransfer.files, z.dataset.cat); });
  });
  document.querySelectorAll('.attrow[data-dl]').forEach(row=>{
    row.addEventListener('dragstart',e=>{
      const f=(editing&&editing.files||[])[Number(row.dataset.dl)]; if(!f||!e.dataTransfer) return;
      const mime = /\.pdf$/i.test(f.name)?'application/pdf':(/\.(png|jpe?g|gif|webp)$/i.test(f.name)?'image/*':'application/octet-stream');
      try{ e.dataTransfer.setData('DownloadURL', `${mime}:${f.name}:${f.url}`); }catch(_){}
    });
  });
}
/* Napojí horní vodorovný posuvník na tabulku požadavků (obousměrná synchronizace). */
function syncTopScroll(){
  const top=document.getElementById('tbltop'), wrap=document.getElementById('tblwrap'), inner=document.getElementById('tbltop-inner');
  if(!top||!wrap||!inner) return;
  const tbl=wrap.querySelector('table');
  const measure=()=>{ if(tbl) inner.style.width=tbl.scrollWidth+'px'; };
  measure();
  let lock=false;
  top.onscroll=()=>{ if(lock)return; lock=true; wrap.scrollLeft=top.scrollLeft; lock=false; };
  wrap.onscroll=()=>{ if(lock)return; lock=true; top.scrollLeft=wrap.scrollLeft; lock=false; };
  if(!window.__topScrollResize){ window.__topScrollResize=true;
    window.addEventListener('resize',()=>{ const t=document.getElementById('tbltop-inner'), w=document.getElementById('tblwrap'); const tb=w&&w.querySelector('table'); if(t&&tb) t.style.width=tb.scrollWidth+'px'; }); }
}

const WRITE_ACTIONS=new Set(['new','save','del','dup','poptat','approve','reject','mgr-apply','mgr-receive','recv-save','upload-file','del-file','import-file','import-confirm',
  'add-user','add-sec','del-sec','add-mach','del-mach','add-acc','del-acc','acc-name','add-cc','del-cc','cc-name','save-rates','req',
  'user-role','user-name','user-email','user-phone','user-team']);
async function act(a,v,el,ev){
  // Pojistka: v režimu „jen pro čtení" neprojde žádná zapisovací akce (i kdyby zbylo tlačítko).
  if(isNakupRO() && WRITE_ACTIONS.has(a)){ toast('Tento modul máte jen pro čtení.','err'); return; }
  switch(a){
    case 'reload': location.reload(); return;
    case 'login':{
      const email=(document.getElementById('lg-user').value||'').trim();
      const pass=document.getElementById('lg-pass').value||'';
      if(!email||!pass){loginErr='Vyplň e-mail i heslo.';render();return;}
      loginBusy=true;loginErr='';render();
      try{ await signInWithEmailAndPassword(auth,email,pass); }
      catch(e){ loginBusy=false; loginErr=authMsg(e.code); render(); }
      return;
    }
    case 'logout': await signOut(auth); return;
    case 'tab': tab=v; break;
    case 'sort': sort=(sort.col===v)?{col:v,dir:-sort.dir}:{col:v,dir:1}; break;
    case 'clear-filters': filters={q:'',grp:'',status:'',priorita:'',ucet:'',usek:'',typ:'',od:'',do:'',mine:false,reqNo:'',rfqNo:'',orderNo:'',col:emptyCol()}; break;
    case 'toggle-cols': colPanel=!colPanel; break;
    case 'cols-reset': colHide={}; colW={}; break;
    case 'col-vis': colHide[v]=!el.checked; break;
    case 'col-w':{ const w=parseInt(el.value,10); if(w>0) colW[v]=w; else delete colW[v]; break; }
    case 'dash-all': dashRange={od:'',do:''}; break;
    case 'dash-month': dashRange=monthRange(); break;
    case 'dash-year': dashRange=yearRange(); break;
    case 'flt-all': filters.grp=''; filters.status=''; break;
    case 'flt-grp': filters.grp=(filters.grp===v?'':v); filters.status=''; break;
    case 'flt-status': filters.status=(filters.status===v?'':v); filters.grp=''; break;

    /* --- Správa požadavků (hromadné doplňování; jen skladník/admin) --- */
    case 'toggle-manage': if(!P().edit)return; manage.on=!manage.on; if(!manage.on) mgrSel.clear(); break;
    case 'mgr-selrow': if(el.checked) mgrSel.add(v); else mgrSel.delete(v); break;
    case 'mgr-selall':{ const vis=visibleRows(); if(el.checked) vis.forEach(r=>mgrSel.add(r._id)); else vis.forEach(r=>mgrSel.delete(r._id)); break; }
    case 'mgr-clear': mgr={reqNo:'',rfqNo:'',orderNo:'',dssiItem:'',recvQty:'',recvDate:'',docType:'',docNo:'',comment:'',status:''}; break;
    case 'mgr-apply': await mgrApply(false); return;
    case 'mgr-receive': await mgrApply(true); return;
    case 'dlg-yes':{const d=dlg;dlg=null;const val=d.kind==='prompt'?(document.getElementById('dlg-input')||{}).value||'':true;
      if(d.mailto){const a2=document.createElement('a');a2.href=d.mailto;a2.rel='noopener';document.body.appendChild(a2);a2.click();a2.remove();}
      render();d.resolve(d.kind==='prompt'?val:true);return;}
    case 'dlg-no':{const d=dlg;dlg=null;render();d.resolve(d.kind==='prompt'?null:false);return;}

    case 'new':
      editing={status:'nový',typ:'Nový požadavek',poradove:'',sklad:'',popis:'',duvod:'',priorita:'běžná',mnozstvi:1,jednotka:'ks',cena:'',mena:'CZK',
        dodavatel:'',vyrobce:'',ucet:'',costcenter:'',usek:'',stroj:'',datum:'',min:0,max:0,newStock:false,url:'',notifyEmail:'',poznamka:''};
      modalTab='pozadavek'; pendingFiles=[]; recvEdit=false; uploadBusy=false; errs={};footMsg='';break;
    case 'open':{ editing=JSON.parse(JSON.stringify(rows.find(r=>r._id===v)));
      if(editing.newStock===undefined) editing.newStock=(Number(editing.min)||0)>0||(Number(editing.max)||0)>0;
      modalTab='pozadavek'; pendingFiles=[]; recvEdit=false; uploadBusy=false; errs={};footMsg='';break;}
    case 'dup':{const s=rows.find(r=>r._id===v);
      editing=Object.assign(JSON.parse(JSON.stringify(s)),{_id:null,poradove:'',status:'nový',datum:'',approvedBy:null,approvedAt:null,hist:[],files:[]});
      if(editing.newStock===undefined) editing.newStock=(Number(editing.min)||0)>0||(Number(editing.max)||0)>0;
      modalTab='pozadavek'; pendingFiles=[]; recvEdit=false; uploadBusy=false; errs={};footMsg='';break;}

    case 'import-file':{
      const f=el.files&&el.files[0]; el.value='';
      await startImport(f); return;
    }
    case 'import-sel':{ if(importState){ importState.items[Number(v)].sel=el.checked; refreshImportFoot(); } return; }
    case 'import-selall':{ if(importState) importState.items.forEach(x=>x.sel=el.checked); break; }
    case 'import-cancel':{ if(importState&&importState.busy)return; importState=null; break; }
    case 'import-confirm':{ if(!importState||importState.busy)return; await runImport(); return; }

    case 'save':{
      const isNew=!editing._id;
      if(!canEditRow(isNew, editing))return;
      collect();
      if(isNew&&!P().edit)editing.status='nový';
      if(!validate()){footMsg='Doplň povinná pole označená červeně.';modalTab='pozadavek';render();return;}
      try{
        if(isNew){const no=await createRequest();editing=null;footMsg='';toast('Požadavek '+no+' založen.','ok');}
        else{
          const old=rows.find(r=>r._id===editing._id)||{};
          const becameDelivered = old.status!=='doručeno' && editing.status==='doručeno';
          const saved=JSON.parse(JSON.stringify(editing));
          await updateRequest();editing=null;footMsg='';toast('Změny uloženy.','ok');
          if(becameDelivered) offerDeliveryMail(saved);
        }
      }catch(e){footMsg='Uložení selhalo: '+e.message;render();return;}
      break;
    }
    case 'del':{
      if(!P().del)return; const r=rows.find(x=>x._id===v);
      if(r.status==='doručeno'){ toast('Doručený požadavek nelze smazat.','err'); return; }
      if(await askYes(`Smazat požadavek ${r.poradove}? Tohle nejde vrátit.`,{title:'Smazání',ok:'Smazat',danger:true})){
        try{await deleteDoc(doc(db,'requests',v));editing=null;toast('Požadavek smazán.','ok');}catch(e){toast('Nešlo smazat: '+e.message,'err');}
      }break;
    }
    case 'poptat':{
      if(!P().edit)return; const r=rows.find(x=>x._id===v);
      const hist=(r.hist||[]).concat(`${today()} · ${me.name} · stav nový → poptáno`);
      try{await updateDoc(doc(db,'requests',v),{status:'poptáno',hist});}catch(e){toast(e.message,'err');}
      break;
    }
    case 'approve':{
      if(!P().approve)return; const r=rows.find(x=>x._id===v);
      if(r.approvedBy){await info('Požadavek už schválil '+r.approvedBy+'.');return;}
      if(!await askYes(`Schválit požadavek ${r.poradove} za sebe? Stačí schválení jednoho ze schvalovatelů.`,{title:'Schválení',ok:'✔ Schválit'}))return;
      const st=['nový','ve schvalování','poptáno'].includes(r.status)?'schváleno':r.status;
      const hist=(r.hist||[]).concat(`${today()} · ${me.name} · schválil požadavek`);
      try{await updateDoc(doc(db,'requests',v),{approvedBy:me.name,approvedAt:today(),status:st,hist});editing=null;toast('Požadavek '+r.poradove+' schválen.','ok');}
      catch(e){toast('Schválení selhalo: '+e.message,'err');}
      break;
    }
    case 'reject':{
      if(!P().approve)return; const r=rows.find(x=>x._id===v);
      const d=await askText(`Zamítnutí požadavku ${r.poradove}. Napiš důvod:`,{title:'Zamítnutí',ok:'✕ Zamítnout',danger:true,placeholder:'např. objednáno jinou cestou'});
      if(d===null)return;
      const hist=(r.hist||[]).concat(`${today()} · ${me.name} · zamítl požadavek${d?': '+d:''}`);
      const poz=d?((r.poznamka?r.poznamka+' | ':'')+'Zamítnuto: '+d):r.poznamka;
      try{await updateDoc(doc(db,'requests',v),{status:'zamítnuto',approvedBy:null,approvedAt:null,poznamka:poz,hist});editing=null;toast('Požadavek '+r.poradove+' zamítnut.','ok');}
      catch(e){toast('Zamítnutí selhalo: '+e.message,'err');}
      break;
    }
    case 'qr-open':{
      if(!editing)return; collect();
      if(!window.Html5Qrcode){toast('QR čtečka se nenačetla — zkontroluj internet a zkus to znovu.','err');return;}
      qrOpen=true;break;
    }
    case 'qr-close': stopQr(); qrOpen=false; break;

    case 'close': case 'close-bg':
      // zavřít pozadím jen když stisk i puštění bylo na pozadí (ne tažení myší z okna ven při označování textu)
      if(a==='close-bg'&&(!downOnOverlay||(ev&&ev.target!==el))){ downOnOverlay=false; return; }
      downOnOverlay=false;
      stopQr(); qrOpen=false; editing=null;recvEdit=false;uploadBusy=false;modalTab='pozadavek';pendingFiles=[];errs={};footMsg='';break;

    case 'mtab': collect(); modalTab=v; break;

    case 'upload-file':{
      const files=el.files?[...el.files]:[]; if(!files.length) return;
      await handleFiles(files, v||'ostatni');
      return;
    }
    case 'unqueue-file':{ pendingFiles.splice(Number(v),1); break; }
    case 'dl-file':{
      const f=(editing&&editing.files||[])[Number(v)]; if(!f) return;
      try{
        const resp=await fetch(f.url); if(!resp.ok) throw new Error('net');
        const blob=await resp.blob(); const u=URL.createObjectURL(blob);
        const a2=document.createElement('a'); a2.href=u; a2.download=f.name; document.body.appendChild(a2); a2.click(); a2.remove();
        setTimeout(()=>URL.revokeObjectURL(u),5000);
      }catch(e){ window.open(f.url,'_blank','noopener'); }   // když stažení nejde (CORS), aspoň otevři
      return;
    }
    case 'del-file':{
      if(!editing||!editing._id) return;
      const cur=rows.find(x=>x._id===editing._id)||editing;
      if(!canAttach(cur)){ toast('Na smazání přílohy nemáš právo.','err'); return; }
      const files=(editing.files||[]).slice(); const f=files[Number(v)];
      if(!f) return;
      if(!await askYes(`Smazat přílohu „${f.name}"? Soubor se odstraní z úložiště.`,{title:'Smazání přílohy',ok:'Smazat',danger:true})) return;
      try{
        try{ await deleteObject(sref(storage,f.path)); }catch(e){ /* soubor už možná není – pokračuj v odebrání z požadavku */ }
        files.splice(Number(v),1);
        const hist=(editing.hist||[]).concat(`${today()} · ${me.name} · smazal přílohu ${f.name}`);
        await updateDoc(doc(db,'requests',editing._id),{files,hist});
        editing.files=files; editing.hist=hist;
        toast('Příloha smazána.','ok');
      }catch(e){ toast('Smazání selhalo: '+e.message,'err'); }
      render(); return;
    }

    case 'recv-edit':{ if(!P().edit||!editing||!editing._id)return; if(!recvEdit)collect(); recvEdit=!recvEdit; break; }
    case 'recv-save':{
      if(!P().edit||!editing||!editing._id)return;
      collect();
      const rid=editing._id;
      const patch={reqNo:editing.reqNo||'',rfqNo:editing.rfqNo||'',orderNo:editing.orderNo||'',dssiItem:editing.dssiItem||'',
        receivedQty:(editing.receivedQty===''||editing.receivedQty===undefined)?'':Number(editing.receivedQty),
        receivedDate:editing.receivedDate||'',docType:editing.docType||'',docNo:editing.docNo||'',skladComment:editing.skladComment||''};
      patch.hist=(editing.hist||[]).concat(`${today()} · ${me.name} · upravil příjem/sklad`);
      try{ await updateDoc(doc(db,'requests',rid),patch); editing.hist=patch.hist; recvEdit=false; toast('Příjem/sklad uložen.','ok'); }
      catch(e){ toast('Uložení selhalo: '+e.message,'err'); return; }
      break;
    }

    case 'export':{
      const head=['Stav','Druh','Pořadové číslo','Vytvořeno','Skladové číslo','Popis položky','Důvod objednání','Priorita','Množství','Cena/ks','Měna','Cena celkem','Cena EUR','Výrobce','Účet','Popis účtu','Linka','Stroj','Předpokládané datum dodání','MIN','MAX','URL','Upozornit e-mailem','Poznámka','Zadal','Schválil','Schváleno dne'];
      const lines=[head.join(';')].concat(visibleRows().map(r=>[r.status,r.typ||'Nový požadavek',r.poradove,r.created,r.sklad,r.popis,r.duvod,r.priorita,r.mnozstvi,r.cena,r.mena,total(r).toFixed(2),totalEur(r).toFixed(2),r.vyrobce,r.ucet,accName(r.ucet),r.usek,r.stroj,r.datum,r.min,r.max,r.url,r.notifyEmail||'',r.poznamka,r.authorName,r.approvedBy||'',r.approvedAt||'']
        .map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')));
      const b=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv'});
      const a2=document.createElement('a');a2.href=URL.createObjectURL(b);a2.download='nakupni_pozadavky.csv';a2.click();return;
    }

    /* --- administrace (jen admin, jinak Firestore pravidla stejně odmítnou) --- */
    case 'req':{ if(!P().admin)return; fld(v).req=el.checked; await saveConfig(); return; }
    case 'add-sec':{
      if(!P().admin)return; const n=(drafts['new-sec']||'').trim(); if(!n)return;
      if(cfg.sections.some(x=>x.name.toLowerCase()===n.toLowerCase())){toast('Linka už existuje.','err');return;}
      cfg.sections.push({name:n,machines:[]});delete drafts['new-sec'];await saveConfig();break;
    }
    case 'del-sec':{
      if(!P().admin)return; const used=rows.filter(r=>r.usek===v).length;
      if(!await askYes(used?`Linka ${v} je u ${used} požadavků — ty zůstanou, jen zmizí z nabídky.`:`Odebrat linku ${v}?`,{title:'Odebrání linky',ok:'Odebrat',danger:true}))return;
      cfg.sections=cfg.sections.filter(x=>x.name!==v);await saveConfig();break;
    }
    case 'add-mach':{
      if(!P().admin)return; const [sn]=v.split('|'); const m=(drafts['m-'+sn]||'').trim(); if(!m)return;
      const sec=cfg.sections.find(x=>x.name===sn);
      if(sec.machines.some(x=>x.toLowerCase()===m.toLowerCase())){toast('Stroj už v úseku je.','err');return;}
      sec.machines.push(m);sec.machines.sort((a,b)=>a.localeCompare(b,'cs',{numeric:true}));delete drafts['m-'+sn];await saveConfig();break;
    }
    case 'del-mach':{ if(!P().admin)return; const [sn,m]=v.split('|'); const sec=cfg.sections.find(x=>x.name===sn); sec.machines=sec.machines.filter(x=>x!==m); await saveConfig(); break; }
    case 'add-acc':{
      if(!P().admin)return; const code=(drafts['new-acc']||'').trim(); const nm=(drafts['new-acc-name']||'').trim();
      if(!code){toast('Vyplň číslo účtu.','err');return;}
      if(cfg.accounts.some(a=>a.code===code)){toast('Účet už existuje.','err');return;}
      cfg.accounts.push({code,name:nm});cfg.accounts.sort((a,b)=>a.code.localeCompare(b.code,'cs',{numeric:true}));
      delete drafts['new-acc'];delete drafts['new-acc-name'];await saveConfig();break;
    }
    case 'acc-name':{ if(!P().admin)return; acc(v).name=el.value.trim(); await saveConfig(); return; }
    case 'del-acc':{
      if(!P().admin)return; const used=rows.filter(r=>r.ucet===v).length;
      if(!await askYes(used?`Účet ${v} je u ${used} požadavků — zůstane u nich, jen zmizí z nabídky.`:`Odebrat účet ${v}?`,{title:'Odebrání účtu',ok:'Odebrat',danger:true}))return;
      cfg.accounts=cfg.accounts.filter(x=>x.code!==v);await saveConfig();break;
    }
    case 'add-cc':{
      if(!P().admin)return; const code=(drafts['new-cc']||'').trim(); const nm=(drafts['new-cc-name']||'').trim();
      if(!code){toast('Vyplň číslo cost centra.','err');return;}
      if(!cfg.costCenters) cfg.costCenters=[];
      if(cfg.costCenters.some(a=>a.code===code)){toast('Cost centrum už existuje.','err');return;}
      cfg.costCenters.push({code,name:nm});cfg.costCenters.sort((a,b)=>a.code.localeCompare(b.code,'cs',{numeric:true}));
      delete drafts['new-cc'];delete drafts['new-cc-name'];await saveConfig();break;
    }
    case 'cc-name':{ if(!P().admin)return; const x=cc(v); if(x){x.name=el.value.trim(); await saveConfig();} return; }
    case 'del-cc':{
      if(!P().admin)return; const used=rows.filter(r=>r.costcenter===v).length;
      if(!await askYes(used?`Cost centrum ${v} je u ${used} požadavků — zůstane u nich, jen zmizí z nabídky.`:`Odebrat cost centrum ${v}?`,{title:'Odebrání cost centra',ok:'Odebrat',danger:true}))return;
      cfg.costCenters=(cfg.costCenters||[]).filter(x=>x.code!==v);await saveConfig();break;
    }
    case 'save-rates':{
      if(!P().admin)return;
      cfg.rates.CZK=Number(document.getElementById('r-czk').value)||cfg.rates.CZK;
      cfg.rates.USD=Number(document.getElementById('r-usd').value)||cfg.rates.USD;
      await saveConfig();toast('Kurzy uloženy.','ok');break;
    }
    case 'add-user':{
      if(!P().admin)return;
      const name=(drafts['nu-name']||'').trim();
      const email=(drafts['nu-email']||'').trim();
      const pass=(drafts['nu-pass']||'');
      const role=drafts['nu-role']||'zadavatel';
      const team=(drafts['nu-team']||'').trim()||'—';
      if(!name||!email||!pass){toast('Vyplň jméno, e-mail i počáteční heslo.','err');return;}
      if(pass.length<6){toast('Heslo musí mít aspoň 6 znaků.','err');return;}
      try{
        const uid=await createUserAccount(email,pass);
        await setDoc(doc(db,'users',uid),{name,email,role,team});
        ['nu-name','nu-email','nu-pass','nu-role','nu-team'].forEach(k=>delete drafts[k]);
        toast('Uživatel '+name+' založen. Předej mu heslo.','ok');
      }catch(e){ toast('Založení selhalo: '+authMsg(e.code),'err'); return; }
      break;
    }
    case 'user-phone':{ if(!P().admin)return; try{await updateDoc(doc(db,'users',v),{phone:el.value.trim()});}catch(e){toast(e.message,'err');} return; }
    case 'user-role':{ if(!P().admin)return; try{await updateDoc(doc(db,'users',v),{role:el.value});}catch(e){toast(e.message,'err');} return; }
    case 'user-name':{ if(!P().admin)return; try{await updateDoc(doc(db,'users',v),{name:el.value.trim()});}catch(e){toast(e.message,'err');} return; }
    case 'user-email':{ if(!P().admin)return; try{await updateDoc(doc(db,'users',v),{email:el.value.trim()});}catch(e){toast(e.message,'err');} return; }
    case 'user-team':{ if(!P().admin)return; try{await updateDoc(doc(db,'users',v),{team:el.value.trim()});}catch(e){toast(e.message,'err');} return; }
  }
  render();
}

function authMsg(code){
  const m={
    'auth/invalid-email':'Neplatný formát e-mailu.',
    'auth/user-not-found':'Takový účet neexistuje. Ověř e-mail, nebo požádej administrátora o založení.',
    'auth/wrong-password':'Nesprávné heslo.',
    'auth/invalid-credential':'Nesprávný e-mail nebo heslo.',
    'auth/too-many-requests':'Příliš mnoho pokusů. Zkus to za chvíli.',
    'auth/network-request-failed':'Není spojení se sítí.',
    'auth/email-already-in-use':'Účet s tímto e-mailem už existuje.',
    'auth/weak-password':'Heslo je příliš slabé — použij aspoň 6 znaků.',
    'auth/operation-not-allowed':'Ve Firebase není povolené přihlašování e-mailem a heslem.'
  };
  return m[code]||('Přihlášení se nepovedlo ('+code+').');
}

render();
</script>
<script src="header.js"></script>
</body>
</html>
